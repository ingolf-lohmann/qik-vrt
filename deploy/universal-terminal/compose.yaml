services:
  qikvrt-universal-terminal:
    build:
      context: ${QIKVRT_REPOSITORY_CONTEXT:-../..}
      dockerfile: deploy/universal-terminal/Dockerfile
    image: ${QIKVRT_UNIVERSAL_TERMINAL_IMAGE:-qikvrt/universal-terminal:local}
    restart: unless-stopped
    environment:
      QIKVRT_SERVICE_MODE: terminal
      QIKVRT_HTTP_HOST: 127.0.0.1
      QIKVRT_START_URL: ${QIKVRT_START_URL:-http://qikvrt-gateway:8080/qik-vrt/mesh/v1/}
    ports:
      - "127.0.0.1:${QIKVRT_NOVNC_HOST_PORT:-6080}:6080"
      - "127.0.0.1:${QIKVRT_MESH_HOST_PORT:-8080}:8080"
    networks:
      qikvrt_mesh:
        ipv4_address: 10.73.0.2
        aliases: [qikvrt-gateway]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run:size=32m,mode=755
      - /opt/qikvrt/runtime/logs:size=64m,mode=755
    volumes:
      - qikvrt_profile:/var/lib/qikvrt/profile
      - qikvrt_state:/var/lib/qikvrt/state
      - qikvrt_personal_posix:/var/lib/qikvrt/personal-posix
    shm_size: 256m

  qikvrt-gateway:
    image: ${QIKVRT_UNIVERSAL_TERMINAL_IMAGE:-qikvrt/universal-terminal:local}
    environment: {QIKVRT_SERVICE_MODE: gateway}
    network_mode: service:qikvrt-universal-terminal
    user: "65534:65534"
    depends_on: [qikvrt-universal-terminal]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777", "/run:size=16m,mode=755"]
    healthcheck: {disable: true}

  qikvrt-smtpd:
    image: ${QIKVRT_UNIVERSAL_TERMINAL_IMAGE:-qikvrt/universal-terminal:local}
    environment: {QIKVRT_SERVICE_MODE: smtpd}
    ports: ["127.0.0.1:${QIKVRT_SMTP_HOST_PORT:-2525}:2525"]
    networks: {qikvrt_mesh: {ipv4_address: 10.73.0.7}}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777", "/run:size=8m,mode=755"]
    volumes: [qikvrt_smtp:/var/lib/qikvrt/smtp]
    healthcheck: {disable: true}

  qikvrt-snmpd:
    image: ${QIKVRT_UNIVERSAL_TERMINAL_IMAGE:-qikvrt/universal-terminal:local}
    environment: {QIKVRT_SERVICE_MODE: snmpd}
    ports: ["127.0.0.1:${QIKVRT_SNMP_HOST_PORT:-1161}:1161/udp"]
    networks: {qikvrt_mesh: {ipv4_address: 10.73.0.9}}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777", "/run:size=8m,mode=755"]
    healthcheck: {disable: true}

  qikvrt-dnsd:
    image: ${QIKVRT_UNIVERSAL_TERMINAL_IMAGE:-qikvrt/universal-terminal:local}
    environment: {QIKVRT_SERVICE_MODE: dnsd, QIKVRT_DNS_PORT: "5353"}
    ports:
      - "127.0.0.1:${QIKVRT_DNS_HOST_PORT:-5353}:5353/udp"
      - "127.0.0.1:${QIKVRT_DNS_HOST_PORT:-5353}:5353/tcp"
    networks: {qikvrt_mesh: {ipv4_address: 10.73.0.8}}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777", "/run:size=8m,mode=755"]
    healthcheck: {disable: true}

  qikvrt-sshd:
    image: ${QIKVRT_UNIVERSAL_TERMINAL_IMAGE:-qikvrt/universal-terminal:local}
    environment:
      QIKVRT_SERVICE_MODE: sshd
      QIKVRT_SSH_AUTHORIZED_KEYS: ${QIKVRT_SSH_AUTHORIZED_KEYS:-}
    ports: ["127.0.0.1:${QIKVRT_SSH_HOST_PORT:-2222}:2222"]
    networks: {qikvrt_mesh: {ipv4_address: 10.73.0.10}}
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777", "/run:size=16m,mode=755"]
    volumes: [qikvrt_ssh:/var/lib/qikvrt/ssh]
    healthcheck: {disable: true}

  qikvrt-sqld:
    image: ${QIKVRT_UNIVERSAL_TERMINAL_IMAGE:-qikvrt/universal-terminal:local}
    environment:
      QIKVRT_SERVICE_MODE: sqld
      QIKVRT_DB_PASSWORD: ${QIKVRT_DB_PASSWORD:-}
    ports: ["127.0.0.1:${QIKVRT_SQL_HOST_PORT:-15432}:5432"]
    networks: {qikvrt_mesh: {ipv4_address: 10.73.0.3}}
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777", "/run:size=16m,mode=755"]
    volumes: [qikvrt_postgres:/var/lib/qikvrt/postgres]
    healthcheck: {disable: true}

  qikvrt-mirror:
    image: ${QIKVRT_UNIVERSAL_TERMINAL_IMAGE:-qikvrt/universal-terminal:local}
    environment:
      QIKVRT_SERVICE_MODE: mirror
      QIKVRT_AUTHORITY_URL: ${QIKVRT_AUTHORITY_URL:-https://github.com/Goldkelch/qik-vrt.git}
      QIKVRT_MIRROR_URL: ${QIKVRT_MIRROR_URL:-https://github.com/ingolf-lohmann/qik-vrt.git}
    ports: ["127.0.0.1:${QIKVRT_GIT_HOST_PORT:-19418}:9418"]
    networks: {qikvrt_mesh: {ipv4_address: 10.73.0.4}}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777", "/run:size=8m,mode=755"]
    volumes: [qikvrt_mirror:/var/lib/qikvrt/mirror]
    healthcheck: {disable: true}

  qikvrt-mc68000:
    image: ${QIKVRT_UNIVERSAL_TERMINAL_IMAGE:-qikvrt/universal-terminal:local}
    environment:
      QIKVRT_SERVICE_MODE: m68k
      QIKVRT_BOOTSTRAP_SERVER_IP: 10.73.0.1
      QIKVRT_BOOTSTRAP_CLIENT_IP: 10.73.0.6
      QIKVRT_BOOTSTRAP_PORT: "7331"
    networks: {qikvrt_mesh: {ipv4_address: 10.73.0.6}}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=32m,mode=1777", "/run:size=8m,mode=755"]
    volumes: [qikvrt_personal_posix:/var/lib/qikvrt/personal-posix]
    healthcheck: {disable: true}

networks:
  qikvrt_mesh:
    ipam:
      config:
        - subnet: 10.73.0.0/24
          gateway: 10.73.0.1

volumes:
  qikvrt_profile:
  qikvrt_state:
  qikvrt_personal_posix:
  qikvrt_smtp:
  qikvrt_ssh:
  qikvrt_postgres:
  qikvrt_mirror:
