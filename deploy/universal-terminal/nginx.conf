# The gateway container itself runs as explicit uid/gid 65534 and keeps all
# Linux capabilities dropped. Keep every writable nginx path on its tmpfs.
master_process off;
worker_processes 1;
pid /tmp/nginx.pid;
# Keep the inherited stderr descriptor: reopening a root-owned container
# pipe through /dev/stderr fails after dropping to uid 65534.
error_log stderr info;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # The unprivileged worker owns this tmpfs log; delivery probes retain it.
  access_log /tmp/nginx-access.log;
  sendfile on;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;
    # Railway terminates TLS outside this gateway. Preserve the caller's origin
    # instead of redirecting to the internal http://host:8080 address.
    absolute_redirect off;

    location = / {
      return 308 /AI/;
    }

    location = /AI {
      return 308 /AI/;
    }

    location = /AI/ {
      root /opt/qikvrt/deploy/universal-terminal;
      try_files /mesh-index.html =404;
      add_header Cache-Control "no-store" always;
    }

    location = /qik-vrt/mesh/v1/ {
      root /opt/qikvrt/deploy/universal-terminal;
      try_files /mesh-index.html =404;
      add_header Cache-Control "no-store" always;
    }

    location = /qik-vrt/mesh/v1/healthz {
      alias /tmp/qikvrt-mesh-health.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
    }

    location = /qik-vrt/mesh/v1/topology {
      alias /tmp/qikvrt-mesh-health.json;
      default_type application/json;
      add_header Cache-Control "no-store" always;
    }

    location /qik-vrt/mesh/v1/terminal/ {
      add_header Cache-Control "no-cache" always;
      proxy_pass http://127.0.0.1:6080/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Public TEMDD observation is a separate GET-only adapter. Do not change
    # the native daemon's loopback/same-origin guard or its Unix-only ingress.
    # Root API aliases are required by the IDE's absolute EventSource URLs.
    location ~ ^(?:/qik-vrt/mesh/v1/effect-ack)?/(?<qikvrt_temdd_read_path>AI/?|api/temdd/(?:subject|events))$ {
      if ($request_method != GET) { return 405; }
      set $qikvrt_temdd_origin_ok 0;
      if ($http_origin = "") { set $qikvrt_temdd_origin_ok 1; }
      if ($http_origin = "http://$http_host") { set $qikvrt_temdd_origin_ok 1; }
      if ($http_origin = "https://$http_host") { set $qikvrt_temdd_origin_ok 1; }
      if ($qikvrt_temdd_origin_ok = 0) { return 403; }
      proxy_pass http://127.0.0.1:8771/$qikvrt_temdd_read_path$is_args$args;
      proxy_http_version 1.1;
      # Translate only validated, credential-free reads to the native origin.
      proxy_set_header Host 127.0.0.1:8771;
      proxy_set_header Origin "";
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_set_header Content-Length "";
      proxy_pass_request_body off;
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/temdd/ {
      return 404;
    }

    location /qik-vrt/mesh/v1/effect-ack/ {
      proxy_pass http://127.0.0.1:8771/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-QIKVRT-Mesh-Path /qik-vrt/mesh/v1/;
      proxy_buffering off;
    }
  }
}
