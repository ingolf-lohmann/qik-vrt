<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QIK-VRT · DevOps Terminal</title><style>body{font:16px system-ui;background:#0b1625;color:#e9f5ff;margin:0;padding:20px}main{max-width:1100px;margin:auto}section{border:1px solid #36506b;border-radius:14px;padding:16px;margin:14px 0}article{background:#16283b;border-radius:10px;padding:12px;margin:8px}input,textarea,button{font:inherit;padding:10px;margin:6px;background:#243950;color:white;border:1px solid #5b7288;border-radius:8px}textarea{width:95%;min-height:90px}button{cursor:pointer}small{color:#b2c9dc}a{color:#8cddff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}</style><main><h1>QIK-VRT · Universelles DevOps Terminal</h1><small>Statischer HTML5-Client · ereignisgebundene Readbacks · keine Browser-Secrets</small><section><h2>Pipeline</h2><div id="stages" class="grid">Verbinde mit dem Terminal…</div><button id="read">GitHub-Readback</button><small id="status"></small></section><section><h2>Auftrag an Universalterminal</h2><form id="command"><input id="title" placeholder="Auftragstitel" required maxlength="180"><textarea id="description" placeholder="Auftrag und Abnahmekriterien" required></textarea><button>Einreichen</button></form><p id="receipt">Ohne zugelassenen Terminal-/Transputer-Adapter ist die Einreichung gesperrt.</p></section><section><h2>Ereignisjournal</h2><div id="journal"></div></section></main><script>
const names=["Auftragseingang","Zulassung","Bearbeitung","PR-Übergabe","Native CI","Governance","Main-Integration","Effekt-Abnahme"],keys=["ingress","admission","processing","handoff","ci","review","merge","effect"],api="https://api.github.com/repos/ingolf-lohmann/qik-vrt";
function log(x){document.getElementById("journal").insertAdjacentHTML("afterbegin","<article>"+String(x).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))+"</article>")}
function draw(runs,pr,issue){let states=keys.map(()=>["UNVERIFIED","Kein Nachweis"]);states[0]=[issue?"SUCCESS":"UNVERIFIED",issue?"Issue #"+issue.number:""];states[3]=[pr?"SUCCESS":"UNVERIFIED",pr?"PR #"+pr.number:""];states[6]=[pr&&pr.merged?"SUCCESS":"PENDING",pr&&pr.merged?"Merge bestätigt":"Nicht gemergt"];runs.forEach(r=>{let n=r.name||"",k=/CI/i.test(n)?4:/review|claim/i.test(n)?5:/issue|subject/i.test(n)?2:/integrity|materialization/i.test(n)?1:-1;if(k<0)return;let s=r.status==="completed"?(r.conclusion==="success"?"SUCCESS":String(r.conclusion).toUpperCase()):"RUNNING";if(states[k][0]!=="RUNNING"||s==="FAILURE")states[k]=[s,n]});states[7]=["UNVERIFIED","Originalhost / EFFECT_ACK nicht nachgewiesen"];document.getElementById("stages").innerHTML=states.map((s,i)=>"<article><b>"+(i+1)+" · "+names[i]+"</b><p>"+s[0]+"</p><small>"+s[1]+"</small></article>").join("")}
async function read(){try{let get=async u=>{let r=await fetch(u);if(!r.ok)throw Error("GitHub HTTP "+r.status);return r.json()},[pr,issue,data]=await Promise.all([get(api+"/pulls/653"),get(api+"/issues/651"),get(api+"/actions/runs?per_page=100")]);draw(data.workflow_runs.filter(r=>r.head_sha===pr.head.sha),pr,issue);document.getElementById("status").textContent=" · "+new Date().toLocaleString();log("GitHub HEAD "+pr.head.sha)}catch(e){log("Readback BLOCKED: "+e.message)}}
document.getElementById("read").onclick=read;read();
const source=new EventSource("/v1/devops/events");source.onmessage=e=>{try{let x=JSON.parse(e.data);if(x.type==="snapshot"){draw(x.runs||[],x.pr,x.issue);log("Terminal Snapshot "+x.head_sha)}}catch(err){log("Ungültiges Ereignis")}};source.onerror=()=>{document.getElementById("status").textContent=" · Terminal-Stream nicht verbunden"};
document.getElementById("command").onsubmit=async e=>{e.preventDefault();let obj={version:"qikvrt.devops.command.v1",kind:"issue.create",title:document.getElementById("title").value,description:document.getElementById("description").value,priority:"P1",client_nonce:crypto.randomUUID()};try{let r=await fetch("/v1/devops/commands",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)}),x=await r.json();document.getElementById("receipt").textContent=JSON.stringify(x);log("Command admission "+(x.admission||"BLOCKED"))}catch(err){log("Command BLOCKED "+err.message)}};
</script></html>
