name: QIKVRT reflexive repository watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "QIK-VRT autonomous bounded self-heal"
      - "QIK-VRT autonomous draft-PR continuation"
      - "QIK-VRT expected-head promotion executor"
      - "QIKVRT workflow executor"
      - "QIKVRT live status watch"
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT Batch-003 remaining subject disposition"
      - "QIKVRT adaptive runtime"
    types: [requested, in_progress, completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_reflexive_repository_watchdog.yml"
      - ".github/workflows/qikvrt_workflow_executor.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - "tools/qikvrt_reflexive_repository_watchdog.py"
      - "tools/qikvrt_workflow_executor.py"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "registry/NODE_DISCOVERY_POLICY.json"
      - "qikvrt/runtime/onboarding/SEED_ACCEPTANCE_STATUS.json"
      - "qikvrt/runtime/onboarding/NODE_REGISTRATION_RENEWAL.json"
      - "qikvrt/runtime/onboarding/NODE_HEALTH.json"
      - "tests/test_qikvrt_reflexive_repository_watchdog.py"
      - "docs/REFLEXIVE_REPOSITORY_WATCHDOG.md"
      - "state/work_units/CONTINUOUS_GATEWATCH_NODE_LIVENESS_V1.json"
  pull_request:
    paths:
      - ".github/workflows/qikvrt_reflexive_repository_watchdog.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - "tools/qikvrt_reflexive_repository_watchdog.py"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "registry/NODE_DISCOVERY_POLICY.json"
      - "qikvrt/runtime/onboarding/SEED_ACCEPTANCE_STATUS.json"
      - "qikvrt/runtime/onboarding/NODE_REGISTRATION_RENEWAL.json"
      - "qikvrt/runtime/onboarding/NODE_HEALTH.json"
      - "tests/test_qikvrt_reflexive_repository_watchdog.py"
      - "docs/REFLEXIVE_REPOSITORY_WATCHDOG.md"
      - "state/work_units/REFLEXIVE_REPOSITORY_WATCHDOG_V1.json"
      - "state/work_units/CONTINUOUS_GATEWATCH_NODE_LIVENESS_V1.json"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: qikvrt-reflexive-watchdog-${{ github.repository }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  pre-deadlock-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact observed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0; unchanged audited #487 pin
        with:
          python-version: "3.12"

      - name: Reobserve exact head, tree, runs, jobs, and previous reflexive receipt
        id: reobserve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -eEuo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          mkdir -p "$root/jobs"
          observation_stage=CHECKOUT_BINDING
          trap 'observation_rc=$?; printf "%s\n" "$observation_stage" > "$root/failed-stage.txt"; printf "%s\n" "$observation_rc" > "$root/failed-exit-code.txt"' ERR
          local_head="$(git rev-parse --verify HEAD^{commit})"
          test "$local_head" = "$EXPECTED_HEAD"
          observation_stage=SUBJECT_READBACK
          test -n "$GH_TOKEN"
          # Keep the job token mandatory. Record only allowlisted response
          # metadata; never retry anonymously or persist request credentials.
          api_observation() {
            local endpoint="$1" output="$2" response rc=0
            response="$(mktemp)"
            gh api --hostname github.com --method GET --include "$endpoint" \
              > "$response" || rc=$?
            python3 -B - "$response" "$output" "$endpoint" "$rc" <<'PY'
          import json
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_text(encoding="utf-8").replace("\r\n", "\n")
          header, separator, body = raw.partition("\n\n")
          lines = header.splitlines()
          status = None
          if lines and lines[0].startswith("HTTP/"):
              fields = lines[0].split()
              if len(fields) > 1 and fields[1].isdigit():
                  status = int(fields[1])
          allowed = {"x-github-request-id", "x-accepted-github-permissions",
                     "x-ratelimit-resource", "x-ratelimit-remaining", "date"}
          headers = {}
          for line in lines[1:]:
              key, colon, value = line.partition(":")
              if colon and key.lower() in allowed:
                  headers[key.lower()] = value.strip()[:256]
          try:
              value = json.loads(body) if separator else None
          except json.JSONDecodeError:
              value = None
          valid = isinstance(value, dict)
          value = value if valid else {}
          head = value.get("head") if isinstance(value.get("head"), dict) else {}
          object_ref = value.get("object") if isinstance(value.get("object"), dict) else {}
          head_repo = head.get("repo") if isinstance(head.get("repo"), dict) else {}
          observation = {"endpoint": sys.argv[3], "credential": "MANDATORY_GITHUB_JOB_TOKEN",
                         "cli_exit_code": int(sys.argv[4]), "http_status": status,
                         "headers": headers, "json_object_received": valid,
                         "number": value.get("number"), "repository_full_name": value.get("full_name"),
                         "head_sha": head.get("sha") or object_ref.get("sha"),
                         "head_repository": head_repo.get("full_name"),
                         "completion_claims": {"PASS": False, "FINAL_PASS": False, "EFFECT_ACK_DONE": False}}
          Path(sys.argv[2]).write_text(json.dumps(observation, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          PY
            rm -f "$response"
            return "$rc"
          }
          if test "$EVENT_NAME" = pull_request; then
            subject_endpoint="repos/$REPOSITORY/pulls/$EVENT_PR"
          else
            subject_endpoint="repos/$REPOSITORY/git/ref/heads/main"
          fi
          subject_rc=0
          api_observation "$subject_endpoint" "$root/subject-readback-diagnostics.json" || subject_rc=$?
          if test "$subject_rc" -ne 0; then
            # One same-token repository probe distinguishes repository visibility
            # from PR visibility. It cannot satisfy the failed subject readback.
            api_observation "repos/$REPOSITORY" "$root/repository-visibility-diagnostics.json" || true
          fi
          jq '{endpoint, cli_exit_code, http_status, headers}' "$root/subject-readback-diagnostics.json"
          test "$subject_rc" -eq 0
          jq -e '.http_status == 200 and .json_object_received == true' "$root/subject-readback-diagnostics.json" > /dev/null
          if test "$EVENT_NAME" = pull_request; then
            jq -e --arg repo "$REPOSITORY" --argjson number "$EVENT_PR" \
              '.number == $number and .head_repository == $repo' "$root/subject-readback-diagnostics.json" > /dev/null
          fi
          live_head="$(jq -er '.head_sha' "$root/subject-readback-diagnostics.json")"
          test "$live_head" = "$EXPECTED_HEAD"
          git rev-parse --verify HEAD^{tree} > "$root/observed-tree.txt"
          printf '%s\n' "$EXPECTED_HEAD" > "$root/observed-head.txt"
          if test "$EVENT_NAME" = pull_request; then
            if test "${{ github.event.pull_request.base.ref }}" = main; then
              printf '%s\n' PULL_REQUEST_MAIN > "$root/observation-scope.txt"
            else
              printf '%s\n' PULL_REQUEST_STACKED > "$root/observation-scope.txt"
            fi
          else
            printf '%s\n' MAIN > "$root/observation-scope.txt"
          fi
          authority_repository="$(jq -r '.authority.repository' state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json)"
          test "$authority_repository" != null
          observation_stage=AUTHORITY_READBACK
          gh api "repos/$authority_repository/git/ref/heads/main" --jq '.object.sha' \
            > "$root/observed-authority-main-head.txt"
          observation_stage=RUNS_READBACK
          gh api "repos/$REPOSITORY/actions/runs?head_sha=$EXPECTED_HEAD&per_page=100" \
            > "$root/current-runs.json"

          # The analyzer considers every returned run. Fetch the matching jobs for
          # every one of those runs so missing observation data is never confused
          # with a genuine terminal zero-job execution.
          mapfile -t run_ids < <(
            jq -r '.workflow_runs[].id' "$root/current-runs.json"
          )
          for run_id in "${run_ids[@]}"; do
            observation_stage=JOBS_READBACK
            gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
              > "$root/jobs/$run_id.json"
          done

          if test "$EVENT_NAME" != pull_request; then
            observation_stage=BASELINE_READBACK
            previous_run="$(
              gh api "repos/$REPOSITORY/actions/workflows/qikvrt_reflexive_repository_watchdog.yml/runs?branch=main&status=completed&per_page=20" \
                | jq -r --argjson current "$CURRENT_RUN_ID" \
                  '[.workflow_runs[] | select(.id != $current and .conclusion == "success")][0].id // empty'
            )"
            if test -n "$previous_run"; then
              previous_artifact="$(
                gh api "repos/$REPOSITORY/actions/runs/$previous_run/artifacts?per_page=100" \
                  | jq -r '[.artifacts[] | select(.name | startswith("qikvrt-reflexive-repository-watchdog-"))][0].id // empty'
              )"
              if test -n "$previous_artifact"; then
                gh api "repos/$REPOSITORY/actions/artifacts/$previous_artifact/zip" \
                  > "$root/previous-receipt.zip" || true
                unzip -p "$root/previous-receipt.zip" reflexive-watchdog-receipt.json \
                  > "$root/previous-receipt.json" 2>/dev/null || true
              fi
            fi
          fi

      - name: Preserve failed observation as machine-readable HOLD
        if: failure() && steps.reobserve.outcome == 'failure'
        env:
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          stage="$(cat "$root/failed-stage.txt")"
          exit_code="$(cat "$root/failed-exit-code.txt")"
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py observation-failure \
            --expect-head "$EXPECTED_HEAD" \
            --observed-head "$(git rev-parse --verify HEAD^{commit})" \
            --observed-tree "$(git rev-parse --verify HEAD^{tree})" \
            --repository "$REPOSITORY" \
            --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --run-id "$CURRENT_RUN_ID" \
            --run-attempt "$CURRENT_RUN_ATTEMPT" \
            --failed-stage "$stage" --exit-code "$exit_code" --json \
            > "$root/reflexive-watchdog-receipt.json"
          cp "$root/reflexive-watchdog-receipt.json" "$root/gatewatch-receipt.json"

      - name: Analyze the pre-deadlock state without mutation
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          head="$(cat "$root/observed-head.txt")"
          tree="$(cat "$root/observed-tree.txt")"
          scope="$(cat "$root/observation-scope.txt")"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          args=(
            analyze
            --runs-file "$root/current-runs.json"
            --jobs-dir "$root/jobs"
            --expect-head "$head"
            --expect-tree "$tree"
            --repository "$REPOSITORY"
            --now "$now"
            --observation-scope "$scope"
            --node-liveness-dir qikvrt/runtime/onboarding
            --authority-head-file "$root/observed-authority-main-head.txt"
            --json
          )
          if test -s "$root/previous-receipt.json"; then
            args+=(--baseline "$root/previous-receipt.json")
          fi
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py "${args[@]}" \
            > "$root/reflexive-watchdog-receipt.json"
          cp "$root/reflexive-watchdog-receipt.json" "$root/gatewatch-receipt.json"
          jq '{state, disposition, first_blocker, productive_edge, semantic_fingerprint}' \
            "$root/reflexive-watchdog-receipt.json"

      - name: Verify reflexive prevention and mesh continuity contracts
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$(mktemp -d)"
          test -d qikvrt/runtime/onboarding
          mv qikvrt/runtime/onboarding "$fixture_root/onboarding"
          restore_liveness() {
            mv "$fixture_root/onboarding" qikvrt/runtime/onboarding
            rmdir "$fixture_root"
          }
          trap restore_liveness EXIT
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_reflexive_repository_watchdog \
            tests.test_qikvrt_workflow_executor_mesh_contract \
            tests.test_seed_workflows

      - name: Preserve the exact-head pre-deadlock receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-reflexive-repository-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: .qikvrt/reflexive-repository-watchdog
