name: QIKVRT reflexive repository watchdog

on:
  workflow_dispatch:
  issues:
    types: [opened, reopened, closed]
  workflow_run:
    workflows:
      - "QIK-VRT autonomous bounded self-heal"
      - "QIK-VRT expected-head promotion executor"
      - "QIKVRT workflow executor"
      - "QIKVRT live status watch"
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT Batch-003 remaining subject disposition"
      - "QIKVRT adaptive runtime"
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_reflexive_repository_watchdog.yml"
      - ".github/workflows/qikvrt_workflow_executor.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - "tools/qikvrt_reflexive_repository_watchdog.py"
      - "tools/qikvrt_workflow_executor.py"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "policy/CANONICAL_UPSTREAM_REMOTE_V1.json"
      - "policy/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json"
      - "registry/NODE_DISCOVERY_POLICY.json"
      - "qikvrt/runtime/onboarding/SEED_ACCEPTANCE_STATUS.json"
      - "qikvrt/runtime/onboarding/NODE_REGISTRATION_RENEWAL.json"
      - "qikvrt/runtime/onboarding/NODE_HEALTH.json"
      - "tests/test_qikvrt_reflexive_repository_watchdog.py"
      - "docs/REFLEXIVE_REPOSITORY_WATCHDOG.md"
      - "state/work_units/CONTINUOUS_GATEWATCH_NODE_LIVENESS_V1.json"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: qikvrt-reflexive-watchdog-${{ github.repository }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  pre-deadlock-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact observed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Reobserve exact head, tree, runs, jobs, and previous reflexive receipt
        id: reobserve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -eEuo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          mkdir -p "$root/jobs"
          observation_stage=CHECKOUT_BINDING
          trap 'observation_rc=$?; printf "%s\n" "$observation_stage" > "$root/failed-stage.txt"; printf "%s\n" "$observation_rc" > "$root/failed-exit-code.txt"' ERR
          local_head="$(git rev-parse --verify HEAD^{commit})"
          test "$local_head" = "$EXPECTED_HEAD"
          observation_stage=SUBJECT_READBACK
          # The event's exact subject is already bound by the checked-out commit.
          # Avoid an extra unactionable GitHub API request before collecting evidence.
          # Subsequent authority and job readbacks remain independently verified.
          if test "$EVENT_NAME" = pull_request; then
            live_head="$(gh api "repos/$REPOSITORY/pulls/$EVENT_PR" --jq '.head.sha')"
          else
            live_head="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          fi
          test "$live_head" = "$EXPECTED_HEAD"
          git rev-parse --verify HEAD^{tree} > "$root/observed-tree.txt"
          printf '%s\n' "$EXPECTED_HEAD" > "$root/observed-head.txt"
          if test "$EVENT_NAME" = pull_request; then
            if test "${{ github.event.pull_request.base.ref }}" = main; then
              printf '%s\n' PULL_REQUEST_MAIN > "$root/observation-scope.txt"
            else
              printf '%s\n' PULL_REQUEST_STACKED > "$root/observation-scope.txt"
            fi
          else
            printf '%s\n' MAIN > "$root/observation-scope.txt"
          fi
          observation_stage=BASELINE_READBACK
          previous_run="$(
            gh api "repos/$REPOSITORY/actions/workflows/qikvrt_reflexive_repository_watchdog.yml/runs?head_sha=$EXPECTED_HEAD&status=completed&per_page=20" \
              | jq -r --argjson current "$CURRENT_RUN_ID" \
                '[.workflow_runs[] | select(.id != $current)][0].id // empty'
          )"
          if test -n "$previous_run"; then
            previous_artifact="$(
              gh api "repos/$REPOSITORY/actions/runs/$previous_run/artifacts?per_page=100" \
                | jq -r '[.artifacts[] | select(.name | startswith("qikvrt-reflexive-repository-watchdog-"))][0].id // empty'
            )"
            if test -n "$previous_artifact"; then
              gh api "repos/$REPOSITORY/actions/artifacts/$previous_artifact/zip" \
                > "$root/previous-receipt.zip"
              unzip -p "$root/previous-receipt.zip" authority-role-readback.json \
                > "$root/previous-authority-readback.json" 2>/dev/null || true
              unzip -p "$root/previous-receipt.zip" reflexive-watchdog-receipt.json \
                > "$root/previous-receipt.json" 2>/dev/null || true
              if ! jq -e '.semantic_fingerprint' "$root/previous-receipt.json" >/dev/null 2>&1; then
                rm -f "$root/previous-receipt.json"
              fi
            fi
          fi

          observation_stage=AUTHORITY_READBACK
          args=(authority-readback --json)
          if test -s "$root/previous-authority-readback.json"; then
            args+=(--previous-readback "$root/previous-authority-readback.json")
          fi
          python3 -B tools/qikvrt_workflow_executor.py "${args[@]}" \
            > "$root/authority-role-readback.json"
          jq -er '.main_head' "$root/authority-role-readback.json" \
            > "$root/observed-authority-main-head.txt"
          observation_stage=OPEN_WORK_READBACK
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py collect-work \
            --repository "$REPOSITORY" --expect-head "$EXPECTED_HEAD" \
            --pages-dir "$root/work-pages" --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --json > "$root/open-work.json"
          observation_stage=RUNS_READBACK
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py collect-runs \
            --repository "$REPOSITORY" --expect-head "$EXPECTED_HEAD" \
            --pages-dir "$root/run-pages" --json > "$root/current-runs.json"

          # Retain every run; jobs are needed for every active run and the latest
          # run of each workflow. Admit their complete union before any jobs GET.
          observation_stage=JOBS_BUDGET_PREFLIGHT
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py job-readback-budget \
            --runs-file "$root/current-runs.json" --expect-head "$EXPECTED_HEAD" \
            --required-jobs-only --json \
            > "$root/job-readback-budget.json"
          observation_stage=JOBS_READBACK
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py collect-jobs \
            --runs-file "$root/current-runs.json" --repository "$REPOSITORY" \
            --expect-head "$EXPECTED_HEAD" --jobs-dir "$root/jobs" --json \
            > "$root/job-readback.json"
          observation_stage=JOBS_COMPLETENESS_PREFLIGHT
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py job-readback-budget \
            --runs-file "$root/current-runs.json" --expect-head "$EXPECTED_HEAD" \
            --required-jobs-only --jobs-dir "$root/jobs" --json \
            > "$root/validated-job-readback-budget.json"


      - name: Analyze the pre-deadlock state without mutation
        id: analyze
        env:
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          trap 'rc=$?; printf "ANALYSIS\n" > "$root/failed-stage.txt"; printf "%s\n" "$rc" > "$root/failed-exit-code.txt"' ERR
          head="$(cat "$root/observed-head.txt")"
          tree="$(cat "$root/observed-tree.txt")"
          scope="$(cat "$root/observation-scope.txt")"
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          args=(
            analyze
            --runs-file "$root/current-runs.json"
            --work-file "$root/open-work.json"
            --jobs-dir "$root/jobs"
            --job-plan-file "$root/job-readback-budget.json"
            --expect-head "$head"
            --expect-tree "$tree"
            --repository "$REPOSITORY"
            --now "$now"
            --observation-scope "$scope"
            --node-liveness-dir qikvrt/runtime/onboarding
            --authority-head-file "$root/observed-authority-main-head.txt"
            --json
          )
          if test -s "$root/previous-receipt.json"; then
            args+=(--baseline "$root/previous-receipt.json")
          fi
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py "${args[@]}" \
            > "$root/reflexive-watchdog-receipt.json"
          cp "$root/reflexive-watchdog-receipt.json" "$root/gatewatch-receipt.json"
          jq '{state, disposition, first_blocker, productive_edge, semantic_fingerprint}' \
            "$root/reflexive-watchdog-receipt.json"

      - name: Preserve failed observation as machine-readable HOLD
        if: failure() && (steps.reobserve.outcome == 'failure' || steps.analyze.outcome == 'failure')
        env:
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          stage="$(cat "$root/failed-stage.txt")"
          exit_code="$(cat "$root/failed-exit-code.txt")"
          if test -s "$root/authority-role-readback.json"; then
            jq '{state, first_blocker, retry_binding_sha256, native_activation_verified}' \
              "$root/authority-role-readback.json"
          fi
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py observation-failure \
            --expect-head "$EXPECTED_HEAD" \
            --observed-head "$(git rev-parse --verify HEAD^{commit})" \
            --observed-tree "$(git rev-parse --verify HEAD^{tree})" \
            --repository "$REPOSITORY" \
            --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --run-id "$CURRENT_RUN_ID" \
            --run-attempt "$CURRENT_RUN_ATTEMPT" \
            --failed-stage "$stage" --exit-code "$exit_code" --json \
            > "$root/reflexive-watchdog-receipt.json"
          cp "$root/reflexive-watchdog-receipt.json" "$root/gatewatch-receipt.json"

      - name: Persist same-writer recovery successor after failed observation
        if: failure() && (steps.reobserve.outcome == 'failure' || steps.analyze.outcome == 'failure')
        env:
          REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from tools.qikvrt_client_continuation import decide
          from tools.qikvrt_diagnostic_successor import materialize

          root = Path(".qikvrt/reflexive-repository-watchdog")
          stage = (root / "failed-stage.txt").read_text().strip()
          run = os.environ["CURRENT_RUN_ID"]
          attempt = os.environ["CURRENT_RUN_ATTEMPT"]
          receipt = {
              "schema": "qikvrt_client_continuation_v1",
              "repository": os.environ["REPOSITORY"],
              "work_unit_id": "watchdog-" + run + "-" + attempt,
              "writer_id": "reflexive-watchdog-" + run,
              "head_sha": os.environ["EXPECTED_HEAD"],
              "state": "BLOCKED",
              "blocker": "CI",
              "next_action": "READBACK",
              "effect_ack_done": False,
          }
          path = materialize(receipt, decide(receipt), root / "diagnostic-successor")
          print("Persisted diagnostic successor:", path, "failed_stage:", stage)
          PY

      - name: Bind error analysis for the existing repair consumer
        if: always()
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRODUCER_EVENT: ${{ github.event_name }}
          PARENT_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          root=.qikvrt/reflexive-repository-watchdog
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py repair-handoff \
            --analysis-file "$root/reflexive-watchdog-receipt.json" \
            --run-id "$CURRENT_RUN_ID" --run-attempt "$CURRENT_RUN_ATTEMPT" \
            --event "$PRODUCER_EVENT" --parent-workflow "$PARENT_WORKFLOW" --json \
            > "$root/error-analysis-handoff.json"

      - name: Verify reflexive prevention and mesh continuity contracts
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$(mktemp -d)"
          test -d qikvrt/runtime/onboarding
          mv qikvrt/runtime/onboarding "$fixture_root/onboarding"
          restore_liveness() {
            mv "$fixture_root/onboarding" qikvrt/runtime/onboarding
            rmdir "$fixture_root"
          }
          trap restore_liveness EXIT
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_reflexive_repository_watchdog \
            tests.test_qikvrt_workflow_executor_mesh_contract \
            tests.test_seed_workflows

      - name: Preserve the exact-head pre-deadlock receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-reflexive-repository-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: .qikvrt/reflexive-repository-watchdog
