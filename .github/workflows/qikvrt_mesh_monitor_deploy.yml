name: QIKVRT existing Mesh monitor exact deployment

on:
  push:
    branches:
      - candidate/mesh-monitor-mirror-20261004-29a55ae4
      - main
    paths:
      - .github/workflows/qikvrt_mesh_monitor_deploy.yml
      - tools/qikvrt_mesh_monitor_deploy.py
      - tools/qikvrt_mesh_monitor_readback.mjs
      - state/deployments/MESH_MONITOR_RAILWAY_EXACT_674aa35.json
  deployment_status:
  workflow_dispatch:

# One target, one writer. The create-only Git ref also survives runner loss.
concurrency:
  group: qikvrt-existing-mesh-monitor-dc3773e0-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'ingolf-lohmann/qik-vrt' && (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Current executor tests and exact source binding
        run: |
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B -m unittest -v tests.test_mesh_monitor_deploy
          node --test tests/mesh_monitor_readback.test.mjs
          make test

  existing-service:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Git-Data create-only ref is the only repository write this job performs.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.x'
      - name: Converge once through the server-side API capability
        id: converge
        continue-on-error: true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          QIKVRT_EXECUTOR_HEAD: ${{ github.sha }}
          QIKVRT_EXECUTOR_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A deployment-status event is observation only, never another deploy.
          if [ "$EVENT_NAME" = deployment_status ]; then
            python3 -B tools/qikvrt_mesh_monitor_deploy.py
          else
            python3 -B tools/qikvrt_mesh_monitor_deploy.py --apply
          fi
      - name: Persist exact result and human progress projection
        if: always()
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone
          base = Path('.qikvrt/evidence/monitor-deploy')
          base.mkdir(parents=True, exist_ok=True)
          receipt = base / 'receipt.json'
          data = json.loads(receipt.read_text()) if receipt.exists() else {'state':'HOLD_EXECUTOR_DID_NOT_PRODUCE_RECEIPT', 'effect_ack_done':False}
          verified = data['state'] == 'PUBLIC_RUNTIME_READBACK_VERIFIED'
          frame = {'schema':'qikvrt_human_machine_progress_v1',
            'repository':'ingolf-lohmann/qik-vrt',
            'operation':'Existing mesh-monitor, exact runtime 674aa35ec0659119a19cda66b88f32050e34f105; executor '+os.environ['GITHUB_SHA']+' at '+os.environ['GITHUB_REF_NAME'],
            'status':'PASS' if verified else 'BLOCK', 'progressPercent':100 if verified else 50,
            'gates':[{'name':'Exact executor tests and source binding','state':'PASS','evidence':'validate job'},
              {'name':'Public source, health and independent client readback','state':'PASS' if verified else 'BLOCK','evidence':'receipt.json: '+data['state']}]}
          (base/'AI_PROGRESS.json').write_text(json.dumps(frame,indent=2)+'\n')
          text = '# Exact existing Mesh monitor deployment\n\n'+data['state']+'\n\n'+json.dumps(data,indent=2)+'\n'
          (base/'AI_STATUS.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:output.write(text)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: mesh-monitor-exact-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qikvrt/evidence/monitor-deploy/
          include-hidden-files: true
          retention-days: 30
      - name: Keep capability and deployment HOLD terminally visible
        if: always()
        run: |
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          receipt=Path('.qikvrt/evidence/monitor-deploy/receipt.json')
          state=json.loads(receipt.read_text()).get('state') if receipt.exists() else None
          if state != 'PUBLIC_RUNTIME_READBACK_VERIFIED':raise SystemExit(20)
          PY
