name: QIK-VRT spacetime bridge formal verification

on:
  push:
    paths:
      - "formalization/QIKVRT_SpacetimeBridge_v1/**"
      - "formalization/QIKVRT_CausalGeometry_v1/**"
      - "docs/research/2026-11-11-lean-geometric-reconstruction/SPACETIME_BRIDGE_REVIEW.md"
      - ".github/workflows/qikvrt_spacetime_bridge.yml"
  pull_request:
    paths:
      - "formalization/QIKVRT_SpacetimeBridge_v1/**"
      - "formalization/QIKVRT_CausalGeometry_v1/**"
      - "docs/research/2026-11-11-lean-geometric-reconstruction/SPACETIME_BRIDGE_REVIEW.md"
      - ".github/workflows/qikvrt_spacetime_bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-spacetime-bridge-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: formalization/QIKVRT_SpacetimeBridge_v1
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization/QIKVRT_SpacetimeBridge_v1
          test: false
      - name: Build the spacetime bridge
        run: lake build QIKVRTSpacetimeBridge
      - name: Reject proof escapes
        run: lake env lean -E hasSorry QIKVRTSpacetimeBridge/SpacetimeBridge.lean
      - name: Audit theorem dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean QIKVRTSpacetimeBridge/AxiomAudit.lean > .lake/build/spacetime-bridge-axioms.log
          python3 - <<'PY'
          from pathlib import Path
          output = Path(".lake/build/spacetime-bridge-axioms.log").read_text()
          expected = [
              "QIKVRT.SpacetimeBridge.V1.causal_volume_reconstruct",
              "QIKVRT.SpacetimeBridge.V1.rejection_exceeds_tolerance",
          ]
          for name in expected:
              if name not in output:
                  raise SystemExit("BLOCK missing axiom audit: " + name)
          for line in output.splitlines():
              if any(name in line for name in expected):
                  if "does not depend on any axioms" not in line:
                      raise SystemExit("BLOCK unexpected axiom dependency: " + line)
          print("PASS: both spacetime bridge theorems are axiom-free")
          PY
