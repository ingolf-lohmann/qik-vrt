name: QIK-VRT Wirkungsquadrat source bootstrap

"on":
  push:
    branches:
      - agent/wirkungsquadrat-v1
    paths:
      - bootstrap/wirkungsquadrat-source-v1.zip.b64
      - .github/workflows/qikvrt_wirkungsquadrat_bootstrap.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-wirkungsquadrat-bootstrap-${{ github.repository }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'Goldkelch/qik-vrt' || github.repository == 'ingolf-lohmann/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/wirkungsquadrat-v1
          fetch-depth: 0

      - name: Detect complete source bundle
        id: bundle
        shell: bash
        run: |
          if [ -f bootstrap/wirkungsquadrat-source-v1.zip.b64 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Bundle not present yet; bootstrap remains inert.'
          fi

      - name: Bind Python runtime
        if: steps.bundle.outputs.ready == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Decode, authenticate and materialize exact source tree
        if: steps.bundle.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, pathlib, stat, zipfile

          B64 = pathlib.Path('bootstrap/wirkungsquadrat-source-v1.zip.b64')
          EXPECTED_B64_SHA256 = '5fe629adee6585bb177a46a80b60988132f99ec56b13ada303e1ef020c26a223'
          EXPECTED_ZIP_SHA256 = 'd0324281b02526b805fec910daa2ce158b0437239d04805b533b95c7a1094912'
          EXPECTED_FILES = 40
          raw_b64 = B64.read_bytes()
          if hashlib.sha256(raw_b64).hexdigest() != EXPECTED_B64_SHA256:
              raise SystemExit('BLOCK: source-bundle Base64 hash mismatch')
          try:
              archive = base64.b64decode(raw_b64, validate=True)
          except Exception as exc:
              raise SystemExit('BLOCK: invalid source-bundle Base64') from exc
          if hashlib.sha256(archive).hexdigest() != EXPECTED_ZIP_SHA256:
              raise SystemExit('BLOCK: source-bundle ZIP hash mismatch')
          bundle = pathlib.Path('.qikvrt/wirkungsquadrat-source-v1.zip')
          bundle.parent.mkdir(parents=True, exist_ok=True)
          bundle.write_bytes(archive)
          with zipfile.ZipFile(bundle) as zf:
              names = zf.namelist()
              if names.count('BUNDLE_MANIFEST.json') != 1:
                  raise SystemExit('BLOCK: source-bundle manifest cardinality differs')
              manifest = json.loads(zf.read('BUNDLE_MANIFEST.json').decode('utf-8'))
              if manifest.get('schema') != 'qikvrt_wirkungsquadrat_source_bundle_v1':
                  raise SystemExit('BLOCK: source-bundle schema differs')
              files = manifest.get('files')
              if not isinstance(files, list) or len(files) != EXPECTED_FILES or manifest.get('file_count') != EXPECTED_FILES:
                  raise SystemExit('BLOCK: source-bundle file count differs')
              expected = {entry['path']: entry for entry in files}
              if len(expected) != EXPECTED_FILES or set(names) != {'BUNDLE_MANIFEST.json', *expected}:
                  raise SystemExit('BLOCK: source-bundle archive entries differ from manifest')
              for name in sorted(expected):
                  pure = pathlib.PurePosixPath(name)
                  info = zf.getinfo(name)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if (
                      pure.is_absolute()
                      or any(part in ('', '.', '..') for part in pure.parts)
                      or pure.parts[0] in ('.git', '.qikvrt', 'bootstrap')
                      or '\\' in name
                      or stat.S_ISLNK(mode)
                  ):
                      raise SystemExit(f'BLOCK: unsafe source-bundle path: {name}')
                  data = zf.read(name)
                  entry = expected[name]
                  if set(entry) != {'path', 'size', 'sha256'}:
                      raise SystemExit(f'BLOCK: source-bundle manifest entry differs: {name}')
                  if len(data) != entry['size'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                      raise SystemExit(f'BLOCK: source-bundle file hash mismatch: {name}')
                  target = pathlib.Path(name)
                  cursor = pathlib.Path('.')
                  for part in pure.parts[:-1]:
                      cursor /= part
                      if cursor.is_symlink():
                          raise SystemExit(f'BLOCK: target parent is a symbolic link: {name}')
                  if target.exists() and target.is_symlink():
                      raise SystemExit(f'BLOCK: target is a symbolic link: {name}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  if hashlib.sha256(target.read_bytes()).hexdigest() != entry['sha256']:
                      raise SystemExit(f'BLOCK: materialized file differs: {name}')
          evidence = {
              'schema': 'qikvrt_wirkungsquadrat_source_bundle_evidence_v1',
              'status': 'PASS',
              'base64_sha256': EXPECTED_B64_SHA256,
              'archive_sha256': EXPECTED_ZIP_SHA256,
              'materialized_file_count': EXPECTED_FILES,
          }
          pathlib.Path('bootstrap/WIRKUNGSQUADRAT_SOURCE_BUNDLE_EVIDENCE.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

      - name: Regenerate repository integrity and run complete gates
        if: steps.bundle.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 make test
          python3 tools/qikvrt_integrity.py verify

      - name: Persist exact materialized source and evidence
        if: steps.bundle.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Source bundle is already materialized.'
            exit 0
          fi
          git commit -m 'Persist Wirkungsquadrat v1 source, proof gates and release automation'
          git push origin HEAD:agent/wirkungsquadrat-v1
