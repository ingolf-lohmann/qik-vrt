name: QIKVRT workflow executor

on:
  workflow_dispatch:
    inputs:
      task_mode:
        description: Existing executor or separately requested IONOS GET inventory/classification
        type: choice
        default: executor
        options: [executor, ionos-inventory-classify]
      expected_main_head:
        description: Independently observed exact main commit for IONOS read-only execution
        type: string
        default: ""
      expected_main_tree:
        description: Independently observed exact main tree for IONOS read-only execution
        type: string
        default: ""
      ionos_binding_secret:
        description: Name of an EXISTING repository secret carrying the private PROVIDER_BINDING JSON
        type: string
        default: ""
      ionos_binding_sha256:
        description: Independent SHA-256 of the exact existing private binding bytes
        type: string
        default: ""
  schedule:
    - cron: "23 * * * *"
    - cron: "30 8 * * *"
      timezone: "Europe/Paris"
    - cron: "0 10-20/2 6 10 *"
      timezone: "Europe/Paris"
  push:
    branches: [main]
    paths:
      - "AI"
      - "Makefile"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"
      - "tools/qikvrt_workflow_executor.py"
      - "tools/qikvrt_seed_common.py"
      - ".github/workflows/qikvrt_workflow_executor.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - "tests/test_qikvrt_workflow_executor_mesh_contract.py"
      - "tests/test_seed_workflows.py"
      - "acceptance/WORKFLOW_EXECUTOR_MESH_NODE_CONTINUITY_ACCEPTANCE_TEST.md"
      - "registry/NODE_DISCOVERY_POLICY.json"
      - "personal/ingolf-lohmann/reminders/**"
      - "tools/qikvrt_owner_reminders.py"
      - "tests/test_owner_reminders.py"

permissions:
  actions: write
  contents: read

concurrency:
  group: qikvrt-workflow-executor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  owner-reminders:
    if: github.repository == 'ingolf-lohmann/qik-vrt' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.task_mode == 'executor')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out exact owner reminder event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up declared Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify cache coverage and reminder contract
        run: |
          python3 -B tools/qikvrt_tool_cache.py verify
          make owner-reminders-test
      - name: Observe due owner reminders and read back bounded notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/qikvrt_owner_reminders.py --deliver --output .qikvrt/owner-reminders/receipt.json
      - name: Preserve owner reminder evidence and scoped progress
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-owner-reminders-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qikvrt/owner-reminders
          if-no-files-found: error
          retention-days: 90

  observe-plan-and-dispatch-one-safe-watchdog:
    if: github.event_name != 'workflow_dispatch' || inputs.task_mode == 'executor'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact current Authority main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reobserve exact Authority head and bounded workflow-run baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qikvrt/workflow-executor
          local_head="$(git rev-parse --verify HEAD^{commit})"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$local_head" = "$live_head"
          printf '%s\n' "$live_head" > .qikvrt/workflow-executor/observed-main-head.txt
          git rev-parse --verify HEAD^{tree} > .qikvrt/workflow-executor/observed-main-tree.txt
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&per_page=100" \
            > .qikvrt/workflow-executor/current-runs.json

          previous_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/qikvrt_workflow_executor.yml/runs?branch=main&status=completed&per_page=20" \
            --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if test -n "$previous_run"; then
            previous_artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name | startswith("qikvrt-workflow-executor-snapshot-"))][0].id // empty' 2>/dev/null || true)"
            if test -n "$previous_artifact"; then
              gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${previous_artifact}/zip" \
                > .qikvrt/workflow-executor/previous-snapshot.zip
              unzip -p .qikvrt/workflow-executor/previous-snapshot.zip workflow-executor-snapshot.json \
                > .qikvrt/workflow-executor/previous-snapshot.json || true
            fi
          fi

      - name: Build exact-head dispatch plan
        shell: bash
        run: |
          set -euo pipefail
          head="$(cat .qikvrt/workflow-executor/observed-main-head.txt)"
          args=(plan --runs-file .qikvrt/workflow-executor/current-runs.json --expect-head "$head" --ref main --json)
          if test -s .qikvrt/workflow-executor/previous-snapshot.json; then
            args+=(--baseline .qikvrt/workflow-executor/previous-snapshot.json)
          fi
          python3 -B tools/qikvrt_workflow_executor.py "${args[@]}" \
            > .qikvrt/workflow-executor/dispatch-plan.json
          jq '.observed' .qikvrt/workflow-executor/dispatch-plan.json \
            > .qikvrt/workflow-executor/workflow-executor-snapshot.json

      - name: Dispatch only a newly eligible no-effect exact-head watchdog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          plan=.qikvrt/workflow-executor/dispatch-plan.json
          head="$(cat .qikvrt/workflow-executor/observed-main-head.txt)"
          tree="$(cat .qikvrt/workflow-executor/observed-main-tree.txt)"
          count="$(jq '[.candidates[] | select(.disposition == "DISPATCH")] | length' "$plan")"
          test "$count" -le 1
          : > .qikvrt/workflow-executor/dispatched-runs.jsonl
          while IFS=$'\t' read -r workflow_id workflow_name; do
            test -n "$workflow_id"
            refreshed_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
            test "$refreshed_head" = "$head"
            dispatched_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" \
              -f ref=main
            run_id=""
            for _ in $(seq 1 12); do
              run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?event=workflow_dispatch&branch=main&per_page=100" \
                | jq -r --arg head "$head" --arg started "$dispatched_at" \
                  '[.workflow_runs[] | select(.head_sha == $head and .created_at >= $started)][0].id // empty')"
              test -n "$run_id" && break
              sleep 5
            done
            test -n "$run_id"
            printf '{"workflow_id":"%s","workflow_name":"%s","ref":"main","head_sha":"%s","tree_sha":"%s","run_id":%s}\n' \
              "$workflow_id" "$workflow_name" "$head" "$tree" "$run_id" \
              >> .qikvrt/workflow-executor/dispatched-runs.jsonl
          done < <(jq -r '.candidates[] | select(.disposition == "DISPATCH") | [.workflow_id, .workflow_name] | @tsv' "$plan")

      - name: Preserve exact-head plan and dispatch receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-workflow-executor-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: .qikvrt/workflow-executor

  ionos-readonly:
    if: github.repository == 'ingolf-lohmann/qik-vrt' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.task_mode == 'ionos-inventory-classify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact trusted main event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up declared Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.13"
      - name: Verify coverage and fresh exact main before any provider credential delivery
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_HEAD: ${{ inputs.expected_main_head }}
          EXPECTED_MAIN_TREE: ${{ inputs.expected_main_tree }}
        run: |
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B - <<'PY'
          import os, re, subprocess, urllib.request
          from pathlib import Path
          from tools import qikvrt_self_host_provider as provider
          def require(condition):
              if not condition: raise ValueError('EXACT_MAIN_REQUIRED')
          try:
              head, tree = os.environ['EXPECTED_MAIN_HEAD'], os.environ['EXPECTED_MAIN_TREE']
              require(all(re.fullmatch(r'[a-f0-9]{40}', value) for value in (head, tree)))
              require(os.environ['GITHUB_REPOSITORY'] == 'ingolf-lohmann/qik-vrt')
              require(os.environ['GITHUB_REF'] == 'refs/heads/main')
              require(os.environ['GITHUB_SHA'] == head)
              for kind, expected in [('commit', head), ('tree', tree)]:
                  require(subprocess.check_output(['git', 'rev-parse', '--verify', 'HEAD^{' + kind + '}'], text=True).strip() == expected)
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), provider.NoRedirect())
              def get(path):
                  url = 'https://api.github.com/repos/ingolf-lohmann/qik-vrt/' + path
                  request = urllib.request.Request(url, method='GET', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28', 'Cache-Control': 'no-cache'})
                  with opener.open(request, timeout=15) as response:
                      require(response.geturl() == url and response.status == 200)
                      data = response.read(1024 * 1024 + 1)
                      require(len(data) <= 1024 * 1024)
                  return provider.decode(data)
              require(get('git/ref/heads/main')['object']['sha'] == head)
              require(get('git/commits/' + head)['tree']['sha'] == tree)
              directory = Path(os.environ['RUNNER_TEMP']) / 'qikvrt-ionos-readonly'
              directory.mkdir(mode=0o700)
              provider.host.private_path(directory, directory=True)
              subject = {'repository': os.environ['GITHUB_REPOSITORY'], 'ref': os.environ['GITHUB_REF'],
                  'head': head, 'tree': tree, 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
              provider.host.synced_private_file(directory / 'subject.json', provider.wire(subject))
              provider.host.sync_directory(directory)
          except (AssertionError, ValueError, OSError, KeyError, TypeError, subprocess.SubprocessError):
              raise SystemExit('HOLD_IONOS_EXACT_MAIN_BINDING_REQUIRED') from None
          PY
      - name: Existing IONOS GET inventory and classify with private fresh readback
        env:
          IONOS_TOKEN: ${{ secrets.IONOS_TOKEN }}
          IONOS_BINDING_SECRET_NAME: ${{ inputs.ionos_binding_secret }}
          IONOS_BINDING_JSON: ${{ secrets[inputs.ionos_binding_secret] }}
          IONOS_BINDING_SHA256: ${{ inputs.ionos_binding_sha256 }}
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from tools import qikvrt_self_host_provider as provider
          directory = Path(os.environ['RUNNER_TEMP']) / 'qikvrt-ionos-readonly'
          subject = provider.decode((directory / 'subject.json').read_bytes())
          receipt = provider.repository_readonly(directory, subject)
          print('IONOS_READONLY_STATE=' + receipt['state'])
          print('IONOS_READONLY_BOUNDARY=' + (receipt['first_boundary'] or 'NONE'))
          raise SystemExit(2 if receipt['state'] == 'HOLD' else 0)
          PY
      - name: Persist only bounded IONOS receipt metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-ionos-readonly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-ionos-readonly/receipt.json
          if-no-files-found: error
          retention-days: 7
