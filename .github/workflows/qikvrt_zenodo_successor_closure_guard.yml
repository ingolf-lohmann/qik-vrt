name: QIKVRT Zenodo successor closure guard

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-zenodo-successor-closure-mirror-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

jobs:
  candidate-freshness:
    if: github.repository == 'ingolf-lohmann/qik-vrt' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact Mirror PR subject
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Reject stale registered Mirror candidates
        run: python3 -B tools/qikvrt_zenodo_successor_guard.py check-all
      - name: Keep production publication authority separated
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "ingolf-lohmann/qik-vrt"
          printf '%s\n' 'MIRROR_PUBLICATION_MUTATION=FORBIDDEN'
          printf '%s\n' 'AUTHORITY_PUBLICATION_REPOSITORY=Goldkelch/qik-vrt'
