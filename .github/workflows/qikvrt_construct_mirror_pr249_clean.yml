name: QIKVRT construct Mirror candidate for Authority PR249

on:
  push:
    branches:
      - trusted/trigger-construct-mirror-pr249-clean-v1

permissions:
  contents: write

concurrency:
  group: qikvrt-construct-mirror-pr249-7d87a600-afcd0255
  cancel-in-progress: false

jobs:
  construct:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
      AUTHORITY_MAIN: 7d87a6003135a6e3efbca34b2d898967d7f66018
      AUTHORITY_PR: "249"
      MIRROR_PARENT: afcd0255aab6bc5ad18275a2d91516688a41e302
      TRIGGER_BRANCH: trusted/trigger-construct-mirror-pr249-clean-v1
      CANDIDATE_BRANCH: sync/owner-accepted-six-authority-7d87a600-from-afcd0255-v1
      MARKER_PATH: work-units/HISTORY_PRESERVING_MIRROR_SYNC_REQUEST_PR249.json
    steps:
      - name: Check out immutable trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate exact request and frozen transport boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "${GITHUB_REF_NAME}" = "$TRIGGER_BRANCH"
          test "$(git rev-parse HEAD^)" = "$MIRROR_PARENT"
          test "$(git ls-remote origin "refs/heads/${TRIGGER_BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          python3 - <<'PY'
          import json, os, pathlib
          value = json.loads(pathlib.Path(os.environ["MARKER_PATH"]).read_text(encoding="utf-8"))
          expected = {
              "schema": "qikvrt_history_preserving_mirror_candidate_request_pr249_v1",
              "state": "READY",
              "operation": "CONSTRUCT_HISTORY_PRESERVING_MIRROR_CANDIDATE",
              "owner_authorization": "ACCEPT",
              "authority_repository": "Goldkelch/qik-vrt",
              "authority_main": "7d87a6003135a6e3efbca34b2d898967d7f66018",
              "authority_pull_request": 249,
              "mirror_repository": "ingolf-lohmann/qik-vrt",
              "mirror_parent": "afcd0255aab6bc5ad18275a2d91516688a41e302",
              "trigger_branch": "trusted/trigger-construct-mirror-pr249-clean-v1",
              "target_branch": "sync/owner-accepted-six-authority-7d87a600-from-afcd0255-v1",
              "completion_claims": {
                  "candidate_created": False,
                  "mirror_promoted": False,
                  "reciprocal_equality_receipt_complete": False,
                  "zenodo_mutation_authorized": False,
                  "pass": False,
                  "final_pass": False,
                  "effect_ack_done": False,
              },
          }
          assert value == expected, "request marker drift"
          PY

      - name: Verify frozen remote leases
        shell: bash
        run: |
          set -euo pipefail
          mirror_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          authority_main="$(git ls-remote "https://github.com/${AUTHORITY_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test "$mirror_main" = "$MIRROR_PARENT"
          test "$authority_main" = "$AUTHORITY_MAIN"
          if git ls-remote --exit-code origin "refs/heads/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo "Candidate branch unexpectedly exists before construction" >&2
            exit 2
          fi

      - name: Fetch exact promoted Authority commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${AUTHORITY_REPOSITORY}.git" "$AUTHORITY_MAIN"
          test "$(git rev-parse FETCH_HEAD)" = "$AUTHORITY_MAIN"

      - name: Construct exact Authority-tree candidate with sole Mirror parent
        id: construct
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          authority_tree="$(git rev-parse "${AUTHORITY_MAIN}^{tree}")"
          observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export GIT_AUTHOR_DATE="$observed_at" GIT_COMMITTER_DATE="$observed_at"
          candidate="$(printf '%s\n\n%s\n%s\n%s\n%s\n%s\n' \
            'Synchronize owner-accepted six corrected corpus candidates from Authority PR249' \
            "Authority-main: ${AUTHORITY_MAIN}" \
            "Authority-PR: ${AUTHORITY_PR}" \
            "Mirror-parent: ${MIRROR_PARENT}" \
            "Authority-tree: ${authority_tree}" \
            'Boundary: candidate only; no Mirror promotion, equality receipt, Zenodo mutation, PASS, FINAL_PASS or EFFECT_ACK_DONE' \
            | git commit-tree "$authority_tree" -p "$MIRROR_PARENT")"
          test "$(git rev-parse "${candidate}^")" = "$MIRROR_PARENT"
          test "$(git rev-parse "${candidate}^{tree}")" = "$authority_tree"
          git diff --exit-code --no-renames "$AUTHORITY_MAIN" "$candidate"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'authority_tree=%s\n' "$authority_tree" >> "$GITHUB_OUTPUT"
          printf 'observed_at=%s\n' "$observed_at" >> "$GITHUB_OUTPUT"

      - name: Persist candidate under reobserved leases
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          candidate="${{ steps.construct.outputs.candidate }}"
          mirror_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          authority_main="$(git ls-remote "https://github.com/${AUTHORITY_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          test "$mirror_main" = "$MIRROR_PARENT"
          test "$authority_main" = "$AUTHORITY_MAIN"
          if git ls-remote --exit-code origin "refs/heads/${CANDIDATE_BRANCH}" >/dev/null 2>&1; then
            echo "Candidate branch appeared during construction" >&2
            exit 2
          fi
          set +e
          git push origin "${candidate}:refs/heads/${CANDIDATE_BRANCH}" > /tmp/candidate-push.log 2>&1
          rc=$?
          set -e
          cat /tmp/candidate-push.log
          printf 'push_exit=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          printf 'candidate=%s\n' "$candidate" > /tmp/candidate.env
          printf 'push_exit=%s\n' "$rc" >> /tmp/candidate.env
          if [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
          remote_candidate="$(git ls-remote origin "refs/heads/${CANDIDATE_BRANCH}" | awk '{print $1}')"
          test "$remote_candidate" = "$candidate"

      - name: Write immutable construction receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          candidate = "${{ steps.construct.outputs.candidate }}"
          push_exit = "${{ steps.persist.outputs.push_exit }}"
          persisted = bool(candidate) and push_exit == "0"
          value = {
              "schema": "qikvrt_history_preserving_mirror_candidate_construction_v1",
              "state": "CANDIDATE_CONSTRUCTED_NOT_PROMOTED" if persisted else "CANDIDATE_CONSTRUCTED_LOCALLY_PERSISTENCE_BLOCKED",
              "authority": {
                  "repository": os.environ["AUTHORITY_REPOSITORY"],
                  "main": os.environ["AUTHORITY_MAIN"],
                  "source_pull_request": int(os.environ["AUTHORITY_PR"]),
              },
              "mirror": {
                  "repository": "ingolf-lohmann/qik-vrt",
                  "parent": os.environ["MIRROR_PARENT"],
                  "candidate_branch": os.environ["CANDIDATE_BRANCH"],
                  "candidate": candidate or None,
                  "persisted": persisted,
                  "push_exit": int(push_exit) if push_exit else None,
              },
              "shared_git_tree": "${{ steps.construct.outputs.authority_tree }}" or None,
              "complete_authority_to_candidate_diff_empty": bool(candidate),
              "observed_at": "${{ steps.construct.outputs.observed_at }}" or None,
              "boundaries": {
                  "mirror_promotion": False,
                  "reciprocal_equality_receipt": False,
                  "zenodo_mutation": False,
                  "pass": False,
                  "final_pass": False,
                  "effect_ack_done": False,
              },
          }
          pathlib.Path("/tmp/MIRROR_CANDIDATE_CONSTRUCTION_RECEIPT.json").write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable construction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-mirror-candidate-pr249-construction
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            /tmp/MIRROR_CANDIDATE_CONSTRUCTION_RECEIPT.json
            /tmp/candidate-push.log
            /tmp/candidate.env
