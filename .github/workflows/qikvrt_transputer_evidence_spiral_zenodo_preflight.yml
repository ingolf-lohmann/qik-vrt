name: QIKVRT Transputer evidence-spiral Zenodo preflight

on:
  push:
    branches:
      - docs/information-effect-axis-v1
    paths:
      - .github/workflows/qikvrt_transputer_evidence_spiral_zenodo_preflight.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/qikvrt_transputer_evidence_spiral_zenodo_preflight.yml

permissions:
  contents: read

concurrency:
  group: qikvrt-transputer-evidence-spiral-zenodo-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'Goldkelch/qik-vrt'
    runs-on: ubuntu-24.04
    environment: zenodo-production
    env:
      TARGET_PDF_SHA256: 78c845bb2bd078d9aeff2657865fc8b877aacf97987b64b817bd7e8856cf0536
      TARGET_PDF_BYTES: '243720'
      ZENODO_API_BASE: https://zenodo.org/api
    steps:
      - name: Check out observed carrier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_PDF_SHA256" = '78c845bb2bd078d9aeff2657865fc8b877aacf97987b64b817bd7e8856cf0536'
          test "$TARGET_PDF_BYTES" = '243720'

      - name: Verify repository publication capability
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/qikvrt_zenodo_publish.py
          test -f tools/qikvrt_zenodo_machine_proof.py
          test -f policy/zenodo-machine-proof-policy-v2.json
          test -f runtime/capabilities/ZENODO_PUBLICATION_CAPABILITY.json
          python3 -B tools/qikvrt_tool_cache.py verify

      - name: Verify production credential is provisioned without disclosure
        shell: bash
        env:
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${ZENODO_ACCESS_TOKEN:-}"
          printf '%s\n' 'ZENODO_PRODUCTION_CREDENTIAL=PROVISIONED'

      - name: Report exact next boundary
        shell: bash
        run: |
          printf '%s\n' "QIKVRT_ZENODO_PREFLIGHT=PASS pdf_sha256=$TARGET_PDF_SHA256 pdf_bytes=$TARGET_PDF_BYTES"
          printf '%s\n' 'NEXT=materialize exact reviewed files plus v2 proof/return/authorization controls, then invoke existing generic publisher'
