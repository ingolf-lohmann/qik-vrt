# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
# New focused S1 admission; the broader original workflow is archived unchanged.
name: QIKVRT productive TEMDD S1 carrier
on:
  pull_request:
    paths:
      - 'src/qikvrt_temdd_event_ledger.py'
      - 'src/qikvrt_effect_ack_http_terminal.py'
      - 'tests/test_temdd*'
      - 'tests/test_self_host*'
      - 'runtime/self-host/**'
      - 'deploy/universal-terminal/**'
      - 'docs/terminal/temdd/**'
      - 'tools/qikvrt_self_host.py'
      - 'Makefile'
      - '.github/workflows/qikvrt_temdd.yml'
      - 'REPOSITORY_FILE_MANIFEST.json.sha256'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-carrier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact native S1 admission and original producer controls
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          QIKVRT_OWNER_REST_TEST_EVIDENCE: ${{ runner.temp }}/owner-rest-evidence
          QIKVRT_STORAGE_CONTRACT_TEST_EVIDENCE: ${{ runner.temp }}/storage-contract-evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -B tools/qikvrt_tool_cache.py verify
          sh tools/bootstrap-runtime.sh --check-only --profile self-host --adapter none
          python3 -B tools/qikvrt_integrity.py verify
          make temdd-event-ledger-test self-host-test origin-adapter-test 2>&1 | tee "$RUNNER_TEMP/temdd-s1-tests.log"
          git diff --exit-code
          python3 -B - <<'PY' > "$RUNNER_TEMP/temdd-s1-binding.json"
          import hashlib,json,os,subprocess
          from pathlib import Path
          git=lambda *a:subprocess.check_output(['git',*a],text=True).strip()
          print(json.dumps({'schema':'qikvrt-temdd-s1-native-gate/v1',
            'source_head':git('rev-parse','HEAD'),'source_tree':git('rev-parse','HEAD^{tree}'),
            'native_source_sha256':hashlib.sha256(Path('src/qikvrt_temdd_event_ledger.py').read_bytes()).hexdigest(),
            'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
            'scope':'EXECUTED_ORIGINAL_AND_PORTABLE_NATIVE_CONTROLS; NO_DEPLOYMENT',
            'predecessor_evidence_transfer':False,'effect_ack_done':False},sort_keys=True))
          PY
      - name: Provision exact desktop Origin test runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          mkdir -p "$RUNNER_TEMP/qikvrt-origin-tests"
          cp runtime/self-host/origin-tests/package.json runtime/self-host/origin-tests/package-lock.json "$RUNNER_TEMP/qikvrt-origin-tests/"
          npm ci --prefix "$RUNNER_TEMP/qikvrt-origin-tests" --ignore-scripts --omit=optional --no-audit --no-fund
          python3 -B - <<'PY'
          import hashlib,json,os,urllib.request,zipfile
          from pathlib import Path
          lock=json.loads(Path('runtime/self-host/ORIGIN_BROWSER_TEST_LOCK.json').read_bytes())
          directory=Path(os.environ['RUNNER_TEMP'])/'qikvrt-origin-browser'
          directory.mkdir(mode=0o700)
          archive=directory/'browser.zip'
          with urllib.request.urlopen(lock['archive_url'],timeout=60) as source,archive.open('xb') as dest:
            while chunk:=source.read(1024*1024): dest.write(chunk)
          raw=archive.read_bytes()
          assert len(raw)==lock['archive_bytes'] and hashlib.sha256(raw).hexdigest()==lock['archive_sha256']
          with zipfile.ZipFile(archive) as bundle:
            for item in bundle.infolist():
              assert not item.filename.startswith('/') and '..' not in Path(item.filename).parts
            bundle.extractall(directory)
            for item in bundle.infolist():
              path=directory/item.filename
              if path.is_file():path.chmod(0o755 if (item.external_attr>>16)&0o111 else 0o644)
          executable=directory/lock['executable_relative_path']
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
            env.write('QIKVRT_ORIGIN_CHROMIUM_EXECUTABLE='+str(executable)+'\n')
            env.write('NODE_PATH='+str(Path(os.environ['RUNNER_TEMP'])/'qikvrt-origin-tests/node_modules')+'\n')
          PY
      - name: Execute real desktop Origin persistence and negative controls
        env:
          QIKVRT_ORIGIN_TEST_EVIDENCE: ${{ runner.temp }}/origin-desktop-witness.json
          QIKVRT_ENTRY_TEST_EVIDENCE: ${{ runner.temp }}/terminal-entry-browser-witness.json
          QIKVRT_ENTRY_SCREENSHOT_DIR: ${{ runner.temp }}/terminal-entry-review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QIKVRT_ENTRY_SCREENSHOT_DIR"
          QIKVRT_ORIGIN_FIXTURE_DIR="$PWD/.qikvrt/evidence/origin-adapter-fixture" node --test docs/monitor/origin/origin.browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/origin-browser-tests.log"
          git diff --exit-code
      - name: Preserve native execution and exact source binding
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-temdd-s1-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/temdd-s1-tests.log
            ${{ runner.temp }}/temdd-s1-binding.json
            ${{ runner.temp }}/origin-browser-tests.log
            ${{ runner.temp }}/terminal-entry-browser-witness.json
            ${{ runner.temp }}/terminal-entry-review/*.png
            ${{ runner.temp }}/origin-desktop-witness.json

            ${{ runner.temp }}/owner-rest-evidence/*.json
            ${{ runner.temp }}/storage-contract-evidence/*.json
          if-no-files-found: error
          retention-days: 30
