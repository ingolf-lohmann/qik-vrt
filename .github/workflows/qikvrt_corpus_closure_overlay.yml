name: QIKVRT effective corpus closure overlay

on:
  pull_request:
    paths:
      - 'tools/qikvrt_corpus_closure_overlay.py'
      - 'tests/test_corpus_closure_overlay.py'
      - 'evidence/receipts/corpus-closure-effective-current.json'
      - '.github/workflows/qikvrt_corpus_closure_overlay.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Materialize effective closure receipt
        run: python3 -B tools/qikvrt_corpus_closure_overlay.py --materialize
      - name: Verify deterministic closure receipt
        run: python3 -B tools/qikvrt_corpus_closure_overlay.py --check
      - name: Run focused regression
        run: python3 -B -m unittest tests.test_corpus_closure_overlay
      - name: Verify repository integrity
        run: python3 -B tools/qikvrt_integrity.py verify
