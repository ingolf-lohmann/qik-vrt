name: QIK-VRT materialize Mirror candidate from Authority 0ab86d6f once

on:
  push:
    branches:
      - trusted/materialize-mirror-authority-0ab86d6f-20260729-v1
    paths:
      - .github/workflows/qikvrt_materialize_mirror_authority_0ab86d6f_once.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-materialize-mirror-authority-0ab86d6f-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'ingolf-lohmann/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRIGGER_BRANCH: trusted/materialize-mirror-authority-0ab86d6f-20260729-v1
      TARGET_BRANCH: sync/content-disposition-batch-002-terminal-5d52adc8-from-30efd108-v1
      EXPECTED_TARGET_HEAD: 887702f50809de208b1d023b793a4cc592a79b91
      EXPECTED_TARGET_TREE: a390fafc1fabfb1bc96b7ebf391767c395885cbf
      AUTHORITY_REMOTE: https://github.com/Goldkelch/qik-vrt.git
      EXPECTED_AUTHORITY_HEAD: 0ab86d6f8ebc82a273bad1a2956e2460dc1729f2
      EXPECTED_AUTHORITY_FIRST_PARENT: ddd791250152a2d615411d18aefa1bc888e94603
      EXPECTED_AUTHORITY_VERIFIED_HEAD: 3d774de19ec12733ac6f3cb6f034fd732ccd245e
      EXPECTED_CONTENT_DIGEST: e33a7930e3848e76d7e71d61c0e5f1479f39dc8c3d037c590b0dfb45a3fdb6e9
      EXPECTED_MANIFEST_BLOB: 52aa8cb46bf4d76c8fcd31e9fc171a0072466ae5
      EXPECTED_MANIFEST_SHA_BLOB: bea5cc636cd37dd13afad3c9a790ec13dd850313
      EXPECTED_SUMS_BLOB: d27392ce7586db748e3b01d2b50a5af0ed4da534
      EXPECTED_TEST_BLOB: 75f4a36719cb2246b4978913f26fe28df43de88b
      EXPECTED_MANIFEST_FILE_SHA256: 615b127f163292c26c959b33b852bce547c607fef5a5eb4b22bb888bba7e020c
      FIXED_GIT_DATE: '2026-07-29T16:25:00Z'

    steps:
      - name: Check out immutable trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify trigger and unchanged Mirror target
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "$TRIGGER_BRANCH" ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git rev-parse HEAD^)" = "$EXPECTED_TARGET_HEAD" ]
          [ "$(git rev-parse "${EXPECTED_TARGET_HEAD}^{tree}")" = "$EXPECTED_TARGET_TREE" ]

          mapfile -t changed < <(git diff --name-only "$EXPECTED_TARGET_HEAD" "$GITHUB_SHA" -- | LC_ALL=C sort)
          [ "${#changed[@]}" -eq 1 ]
          [ "${changed[0]}" = '.github/workflows/qikvrt_materialize_mirror_authority_0ab86d6f_once.yml' ]

          remote_target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          [ "$remote_target" = "$EXPECTED_TARGET_HEAD" ]

      - name: Fetch and verify exact Authority source tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git remote add authority "$AUTHORITY_REMOTE"
          git fetch --no-tags --depth=1 authority "$EXPECTED_AUTHORITY_HEAD"
          authority_head="$(git rev-parse FETCH_HEAD)"
          [ "$authority_head" = "$EXPECTED_AUTHORITY_HEAD" ]

          mapfile -t parents < <(git cat-file -p "$authority_head" | sed -n 's/^parent //p')
          [ "${#parents[@]}" -eq 2 ]
          [ "${parents[0]}" = "$EXPECTED_AUTHORITY_FIRST_PARENT" ]
          [ "${parents[1]}" = "$EXPECTED_AUTHORITY_VERIFIED_HEAD" ]

          authority_tree="$(git rev-parse "${authority_head}^{tree}")"
          [ "$authority_tree" != "$EXPECTED_TARGET_TREE" ]

          blob_for() {
            git ls-tree "$authority_head" -- "$1" | awk '{print $3}'
          }
          [ "$(blob_for REPOSITORY_FILE_MANIFEST.json)" = "$EXPECTED_MANIFEST_BLOB" ]
          [ "$(blob_for REPOSITORY_FILE_MANIFEST.json.sha256)" = "$EXPECTED_MANIFEST_SHA_BLOB" ]
          [ "$(blob_for SHA256SUMS.txt)" = "$EXPECTED_SUMS_BLOB" ]
          [ "$(blob_for tests/test_integrity.py)" = "$EXPECTED_TEST_BLOB" ]

          mapfile -t delta < <(git diff --name-only "$EXPECTED_TARGET_HEAD" "$authority_head" -- | LC_ALL=C sort)
          expected=(
            REPOSITORY_FILE_MANIFEST.json
            REPOSITORY_FILE_MANIFEST.json.sha256
            SHA256SUMS.txt
            tests/test_integrity.py
          )
          [ "${#delta[@]}" -eq "${#expected[@]}" ]
          for index in "${!expected[@]}"; do
            [ "${delta[$index]}" = "${expected[$index]}" ]
          done

          python3 - "$authority_head" "$EXPECTED_CONTENT_DIGEST" "$EXPECTED_MANIFEST_FILE_SHA256" <<'PY'
          import json
          import subprocess
          import sys

          head, expected_content_digest, expected_manifest_sha256 = sys.argv[1:]
          manifest_bytes = subprocess.check_output(
              ['git', 'show', f'{head}:REPOSITORY_FILE_MANIFEST.json']
          )
          manifest = json.loads(manifest_bytes.decode('utf-8'))
          assert manifest['repository_content_tree_sha256'] == expected_content_digest
          detached = subprocess.check_output(
              ['git', 'show', f'{head}:REPOSITORY_FILE_MANIFEST.json.sha256'],
              text=True,
          )
          assert detached == f'{expected_manifest_sha256}  REPOSITORY_FILE_MANIFEST.json\n'
          PY

          echo "authority_tree=$authority_tree" >> "$GITHUB_OUTPUT"

      - name: Create one deterministic Mirror-history commit and push with lease
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          authority_tree='${{ steps.source.outputs.authority_tree }}'
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          [ "$remote_before" = "$EXPECTED_TARGET_HEAD" ]

          candidate_head="$(
            printf '%s\n\n%s\n%s\n%s\n' \
              'sync: materialize promoted Authority tree in Mirror' \
              "Authority repository: Goldkelch/qik-vrt" \
              "Authority commit: $EXPECTED_AUTHORITY_HEAD" \
              "Authority tree: $authority_tree" \
            | env \
                GIT_AUTHOR_NAME='QIK-VRT Mirror Materializer' \
                GIT_AUTHOR_EMAIL='ingolf.lohmann@live.com' \
                GIT_AUTHOR_DATE="$FIXED_GIT_DATE" \
                GIT_COMMITTER_NAME='QIK-VRT Mirror Materializer' \
                GIT_COMMITTER_EMAIL='ingolf.lohmann@live.com' \
                GIT_COMMITTER_DATE="$FIXED_GIT_DATE" \
                git commit-tree "$authority_tree" -p "$EXPECTED_TARGET_HEAD"
          )"

          [ "$(git rev-parse "${candidate_head}^")" = "$EXPECTED_TARGET_HEAD" ]
          [ "$(git rev-parse "${candidate_head}^{tree}")" = "$authority_tree" ]
          [ -z "$(git diff --name-only "$candidate_head" "$EXPECTED_AUTHORITY_HEAD" --)" ]

          mkdir -p "$RUNNER_TEMP/mirror-materialization"
          python3 - \
            "$EXPECTED_AUTHORITY_HEAD" \
            "$authority_tree" \
            "$EXPECTED_TARGET_HEAD" \
            "$candidate_head" \
            "$TARGET_BRANCH" \
            "$EXPECTED_CONTENT_DIGEST" \
            > "$RUNNER_TEMP/mirror-materialization/MIRROR_CANDIDATE_RECEIPT.json" <<'PY'
          import json
          import sys

          authority_head, authority_tree, parent, candidate, branch, digest = sys.argv[1:]
          print(json.dumps({
              '_license': {
                  'classification': 'machine_readable_materialization_receipt',
                  'copyright': 'Copyright 2026 Ingolf Lohmann',
                  'license': 'CC-BY-NC-ND-4.0',
                  'rights_holder': 'Ingolf Lohmann',
              },
              'schema': 'qikvrt_mirror_candidate_materialization_receipt_v1',
              'authority_repository': 'Goldkelch/qik-vrt',
              'authority_commit': authority_head,
              'authority_tree': authority_tree,
              'authority_repository_content_tree_sha256': digest,
              'mirror_repository': 'ingolf-lohmann/qik-vrt',
              'mirror_parent': parent,
              'mirror_candidate': candidate,
              'mirror_branch': branch,
              'tree_equality': True,
              'promotion': False,
              'reciprocal_equality_receipt': False,
              'pass': False,
              'final_pass': False,
              'effect_ack_done': False,
              'next_deterministic_effect': 'CREATE_TRUSTED_MIRROR_EXACT_HEAD_VERIFICATION',
          }, indent=2, sort_keys=True))
          PY
          sha256sum "$RUNNER_TEMP/mirror-materialization/MIRROR_CANDIDATE_RECEIPT.json" \
            > "$RUNNER_TEMP/mirror-materialization/MIRROR_CANDIDATE_RECEIPT.json.sha256"

          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_TARGET_HEAD}" \
            origin \
            "${candidate_head}:refs/heads/${TARGET_BRANCH}"
          remote_after="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          [ "$remote_after" = "$candidate_head" ]

          echo "candidate_head=$candidate_head" >> "$GITHUB_OUTPUT"
          echo "receipt_sha256=$(cut -d' ' -f1 "$RUNNER_TEMP/mirror-materialization/MIRROR_CANDIDATE_RECEIPT.json.sha256")" >> "$GITHUB_OUTPUT"

          {
            echo '## Mirror candidate materialized'
            echo
            echo "- Authority commit: \`$EXPECTED_AUTHORITY_HEAD\`"
            echo "- Authority tree: \`$authority_tree\`"
            echo "- Previous Mirror candidate: \`$EXPECTED_TARGET_HEAD\`"
            echo "- New Mirror candidate: \`$candidate_head\`"
            echo "- Target branch: \`$TARGET_BRANCH\`"
            echo "- Receipt SHA-256: \`$(cut -d' ' -f1 "$RUNNER_TEMP/mirror-materialization/MIRROR_CANDIDATE_RECEIPT.json.sha256")\`"
            echo '- Tree equality: verified before push'
            echo '- Mirror promotion / reciprocal equality / PASS / FINAL_PASS / EFFECT_ACK_DONE: not claimed'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable materialization receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mirror-candidate-authority-0ab86d6f
          retention-days: 30
          path: |
            ${{ runner.temp }}/mirror-materialization/MIRROR_CANDIDATE_RECEIPT.json
            ${{ runner.temp }}/mirror-materialization/MIRROR_CANDIDATE_RECEIPT.json.sha256
          if-no-files-found: error
