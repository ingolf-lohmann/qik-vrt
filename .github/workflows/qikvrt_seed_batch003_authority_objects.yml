name: QIKVRT seed Batch003 Authority objects

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qikvrt-seed-batch003-authority-objects
  cancel-in-progress: false

jobs:
  seed:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'automation/seed-batch003-authority-objects-6f4a57dd')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
      AUTHORITY_SHA: db60a0801c4435d560f7ef3472c0147880e9d616
      MIRROR_MAIN: 518677ee2c216b3fb67a49fc7d5a1047e14c2cc1
      TARGET_REF: seed/batch003-current-authority-db60a080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify frozen Mirror lease
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_REF"
          test "$(git rev-parse origin/main)" = "$MIRROR_MAIN"
          test "$(git rev-parse HEAD)" = "$MIRROR_MAIN"
          test "$(git rev-parse origin/$TARGET_REF)" = "$MIRROR_MAIN"
      - name: Fetch exact current Authority paths and verify source blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import pathlib
          import urllib.parse
          import urllib.request

          root = pathlib.Path('.').resolve()
          repository = 'Goldkelch/qik-vrt'
          sha = 'db60a0801c4435d560f7ef3472c0147880e9d616'
          expected = {
              '.github/workflows/qikvrt_batch04_integrity.yml': '48fab44aa61a7c801501bb92f8c352b3615ecbd6',
              'AI_PROGRESS.json': '6bcad237315e532f53ae9cf37e3a64a71e5c970c',
              'AI_STATUS.md': 'b03ffa0c07ab7b4b76f01af415c9cef5bc8f511d',
              'Makefile': 'a23e730ba757f41812f32c5d3c308981cbb2a1cf',
              'REPOSITORY_FILE_MANIFEST.json': '741cfcf552cd40d2b51af4a1c1c87dd49219618c',
              'REPOSITORY_FILE_MANIFEST.json.sha256': 'e313ca68c4e23ec4e5966e1f800809bf2385e663',
              'SHA256SUMS.txt': '7adcbeccf2bc26cb958d37d55c88990bc4f38241',
              'release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/dispatch/BATCH_003_DISPATCH_RECEIPT.json': 'acdb9d295429eb8adf08b7999a988c883e1f8628',
              'release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/dispatch/subjects/SUBJECT-2581811b342e505d/CLAIM_EXTRACTION_WORK_PACKAGE.json': 'e0b32ec44a8d73ac7226d50ac8db004c82f176a3',
              'schemas/human_machine_progress.schema.json': '89169c024bc7d55f6dbe741c30d9d28ae03f8b2c',
              'tests/test_content_disposition_batch_002_terminal.py': '3aaaa0f87b2a9723bbc555df976df2e6262c5761',
              'tests/test_content_disposition_batch_003_dispatch.py': 'ee9a6a8d73c890792d90446e1fe9e693dcc43fef',
              'tests/test_content_disposition_batch_003_live_index_append.py': 'be9edf10ec61ffa4150108ebce4b4d4f41f1c3a3',
              'tests/test_content_disposition_status_after_batch_002_acceptance.py': 'b82177c484eb0828f5c8ff0454a47869c6866bfc',
              'tools/qikvrt_content_disposition_batch_003_dispatch.py': '23d3be52757578f4070ce534b1a8856b8609c063',
              'tools/qikvrt_content_disposition_batch_003_dispatch_legacy.py': 'a0ddbf87b4c3770b57f310e5c1b3554b7e626db6',
              'work-units/ADVANCE_CANONICAL_STATUS_AND_DISPATCH_BATCH_003.json': 'f5d9824f9b748f1daaef5f4484000a4cd05bc2bf',
          }
          for relative, expected_blob in expected.items():
              quoted = urllib.parse.quote(relative, safe='/')
              url = f'https://raw.githubusercontent.com/{repository}/{sha}/{quoted}'
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              actual = hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()
              if actual != expected_blob:
                  raise SystemExit(f'BLOCK: Authority blob mismatch for {relative}: {actual}')
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY
      - name: Rebuild projection, integrity and complete gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_content_disposition_batch_003_dispatch.py --materialize
          python3 -B tools/qikvrt_content_disposition_batch_003_dispatch.py --check-status-projection
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tests/test_content_disposition_batch_003_live_index_append.py
          python3 -B tools/qikvrt_integrity.py verify
      - name: Verify exact final current Authority blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/qikvrt_batch04_integrity.yml)" = 48fab44aa61a7c801501bb92f8c352b3615ecbd6
          test "$(git hash-object AI_PROGRESS.json)" = 6bcad237315e532f53ae9cf37e3a64a71e5c970c
          test "$(git hash-object AI_STATUS.md)" = b03ffa0c07ab7b4b76f01af415c9cef5bc8f511d
          test "$(git hash-object Makefile)" = a23e730ba757f41812f32c5d3c308981cbb2a1cf
          test "$(git hash-object REPOSITORY_FILE_MANIFEST.json)" = 741cfcf552cd40d2b51af4a1c1c87dd49219618c
          test "$(git hash-object REPOSITORY_FILE_MANIFEST.json.sha256)" = e313ca68c4e23ec4e5966e1f800809bf2385e663
          test "$(git hash-object SHA256SUMS.txt)" = 7adcbeccf2bc26cb958d37d55c88990bc4f38241
          test "$(git hash-object release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/dispatch/BATCH_003_DISPATCH_RECEIPT.json)" = acdb9d295429eb8adf08b7999a988c883e1f8628
          test "$(git hash-object release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/dispatch/subjects/SUBJECT-2581811b342e505d/CLAIM_EXTRACTION_WORK_PACKAGE.json)" = e0b32ec44a8d73ac7226d50ac8db004c82f176a3
          test "$(git hash-object schemas/human_machine_progress.schema.json)" = 89169c024bc7d55f6dbe741c30d9d28ae03f8b2c
          test "$(git hash-object tests/test_content_disposition_batch_002_terminal.py)" = 3aaaa0f87b2a9723bbc555df976df2e6262c5761
          test "$(git hash-object tests/test_content_disposition_batch_003_dispatch.py)" = ee9a6a8d73c890792d90446e1fe9e693dcc43fef
          test "$(git hash-object tests/test_content_disposition_batch_003_live_index_append.py)" = be9edf10ec61ffa4150108ebce4b4d4f41f1c3a3
          test "$(git hash-object tests/test_content_disposition_status_after_batch_002_acceptance.py)" = b82177c484eb0828f5c8ff0454a47869c6866bfc
          test "$(git hash-object tools/qikvrt_content_disposition_batch_003_dispatch.py)" = 23d3be52757578f4070ce534b1a8856b8609c063
          test "$(git hash-object tools/qikvrt_content_disposition_batch_003_dispatch_legacy.py)" = a0ddbf87b4c3770b57f310e5c1b3554b7e626db6
          test "$(git hash-object work-units/ADVANCE_CANONICAL_STATUS_AND_DISPATCH_BATCH_003.json)" = f5d9824f9b748f1daaef5f4484000a4cd05bc2bf
      - name: Seed non-workflow current Authority objects on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/qikvrt_batch04_integrity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_PROGRESS.json AI_STATUS.md Makefile REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/dispatch/BATCH_003_DISPATCH_RECEIPT.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/dispatch/subjects/SUBJECT-2581811b342e505d/CLAIM_EXTRACTION_WORK_PACKAGE.json \
            schemas/human_machine_progress.schema.json \
            tests/test_content_disposition_batch_002_terminal.py \
            tests/test_content_disposition_batch_003_dispatch.py \
            tests/test_content_disposition_batch_003_live_index_append.py \
            tests/test_content_disposition_status_after_batch_002_acceptance.py \
            tools/qikvrt_content_disposition_batch_003_dispatch.py \
            tools/qikvrt_content_disposition_batch_003_dispatch_legacy.py \
            work-units/ADVANCE_CANONICAL_STATUS_AND_DISPATCH_BATCH_003.json
          git diff --cached --check
          git commit -m "Seed exact current Batch-003 Authority objects for Mirror candidate"
          git push origin "HEAD:$TARGET_REF"
