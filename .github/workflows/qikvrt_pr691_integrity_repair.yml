name: QIKVRT PR691 deterministic integrity repair
on:
  push:
    branches:
      - policy/cognitive-behavior-audit-20261105
    paths-ignore:
      - REPOSITORY_FILE_MANIFEST.json
      - REPOSITORY_FILE_MANIFEST.json.sha256
      - SHA256SUMS.txt
permissions:
  contents: write
concurrency:
  group: qikvrt-pr691-integrity
  cancel-in-progress: false
jobs:
  regenerate:
    if: github.repository == 'ingolf-lohmann/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1
      - name: Validate source and regenerate canonical trio
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git diff --cached --name-only | grep -vE '^(REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt)$' && exit 1 || true
      - name: Commit and push exact generated files only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Canonical integrity artifacts already current"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'integrity: regenerate canonical trio for PR691'
          git push origin HEAD:refs/heads/policy/cognitive-behavior-audit-20261105
