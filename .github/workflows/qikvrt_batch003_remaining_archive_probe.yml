name: QIKVRT Batch-003 remaining archive probe

on:
  push:
    branches:
      - agent/batch003-subject-172dd-public-freeze-probe
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-batch003-remaining-archive-probe-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'agent/batch003-subject-172dd-public-freeze-probe')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and recursively inventory remaining public archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-output
          python3 -B tools/qikvrt_batch003_remaining_archive_probe.py \
            --output probe-output/REMAINING_ARCHIVE_PROBE.json \
            | tee probe-output/REMAINING_ARCHIVE_PROBE.log
          gzip -9 probe-output/REMAINING_ARCHIVE_PROBE.json
          sha256sum probe-output/* > probe-output/SHA256SUMS.txt
          grep -Fx 'PASS=false' probe-output/REMAINING_ARCHIVE_PROBE.log
          grep -Fx 'FINAL_PASS=false' probe-output/REMAINING_ARCHIVE_PROBE.log
          grep -Fx 'EFFECT_ACK_DONE=false' probe-output/REMAINING_ARCHIVE_PROBE.log
          grep -Fx 'ZENODO_MUTATION=false' probe-output/REMAINING_ARCHIVE_PROBE.log
      - name: Upload immutable remaining-subject probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-batch003-remaining-archive-probe
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
          path: probe-output/**
