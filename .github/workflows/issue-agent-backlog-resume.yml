name: Issue agent backlog resume

# Event-driven only: no scheduled polling. Dispatch requires a causally new input.
on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_run:
    workflows: ["QIKVRT CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional single issue number
        required: false
        type: string

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-agent-backlog-resume
  cancel-in-progress: false

jobs:
  resume:
    # Native workflow completion is a causal event, not a timer.
    # The admission check below rejects unchanged issue inputs.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUESTED_ISSUE: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Discover and resume stale non-final issue transactions
        shell: bash
        run: |
          set -euo pipefail

          python3 -B tools/qikvrt_tool_cache.py verify

          if [ -n "${REQUESTED_ISSUE:-}" ]; then
            [[ "$REQUESTED_ISSUE" =~ ^[1-9][0-9]*$ ]]
            issues="$REQUESTED_ISSUE"
          else
            # Discover all open issues, not only issues with an existing PR.
            # Pagination is explicit; pull requests are excluded by GitHub issue shape.
            issues="$(gh api --paginate "repos/$REPOSITORY/issues?state=open&per_page=100" \
              --jq '.[] | select(has("pull_request") | not) | .number' | sort -nu)"
          fi

          resumed=0
          skipped_unchanged=0
          skipped_final=0
          blocked_missing_status=0
          new_issues=0

          for issue in $issues; do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]]
            branch="issue-agent/$issue"
            status_url="repos/$REPOSITORY/contents/evidence/issues/$issue/STATUS.json?ref=$branch"

            if ! gh api "repos/$REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
              # New issue: the native issue processor owns branch creation.
              jq -n --arg issue "$issue" '{ref:"main",inputs:{issue_number:$issue}}' > "$RUNNER_TEMP/dispatch-new-$issue.json"
              gh api --method POST "repos/$REPOSITORY/actions/workflows/issue-autonomous-processing.yml/dispatches" \
                --input "$RUNNER_TEMP/dispatch-new-$issue.json"
              echo "issue=$issue state=NEW_ISSUE_DISPATCHED"
              new_issues=$((new_issues + 1))
              continue
            fi
            if ! status_json="$(gh api -H 'Accept: application/vnd.github.raw+json' "$status_url" 2>/dev/null)"; then
              echo "issue=$issue state=BLOCK reason=missing_status"
              blocked_missing_status=$((blocked_missing_status + 1))
              continue
            fi

            status="$(printf '%s' "$status_json" | jq -r '.status // "BLOCK"')"

            case "$status" in
              DONE|EFFECT_ACK_DONE)
                echo "issue=$issue state=FINAL_OR_AWAITING_AUTOFINISH"
                skipped_final=$((skipped_final + 1))
                continue
                ;;
              BLOCK|CONTINUE|EFFECT_ACK_CONTINUE)
                ;;
              *)
                echo "issue=$issue state=BLOCK reason=unknown_status value=$status"
                continue
                ;;
            esac

            input="$RUNNER_TEMP/issue-resume/$issue"
            mkdir -p "$input"
            gh api "repos/$REPOSITORY/issues/$issue" > "$input/issue.json"
            python3 -B scripts/issue_agent/materialize.py --issue "$input/issue.json" \
              --repository "$REPOSITORY" --output-dir "$input"
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! python3 -B scripts/issue_agent/compile.py --check-admission \
              --issue "$input/issue.json" --repository "$REPOSITORY" \
              --context "$input/CONTEXT.md" --previous-ref "refs/remotes/origin/$branch" \
              --output "$input/ADMISSION.json"; then
              echo "issue=$issue state=BLOCK reason=causal_admission_unavailable"
              continue
            fi
            if [ "$(jq -r '.execute' "$input/ADMISSION.json")" != true ]; then
              # An unchanged issue still requires the existing processor to
              # independently recover its persisted review handoff. Its native
              # per-issue concurrency and exact-HEAD readback fence the writer.
              jq -n --arg issue "$issue" '{ref:"main",inputs:{issue_number:$issue}}' > "$input/DISPATCH.json"
              gh api --method POST "repos/$REPOSITORY/actions/workflows/issue-autonomous-processing.yml/dispatches" \
                --input "$input/DISPATCH.json"
              echo "issue=$issue state=HANDOFF_RECOVERY_DISPATCHED reason=unchanged_causal_input"
              skipped_unchanged=$((skipped_unchanged + 1))
              continue
            fi

            jq -n --arg issue "$issue" '{ref:"main",inputs:{issue_number:$issue}}' > "$input/DISPATCH.json"
            gh api --method POST "repos/$REPOSITORY/actions/workflows/issue-autonomous-processing.yml/dispatches" \
              --input "$input/DISPATCH.json"
            echo "issue=$issue state=RESUMED previous_status=$status reason=new_causal_input"
            resumed=$((resumed + 1))
          done

          {
            echo "## Issue-agent backlog resume"
            echo
            echo "- resumed: $resumed"
            echo "- newly dispatched issues: $new_issues"
            echo "- unchanged causal inputs dispatched for handoff recovery: $skipped_unchanged"
            echo "- final/awaiting auto-finish: $skipped_final"
            echo "- missing status blockers: $blocked_missing_status"
          } >> "$GITHUB_STEP_SUMMARY"
