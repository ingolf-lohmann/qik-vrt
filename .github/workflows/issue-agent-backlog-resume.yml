name: Issue agent backlog resume

# Event-driven only: no scheduled polling. Dispatch requires a causally new input.
on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_run:
    workflows: ["QIKVRT CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional single issue number
        required: false
        type: string

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-agent-backlog-resume
  cancel-in-progress: false

jobs:
  resume:
    # Native workflow completion is a causal event, not a timer.
    # The admission check below rejects unchanged issue inputs.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'issues' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUESTED_ISSUE: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Discover and resume stale non-final issue transactions
        shell: bash
        run: |
          set -euo pipefail

          python3 -B tools/qikvrt_tool_cache.py verify

          # Reuse the existing fail-closed, paginated watchdog inventory.
          # The Issues API includes pull requests; only actual open Issues may
          # enter the issue-agent, while PRs remain visible to the PR consumer.
          inventory_root="$RUNNER_TEMP/issue-agent-backlog-inventory"
          mkdir -p "$inventory_root"
          inventory_head="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$inventory_head" =~ ^[0-9a-f]{40}$ ]]
          python3 -B tools/qikvrt_reflexive_repository_watchdog.py collect-work \
            --repository "$REPOSITORY" --expect-head "$inventory_head" \
            --pages-dir "$inventory_root/pages" --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --json > "$inventory_root/open-work.json"
          jq -e '.complete == true and .truncated == false and
                 .total_count == (.items | length) and .first_blocker == null' \
            "$inventory_root/open-work.json" >/dev/null
          readback_head="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$inventory_head" != "$readback_head" ]; then
            echo "state=BLOCK reason=MAIN_HEAD_CHANGED_DURING_OPEN_WORK_INVENTORY" >&2
            exit 2
          fi
          inventory_issues="$(jq '[.items[] | select(.kind == "ISSUE")] | length' "$inventory_root/open-work.json")"
          inventory_prs="$(jq '[.items[] | select(.kind == "PULL_REQUEST")] | length' "$inventory_root/open-work.json")"
          echo "inventory=COMPLETE main=$inventory_head open_issues=$inventory_issues open_prs=$inventory_prs"

          if [ -n "${REQUESTED_ISSUE:-}" ]; then
            [[ "$REQUESTED_ISSUE" =~ ^[1-9][0-9]*$ ]]
            if ! jq -e --argjson number "$REQUESTED_ISSUE" \
              '.items | any(.number == $number and .kind == "ISSUE")' \
              "$inventory_root/open-work.json" >/dev/null; then
              echo "state=BLOCK reason=REQUESTED_ISSUE_NOT_IN_FRESH_OPEN_WORK_INVENTORY" >&2
              exit 2
            fi
            issues="$REQUESTED_ISSUE"
          else
            issues="$(jq -r '.items[] | select(.kind == "ISSUE") | .number' \
              "$inventory_root/open-work.json")"
          fi

          resumed=0
          skipped_unchanged=0
          skipped_final=0
          blocked_missing_status=0

          for issue in $issues; do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]]
            branch="issue-agent/$issue"
            status_url="repos/$REPOSITORY/contents/evidence/issues/$issue/STATUS.json?ref=$branch"

            if ! status_json="$(gh api -H 'Accept: application/vnd.github.raw+json' "$status_url" 2>/dev/null)"; then
              # Unprocessed issues remain visible in the complete inventory.
              # 404 and permission/readback failure are not interchangeable:
              # never infer completion or a verified missing branch here.
              echo "issue=$issue state=UNKNOWN reason=issue_agent_status_not_verified"
              blocked_missing_status=$((blocked_missing_status + 1))
              continue
            fi

            status="$(printf '%s' "$status_json" | jq -r '.status // "BLOCK"')"

            case "$status" in
              DONE|EFFECT_ACK_DONE)
                echo "issue=$issue state=FINAL_OR_AWAITING_AUTOFINISH"
                skipped_final=$((skipped_final + 1))
                continue
                ;;
              BLOCK|CONTINUE|EFFECT_ACK_CONTINUE)
                ;;
              *)
                echo "issue=$issue state=BLOCK reason=unknown_status value=$status"
                continue
                ;;
            esac

            input="$RUNNER_TEMP/issue-resume/$issue"
            mkdir -p "$input"
            gh api "repos/$REPOSITORY/issues/$issue" > "$input/issue.json"
            python3 -B scripts/issue_agent/materialize.py --issue "$input/issue.json" \
              --repository "$REPOSITORY" --output-dir "$input"
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            if ! python3 -B scripts/issue_agent/compile.py --check-admission \
              --issue "$input/issue.json" --repository "$REPOSITORY" \
              --context "$input/CONTEXT.md" --previous-ref "refs/remotes/origin/$branch" \
              --output "$input/ADMISSION.json"; then
              echo "issue=$issue state=BLOCK reason=causal_admission_unavailable"
              continue
            fi
            if [ "$(jq -r '.execute' "$input/ADMISSION.json")" != true ]; then
              echo "issue=$issue state=NOOP reason=unchanged_causal_input"
              skipped_unchanged=$((skipped_unchanged + 1))
              continue
            fi

            jq -n --arg issue "$issue" '{ref:"main",inputs:{issue_number:$issue}}' > "$input/DISPATCH.json"
            gh api --method POST "repos/$REPOSITORY/actions/workflows/issue-autonomous-processing.yml/dispatches" \
              --input "$input/DISPATCH.json"
            echo "issue=$issue state=RESUMED previous_status=$status reason=new_causal_input"
            resumed=$((resumed + 1))
          done

          {
            echo "## Issue-agent backlog resume"
            echo
            echo "- inventory state: COMPLETE (fresh Main ref re-read)"
            echo "- inventory Main HEAD: $inventory_head"
            echo "- open Issues discovered: $inventory_issues"
            echo "- open Pull Requests discovered: $inventory_prs"
            echo "- resume scope: open Issues with verified non-final issue-agent status"
            echo "- resumed: $resumed"
            echo "- unchanged causal inputs: $skipped_unchanged"
            echo "- final/awaiting auto-finish: $skipped_final"
            echo "- missing status blockers: $blocked_missing_status"
          } >> "$GITHUB_STEP_SUMMARY"
