name: QIKVRT PR18 integrity repair

on:
  push:
    branches:
      - infra/live-status-default-branch
      - feat/mesh-monitor-bootstrap-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qikvrt-pr18-integrity-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.ref == 'refs/heads/infra/live-status-default-branch' ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'infra/live-status-default-branch' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: infra/live-status-default-branch
          fetch-depth: 0
      - name: Regenerate and verify repository integrity
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Commit regenerated integrity outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Integrity outputs already current."
            exit 0
          fi
          git commit -m "fix: regenerate repository integrity for live status watcher"
          git push origin HEAD:infra/live-status-default-branch

  materialize-monitor:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Goldkelch/qik-vrt' &&
      github.ref == 'refs/heads/feat/mesh-monitor-bootstrap-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_HEAD: ${{ github.sha }}
      TARGET_REF: feat/mesh-monitor-bootstrap-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Bind exact source and verify declared tool cache
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)" = "$SOURCE_HEAD"
          python3 -B tools/qikvrt_tool_cache.py verify
      - name: Wire monitor regression into canonical test and regenerate integrity
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import subprocess
          path = Path('Makefile')
          body = path.read_text()
          addition = '\n.PHONY: mesh-monitor-test\nmesh-monitor-test:\n\tPYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 $(PYTHON) -B tests/test_mesh_monitor.py\n\ntest: mesh-monitor-test\n'
          if addition not in body:
              expected = '4f3eae3ab9a530e5d4d672de84f5526b8e00e4ac'
              actual = subprocess.check_output(['git', 'hash-object', 'Makefile'], text=True).strip()
              if actual != expected:
                  raise SystemExit('BLOCK: unexpected Makefile; no speculative source rewrite')
              path.write_text(body + addition)
          PY
          python3 -B tests/test_mesh_monitor.py
          make -n test | grep -F 'tests/test_mesh_monitor.py'
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
      - name: Persist bounded successor on a non-production materialization ref
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/$TARGET_REF" | cut -f1)" = "$SOURCE_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix(monitor): wire canonical regression and persist integrity"
            candidate="$(git rev-parse HEAD)"
            carrier="refs/heads/materialized/mesh-monitor-$SOURCE_HEAD"
            if [ -n "$(git ls-remote origin "$carrier")" ]; then
              echo 'BLOCK: materialization ref already exists; inspect without blind retry' >&2
              exit 2
            fi
            git push origin "$candidate:$carrier"
            test "$(git ls-remote origin "$carrier" | cut -f1)" = "$candidate"
          fi
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'BOUND_HEAD=%s\nBOUND_TREE=%s\nPREDECESSOR_EVIDENCE_TRANSFER=false\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - name: Fresh full-suite validation of persisted exact subject
        run: |
          set -euo pipefail
          bound_head="$(git rev-parse HEAD)"
          bound_tree="$(git rev-parse HEAD^{tree})"
          make test
          test "$(git rev-parse HEAD)" = "$bound_head"
          test "$(git rev-parse HEAD^{tree})" = "$bound_tree"
          test -z "$(git status --porcelain --untracked-files=no)"
          printf 'VALIDATED_HEAD=%s\nVALIDATED_TREE=%s\nREVIEW_MAIN_DEPLOYMENT_EFFECT=NOT_ESTABLISHED\n' "$bound_head" "$bound_tree"
