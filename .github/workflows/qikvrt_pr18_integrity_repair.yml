name: QIKVRT PR18 integrity repair

on:
  push:
    branches:
      - infra/live-status-default-branch
      - feat/three-fixpoint-conformance-20261110
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qikvrt-pr18-integrity-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'push' && (github.ref_name == 'infra/live-status-default-branch' || github.ref_name == 'feat/three-fixpoint-conformance-20261110')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Regenerate and verify repository integrity
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Commit regenerated integrity outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Integrity outputs already current."
            exit 0
          fi
          git commit -m "fix: regenerate repository integrity for live status watcher"
          git push origin HEAD:"${GITHUB_REF_NAME}"
