name: QIK-VRT measurement-derived dimensions proof

on:
  pull_request:
    paths:
      - 'docs/publications/2026-08-07-measurement-derived-dimensions/**'
      - 'state/work_units/MEASUREMENT_DERIVED_DIMENSIONS_V2.json'
      - '.github/workflows/qikvrt_measurement_derived_dimensions.yml'

permissions:
  contents: read

jobs:
  exact-head-measurement-derived-dimensions:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/publications/2026-08-07-measurement-derived-dimensions
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source head and tree
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          head="$(git -C ../../.. rev-parse HEAD)"
          tree="$(git -C ../../.. rev-parse 'HEAD^{tree}')"
          test "$head" = "$expected"
          test "${#head}" -eq 40
          test "${#tree}" -eq 40
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Provision Lean 4.19 and build standalone package
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: docs/publications/2026-08-07-measurement-derived-dimensions
          test: false

      - name: Run actions/setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Kernel-check exact MDD source
        shell: bash
        run: |
          set -euo pipefail
          module_dir=.lake/build/mdd-modules
          mkdir -p "$module_dir"
          lake env lean -E hasSorry \
            -o "$module_dir/MeasurementDerivedDimensions.olean" \
            MeasurementDerivedDimensions.lean

      - name: Run exact eleven-theorem axiom audit
        shell: bash
        run: |
          set -euo pipefail
          module_dir=.lake/build/mdd-modules
          LEAN_PATH="$module_dir" lake env lean -E hasSorry \
            MeasurementDerivedDimensionsAxiomAudit.lean \
            | tee MDD_AXIOM_OUTPUT.txt

      - name: Validate theorem inventory and create exact-head receipt
        shell: bash
        env:
          HEAD_SHA: ${{ steps.binding.outputs.head }}
          TREE_SHA: ${{ steps.binding.outputs.tree }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess

          root = pathlib.Path('.')
          source = root / 'MeasurementDerivedDimensions.lean'
          audit = root / 'MeasurementDerivedDimensionsAxiomAudit.lean'
          output = root / 'MDD_AXIOM_OUTPUT.txt'

          expected = [
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T01_derived_dimension_agrees_with_basis',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T02_basis_agreement_is_unique',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T03_nonderived_dimension_cannot_agree_with_all_basis_responses',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T04_calibration_action_has_unique_dimension',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T05_zero_calibration_has_zero_response',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T06_calibration_composition_is_additive',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T07_channel_dimension_is_basis_derived',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T08_equal_calibration_action_forces_equal_dimension',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T09_calibration_change_preserves_premetric_ontology',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T10_length_dimension_is_calibration_derived',
              'QIKVRT.V2.Physics.MeasurementDerivedDimensions.MDD_T11_time_dimension_is_calibration_derived',
          ]

          source_text = source.read_text(encoding='utf-8')
          forbidden = re.compile(r'(?m)^\s*(axiom|opaque\s+axiom|theorem\s+[^\n]*:=\s*by\s+sorry\b)')
          if forbidden.search(source_text):
              raise SystemExit('BLOCK forbidden project proof escape in MDD source')

          pat = re.compile(r"^'([^']+)' (?:does not depend on any axioms|depends on axioms:\s*\[([^]]*)\])$")
          reports = {}
          for line in output.read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              match = pat.fullmatch(line.strip())
              if match is None:
                  raise SystemExit(f'BLOCK unexpected axiom output: {line!r}')
              name = match.group(1)
              axioms = [x.strip() for x in (match.group(2) or '').split(',') if x.strip()]
              if name in reports:
                  raise SystemExit(f'BLOCK duplicate theorem report: {name}')
              reports[name] = axioms

          if list(reports) != expected:
              raise SystemExit(f'BLOCK theorem inventory differs: {list(reports)!r}')
          if any(reports[name] for name in expected):
              raise SystemExit(f'BLOCK unexpected axiom dependency: {reports!r}')

          def identity(path):
              raw = path.read_bytes()
              return {
                  'path': path.name,
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
              }

          lean_version = subprocess.check_output(
              ['lake', 'env', 'lean', '--version'], text=True
          ).strip()

          receipt = {
              'schema': 'qikvrt_measurement_derived_dimensions_kernel_receipt_v2',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit': os.environ['HEAD_SHA'],
              'source_tree': os.environ['TREE_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'lean_version': lean_version,
              'source': identity(source),
              'axiom_audit_source': identity(audit),
              'axiom_output': identity(output),
              'theorem_count': len(expected),
              'axioms_by_theorem': reports,
              'project_axioms': [],
              'formal_result': 'ADMISSIBLE_CALIBRATION_ACTION_UNIQUELY_DETERMINES_DIMENSION_SIGNATURE',
              'measurement_dimension_field': 'ABSENT',
              'physical_correspondence': 'NOT_INFERRED',
              'nature_fundamentally_dimensionless': 'NOT_INFERRED',
              'qce_supplies_physical_calibration_action': 'NOT_ESTABLISHED',
              'si_derived': False,
              'c_physical_value_derived': False,
              'hbar_derived': False,
              'G_derived': False,
              'completion_claims': {
                  'PASS': False,
                  'FINAL_PASS': False,
                  'EFFECT_ACK_DONE': False,
              },
          }
          canonical = json.dumps(receipt, sort_keys=True, separators=(',', ':')).encode()
          receipt['receipt_payload_sha256'] = hashlib.sha256(canonical).hexdigest()
          (root / 'MDD_KERNEL_RECEIPT.json').write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(receipt, sort_keys=True, indent=2))
          PY

      - name: Upload MDD exact-head evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-measurement-derived-dimensions-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            docs/publications/2026-08-07-measurement-derived-dimensions/MDD_AXIOM_OUTPUT.txt
            docs/publications/2026-08-07-measurement-derived-dimensions/MDD_KERNEL_RECEIPT.json
