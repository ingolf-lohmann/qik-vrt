name: QIKVRT reflexive repository roundtrip
on:
  push:
    branches:
      - repair/recursive-priority-queue-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-tree-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Serialize and independently deserialize every tracked blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 -B tools/qikvrt_repository_roundtrip.py --commit "${GITHUB_SHA}" --output "${RUNNER_TEMP}/qikvrt-tree.ndjson" | tee "${RUNNER_TEMP}/qikvrt-roundtrip-receipt.json"
      - name: Publish exact-subject receipt and replay bytes
        uses: actions/upload-artifact@v4
        with:
          name: qikvrt-reflexive-roundtrip-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qikvrt-tree.ndjson
            ${{ runner.temp }}/qikvrt-roundtrip-receipt.json
          retention-days: 30
