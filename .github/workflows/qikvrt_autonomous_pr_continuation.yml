name: QIK-VRT autonomous draft-PR continuation

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_autonomous_pr_continuation.yml"
      - ".github/workflows/qikvrt_autonomous_exact_head_verify.yml"
      - ".github/workflows/qikvrt_autonomous_self_heal.yml"
      - ".github/workflows/qikvrt_workflow_executor.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - "tools/qikvrt_autonomous_self_heal.py"
      - "tools/qikvrt_pipeline_contracts.py"
      - "tools/qikvrt_contract_test_runner.py"
      - "tests/test_qikvrt_pipeline_contracts.py"
      - "state/autonomy/PIPELINE_CONTRACT_TESTS_V1.json"
      - "tools/qikvrt_workflow_executor.py"
      - "tools/qikvrt_seed_common.py"
      - "tools/qikvrt_publication_overview.py"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "tests/test_qikvrt_workflow_executor_mesh_contract.py"
      - "tests/test_seed_workflows.py"

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-autonomous-pr-continuation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  continue-one-opted-in-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPT_IN_MARKER: "<!-- qikvrt-autonomous-self-heal:enabled -->"
    steps:
      - name: Check out current main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Select one exact opted-in same-repository draft PR
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cp tools/qikvrt_pipeline_contracts.py "$RUNNER_TEMP/qikvrt-pipeline-contracts.py"
          python3 -B "$RUNNER_TEMP/qikvrt-pipeline-contracts.py" select \
            --output "$RUNNER_TEMP/qikvrt-continuation/select.json"

      - name: Continue exact draft head through deterministic repairs
        id: continue
        if: steps.select.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.select.outputs.pr_number }}
          HEAD_REF: ${{ steps.select.outputs.head_ref }}
          EXPECTED_HEAD: ${{ steps.select.outputs.head_sha }}
          BASE_REF: ${{ steps.select.outputs.base_ref }}
          OBSERVED_BASE: ${{ steps.select.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qikvrt-continuation"
          phase=REOBSERVE_SELECTED_SUBJECT
          trap 'rc=$?; if test "$rc" -ne 0; then printf "{\"state\":\"HOLD\",\"first_blocker\":\"%s\",\"exit_code\":%s,\"EFFECT_ACK_DONE\":false}\n" "$phase" "$rc" > "$RUNNER_TEMP/qikvrt-continuation/early-failure.json"; fi; exit "$rc"' EXIT
          test "$BASE_REF" = "main"
          checked_main="$(git rev-parse --verify HEAD^{commit})"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$checked_main" = "$live_main"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$live_head" = "$EXPECTED_HEAD"

          git config user.name "qik-vrt-autonomous-pr-continuation"
          git config user.email "qik-vrt-autonomous-pr-continuation@users.noreply.github.com"
          git fetch origin "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          git switch -C "$HEAD_REF" "$EXPECTED_HEAD"
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"

          phase=MERGE_CURRENT_BASE
          merge_created=false
          if ! git merge-base --is-ancestor "$live_main" HEAD; then
            if git merge --no-ff --no-edit "$live_main"; then
              merge_created=true
            else
              git diff --name-only --diff-filter=U | sort -u \
                > /tmp/qikvrt-merge-conflicts.txt
              test -s /tmp/qikvrt-merge-conflicts.txt
              unexpected=()
              while IFS= read -r path; do
                test -n "$path"
                if ! jq -e --arg path "$path" \
                  'any(.allowlisted_handlers[].mutable_paths[]; . == $path)' \
                  state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json \
                  >/dev/null; then
                  unexpected+=("$path")
                fi
              done < /tmp/qikvrt-merge-conflicts.txt
              if ((${#unexpected[@]})); then
                printf 'BLOCK: non-allowlisted merge conflicts: %s\n' \
                  "${unexpected[*]}" >&2
                exit 2
              fi
              while IFS= read -r path; do
                test -n "$path"
                git checkout --ours -- "$path"
                git add -- "$path"
              done < /tmp/qikvrt-merge-conflicts.txt
              test -z "$(git diff --name-only --diff-filter=U)"
              git commit -m \
                "merge(autonomy): integrate main into PR ${PR_NUMBER} with generated-output reset"
              merge_created=true
            fi
          fi

          phase=REPAIR_GENERATED_PROJECTIONS
          python3 -B tools/qikvrt_autonomous_self_heal.py apply > /tmp/qikvrt-pr-self-heal.json
          cat /tmp/qikvrt-pr-self-heal.json
          python3 -B - <<'PY' > /tmp/qikvrt-pr-self-heal-paths
          import json
          value = json.load(open('/tmp/qikvrt-pr-self-heal.json', encoding='utf-8'))
          if value['state'] not in {'NOOP', 'CANDIDATE_READY'}:
              raise SystemExit(f"BLOCK: unexpected self-heal state {value['state']}")
          for path in value.get('changed_paths', []):
              print(path)
          PY

          if test -s /tmp/qikvrt-pr-self-heal-paths; then
            python3 -B tools/qikvrt_anticipation.py check
            python3 -B tools/qikvrt_publication_overview.py check
            python3 -B tools/qikvrt_integrity.py verify
            python3 -B -m unittest -v \
              tests.test_qikvrt_publication_overview \
              tests.test_qikvrt_autonomous_self_heal \
              tests.test_qikvrt_autonomous_pr_continuation
            mapfile -t changed_paths < /tmp/qikvrt-pr-self-heal-paths
            git add -- "${changed_paths[@]}"
            test -z "$(git status --porcelain=v1 | grep '^??' || true)"
            git commit -m "fix(autonomy): repair exact PR ${PR_NUMBER} repository projections"
          fi

          # Byte-NOOP and transaction-NOOP are different predicates.
          if test "$merge_created" = false && ! test -s /tmp/qikvrt-pr-self-heal-paths; then
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
          else
            phase=VERIFY_SUCCESSOR
            make test
            phase=PERSIST_SUCCESSOR
            live_head_before_push="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            test "$live_head_before_push" = "$EXPECTED_HEAD"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')" = "$live_main"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi

          # Resume qikvrt_autonomous_exact_head_verify even with unchanged bytes.
          # No status publication is a prerequisite of dispatch. A completed
          # native run suppresses retries; a 204 response is not execution evidence.
          phase=RESUME_VERIFIER_POSTCONDITION
          export CANDIDATE_HEAD="$(git rev-parse --verify HEAD^{commit})"
          export CANDIDATE_TREE="$(git rev-parse --verify HEAD^{tree})"
          export CURRENT_BASE="$live_main"
          python3 -B "$RUNNER_TEMP/qikvrt-pipeline-contracts.py" resume \
            --output "$RUNNER_TEMP/qikvrt-continuation/resume.json"

      - name: Confirm no eligible work is a strict NOOP
        if: steps.select.outputs.found != 'true'
        run: echo 'No opted-in same-repository draft PR requires continuation.'

      - name: Preserve selection and postcondition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-continuation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-continuation/
          if-no-files-found: error
          retention-days: 30
