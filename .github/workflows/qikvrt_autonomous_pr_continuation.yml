name: QIK-VRT autonomous draft-PR continuation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["QIKVRT CI", "QIK-VRT autonomous bounded self-heal", "QIKVRT reflexive repository watchdog"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_autonomous_pr_continuation.yml"
      - ".github/workflows/qikvrt_autonomous_exact_head_verify.yml"
      - ".github/workflows/qikvrt_autonomous_self_heal.yml"
      - ".github/workflows/qikvrt_workflow_executor.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - "tools/qikvrt_autonomous_self_heal.py"
      - "tools/qikvrt_workflow_executor.py"
      - "tools/qikvrt_seed_common.py"
      - "tools/qikvrt_publication_overview.py"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "tests/test_qikvrt_workflow_executor_mesh_contract.py"
      - "tests/test_seed_workflows.py"

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-autonomous-pr-continuation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  continue-one-opted-in-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPT_IN_MARKER: "<!-- qikvrt-autonomous-self-heal:enabled -->"
    steps:
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Check out exact current main through GitHub REST
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # An early checkout failure must retain a machine-readable, fail-closed
          # receipt rather than cascading into a missing-artifact error.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            repair_root="$RUNNER_TEMP/qikvrt-watchdog-repair-input"
            mkdir -p "$repair_root"
            trap 'rc=$?; if (( rc != 0 )); then printf "{\\"schema\\":\\"qikvrt-continuation-bootstrap-failure/v1\\",\\"stage\\":\\"exact-main-checkout\\",\\"exit_code\\":%d,\\"admitted\\":false}\n" "$rc" > "$repair_root/bootstrap-failure.json"; fi' EXIT
          fi
          live_main="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/contents/tools/qikvrt_autonomous_self_heal.py?ref=${live_main}" \
            > "$RUNNER_TEMP/qikvrt-pr-controller-blob.json"
          python3 -B - <<'PYTHON'
          import base64, hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          value = json.loads((root / 'qikvrt-pr-controller-blob.json').read_text())
          raw = base64.b64decode(value['content'])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == value['sha']
          (root / 'qikvrt-pr-controller.py').write_bytes(raw)
          PYTHON
          python3 -B "$RUNNER_TEMP/qikvrt-pr-controller.py" pr-checkout --root "$GITHUB_WORKSPACE" --sha "$live_main"
          python3 -B tools/qikvrt_tool_cache.py verify
          cp state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json "$RUNNER_TEMP/qikvrt-pr-continuation-contract.json"

      - name: Admit the exact watchdog repair input before continuing existing work
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'QIKVRT reflexive repository watchdog'
        env:
          WATCHDOG_REPAIR_ROOT: ${{ runner.temp }}/qikvrt-watchdog-repair-input
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          root="$WATCHDOG_REPAIR_ROOT"
          mkdir -p "$root"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$root/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?filter=latest&per_page=100" > "$root/source-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" > "$root/source-artifacts.json"
          artifact="$(jq -er --arg name "qikvrt-reflexive-repository-watchdog-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else error("unique current producer artifact required") end' \
            "$root/source-artifacts.json")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact/zip" > "$root/source.zip"
          python3 -B - <<'PYTHON'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['WATCHDOG_REPAIR_ROOT'])
          if (root / 'source.zip').stat().st_size > 64 * 1024 * 1024:
              raise SystemExit('BLOCK: oversized producer artifact')
          with zipfile.ZipFile(root / 'source.zip') as archive:
              name = 'error-analysis-handoff.json'
              matches = [entry for entry in archive.infolist() if entry.filename == name]
              if len(matches) != 1 or matches[0].file_size > 8 * 1024 * 1024:
                  raise SystemExit('BLOCK: missing, duplicated or oversized repair input')
              (root / name).write_bytes(archive.read(matches[0]))
          PYTHON
          python3 -B tools/qikvrt_autonomous_self_heal.py repair-consume \
            --envelope "$root/error-analysis-handoff.json" \
            --source-run "$root/source-run.json" --source-jobs "$root/source-jobs.json" \
            --repository-name "$GITHUB_REPOSITORY" \
            --expected-head "$(git rev-parse --verify HEAD^{commit})" \
            --expected-tree "$(git rev-parse --verify HEAD^{tree})" \
            --inbox "$root/inbox" > "$root/consumer-receipt.json"

      - name: Preserve the independently checked repair input
        if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.name == 'QIKVRT reflexive repository watchdog'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-watchdog-repair-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-watchdog-repair-input
          if-no-files-found: error
          retention-days: 30

      - name: Select and record one fair exact opted-in draft PR
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/qikvrt-pr-controller.py" pr-select \
            --output "$RUNNER_TEMP/qikvrt-pr-selection.json"

      - name: Resume an existing exact successor handoff without a new commit
        if: steps.select.outputs.found == 'true' && steps.select.outputs.resume_handoff == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ steps.select.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B "$RUNNER_TEMP/qikvrt-pr-controller.py" pr-resume \
            --selection "$RUNNER_TEMP/qikvrt-pr-selection.json" --sha "$EXPECTED_HEAD"

      - name: Continue exact draft head through deterministic repairs
        if: steps.select.outputs.found == 'true' && steps.select.outputs.resume_handoff != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.select.outputs.pr_number }}
          HEAD_REF: ${{ steps.select.outputs.head_ref }}
          EXPECTED_HEAD: ${{ steps.select.outputs.head_sha }}
          BASE_REF: ${{ steps.select.outputs.base_ref }}
          OBSERVED_BASE: ${{ steps.select.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_REF" = "main"
          checked_main="$(git rev-parse --verify HEAD^{commit})"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$checked_main" = "$live_main"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$live_head" = "$EXPECTED_HEAD"

          git config user.name "qik-vrt-autonomous-pr-continuation"
          git config user.email "qik-vrt-autonomous-pr-continuation@users.noreply.github.com"
          python3 -B "$RUNNER_TEMP/qikvrt-pr-controller.py" pr-import --sha "$EXPECTED_HEAD"
          comparison="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/compare/${live_main}...${EXPECTED_HEAD}")"
          merge_base="$(jq -r '.merge_base_commit.sha' <<< "$comparison")"
          if test "$merge_base" != "$live_main" && test "$merge_base" != "$EXPECTED_HEAD"; then
            python3 -B "$RUNNER_TEMP/qikvrt-pr-controller.py" pr-import --sha "$merge_base"
          fi
          git switch -C "$HEAD_REF" "$EXPECTED_HEAD"
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"

          merge_created=false
          if test "$merge_base" != "$live_main"; then
            if git merge-tree --write-tree --name-only -z --merge-base="$merge_base" \
              "$EXPECTED_HEAD" "$live_main" > /tmp/qikvrt-merge-tree; then
              merge_status=0
            else
              merge_status=$?
              test "$merge_status" -eq 1
            fi
            python3 -B - <<'PYTHON'
          import pathlib
          fields = pathlib.Path('/tmp/qikvrt-merge-tree').read_bytes().split(b'\0\0', 1)[0].split(b'\0')
          pathlib.Path('/tmp/qikvrt-merged-tree').write_bytes(fields[0])
          pathlib.Path('/tmp/qikvrt-merge-conflicts.txt').write_bytes(b'\n'.join(p for p in fields[1:] if p))
          PYTHON
            merged_tree="$(cat /tmp/qikvrt-merged-tree)"
            git read-tree --reset -u "$merged_tree"
            if test "$merge_status" -eq 1; then
              test -s /tmp/qikvrt-merge-conflicts.txt
              unexpected=()
              while IFS= read -r path || test -n "$path"; do
                test -n "$path"
                if ! jq -e --arg path "$path" \
                  'any(.allowlisted_handlers[].mutable_paths[]; . == $path)' \
                  "$RUNNER_TEMP/qikvrt-pr-continuation-contract.json" >/dev/null; then
                  unexpected+=("$path")
                fi
              done < /tmp/qikvrt-merge-conflicts.txt
              if ((${#unexpected[@]})); then
                printf 'BLOCK: non-allowlisted merge conflicts: %s\n' "${unexpected[*]}" >&2
                exit 2
              fi
              while IFS= read -r path || test -n "$path"; do
                git checkout "$EXPECTED_HEAD" -- "$path"
              done < /tmp/qikvrt-merge-conflicts.txt
              merged_tree="$(git write-tree)"
            fi
            if test "$merged_tree" != "$(git rev-parse "$EXPECTED_HEAD^{tree}")"; then
              successor="$(git commit-tree "$merged_tree" -p "$EXPECTED_HEAD" -p "$live_main" \
                -m "merge(autonomy): integrate main into PR ${PR_NUMBER} with generated-output reset")"
              git reset --hard "$successor"
              merge_created=true
            else
              git reset --hard "$EXPECTED_HEAD"
            fi
          fi

          python3 -B tools/qikvrt_autonomous_self_heal.py apply > /tmp/qikvrt-pr-self-heal.json
          cat /tmp/qikvrt-pr-self-heal.json
          python3 -B - <<'PY' > /tmp/qikvrt-pr-self-heal-paths
          import json
          value = json.load(open('/tmp/qikvrt-pr-self-heal.json', encoding='utf-8'))
          if value['state'] not in {'NOOP', 'CANDIDATE_READY'}:
              raise SystemExit(f"BLOCK: unexpected self-heal state {value['state']}")
          for path in value.get('changed_paths', []):
              print(path)
          PY

          if test -s /tmp/qikvrt-pr-self-heal-paths; then
            python3 -B tools/qikvrt_anticipation.py check
            python3 -B tools/qikvrt_publication_overview.py check
            python3 -B tools/qikvrt_integrity.py verify
            python3 -B -m unittest -v \
              tests.test_qikvrt_publication_overview \
              tests.test_qikvrt_autonomous_self_heal \
              tests.test_qikvrt_autonomous_pr_continuation
            mapfile -t changed_paths < /tmp/qikvrt-pr-self-heal-paths
            git add -- "${changed_paths[@]}"
            test -z "$(git status --porcelain=v1 | grep '^??' || true)"
            git commit -m "fix(autonomy): repair exact PR ${PR_NUMBER} repository projections"
          fi

          if test "$merge_created" = false && ! test -s /tmp/qikvrt-pr-self-heal-paths; then
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            exit 0
          fi

          python3 -B "$RUNNER_TEMP/qikvrt-pr-controller.py" pr-fixtures
          make test
          candidate_head="$(git rev-parse --verify HEAD^{commit})"
          # BEGIN tested-successor checkpoint
          test "$candidate_head" = "$(git rev-parse --verify HEAD^{commit})"
          git diff --quiet
          git diff --cached --quiet
          checkpoint_dir="$RUNNER_TEMP/qikvrt-pr-successor-checkpoint"
          test ! -e "$checkpoint_dir"
          mkdir "$checkpoint_dir"
          git bundle create "$checkpoint_dir/candidate.bundle" HEAD "^$EXPECTED_HEAD" "^$OBSERVED_BASE"
          git bundle verify "$checkpoint_dir/candidate.bundle" > "$checkpoint_dir/bundle-verify.log" 2>&1
          printf '%s\n' "$candidate_head" > "$checkpoint_dir/candidate-head.txt"
          git rev-parse --verify HEAD^{tree} > "$checkpoint_dir/candidate-tree.txt"
          git cat-file commit "$candidate_head" > "$checkpoint_dir/candidate-commit.raw"
          cp "$RUNNER_TEMP/qikvrt-pr-selection.json" "$checkpoint_dir/selection.json"
          (
            cd "$checkpoint_dir"
            sha256sum candidate.bundle candidate-head.txt candidate-tree.txt candidate-commit.raw selection.json bundle-verify.log > SHA256SUMS
          )
          # END tested-successor checkpoint
          live_head_before_push="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$live_head_before_push" = "$EXPECTED_HEAD"
          python3 -B "$RUNNER_TEMP/qikvrt-pr-controller.py" pr-publish \
            --selection "$RUNNER_TEMP/qikvrt-pr-selection.json" --sha "$candidate_head"

      - name: Retain tested successor after publication failure
        if: always() && steps.select.outputs.found == 'true' && steps.select.outputs.resume_handoff != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # existing repository pin
        with:
          name: qikvrt-pr-successor-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-pr-successor-checkpoint/
          if-no-files-found: ignore
          retention-days: 30

      - name: Confirm no eligible work is a strict NOOP
        if: steps.select.outputs.found != 'true'
        run: echo 'No eligible selection was claimed; no PR content or handoff is emitted.'
