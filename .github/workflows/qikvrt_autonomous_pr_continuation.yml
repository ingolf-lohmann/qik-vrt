name: QIK-VRT autonomous draft-PR continuation

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  workflow_run:
    workflows:
      - "QIKVRT CI"
      - "QIKVRT reflexive repository watchdog"
      - "QIKVRT repository evidence materialization"
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/qikvrt_autonomous_pr_continuation.yml"
      - ".github/workflows/qikvrt_autonomous_exact_head_verify.yml"
      - ".github/workflows/qikvrt_autonomous_self_heal.yml"
      - ".github/workflows/qikvrt_workflow_executor.yml"
      - ".github/workflows/qikvrt_workflow_executor_watchdog.yml"
      - ".github/workflows/qikvrt_live_status_watch.yml"
      - "tools/qikvrt_autonomous_self_heal.py"
      - "tools/qikvrt_workflow_executor.py"
      - "tools/qikvrt_seed_common.py"
      - "tools/qikvrt_publication_overview.py"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"
      - "state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json"
      - "tests/test_qikvrt_workflow_executor_mesh_contract.py"
      - "tests/test_seed_workflows.py"

permissions:
  actions: read
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-autonomous-pr-continuation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  continue-one-opted-in-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OPT_IN_MARKER: "<!-- qikvrt-autonomous-self-heal:enabled -->"
    steps:
      - name: Check out current main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bind invariant pipeline from trusted current Main
        shell: bash
        run: |
          set -euo pipefail
          trusted_main="$(git rev-parse --verify HEAD^{commit})"
          python3 -B tools/qikvrt_autonomous_self_heal.py pipeline-bind \
            --repository "$GITHUB_WORKSPACE" --reference "$trusted_main" \
            > /tmp/qikvrt-trusted-pipeline-binding.json
          python3 -B - <<'PY'
          from pathlib import Path
          Path('/tmp/qikvrt-trusted-pipeline-controller.py').write_bytes(
              Path('tools/qikvrt_autonomous_self_heal.py').read_bytes())
          PY

      - name: Receive watchdog analysis in the existing repair consumer
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'QIKVRT reflexive repository watchdog'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/qikvrt-repair-input
          mkdir -p "$root/inbox"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > "$root/source-run.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_ATTEMPT/jobs?per_page=100" \
            | jq '{jobs: [.[].jobs[]]} | .total_count=(.jobs|length)' > "$root/source-jobs.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            | jq '[.[].artifacts[]]' > "$root/artifacts.json"
          artifact_id="$(python3 -B - <<'PY'
          import json, os
          prefix = f"qikvrt-reflexive-repository-watchdog-{os.environ['SOURCE_RUN_ID']}-{os.environ['SOURCE_ATTEMPT']}"
          matches = [a for a in json.load(open('/tmp/qikvrt-repair-input/artifacts.json'))
                     if a['name'] == prefix and not a['expired']]
          if len(matches) != 1:
              raise SystemExit('BLOCK: exactly one bound watchdog artifact required')
          print(matches[0]['id'])
          PY
          )"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$root/source.zip"
          python3 -B - <<'PY'
          import hashlib, json, pathlib, zipfile, os
          root = pathlib.Path('/tmp/qikvrt-repair-input')
          artifact = next(a for a in json.loads((root/'artifacts.json').read_text())
                          if a['name'] == f"qikvrt-reflexive-repository-watchdog-{os.environ['SOURCE_RUN_ID']}-{os.environ['SOURCE_ATTEMPT']}")
          digest = 'sha256:' + hashlib.sha256((root/'source.zip').read_bytes()).hexdigest()
          if artifact.get('digest') != digest:
              raise SystemExit('BLOCK: source archive digest mismatch')
          with zipfile.ZipFile(root/'source.zip') as z:
              matches = [i for i in z.infolist() if i.filename == 'repair-handoff.json']
              if len(matches) != 1 or matches[0].file_size > 16*1024*1024:
                  raise SystemExit('BLOCK: invalid handoff archive member')
              # Extract only the explicitly named data member, never archive paths/code.
              (root/'repair-handoff.json').write_bytes(z.read(matches[0]))
          PY
          gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_HEAD" > "$root/current-subject.json"
          current_head="$(jq -r .sha "$root/current-subject.json")"
          current_tree="$(jq -r .commit.tree.sha "$root/current-subject.json")"
          test "$current_head" = "$SOURCE_HEAD"
          # Current Main or an actual current open PR must still bind this subject.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" > "$root/main.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            > "$root/open-prs.json"
          python3 -B - <<'PY'
          import json, os
          root='/tmp/qikvrt-repair-input/'
          head=os.environ['SOURCE_HEAD']; repo=os.environ['GITHUB_REPOSITORY']
          main=json.load(open(root+'main.json'))['object']['sha']
          prs=[p for page in json.load(open(root+'open-prs.json')) for p in page]
          if head != main and not any(p['head']['sha']==head and
                  (p['head'].get('repo') or {}).get('full_name')==repo for p in prs):
              raise SystemExit('BLOCK: stale repair subject')
          PY
          python3 -B tools/qikvrt_autonomous_self_heal.py repair-consume \
            --envelope "$root/repair-handoff.json" --source-run "$root/source-run.json" \
            --source-jobs "$root/source-jobs.json" --repository-name "$GITHUB_REPOSITORY" \
            --expected-head "$current_head" --expected-tree "$current_tree" \
            --inbox "$root/inbox" > "$root/consumer-receipt.json"
          cat "$root/consumer-receipt.json"

      - name: Preserve admitted repair inbox and consumer readback
        if: always() && github.event_name == 'workflow_run' && github.event.workflow_run.name == 'QIKVRT reflexive repository watchdog'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-repair-consumer-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: /tmp/qikvrt-repair-input

      - name: Select one exact opted-in same-repository draft PR
        if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'QIKVRT reflexive repository watchdog'
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            > /tmp/qikvrt-open-pr-pages.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          pages = json.load(open('/tmp/qikvrt-open-pr-pages.json', encoding='utf-8'))
          marker = os.environ['OPT_IN_MARKER']
          repo = os.environ['GITHUB_REPOSITORY']
          source_head = os.environ.get('SOURCE_HEAD_SHA', '')
          if source_head and (len(source_head) != 40 or
                  any(c not in '0123456789abcdef' for c in source_head)):
              raise SystemExit('BLOCK: malformed completed-workflow subject')
          candidates = []
          for page in pages:
              for pr in page:
                  head_repo = ((pr.get('head') or {}).get('repo') or {}).get('full_name')
                  if pr.get('draft') is not True or head_repo != repo:
                      continue
                  if marker not in (pr.get('body') or ''):
                      continue
                  # A stale or unrelated CI completion cannot select a writer.
                  # Both success and failure are continuation opportunities.
                  if source_head and pr['head']['sha'] != source_head:
                      continue
                  candidates.append(pr)
          candidates.sort(key=lambda item: int(item['number']))
          if not candidates:
              print('found=false')
          else:
              pr = candidates[0]
              print('found=true')
              print(f"pr_number={pr['number']}")
              print(f"head_ref={pr['head']['ref']}")
              print(f"head_sha={pr['head']['sha']}")
              print(f"base_ref={pr['base']['ref']}")
              print(f"base_sha={pr['base']['sha']}")
          PY

      - name: Continue exact draft head through deterministic repairs
        if: steps.select.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.select.outputs.pr_number }}
          HEAD_REF: ${{ steps.select.outputs.head_ref }}
          EXPECTED_HEAD: ${{ steps.select.outputs.head_sha }}
          BASE_REF: ${{ steps.select.outputs.base_ref }}
          OBSERVED_BASE: ${{ steps.select.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BASE_REF" = "main"
          checked_main="$(git rev-parse --verify HEAD^{commit})"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$checked_main" = "$live_main"
          live_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$live_head" = "$EXPECTED_HEAD"

          git config user.name "qik-vrt-autonomous-pr-continuation"
          git config user.email "qik-vrt-autonomous-pr-continuation@users.noreply.github.com"
          git fetch origin "+refs/heads/${HEAD_REF}:refs/remotes/origin/${HEAD_REF}"
          git switch -C "$HEAD_REF" "$EXPECTED_HEAD"
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"

          merge_created=false
          if ! git merge-base --is-ancestor "$live_main" HEAD; then
            if git merge --no-ff --no-edit "$live_main"; then
              merge_created=true
            else
              git diff --name-only --diff-filter=U | sort -u \
                > /tmp/qikvrt-merge-conflicts.txt
              test -s /tmp/qikvrt-merge-conflicts.txt
              unexpected=()
              while IFS= read -r path; do
                test -n "$path"
                if ! jq -e --arg path "$path" \
                  'any(.allowlisted_handlers[].mutable_paths[]; . == $path)' \
                  state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json \
                  >/dev/null; then
                  unexpected+=("$path")
                fi
              done < /tmp/qikvrt-merge-conflicts.txt
              if ((${#unexpected[@]})); then
                printf 'BLOCK: non-allowlisted merge conflicts: %s\n' \
                  "${unexpected[*]}" >&2
                exit 2
              fi
              while IFS= read -r path; do
                test -n "$path"
                git checkout --ours -- "$path"
                git add -- "$path"
              done < /tmp/qikvrt-merge-conflicts.txt
              test -z "$(git diff --name-only --diff-filter=U)"
              git commit -m \
                "merge(autonomy): integrate main into PR ${PR_NUMBER} with generated-output reset"
              merge_created=true
            fi
          fi

          # Check before any candidate-controlled command gets the writer token.
          # A pipeline upgrade needs separate native review/Main activation.
          python3 -B /tmp/qikvrt-trusted-pipeline-controller.py pipeline-verify \
            --repository "$GITHUB_WORKSPACE" \
            --binding /tmp/qikvrt-trusted-pipeline-binding.json

          python3 -B tools/qikvrt_autonomous_self_heal.py apply > /tmp/qikvrt-pr-self-heal.json
          cat /tmp/qikvrt-pr-self-heal.json
          python3 -B - <<'PY' > /tmp/qikvrt-pr-self-heal-paths
          import json
          value = json.load(open('/tmp/qikvrt-pr-self-heal.json', encoding='utf-8'))
          if value['state'] not in {'NOOP', 'CANDIDATE_READY'}:
              raise SystemExit(f"BLOCK: unexpected self-heal state {value['state']}")
          for path in value.get('changed_paths', []):
              print(path)
          PY

          if test -s /tmp/qikvrt-pr-self-heal-paths; then
            python3 -B tools/qikvrt_anticipation.py check
            python3 -B tools/qikvrt_publication_overview.py check
            python3 -B tools/qikvrt_integrity.py verify
            python3 -B -m unittest -v \
              tests.test_qikvrt_publication_overview \
              tests.test_qikvrt_autonomous_self_heal \
              tests.test_qikvrt_autonomous_pr_continuation
            mapfile -t changed_paths < /tmp/qikvrt-pr-self-heal-paths
            git add -- "${changed_paths[@]}"
            test -z "$(git status --porcelain=v1 | grep '^??' || true)"
            git commit -m "fix(autonomy): repair exact PR ${PR_NUMBER} repository projections"
          fi

          if test "$merge_created" = false && ! test -s /tmp/qikvrt-pr-self-heal-paths; then
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            echo 'Repository NOOP; dedicated exact-head verification remains required.'
          else
            make test
            python3 -B /tmp/qikvrt-trusted-pipeline-controller.py pipeline-verify \
              --repository "$GITHUB_WORKSPACE" \
              --binding /tmp/qikvrt-trusted-pipeline-binding.json
            live_head_before_push="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
            test "$live_head_before_push" = "$EXPECTED_HEAD"
            git push origin "HEAD:refs/heads/${HEAD_REF}"
          fi

          candidate_head="$(git rev-parse --verify HEAD^{commit})"
          live_head_before_dispatch="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          test "$live_head_before_dispatch" = "$candidate_head"
          live_main_before_dispatch="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main_before_dispatch" = "$checked_main"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${candidate_head}/status?per_page=100" \
            > /tmp/qikvrt-exact-head-statuses.json
          python3 -B /tmp/qikvrt-trusted-pipeline-controller.py verification-decision \
            --statuses /tmp/qikvrt-exact-head-statuses.json \
            > /tmp/qikvrt-verification-decision.json
          decision="$(python3 -B -c "import json; print(json.load(open('/tmp/qikvrt-verification-decision.json'))['state'])")"
          if test "$decision" = EXISTING_VERIFICATION_REQUIRES_READBACK; then
            cat /tmp/qikvrt-verification-decision.json
            echo 'CONTINUE_REQUIRED: observe existing exact-head verifier; no duplicate dispatch or acceptance claim.'
            exit 0
          fi
          test "$decision" = DISPATCH_REQUIRED

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${candidate_head}" \
            -f state=pending \
            -f context='QIKVRT autonomous exact-head verification' \
            -f description='Exact repaired head awaits repository-dispatch re-verification' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          python3 -B - <<PY > /tmp/qikvrt-autonomous-dispatch.json
          import json
          print(json.dumps({
              'event_type': 'qikvrt_autonomous_exact_head_verify',
              'client_payload': {
                  'repository': '${GITHUB_REPOSITORY}',
                  'pull_request': int('${PR_NUMBER}'),
                  'head_ref': '${HEAD_REF}',
                  'head_sha': '${candidate_head}',
                  'source_head_sha': '${EXPECTED_HEAD}',
                  'base_sha': '${live_main}',
              },
          }))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input /tmp/qikvrt-autonomous-dispatch.json

          conflict_summary=none
          if test -s /tmp/qikvrt-merge-conflicts.txt; then
            conflict_summary="$(tr '\n' ',' < /tmp/qikvrt-merge-conflicts.txt | sed 's/,$//')"
          fi
          cat > /tmp/qikvrt-autonomous-pr-comment.md <<EOF
          <!-- qikvrt-autonomous-pr-continuation -->
          Autonomous continuation handed the exact candidate to its dedicated verifier.

          - previous exact head: \`${EXPECTED_HEAD}\`
          - current candidate head: \`${candidate_head}\`
          - current main merged: \`${live_main}\`
          - deterministic generated-output conflicts reset before regeneration: \`${conflict_summary}\`
          - repository transport: one verifier repository-dispatch; no merge/publication
          - next state: exact-head repository-dispatch verification

          Human scientific review and any separately authorized publication effect remain independent downstream gates. No repository-wide PASS, FINAL_PASS, or EFFECT_ACK_DONE is claimed.
          EOF
          gh pr comment "$PR_NUMBER" --body-file /tmp/qikvrt-autonomous-pr-comment.md

      - name: Confirm no eligible work is a strict NOOP
        if: steps.select.outputs.found != 'true'
        run: echo 'No opted-in same-repository draft PR requires continuation.'
