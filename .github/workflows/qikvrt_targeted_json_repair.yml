name: QIKVRT targeted JSON repair executor

on:
  push:
    branches:
      - repair/seed-acceptance-probe-json-1e1bf6af-v1

permissions:
  contents: write

concurrency:
  group: qikvrt-repository-evidence-repair/seed-acceptance-probe-json-1e1bf6af-v1
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REF: repair/seed-acceptance-probe-json-1e1bf6af-v1
      EXECUTOR_PATH: .github/workflows/qikvrt_targeted_json_repair.yml
    steps:
      - name: Check out current repair ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: repair/seed-acceptance-probe-json-1e1bf6af-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Apply exact JSON-safe snapshot repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from __future__ import annotations

          import pathlib

          root = pathlib.Path(".")
          source_path = root / "tools/qikvrt_node_liveness.py"
          test_path = root / "tests/test_qikvrt_node_liveness.py"
          executor_path = root / ".github/workflows/qikvrt_targeted_json_repair.yml"

          source = source_path.read_text(encoding="utf-8")
          old_print = """def _print(value: Mapping[str, Any]) -> None:
              print(json.dumps(value, ensure_ascii=False, sort_keys=True, indent=2))
          """
          new_print = """def _json_default(value: Any) -> dict[str, str]:
              if isinstance(value, RepositorySnapshot):
                  return {
                      "repository": value.repository,
                      "commit": value.commit,
                      "tree": value.tree,
                  }
              raise TypeError(
                  f"Object of type {type(value).__name__} is not JSON serializable"
              )


          def _print(value: Mapping[str, Any]) -> None:
              print(
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True,
                      indent=2,
                      default=_json_default,
                  )
              )
          """
          if source.count(old_print) != 1:
              raise SystemExit("BLOCK: exact node-liveness print function changed")
          source_path.write_text(
              source.replace(old_print, new_print),
              encoding="utf-8",
              newline="\n",
          )

          tests = test_path.read_text(encoding="utf-8")
          import_marker = "import datetime as dt\n"
          if tests.count(import_marker) != 1 or "import io\n" in tests:
              raise SystemExit("BLOCK: node-liveness test imports changed")
          tests = tests.replace(import_marker, import_marker + "import io\n", 1)
          method_marker = (
              "    def test_acceptance_refresh_is_separate_and_exact_pair_bound(self) -> None:\n"
          )
          regression = (
              "    def test_check_acceptance_cli_serializes_bound_snapshots(self) -> None:\n"
              "        assessment = {\n"
              "            \"state\": \"MIRROR_SEED_ACCEPTANCE_REFRESH_REQUIRED\",\n"
              "            \"refresh_required\": True,\n"
              "            \"guid\": GUID,\n"
              "            \"source\": SOURCE,\n"
              "            \"authority\": AUTHORITY,\n"
              "        }\n"
              "        with (\n"
              "            mock.patch.object(\n"
              "                MODULE,\n"
              "                \"acceptance_assessment\",\n"
              "                return_value=assessment,\n"
              "            ),\n"
              "            mock.patch(\"sys.stdout\", new_callable=io.StringIO) as output,\n"
              "        ):\n"
              "            returncode = MODULE.main([\"check-acceptance\"])\n"
              "        self.assertEqual(1, returncode)\n"
              "        rendered = output.getvalue()\n"
              "        self.assertIn(\"MIRROR_SEED_ACCEPTANCE_REFRESH_REQUIRED\", rendered)\n"
              "        value = json.loads(rendered)\n"
              "        self.assertEqual(SOURCE.commit, value[\"source\"][\"commit\"])\n"
              "        self.assertEqual(SOURCE.tree, value[\"source\"][\"tree\"])\n"
              "        self.assertEqual(AUTHORITY.commit, value[\"authority\"][\"commit\"])\n"
              "        self.assertEqual(AUTHORITY.tree, value[\"authority\"][\"tree\"])\n"
              "\n"
          )
          if tests.count(method_marker) != 1 or regression in tests:
              raise SystemExit("BLOCK: node-liveness regression insertion point changed")
          test_path.write_text(
              tests.replace(method_marker, regression + method_marker, 1),
              encoding="utf-8",
              newline="\n",
          )

          if not executor_path.is_file():
              raise SystemExit("BLOCK: self-removing executor is absent")
          executor_path.unlink()
          PY
          git diff --check

      - name: Verify focused regression and live fail-closed probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_qikvrt_node_liveness
          set +e
          python3 -B tools/qikvrt_node_liveness.py check-acceptance \
            > "$RUNNER_TEMP/qikvrt-seed-acceptance-probe.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/qikvrt-seed-acceptance-probe.json"
          test "$rc" -eq 1
          python3 -B - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "qikvrt-seed-acceptance-probe.json"
          value = json.loads(path.read_text(encoding="utf-8"))
          if value.get("state") != "MIRROR_SEED_ACCEPTANCE_REFRESH_REQUIRED":
              raise SystemExit("BLOCK: repaired probe did not expose the allowlisted state")
          if value.get("refresh_required") is not True:
              raise SystemExit("BLOCK: repaired probe did not require the bounded refresh")
          for key in ("source", "authority"):
              snapshot = value.get(key)
              if not isinstance(snapshot, dict):
                  raise SystemExit(f"BLOCK: {key} snapshot is not JSON-safe")
              if set(snapshot) != {"repository", "commit", "tree"}:
                  raise SystemExit(f"BLOCK: {key} snapshot fields differ")
          PY

      - name: Regenerate integrity and run complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check

      - name: Persist exact five-path candidate
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$source_head" ]; then
            echo "BLOCK: repair ref advanced before persistence" >&2
            exit 2
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            "$EXECUTOR_PATH" \
            tools/qikvrt_node_liveness.py \
            tests/test_qikvrt_node_liveness.py \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git commit -m "fix: serialize seed-acceptance probe snapshots"

          mapfile -t final_paths < <(
            git diff --name-only origin/main...HEAD | LC_ALL=C sort
          )
          expected_paths=(
            REPOSITORY_FILE_MANIFEST.json
            REPOSITORY_FILE_MANIFEST.json.sha256
            SHA256SUMS.txt
            tests/test_qikvrt_node_liveness.py
            tools/qikvrt_node_liveness.py
          )
          if [ "${final_paths[*]}" != "${expected_paths[*]}" ]; then
            printf 'BLOCK: final candidate paths differ:\n%s\n' "${final_paths[*]}" >&2
            exit 2
          fi

          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo "BLOCK: repair ref advanced while candidate was built" >&2
            exit 2
          fi
          git push origin "HEAD:$TARGET_REF"
