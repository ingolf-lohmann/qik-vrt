name: QIKVRT physics bridge integrity

on:
  push:
    branches:
      - agent/formalization-v2-physics-bridge-01
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: qikvrt-physics-bridge-integrity
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/formalization-v2-physics-bridge-01
          fetch-depth: 0
      - name: Bind writer source and current Main before materialization
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN || github.token }}
          TARGET_REF: agent/formalization-v2-physics-bridge-01
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_pipeline_contracts.py observe-writer \
            --output "$RUNNER_TEMP/qikvrt-writer-input.json"
      - name: Regenerate and verify repository integrity
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Commit regenerated integrity outputs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Integrity outputs already current."
            exit 0
          fi
          git commit -m "fix: regenerate integrity for physics bridge"
          # Branch/PR/verifier writes are resumed by the shared postcondition step.
      - name: Resume Branch Draft-PR Exact-Head verifier postcondition
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_pipeline_contracts.py publish-writer \
            --input "$RUNNER_TEMP/qikvrt-writer-input.json" \
            --output "$RUNNER_TEMP/qikvrt-writer-postcondition.json"
      - name: Preserve writer input and postcondition or causal blockade
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-writer-postcondition-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qikvrt-writer-input.json
            ${{ runner.temp }}/qikvrt-writer-postcondition.json
          if-no-files-found: error
          retention-days: 30
