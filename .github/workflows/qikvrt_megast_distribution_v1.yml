name: QIKVRT Mega ST Distribution

on:
  pull_request:
    paths:
      - 'distribution/qikvrt-megast/**'
      - '.github/workflows/qikvrt_megast_distribution_v1.yml'
      - 'tests/test_qikvrt_megast_distribution.py'
      - 'tests/test_qikvrt_netboot.py'
      - 'tests/test_qikvrt_distribution_readback.py'
      - 'tests/test_qikvrt_distribution_execution.py'
      - 'tools/qikvrt_distribution_readback.py'
      - 'deploy/universal-terminal/**'
      - '.dockerignore'
      - 'src/smalltalk/**'
      - 'src/cloud_transputer/**'
      - 'tools/qikvrt_smalltalk.py'
      - 'runtime/toolchains/**'
  push:
    # Image candidates remain executable while the product base moves. The
    # publish job below retains its separate exact branch/event admission.
    branches: [ main, 'work/qikvrt-linux-ssh-*' ]
    paths:
      - 'distribution/qikvrt-megast/**'
      - '.github/workflows/qikvrt_megast_distribution_v1.yml'
      - 'tests/test_qikvrt_megast_distribution.py'
      - 'tests/test_qikvrt_netboot.py'
      - 'tests/test_qikvrt_distribution_readback.py'
      - 'tests/test_qikvrt_distribution_execution.py'
      - 'tools/qikvrt_distribution_readback.py'
      - 'deploy/universal-terminal/**'
      - '.dockerignore'
      - 'src/smalltalk/**'
      - 'src/cloud_transputer/**'
      - 'tools/qikvrt_smalltalk.py'
      - 'runtime/toolchains/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qikvrt-distribution-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify exact-subject repository integrity before distribution execution
        run: python3 -B tools/qikvrt_integrity.py verify
      - name: Install nginx for the unprivileged log regression
        run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Verify distribution contract
        run: python -m unittest tests.test_qikvrt_megast_distribution tests.test_qikvrt_netboot tests.test_qikvrt_distribution_readback tests.test_qikvrt_distribution_execution -v

  build:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      source_tree: ${{ steps.export.outputs.source_tree }}
      manifest_sha256: ${{ steps.export.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install live-build and boot-test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio curl debootstrap xorriso squashfs-tools qemu-system-x86 gcc-m68k-linux-gnu libc6-dev-m68k-cross openssh-client
          curl -fsSLo /tmp/debian-archive-keyring.deb \
            https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/debian-archive-keyring_2025.1_all.deb
          printf '%s  %s\n' \
            '9ea7778e443144ca490668737a8ab22dd3e748bb99e805e22ec055abeb3c7fac' \
            /tmp/debian-archive-keyring.deb | sha256sum -c -
          sudo dpkg -i /tmp/debian-archive-keyring.deb
          curl -fsSLo /tmp/live-build.deb \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          printf '%s  %s\n' \
            '58e09779881cbcc631c49ceb703413e0247a87db01823e597b2a1c40a2afd8f4' \
            /tmp/live-build.deb | sha256sum -c -
          sudo dpkg -i /tmp/live-build.deb
          lb --version
          qemu-system-x86_64 --version
      - name: Verify C90 and Smalltalk language implementations
        id: languages
        run: |
          python3 -B tools/qikvrt_tool_cache.py verify
          sh tests/test_effect_ack_core.sh
          python3 -B tools/qikvrt_smalltalk.py install
          python3 -B tools/qikvrt_smalltalk.py test
      - name: Inspect original Pharo VM archive identity without installing candidates
        if: failure() && steps.languages.outcome == 'failure'
        timeout-minutes: 8
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib,subprocess,tempfile
          lock=json.loads(pathlib.Path('runtime/toolchains/pharo-13.lock.json').read_text())
          sources=[
            ('locked_vm_url',lock['vm']['url']),
            ('original_vm_alias','https://files.pharo.org/get-files/130/pharo-vm-Linux-x86_64-stable.zip'),
          ]
          report={'schema':'qikvrt_dependency_identity_probe_v1','source_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'expected_vm_sha256':lock['vm']['sha256'],'archive_execution':False,'lock_mutation':False,'effect_ack_done':False,'probes':[]}
          out=pathlib.Path('/tmp/qikvrt-dependency-diagnostics')
          out.mkdir(exist_ok=True)
          for role,url in sources:
            entry={'role':role,'url':url,'state':'FETCH_FAILED'}
            with tempfile.TemporaryDirectory() as tmp:
              archive=pathlib.Path(tmp)/'archive.zip'
              try:
                result=subprocess.run(['curl','--fail','--silent','--show-error','--location','--max-redirs','3','--proto','=https','--proto-redir','=https','--connect-timeout','15','--max-time','120','--max-filesize','104857600','--write-out','%{url_effective}','--output',str(archive),url],capture_output=True,timeout=125)
                entry['fetch_exit']=result.returncode
                entry['effective_url']=result.stdout.decode('utf-8',errors='replace').strip()
                if result.returncode==0:
                  digest=hashlib.sha256()
                  with archive.open('rb') as stream:
                    for block in iter(lambda:stream.read(1048576),b''):
                      digest.update(block)
                  entry.update(bytes=archive.stat().st_size,sha256=digest.hexdigest())
                  entry['state']='HASH_MATCH' if digest.hexdigest()==lock['vm']['sha256'] else 'HASH_MISMATCH'
              except subprocess.TimeoutExpired:
                entry['state']='BOUNDED_TIMEOUT'
            report['probes'].append(entry)
            (out/'PHARO_VM_ARCHIVE_PROBE.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
            print(json.dumps(entry,sort_keys=True),flush=True)
          PY
      - name: Preserve dependency identity diagnosis without masking failed language gate
        if: failure() && steps.languages.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: qikvrt-dependency-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/qikvrt-dependency-diagnostics/PHARO_VM_ARCHIVE_PROBE.json
          if-no-files-found: error
          retention-days: 30
      - name: Build exact-subject ISO
        env:
          QIKVRT_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sudo -E ./distribution/qikvrt-megast/build.sh
      - name: Reobserve artifact binding
        run: |
          test -s out/qikvrt-megast-amd64.iso
          (cd out && sha256sum -c qikvrt-megast-amd64.iso.sha256)
          grep -F '"source_sha": "${{ github.event.pull_request.head.sha || github.sha }}"' out/qikvrt-megast-build-receipt.json
          grep -F '"effect_ack_done": false' out/qikvrt-megast-build-receipt.json
      - name: Mount exact ISO and inspect live filesystem
        run: |
          set -eu
          sudo mkdir -p /mnt/qikvrt-megast
          trap 'sudo umount /mnt/qikvrt-megast >/dev/null 2>&1 || true' EXIT
          sudo mount -o loop,ro out/qikvrt-megast-amd64.iso /mnt/qikvrt-megast
          test -s /mnt/qikvrt-megast/live/filesystem.squashfs
          kernel=$(find /mnt/qikvrt-megast/live -maxdepth 1 -type f -name 'vmlinuz*' | head -n1)
          initrd=$(find /mnt/qikvrt-megast/live -maxdepth 1 -type f -name 'initrd*' | head -n1)
          test -n "$kernel"
          test -n "$initrd"
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0644 "$kernel" out/qikvrt-megast-vmlinuz
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0644 "$initrd" out/qikvrt-megast-initrd
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0644 /mnt/qikvrt-megast/live/filesystem.squashfs out/qikvrt-megast-filesystem.squashfs
          printf 'QIKVRT_MEGAST_MOUNT_OK source_sha=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Boot exact ISO and reobserve guest witness
        run: |
          set -eu
          log=out/qikvrt-megast-qemu-serial.log
          sudo install -o "$(id -u)" -g "$(id -g)" -m 0644 /dev/null "$log"
          qemu-system-x86_64 \
            -accel tcg \
            -m 1536 \
            -smp 2 \
            -cdrom out/qikvrt-megast-amd64.iso \
            -kernel out/qikvrt-megast-vmlinuz \
            -initrd out/qikvrt-megast-initrd \
            -append "boot=live components username=qikvrt hostname=qikvrt-megast console=tty0 console=ttyS0,115200n8" \
            -display none \
            -serial "file:$log" \
            -no-reboot \
            -no-shutdown &
          pid=$!
          ok=0
          for _ in $(seq 1 180); do
            if grep -Fq 'QIKVRT_MEGAST_BOOT_OK source_sha=${{ github.event.pull_request.head.sha || github.sha }}' "$log"; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          cat "$log"
          test "$ok" -eq 1
          printf 'QIKVRT_MEGAST_BOOT_REOBSERVED source_sha=%s\n' '${{ github.event.pull_request.head.sha || github.sha }}'
      - name: Build network-boot manifest and execute receiving client
        run: |
          sudo chown -R "$(id -u):$(id -g)" out
          test ! -e /dev/kvm || sudo chown "$(id -u):$(id -g)" /dev/kvm
          python3 -B distribution/qikvrt-megast/boot.py manifest out '${{ github.event.pull_request.head.sha || github.sha }}' --source-tree "$(git rev-parse 'HEAD^{tree}')"
          # Private keys stay outside both HTTP roots and every uploaded artifact.
          ssh_keys=$(mktemp -d /tmp/qikvrt-ssh.XXXXXX)
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_keys/owner"
          ssh-keygen -q -t ed25519 -N '' -f "$ssh_keys/rejected"
          python3 -m http.server 17331 --bind 127.0.0.1 --directory out > /tmp/qikvrt-download.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -rf "$ssh_keys"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:17331/qikvrt-netboot.json > /dev/null && break
            sleep 1
          done
          manifest_sha=$(sha256sum out/qikvrt-netboot.json | cut -d' ' -f1)
          result=0
          python3 -B distribution/qikvrt-megast/boot.py receive \
            http://127.0.0.1:17331/qikvrt-netboot.json "$manifest_sha" /tmp/qikvrt-received --boot --verify-only \
            --ssh-public-key "$ssh_keys/owner.pub" --ssh-identity "$ssh_keys/owner" \
            --ssh-reject-identity "$ssh_keys/rejected" || result=$?
          for evidence in /tmp/qikvrt-received/qikvrt-netboot*; do
            test ! -f "$evidence" || cp "$evidence" out/
          done
          cp distribution/qikvrt-megast/boot.py out/qikvrt-netboot-client.py
          exit "$result"
      - name: Build and export exact-subject Docker image
        id: export
        env:
          QIKVRT_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QIKVRT_EXACT_SHA"
          tree=$(git rev-parse 'HEAD^{tree}')
          context=$(mktemp -d /tmp/qikvrt-docker-context.XXXXXX)
          trap 'rm -rf "$context"' EXIT
          # A clean Git checkout excludes the root-owned live-build chroot and
          # generated ISO/cache output, while retaining actual Git identity.
          git clone --no-local --no-hardlinks --depth=1 --no-checkout "$PWD" "$context"
          git -C "$context" checkout --detach "$QIKVRT_EXACT_SHA"
          test "$(git -C "$context" rev-parse 'HEAD^{tree}')" = "$tree"
          test ! -e "$context/.build/qikvrt-megast"
          test ! -e "$context/out/qikvrt-megast-amd64.iso"
          image="qikvrt/universal-terminal:${QIKVRT_EXACT_SHA}"
          docker build --pull --progress=plain \
            --file "$context/deploy/universal-terminal/Dockerfile" \
            --label "org.opencontainers.image.revision=$QIKVRT_EXACT_SHA" \
            --label "io.qikvrt.source.tree=$tree" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image" "$context" 2>&1 | tee out/qikvrt-docker-build.log
          docker image inspect "$image" > out/qikvrt-universal-terminal-image-inspect.json
          docker save --output out/qikvrt-universal-terminal-amd64.docker.tar "$image"
          (cd out && sha256sum qikvrt-universal-terminal-amd64.docker.tar > qikvrt-universal-terminal-amd64.docker.tar.sha256)
          docker load --input out/qikvrt-universal-terminal-amd64.docker.tar
          docker image inspect "$image" >/dev/null
          cp tools/qikvrt_distribution_readback.py out/qikvrt-distribution-readback.py
          python3 tools/qikvrt_distribution_readback.py manifest out "$QIKVRT_EXACT_SHA" "$tree"
          printf 'source_tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          printf 'manifest_sha256=%s\n' "$(sha256sum out/qikvrt-distribution-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Preserve inspectable startup evidence separately from the image
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qikvrt-megast-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            out/qikvrt-megast-amd64.iso.sha256
            out/qikvrt-megast-build-receipt.json
            out/qikvrt-megast-qemu-serial.log
            out/QIKVRT_BOOT.BIN
            out/qikvrt-netboot*
            out/qikvrt-docker-build.log
            out/qikvrt-distribution*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qikvrt-megast-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            out/qikvrt-*
            out/QIKVRT_BOOT.BIN
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'integration/qikvrt-product-temdd-cloud-v1')
    needs: build
    env:
      QIKVRT_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      QIKVRT_EXACT_TREE: ${{ needs.build.outputs.source_tree }}
      QIKVRT_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      QIKVRT_TEMDD_PR: ${{ github.event.pull_request.number || vars.QIKVRT_TEMDD_PR }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qikvrt-megast-${{ github.event.pull_request.head.sha || github.sha }}
          path: out
      - name: Verify before publication
        run: |
          set -euo pipefail
          cd out
          sha256sum -c qikvrt-megast-amd64.iso.sha256
          grep -F '"source_sha": "'"${QIKVRT_EXACT_SHA}"'"' qikvrt-megast-build-receipt.json
          grep -F "QIKVRT_MEGAST_BOOT_OK source_sha=${QIKVRT_EXACT_SHA}" qikvrt-megast-qemu-serial.log
          grep -F "QIKVRT_MEGAST_RUNTIME_OK source_sha=${QIKVRT_EXACT_SHA}" qikvrt-netboot-serial.log
          sha256sum -c qikvrt-universal-terminal-amd64.docker.tar.sha256
          printf '%s  %s\n' "$QIKVRT_MANIFEST_SHA256" qikvrt-distribution-manifest.json | sha256sum -c -
          python3 qikvrt-distribution-readback.py verify . "$QIKVRT_EXACT_SHA" "$QIKVRT_EXACT_TREE"
      - name: Publish exact-subject release assets without overwriting existing bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(printf '%s' "$QIKVRT_EXACT_SHA" | cut -c1-12)
          tag="qikvrt-distribution-${short}"
          mapfile -t assets < <(python3 - <<'PY'
          import json
          m=json.load(open('out/qikvrt-distribution-manifest.json'))
          for name in sorted(m['assets']): print('out/'+name)
          print('out/qikvrt-distribution-manifest.json')
          print('out/qikvrt-distribution-manifest.json.sha256')
          PY
          )
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > /tmp/qikvrt-existing-release.json; then
            test "$(python3 -c 'import json; print(json.load(open("/tmp/qikvrt-existing-release.json"))["target_commitish"])')" = "$QIKVRT_EXACT_SHA"
            for asset in "${assets[@]}"; do
              if ! python3 - "$asset" <<'PY'
          import json,os,sys
          names={a['name'] for a in json.load(open('/tmp/qikvrt-existing-release.json'))['assets']}
          sys.exit(0 if os.path.basename(sys.argv[1]) in names else 1)
          PY
              then gh release upload "$tag" "$asset" --repo "$GITHUB_REPOSITORY"; fi
            done
          else
            flags=()
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then flags+=(--prerelease --latest=false); fi
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$QIKVRT_EXACT_SHA" \
              --title "QIK-VRT Linux Distribution ${short}" "${flags[@]}" \
              --notes 'Exact-subject ISO, HTTP-netboot and Docker archive candidate. Publication is not product acceptance, registry delivery, or protected-Main adoption.'
          fi
      - name: Read back published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="qikvrt-distribution-$(printf '%s' "$QIKVRT_EXACT_SHA" | cut -c1-12)"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,targetCommitish,assets > out/release-readback.json
          grep -F "\"tagName\":\"$tag\"" out/release-readback.json
          grep -F qikvrt-megast-amd64.iso out/release-readback.json
          grep -F qikvrt-universal-terminal-amd64.docker.tar out/release-readback.json
      - name: Fresh unauthenticated complete public payload readback
        id: public_readback
        env:
          GH_TOKEN: ""
        run: |
          set -euo pipefail
          tag="qikvrt-distribution-$(printf '%s' "$QIKVRT_EXACT_SHA" | cut -c1-12)"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"
          python3 out/qikvrt-distribution-readback.py readback /tmp/qikvrt-public-readback \
            "$QIKVRT_EXACT_SHA" "$QIKVRT_EXACT_TREE" \
            --base-url "$base" --manifest-sha256 "$QIKVRT_MANIFEST_SHA256"
      - name: Load public Docker archive and execute exact runtime
        run: |
          set -euo pipefail
          case "${QIKVRT_TEMDD_PR:-}" in
            ''|*[!0-9]*|0*) echo 'BLOCK: explicit positive TEMDD PR is required' >&2; exit 64 ;;
          esac
          image="qikvrt/universal-terminal:${QIKVRT_EXACT_SHA}"
          docker load --input /tmp/qikvrt-public-readback/qikvrt-universal-terminal-amd64.docker.tar
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$QIKVRT_EXACT_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "io.qikvrt.source.tree"}}' "$image")" = "$QIKVRT_EXACT_TREE"
          cid=$(docker run -d --shm-size=256m -e QIKVRT_SERVICE_MODE=cloud \
            -e QIKVRT_EXACT_HEAD="$QIKVRT_EXACT_SHA" -e QIKVRT_EXACT_TREE="$QIKVRT_EXACT_TREE" \
            -e QIKVRT_TEMDD_PR="$QIKVRT_TEMDD_PR" \
            -p 127.0.0.1:18080:8080 "$image")
          cleanup_container() {
            result=$?
            trap - EXIT
            docker logs "$cid" > /tmp/qikvrt-public-readback/qikvrt-public-container.log 2>&1 || true
            docker cp "$cid:/tmp/nginx-access.log" /tmp/qikvrt-public-readback/qikvrt-public-nginx-access.log || true
            docker rm -f "$cid" >/dev/null || true
            exit "$result"
          }
          trap cleanup_container EXIT
          ready=0
          for _ in $(seq 1 90); do
            if docker exec "$cid" /usr/local/bin/qikvrt-runtime-health >/dev/null 2>&1 && curl -fsS http://127.0.0.1:18080/qik-vrt/mesh/v1/healthz > /tmp/qikvrt-public-readback/qikvrt-public-container-health.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          test "$(docker exec "$cid" git -C /opt/qikvrt rev-parse HEAD)" = "$QIKVRT_EXACT_SHA"
          test "$(docker exec "$cid" git -C /opt/qikvrt rev-parse 'HEAD^{tree}')" = "$QIKVRT_EXACT_TREE"
          curl -fsS http://127.0.0.1:18080/AI/ > /tmp/qikvrt-public-readback/qikvrt-public-surface.html
          curl -fsS http://127.0.0.1:18080/qik-vrt/mesh/v1/terminal/vnc.html > /tmp/qikvrt-public-readback/qikvrt-public-novnc.html
          curl -fsS http://127.0.0.1:18080/qik-vrt/mesh/v1/effect-ack/AI > /tmp/qikvrt-public-readback/qikvrt-public-temdd.html
          curl -fsS http://127.0.0.1:18080/api/temdd/subject > /tmp/qikvrt-public-readback/qikvrt-public-temdd-subject.json
          python3 - <<'PYCODE'
          import json,os
          expected={'repository':os.environ['GITHUB_REPOSITORY'],'pr':int(os.environ['QIKVRT_TEMDD_PR']),
                    'head':os.environ['QIKVRT_EXACT_SHA'],'tree':os.environ['QIKVRT_EXACT_TREE']}
          observed=json.load(open('/tmp/qikvrt-public-readback/qikvrt-public-temdd-subject.json'))
          if observed.get('subject') != expected:
              raise SystemExit('PUBLIC_TEMDD_SUBJECT_MISMATCH')
          PYCODE
          docker exec "$cid" qemu-m68k /usr/local/bin/qikvrt-m68k-selftest > /tmp/qikvrt-public-readback/qikvrt-public-m68k.txt
          echo 'PUBLIC_DOCKER_ARCHIVE_EXECUTION_VERIFIED; OCI_REGISTRY_PULL_NOT_IMPLIED; FULL_PRODUCT_DONE_NOT_IMPLIED'
      - name: Boot downloaded ISO through BIOS firmware, not a supplied kernel
        if: ${{ !cancelled() && steps.public_readback.outcome == 'success' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          log=/tmp/qikvrt-public-readback/qikvrt-public-firmware-serial.log
          qmp=/tmp/qikvrt-public-readback/qikvrt-public-firmware-qmp.sock
          rm -f "$log" "$qmp"
          : > "$log"
          qemu-system-x86_64 -accel tcg -m 2048 -smp 2 -boot order=d \
            -cdrom /tmp/qikvrt-public-readback/qikvrt-megast-amd64.iso \
            -display none -serial "file:$log" \
            -qmp "unix:$qmp,server=on,wait=off" -no-reboot -no-shutdown &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          python3 - "$qmp" <<'PY'
          import json
          import socket
          import sys
          import time

          path = sys.argv[1]
          deadline = time.monotonic() + 30
          while True:
              client = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              try:
                  client.connect(path)
                  break
              except OSError:
                  client.close()
                  if time.monotonic() >= deadline:
                      raise SystemExit("QMP_SOCKET_UNAVAILABLE")
                  time.sleep(0.25)

          stream = client.makefile("rwb")
          greeting = json.loads(stream.readline())
          if "QMP" not in greeting:
              raise SystemExit("QMP_GREETING_MISSING")

          def command(payload):
              stream.write(json.dumps(payload).encode() + b"\n")
              stream.flush()
              while True:
                  reply = json.loads(stream.readline())
                  if "error" in reply:
                      raise SystemExit("QMP_COMMAND_FAILED: " + json.dumps(reply))
                  if "return" in reply:
                      return

          command({"execute": "qmp_capabilities"})
          # Debian Live's firmware boot menu is interactive. Select its default
          # through the emulated keyboard; no host-supplied kernel is admitted.
          for delay in (5, 10, 15):
              time.sleep(delay)
              command({"execute": "human-monitor-command",
                       "arguments": {"command-line": "sendkey ret"}})
          stream.close()
          client.close()
          PY
          ok=0
          for _ in $(seq 1 300); do
            if grep -Fq "QIKVRT_MEGAST_BOOT_OK source_sha=$QIKVRT_EXACT_SHA" "$log"; then ok=1; break; fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          trap - EXIT
          cat "$log"
          test "$ok" = 1
          echo 'PUBLIC_ISO_BIOS_BOOT_VERIFIED; UEFI_PXE_AND_FULL_PRODUCT_ACCEPTANCE_NOT_IMPLIED'
      - name: Preserve fresh public readback and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qikvrt-public-delivery-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            out/release-readback.json
            /tmp/qikvrt-public-readback/qikvrt-public-*
          if-no-files-found: error
          retention-days: 30
