name: Autonomous issue processing

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to process
        required: true
        type: string

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write
  models: read

concurrency:
  group: issue-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="$EVENT_ISSUE_NUMBER"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then number="$INPUT_ISSUE_NUMBER"; fi
          test -n "$number"
          gh api "repos/$REPOSITORY/issues/$number" > issue.json
          jq -e '.pull_request | not' issue.json >/dev/null
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Bind resumable issue work branch without history rewrite
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          export TARGET_REF="issue-agent/$ISSUE_NUMBER"
          remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
          if test -n "$remote"; then
            git fetch --no-tags origin "$TARGET_REF"
            test "$(git rev-parse FETCH_HEAD)" = "$remote"
            git switch -c "$TARGET_REF" "$remote"
          else
            git switch -c "$TARGET_REF"
          fi
          python3 -B tools/qikvrt_pipeline_contracts.py observe-writer \
            --output "$RUNNER_TEMP/qikvrt-issue-writer-input.json"
      - name: Materialize request and repository context
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/materialize.py \
            --issue issue.json \
            --repository "$REPOSITORY" \
            --output-dir "evidence/issues/$ISSUE_NUMBER"

      - name: Generate repository-grounded answer
        id: inference
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/infer.py \
            --issue issue.json \
            --context "evidence/issues/$ISSUE_NUMBER/CONTEXT.md" \
            --output "evidence/issues/$ISSUE_NUMBER/ANSWER.md" \
            --model "openai/gpt-4.1"

      - name: Enforce truthful status
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          INFERENCE_OUTCOME: ${{ steps.inference.outcome }}
        run: |
          set -euo pipefail
          python3 scripts/issue_agent/finalize.py \
            --directory "evidence/issues/$ISSUE_NUMBER" \
            --inference-outcome "$INFERENCE_OUTCOME"

      - name: Validate and promote generated artifacts
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/issue_agent -p 'test_*.py'
          python3 scripts/issue_agent/validate.py "evidence/issues/$ISSUE_NUMBER"
          python3 scripts/issue_agent/promote.py "evidence/issues/$ISSUE_NUMBER"
          python3 scripts/issue_agent/validate.py "evidence/issues/$ISSUE_NUMBER"

      - name: Create or update issue work branch and pull request
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN || github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          branch="issue-agent/$ISSUE_NUMBER"
          git config user.name "qik-vrt-issue-agent[bot]"
          git config user.email "qik-vrt-issue-agent[bot]@users.noreply.github.com"
          git add "evidence/issues/$ISSUE_NUMBER"
          if ! git diff --cached --quiet; then
            git commit -m "issue-agent: process issue #$ISSUE_NUMBER"
            # Non-force branch/PR/verifier handoff follows below.
          fi

          python3 -B tools/qikvrt_pipeline_contracts.py publish-writer \
            --input "$RUNNER_TEMP/qikvrt-issue-writer-input.json" \
            --output "$RUNNER_TEMP/qikvrt-issue-writer-postcondition.json"
          pr_number="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["pr_number"])' "$RUNNER_TEMP/qikvrt-issue-writer-postcondition.json")"
          pr_url="https://github.com/$GITHUB_REPOSITORY/pull/$pr_number"
          status="$(jq -r '.status' "evidence/issues/$ISSUE_NUMBER/STATUS.json")"
          gh issue comment "$ISSUE_NUMBER" --body "Repository processing status: **$status**\n\nWork product: $pr_url\n\nThe repository auto-finish transaction now owns merge, mirror synchronization, common tagging, and issue closure. Any failed gate remains BLOCK."
      - name: Preserve issue writer postcondition or causal blockade
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-issue-writer-postcondition-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qikvrt-issue-writer-input.json
            ${{ runner.temp }}/qikvrt-issue-writer-postcondition.json
          if-no-files-found: error
          retention-days: 30
