name: Autonomous issue processing

on:
  issues:
    types: [opened, reopened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing issue number to process
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-agent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set transient processor paths
        run: |
          set -euo pipefail
          echo "ISSUE_JSON=$RUNNER_TEMP/qikvrt-issue.json" >> "$GITHUB_ENV"
          echo "TRUSTED_PROCESSOR_ROOT=$RUNNER_TEMP/qikvrt-issue-processor" >> "$GITHUB_ENV"
          echo "HANDOFF_DIRECTORY=$RUNNER_TEMP/qikvrt-issue-handoff" >> "$GITHUB_ENV"
          echo "PREPARED_INPUT_DIRECTORY=$RUNNER_TEMP/qikvrt-issue-input" >> "$GITHUB_ENV"

      - name: Validate and retain trusted processor
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B -m unittest discover -s tests/issue_agent -p 'test_*.py'
          mkdir -p "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent" "$TRUSTED_PROCESSOR_ROOT/tools"
          cp scripts/issue_agent/*.py "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/"
          cp tools/qikvrt_subprocess.py tools/qikvrt_integrity.py "$TRUSTED_PROCESSOR_ROOT/tools/"
          mkdir -p "$TRUSTED_PROCESSOR_ROOT/.github/workflows" "$TRUSTED_PROCESSOR_ROOT/policy"
          cp .github/workflows/issue-autonomous-processing.yml .github/workflows/issue-agent-backlog-resume.yml \
            "$TRUSTED_PROCESSOR_ROOT/.github/workflows/"
          cp policy/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json "$TRUSTED_PROCESSOR_ROOT/policy/"
          touch "$TRUSTED_PROCESSOR_ROOT/scripts/__init__.py" \
            "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/__init__.py" \
            "$TRUSTED_PROCESSOR_ROOT/tools/__init__.py"

      - name: Resolve issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          number="$EVENT_ISSUE_NUMBER"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then number="$INPUT_ISSUE_NUMBER"; fi
          [[ "$number" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$REPOSITORY/issues/$number" > "$ISSUE_JSON"
          jq -e --argjson number "$number" '(.pull_request | not) and .number == $number' "$ISSUE_JSON" >/dev/null
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Evaluate causal retry admission
        id: admission
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -B "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/materialize.py" \
            --issue "$ISSUE_JSON" --repository "$REPOSITORY" --output-dir "$PREPARED_INPUT_DIRECTORY"
          branch="issue-agent/$ISSUE_NUMBER"
          previous_args=()
          remote="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [ -n "$remote" ]; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            previous_args=(--previous-ref "refs/remotes/origin/$branch")
          fi
          python3 -B "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/compile.py" \
            --check-admission --issue "$ISSUE_JSON" --repository "$REPOSITORY" \
            --context "$PREPARED_INPUT_DIRECTORY/CONTEXT.md" \
            --output "$HANDOFF_DIRECTORY/ADMISSION.json" "${previous_args[@]}"
          echo "execute=$(jq -r '.execute' "$HANDOFF_DIRECTORY/ADMISSION.json")" >> "$GITHUB_OUTPUT"
          echo "previous_branch_head=$(jq -r '.previous_branch_head // ""' "$HANDOFF_DIRECTORY/ADMISSION.json")" >> "$GITHUB_OUTPUT"
          jq -r '.reason' "$HANDOFF_DIRECTORY/ADMISSION.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare history-preserving issue branch
        if: steps.admission.outputs.execute == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PREVIOUS_BRANCH_HEAD: ${{ steps.admission.outputs.previous_branch_head }}
        run: |
          set -euo pipefail
          branch="issue-agent/$ISSUE_NUMBER"
          git config user.name "qik-vrt-issue-agent[bot]"
          git config user.email "qik-vrt-issue-agent[bot]@users.noreply.github.com"
          remote="$(git ls-remote --heads origin "refs/heads/$branch")"
          if [ "${PREVIOUS_BRANCH_HEAD+x}" = x ]; then
            observed="${remote%%[[:space:]]*}"
            test "$observed" = "$PREVIOUS_BRANCH_HEAD" || { echo "ISSUE_BRANCH_CHANGED_AFTER_ADMISSION" >&2; exit 1; }
          fi
          if [ -n "$remote" ]; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            git checkout -b "$branch" --track "origin/$branch"
            if ! git merge --no-commit --no-ff "$GITHUB_SHA"; then
              # Only generated integrity projections may be resolved mechanically.
              # Other conflicts retain the branch and require new causal information.
              while IFS= read -r path; do
                case "$path" in
                  REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt)
                    git checkout --ours -- "$path"; git add "$path" ;;
                  *) echo "ISSUE_BRANCH_CONFLICT:$path" >&2; exit 1 ;;
                esac
              done < <(git diff --name-only --diff-filter=U)
              test -z "$(git diff --name-only --diff-filter=U)"
            fi
          else
            git checkout -b "$branch" "$GITHUB_SHA"
          fi

      - name: Materialize request and repository context
        if: steps.admission.outputs.execute == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -B - "$TRUSTED_PROCESSOR_ROOT" "$PREPARED_INPUT_DIRECTORY" "$ISSUE_NUMBER" <<'PY'
          import shutil, sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from scripts.issue_agent.compile import preserve_previous
          directory = Path('evidence/issues') / sys.argv[3]
          directory.mkdir(parents=True, exist_ok=True)
          preserve_previous(directory)
          (directory / 'ATTEMPT.json').unlink(missing_ok=True)
          for name in ('REQUEST.json', 'REQUEST.sha256', 'CONTEXT.md'):
              shutil.copyfile(Path(sys.argv[2]) / name, directory / name)
          PY

      - name: Compile deterministic repository-grounded disposition
        if: steps.admission.outputs.execute == 'true'
        id: compilation
        continue-on-error: true
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          python3 -B "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/compile.py" \
            --issue "$ISSUE_JSON" \
            --context "evidence/issues/$ISSUE_NUMBER/CONTEXT.md" \
            --output "evidence/issues/$ISSUE_NUMBER/ANSWER.md"

      - name: Enforce truthful status
        if: steps.admission.outputs.execute == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PROCESSING_OUTCOME: ${{ steps.compilation.outcome }}
        run: |
          set -euo pipefail
          python3 -B "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/finalize.py" \
            --directory "evidence/issues/$ISSUE_NUMBER" \
            --processing-outcome "$PROCESSING_OUTCOME"

      - name: Validate evidence and materialize canonical integrity
        if: steps.admission.outputs.execute == 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          python3 -B "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/validate.py" "evidence/issues/$ISSUE_NUMBER"
          python3 -B "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/promote.py" "evidence/issues/$ISSUE_NUMBER"
          python3 -B "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/validate.py" "evidence/issues/$ISSUE_NUMBER"
          python3 -B - "$TRUSTED_PROCESSOR_ROOT" "$HANDOFF_DIRECTORY/ADMISSION.json" "$ISSUE_NUMBER" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from scripts.issue_agent.compile import record_attempt
          record_attempt(Path('evidence/issues') / sys.argv[3], Path(sys.argv[2]))
          PY
          python3 -B "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/validate.py" "evidence/issues/$ISSUE_NUMBER"
          python3 -B - "$TRUSTED_PROCESSOR_ROOT" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from tools.qikvrt_integrity import generate, verify
          generate(Path.cwd())
          verify(Path.cwd())
          PY

      - name: Persist issue work branch
        if: steps.admission.outputs.execute == 'true'
        id: publication
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -euo pipefail
          branch="issue-agent/$ISSUE_NUMBER"
          git add "evidence/issues/$ISSUE_NUMBER" \
            REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "issue-agent: process issue #$ISSUE_NUMBER"
          fi
          # Ordinary push preserves previous evidence and rejects a competing writer.
          git push origin "HEAD:refs/heads/$branch"
          echo "commit=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Record review handoff and notify issue
        if: always() && steps.publication.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          PUBLISHED_COMMIT: ${{ steps.publication.outputs.commit }}
          PUBLISHED_TREE: ${{ steps.publication.outputs.tree }}
        run: |
          set -euo pipefail
          python3 -B "$TRUSTED_PROCESSOR_ROOT/scripts/issue_agent/handoff.py" \
            --repository "$REPOSITORY" --issue-number "$ISSUE_NUMBER" \
            --commit "$PUBLISHED_COMMIT" --tree "$PUBLISHED_TREE" \
            --source-commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --output-directory "$HANDOFF_DIRECTORY"

      - name: Retain exact review handoff receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-agent-handoff-${{ steps.issue.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-issue-handoff/
          retention-days: 30
          if-no-files-found: warn
