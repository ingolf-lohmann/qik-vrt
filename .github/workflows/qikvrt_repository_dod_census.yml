name: QIKVRT repository DoD census

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr:
        description: Exact pull request number
        required: true
        type: string
      head:
        description: Exact pull request head SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || inputs.head }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch complete read-only branch graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --force --prune origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Snapshot all open PRs through one bounded read fallback
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-dod"
          mkdir -p "$root"
          : >"$root/open-prs.rest.stderr"
          : >"$root/open-prs.graphql.stderr"

          set +e
          gh api --paginate --slurp             "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100"             >"$root/open-prs.rest.json" 2>"$root/open-prs.rest.stderr"
          rest_rc=$?
          set -e

          if [ "$rest_rc" -eq 0 ]; then
            python3 - "$root/open-prs.rest.json" "$root/open-prs.json" <<'PY'
          import json,sys
          src,dst=sys.argv[1:]
          pages=json.load(open(src,encoding='utf-8'))
          if not isinstance(pages,list):
              raise SystemExit('BLOCK: REST open PR result is not a list')
          rows=[row for page in pages for row in page] if pages and all(isinstance(page,list) for page in pages) else pages
          if not all(isinstance(row,dict) for row in rows):
              raise SystemExit('BLOCK: REST open PR row is not an object')
          value={'schema':'qikvrt_open_pr_snapshot_v1','state':'OBSERVED','source':'REST','pull_requests':rows}
          with open(dst,'w',encoding='utf-8') as f:
              json.dump(value,f,separators=(',',':'))
              f.write('\n')
          PY
            echo "OPEN_PR_SNAPSHOT=OBSERVED_REST"
          else
            owner="${GITHUB_REPOSITORY%%/*}"
            name="${GITHUB_REPOSITORY#*/}"
            query='query($owner:String!,$name:String!,$endCursor:String){repository(owner:$owner,name:$name){pullRequests(first:100,states:OPEN,after:$endCursor,orderBy:{field:UPDATED_AT,direction:DESC}){nodes{number state body headRefName headRefOid}pageInfo{hasNextPage endCursor}}}}'

            set +e
            gh api graphql --paginate --slurp               -f owner="$owner" -f name="$name" -f query="$query"               >"$root/open-prs.graphql.json" 2>"$root/open-prs.graphql.stderr"
            graphql_rc=$?
            set -e

            if [ "$graphql_rc" -eq 0 ]; then
              python3 - "$root/open-prs.graphql.json" "$root/open-prs.json" <<'PY'
          import json,sys
          src,dst=sys.argv[1:]
          pages=json.load(open(src,encoding='utf-8'))
          if not isinstance(pages,list):
              raise SystemExit('BLOCK: GraphQL page result is not a list')
          rows=[]
          for page in pages:
              nodes=page.get('data',{}).get('repository',{}).get('pullRequests',{}).get('nodes')
              if not isinstance(nodes,list):
                  raise SystemExit('BLOCK: GraphQL pullRequests.nodes is not a list')
              for node in nodes:
                  if not isinstance(node,dict):
                      raise SystemExit('BLOCK: GraphQL PR row is not an object')
                  rows.append({
                      'number':node.get('number'),
                      'state':str(node.get('state','')).lower(),
                      'body':node.get('body') or '',
                      'head':{'sha':node.get('headRefOid'),'ref':node.get('headRefName')},
                  })
          value={'schema':'qikvrt_open_pr_snapshot_v1','state':'OBSERVED','source':'GRAPHQL','pull_requests':rows}
          with open(dst,'w',encoding='utf-8') as f:
              json.dump(value,f,separators=(',',':'))
              f.write('\n')
          PY
              echo "OPEN_PR_SNAPSHOT=OBSERVED_GRAPHQL"
            else
              python3 - "$root/open-prs.json" "$rest_rc" "$graphql_rc" <<'PY'
          import json,sys
          path,rest_rc,graphql_rc=sys.argv[1:]
          value={
              'schema':'qikvrt_open_pr_snapshot_unavailable_v1',
              'state':'HOLD_UNVERIFIED',
              'reason':'OPEN_PR_SNAPSHOT_API_UNAVAILABLE',
              'rest_rc':int(rest_rc),
              'graphql_rc':int(graphql_rc),
              'fabricated_empty_inventory':False,
              'retry_attempted':False,
              'bounded_alternative_read_attempted':True,
          }
          with open(path,'w',encoding='utf-8') as f:
              json.dump(value,f,sort_keys=True,separators=(',',':'))
              f.write('\n')
          PY
              echo "OPEN_PR_SNAPSHOT=HOLD_UNVERIFIED"
              tail -n 5 "$root/open-prs.rest.stderr" || true
              tail -n 5 "$root/open-prs.graphql.stderr" || true
            fi
          fi

      - name: Build exact-subject finite census
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/qikvrt-dod"
          tree="$(git rev-parse HEAD^{tree})"
          python3 -B tools/qikvrt_repository_dod_census.py             --repository "$GITHUB_REPOSITORY"             --subject-head "$EXPECTED_HEAD"             --subject-tree "$tree"             --current-pr "$PR_NUMBER"             --open-prs "$root/open-prs.json"             --output "$root/census.json"

          python3 - "$root/census.json" "$EXPECTED_HEAD" "$tree" <<'PY'
          import json,sys
          p,head,tree=sys.argv[1:]
          r=json.load(open(p,encoding='utf-8'))
          assert r['subject']=={'head':head,'tree':tree}
          assert r['predecessor_evidence_transfer'] is False
          assert r['branch_snapshot']['complete'] is True
          if r['inventory_complete'] is False:
              assert r['state']=='HOLD_UNVERIFIED'
              assert r['pr_snapshot']['complete'] is False
              assert r['all_pull_requests_regarded'] is False
              assert r['all_productive_branches_merged'] is False
          PY

      - name: Preserve finite or fail-closed census
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-dod-census-${{ env.EXPECTED_HEAD }}
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/qikvrt-dod/census.json
            ${{ runner.temp }}/qikvrt-dod/open-prs.json
            ${{ runner.temp }}/qikvrt-dod/open-prs.rest.stderr
            ${{ runner.temp }}/qikvrt-dod/open-prs.graphql.stderr
