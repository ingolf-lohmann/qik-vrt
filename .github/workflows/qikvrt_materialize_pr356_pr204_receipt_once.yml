name: QIK-VRT one-shot PR356 PR204 reciprocal equality receipt
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/qikvrt_materialize_pr356_pr204_receipt_once.yml]
permissions:
  contents: write
concurrency:
  group: qikvrt-pr356-pr204-receipt-${{ github.repository }}
  cancel-in-progress: false
jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
