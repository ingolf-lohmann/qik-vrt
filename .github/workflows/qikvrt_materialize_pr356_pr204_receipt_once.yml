name: QIK-VRT one-shot PR356 PR204 reciprocal equality receipt v2
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths: [.github/workflows/qikvrt_materialize_pr356_pr204_receipt_once.yml]
permissions:
  contents: write
concurrency:
  group: qikvrt-pr356-pr204-receipt-v2-${{ github.repository }}
  cancel-in-progress: false
jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WORKFLOW_PATH: .github/workflows/qikvrt_materialize_pr356_pr204_receipt_once.yml
      SOURCE_COMMIT: 342d4a2a6b5b0bf09fe542ef3b143125b3d471c9
      SOURCE_WORKFLOW_BLOB: 3ce95cad6b2664ff20473d7a7c6bbed4552dab03
      SOURCE_EXECUTOR_SHA256: f6b0e82e52aa2b147dd3f253b09153c07513e49317c013c29a5a6d13030dcc36
      PATCHED_EXECUTOR_SHA256: 972f11e380956dc6975cc12ef93e6b3b7de97d8f106e2717cf2e4c73ab2b02f1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Recover and execute the digest-bound receipt program
        shell: bash
        run: |
          set -euo pipefail
          git remote add payload https://github.com/Goldkelch/qik-vrt.git
          git fetch --no-tags payload "$SOURCE_COMMIT"
          test "$(git rev-parse "$SOURCE_COMMIT:$WORKFLOW_PATH")" = "$SOURCE_WORKFLOW_BLOB"
          git show "$SOURCE_COMMIT:$WORKFLOW_PATH" > "$RUNNER_TEMP/source.yml"
          python3 - "$RUNNER_TEMP/source.yml" "$RUNNER_TEMP/executor.py" <<'PY'
          import base64, hashlib, os, pathlib, sys, zlib
          text = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          a = text.index('          encoded = """\n') + len('          encoded = """\n')
          b = text.index('\n          """.replace("\\n", "")', a)
          raw = zlib.decompress(base64.b64decode(''.join(text[a:b].splitlines())))
          if hashlib.sha256(raw).hexdigest() != os.environ['SOURCE_EXECUTOR_SHA256']:
              raise SystemExit('BLOCK: source executor digest differs')
          text = raw.decode('utf-8')
          text = text.replace('"trusted/pr356-pr204-receipt-executor-authority-v1"', '"trusted/pr356-pr204-receipt-executor-authority-v2"')
          text = text.replace('"trusted/pr356-pr204-receipt-executor-mirror-v1"', '"trusted/pr356-pr204-receipt-executor-mirror-v2"')
          patched = text.encode('utf-8')
          if hashlib.sha256(patched).hexdigest() != os.environ['PATCHED_EXECUTOR_SHA256']:
              raise SystemExit('BLOCK: patched executor digest differs')
          pathlib.Path(sys.argv[2]).write_bytes(patched)
          PY
          python3 "$RUNNER_TEMP/executor.py"
