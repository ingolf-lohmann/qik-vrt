name: QIKVRT Seed Dashboard Build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional safe QIKVRT run id
        required: false
        type: string
  push:
    branches: [main]
  schedule:
    - cron: '5 */6 * * *'

permissions:
  contents: read

concurrency:
  group: qikvrt-seed-dashboard
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QIKVRT_RUN_ID: ${{ inputs.run_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Bind dashboard evidence to the exact checked-out main head
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse --verify HEAD^{commit})"
          test "$actual_head" = "$EXPECTED_HEAD"
          actual_tree="$(git show -s --format=%T HEAD)"
          export ACTUAL_TREE="$actual_tree"
          mkdir -p .qikvrt/seed-workflow
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          payload = {
              "schema": "qikvrt_seed_dashboard_exact_head_binding_v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_head": os.environ["EXPECTED_HEAD"],
              "source_tree": os.environ["ACTUAL_TREE"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          pathlib.Path(
              ".qikvrt/seed-workflow/dashboard-exact-head-binding.json"
          ).write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Refresh and revalidate mesh
        id: revalidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qikvrt/seed-workflow
          sh tools/qikvrt_seed_mesh_maintenance.sh 2>&1 | tee .qikvrt/seed-workflow/dashboard.log
          set +e
          sh tools/qikvrt_seed_node_revalidation.sh 2>&1 | tee -a .qikvrt/seed-workflow/dashboard.log
          rc=${PIPESTATUS[0]}
          set -e
          case "$rc" in
            0)
              echo "dashboard_execution=ADMITTED" >> "$GITHUB_OUTPUT"
              ;;
            10)
              echo "dashboard_execution=NOT_EXECUTED" >> "$GITHUB_OUTPUT"
              echo "current_dashboard_evidence=NOT_ESTABLISHED" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit "$rc"
              ;;
          esac
      - name: Build dashboard only from PASS revalidation
        if: steps.revalidate.outputs.dashboard_execution == 'ADMITTED'
        shell: bash
        run: |
          set -euo pipefail
          sh tools/qikvrt_seed_dashboard_publish.sh 2>&1 | tee -a .qikvrt/seed-workflow/dashboard.log
      - name: Record non-executed dashboard provenance
        if: steps.revalidate.outputs.dashboard_execution == 'NOT_EXECUTED'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          import pathlib
          revalidation = json.loads(pathlib.Path("registry/NODEMESH_REVALIDATION.json").read_text(encoding="utf-8"))
          payload = {
              "schema": "qikvrt_seed_dashboard_execution_v1",
              "run_id": os.environ["QIKVRT_RUN_ID"],
              "dashboard_execution": "NOT_EXECUTED",
              "current_dashboard_evidence": "NOT_ESTABLISHED",
              "reason": "NODE_REVALIDATION_CONTINUE",
              "revalidation_status": revalidation["status"],
              "source_status_run_id": revalidation["source_status_run_id"],
              "predecessor_evidence_transfer": False,
          }
          pathlib.Path(".qikvrt/seed-workflow/dashboard-execution.json").write_text(
              json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Preserve local dashboard evidence without mutating the repository
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-seed-dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .qikvrt/seed-workflow/dashboard.log
            .qikvrt/seed-workflow/dashboard-exact-head-binding.json
            .qikvrt/seed-workflow/dashboard-execution.json
            docs/qikvrt_mesh_dashboard.html
            docs/QIKVRT_MESH_DASHBOARD.md
            registry/NODEMESH_INDEX.json
            registry/NODEMESH_STATUS.json
            registry/NODEMESH_REVALIDATION.json
            evidence/seed_mesh_maintenance/LATEST.json
            evidence/seed_mesh_maintenance/runs/${{ env.QIKVRT_RUN_ID }}.json
            evidence/seed_node_revalidation/LATEST.json
            evidence/seed_node_revalidation/runs/${{ env.QIKVRT_RUN_ID }}.json
            evidence/seed_dashboard/LATEST.json
            evidence/seed_dashboard/runs/${{ env.QIKVRT_RUN_ID }}.json
