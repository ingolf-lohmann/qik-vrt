name: QIK-VRT paired current-main anticipation refresh PR368 PR214 v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qikvrt_paired_anticipation_refresh_pr368_pr214.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-paired-anticipation-refresh-pr368-pr214-v2-${{ github.repository }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'ingolf-lohmann/qik-vrt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/current-main-anticipation-refresh-pr368-pr214-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/current-main-anticipation-refresh-pr368-pr214-v2
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Refresh bounded anticipation input and projections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P HEAD)" = "923a508566bb27c977bdac7e2313f4038e2a7111"
          python3 -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          authority_main = "d0c0076cf1aeb6ce52bc99823ec55fda124d2f71"
          mirror_main = "923a508566bb27c977bdac7e2313f4038e2a7111"
          r11_head = "26a45a0af463dcd8bb1667897d1a999230375307"
          receipt_path = "evidence/receipts/authority-mirror-equality-2026-08-04-aphorism-corpus-pr356-pr204.json"
          index_path = "evidence/receipts/index.json"
          path = Path("anticipation/INPUT.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          def binding(p):
              raw = Path(p).read_bytes()
              return {"path": p, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
          metrics = dict(value["observations"][-1]["metrics"])
          observation = {
              "classification": "TEILFORTSCHRITT",
              "evidence": [f"authority-git-commit:{authority_main}", f"mirror-git-commit:{mirror_main}", "authority-pull-request:368", "mirror-pull-request:214", f"r11-git-commit:{r11_head}", receipt_path, index_path],
              "metrics": metrics,
              "observed_at": "2026-08-05T05:45:52Z",
              "productive_chain_position": "POST_PR368_PR214_SCOPED_PROMOTION_R11_EVIDENCE_BINDING_OPEN",
              "state_id": "post-pr368-pr214-scoped-promotion-r11-evidence-binding-open"
          }
          if value["observations"][-1].get("state_id") != observation["state_id"]:
              value["observations"].append(observation)
          value["observed_at"] = observation["observed_at"]
          value["source_revision"] = "git-tree:fd0f1b83726d0e5cd0e44b6bc959742efe0e9c93"
          value["source_bindings"] = [binding("AI_PROGRESS.json"), binding("AI_STATUS.md"), binding(receipt_path), binding(index_path)]
          value["next_effect"] = {
              "anticipated_state_id": "r11-draft-shape-observation-receipt-pair-exact-head-green",
              "description": "Resolve the exact Authority R11 push run for 26a45a0af463dcd8bb1667897d1a999230375307 under the standing Owner delegation, download and verify the bounded read-only draft-shape observation artifact, verify the unchanged C2 SHA-256, persist a receipt-only Authority successor, port the byte-identical substantive receipt to Mirror, regenerate repository-native integrity outputs, run all mandatory exact-head gates, and verify reciprocal Authority/Mirror synchronization. Automatic external dispatch, Zenodo mutation, publication, release, deployment, IETF action, PASS, FINAL_PASS, and EFFECT_ACK_DONE remain forbidden.",
              "effect_id": "RESOLVE_AND_PERSIST_R11_DRAFT_SHAPE_OBSERVATION_RECEIPT_PAIR",
              "executor_capability": "qikvrt.repository.anticipation.v1",
              "expected_receipt": "receipts/anticipation/0005-r11-draft-shape-observation-receipt-pair.json",
              "preconditions": ["AUTHORITY_MAIN_EQUALS_D0C0076CF1AEB6CE52BC99823EC55FDA124D2F71", "MIRROR_MAIN_EQUALS_923A508566BB27C977BDAC7E2313F4038E2A7111", "PR368_PR214_SCOPED_PORT_PROMOTED", "R11_HEAD_EQUALS_26A45A0AF463DCD8BB1667897D1A999230375307", "OWNER_STANDING_DELEGATION_AUTHORIZES_EXACTLY_ONE_READ_ONLY_R11_RESOLUTION", "RECEIPT_BLOB_04B30A72B3303933E2F857FD5D9AF562EEF6CEED_PRESERVED", "RECEIPT_INDEX_APPEND_ONLY_EQUALITY_PRESERVED", "RESOLVE_EXACT_R11_PUSH_RUN", "VERIFY_R11_ARTIFACT_AND_UNCHANGED_C2", "PERSIST_RECEIPT_ONLY_SUCCESSORS", "RUN_MANDATORY_EXACT_HEAD_GATES", "VERIFY_AUTHORITY_MIRROR_SYNCHRONIZATION", "NO_ZENODO_MUTATION", "NO_EXTERNAL_DISPATCH"]
          }
          value["completion_claims"] = {"PASS": False, "FINAL_PASS": False, "EFFECT_ACK_DONE": False}
          path.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          python3 -B tools/qikvrt_anticipation.py materialize
          python3 -B tools/qikvrt_anticipation.py check
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
      - name: Persist projections and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qikvrt_paired_anticipation_refresh_pr368_pr214.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anticipation receipts/anticipation REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git add -u .github/workflows/qikvrt_paired_anticipation_refresh_pr368_pr214.yml
          git commit -m "anticipation: bind PR368 PR214 promotion and select R11 receipt pair"
          git push origin HEAD:agent/current-main-anticipation-refresh-pr368-pr214-v2
