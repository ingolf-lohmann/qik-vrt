name: Publish relational-time evidence-sphere anchor to Zenodo

on:
  push:
    branches:
      - automation/zenodo-anchor-terminal-pattern
    paths:
      - release/relational-time-monotonic-evidence-sphere-zenodo-v1/PUBLISH_TRIGGER.json

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qikvrt-relational-time-evidence-sphere-zenodo-v1
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Goldkelch/qik-vrt' &&
      github.ref == 'refs/heads/automation/zenodo-anchor-terminal-pattern' &&
      github.actor == 'ingolf-lohmann' &&
      github.triggering_actor == 'ingolf-lohmann'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: zenodo-production
    env:
      EXECUTION_HEAD: 0cc8e5fe667a85bf4c0f112868dc43f47a4829dc
      EXECUTION_TREE: 0db904c3ed24e69f6cf345a03da91d2ca30b4aea
      PUBLICATION_ID: qikvrt-relational-time-monotonic-evidence-sphere-v1
      AUTHORIZATION_ID: qikvrt-relational-time-evidence-sphere-v1-20260831-2f5a9b9aa7cc4f92
      MANIFEST_PATH: release/relational-time-monotonic-evidence-sphere-zenodo-v1/publish-request.json
      MANIFEST_SHA256: fbb9c4f4e3369c199a0fe542ce345069100d03fc50c098f8b1e200dee67cc648
      AUTHORIZATION_PATH: release/relational-time-monotonic-evidence-sphere-zenodo-v1/OWNER_ZENODO_AUTHORIZATION.json
      AUTHORIZATION_SHA256: 7936ba322b817d85f520050921f3fc6f5200790d809852f3c06ef2b1eb58f2b0
      TRIGGER_PATH: release/relational-time-monotonic-evidence-sphere-zenodo-v1/PUBLISH_TRIGGER.json
      EVIDENCE_PATH: release/relational-time-monotonic-evidence-sphere-zenodo-v1/zenodo-publication.json
      TARGET_PDF_SHA256: 38b0e62a46214a7cb9943dd3ef08283a70ae7e15ba22a59a9e53506f2945e311
      TARGET_PDF_BYTES: '379427'
      ZENODO_API_BASE: https://zenodo.org/api
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'

    steps:
      - name: Check out exact trigger commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate one-commit production trigger and immutable execution binding
        id: trigger
        shell: bash
        env:
          EVENT_AFTER: ${{ github.event.after }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          hex40 = re.compile(r"^[0-9a-f]{40}$")
          hex64 = re.compile(r"^[0-9a-f]{64}$")
          zero40 = "0" * 40

          def fail(message):
              raise SystemExit("BLOCK: " + message)

          def git(*args):
              return subprocess.check_output(
                  ["git", *args], text=True
              ).strip()

          trigger_path = pathlib.Path(os.environ["TRIGGER_PATH"])
          if not trigger_path.is_file() or trigger_path.is_symlink():
              fail("trigger is absent or not a regular file")
          raw = trigger_path.read_bytes()
          try:
              marker = json.loads(raw.decode("utf-8"))
          except (UnicodeDecodeError, json.JSONDecodeError):
              fail("trigger is not valid UTF-8 JSON")

          expected_keys = {
              "schema", "state", "confirm", "repository",
              "source_main_head", "source_main_tree",
              "execution_head", "execution_tree",
              "publication_id", "authorization_id",
              "manifest_sha256", "owner_authorization_sha256",
              "target_pdf_sha256", "target_pdf_bytes",
          }
          if not isinstance(marker, dict) or set(marker) != expected_keys:
              fail("trigger keys differ from the closed contract")

          fixed = {
              "schema": "qikvrt_relational_time_anchor_zenodo_trigger_v1",
              "state": "publish",
              "confirm": "PUBLISH_RELATIONAL_TIME_EVIDENCE_SPHERE_ANCHOR",
              "repository": "Goldkelch/qik-vrt",
              "execution_head": os.environ["EXECUTION_HEAD"],
              "execution_tree": os.environ["EXECUTION_TREE"],
              "publication_id": os.environ["PUBLICATION_ID"],
              "authorization_id": os.environ["AUTHORIZATION_ID"],
              "manifest_sha256": os.environ["MANIFEST_SHA256"],
              "owner_authorization_sha256": os.environ["AUTHORIZATION_SHA256"],
              "target_pdf_sha256": os.environ["TARGET_PDF_SHA256"],
              "target_pdf_bytes": int(os.environ["TARGET_PDF_BYTES"]),
          }
          for key, expected in fixed.items():
              if marker.get(key) != expected:
                  fail(f"trigger {key} differs from the fixed contract")

          source_main_head = marker["source_main_head"]
          source_main_tree = marker["source_main_tree"]
          if hex40.fullmatch(source_main_head) is None:
              fail("source_main_head is not lowercase Git SHA-1")
          if hex40.fullmatch(source_main_tree) is None:
              fail("source_main_tree is not lowercase Git SHA-1")
          for key in (
              "manifest_sha256",
              "owner_authorization_sha256",
              "target_pdf_sha256",
          ):
              if hex64.fullmatch(marker[key]) is None:
                  fail(f"{key} is not lowercase SHA-256")

          after = os.environ["EVENT_AFTER"]
          before = os.environ["EVENT_BEFORE"]
          if os.environ["EVENT_REF"] != (
              "refs/heads/automation/zenodo-anchor-terminal-pattern"
          ):
              fail("event ref differs")
          if os.environ["EVENT_FORCED"] != "false":
              fail("forced trigger update is forbidden")
          if after != os.environ["GITHUB_SHA"] or git("rev-parse", "HEAD") != after:
              fail("event after, GITHUB_SHA and checked-out HEAD differ")
          if before not in {zero40, source_main_head}:
              fail("event before is neither branch creation nor exact source main")

          parents = git("show", "-s", "--format=%P", "HEAD").split()
          if parents != [source_main_head]:
              fail("trigger commit must have exactly source_main_head as parent")
          if git("show", "-s", "--format=%T", source_main_head) != source_main_tree:
              fail("source main tree differs")
          if git("show", "-s", "--format=%T", os.environ["EXECUTION_HEAD"]) != os.environ["EXECUTION_TREE"]:
              fail("execution tree differs")
          subprocess.run(
              ["git", "merge-base", "--is-ancestor",
               os.environ["EXECUTION_HEAD"], source_main_head],
              check=True,
          )

          changed = git(
              "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD^", "HEAD"
          ).splitlines()
          if changed != [os.environ["TRIGGER_PATH"]]:
              fail("trigger commit changed paths outside the trigger marker")

          remote_main = git("ls-remote", "--heads", "origin", "refs/heads/main").split()
          if not remote_main or remote_main[0] != source_main_head:
              fail("remote main differs from trigger source")
          remote_trigger = git(
              "ls-remote", "--heads", "origin",
              "refs/heads/automation/zenodo-anchor-terminal-pattern",
          ).split()
          if not remote_trigger or remote_trigger[0] != after:
              fail("remote trigger ref differs from event after")

          print(f"source_main_head={source_main_head}")
          print(f"source_main_tree={source_main_tree}")
          print(f"trigger_sha256={hashlib.sha256(raw).hexdigest()}")
          PY

      - name: Check out fixed authorized execution commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXECUTION_HEAD"
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXECUTION_HEAD"
          test "$(git show -s --format=%T HEAD)" = "$EXECUTION_TREE"
          test ! -e "$EVIDENCE_PATH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Verify exact publication controls without network effect
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$MANIFEST_PATH" | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(sha256sum "$AUTHORIZATION_PATH" | awk '{print $1}')" = "$AUTHORIZATION_SHA256"
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          GITHUB_SHA="$EXECUTION_HEAD" \
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          from tools import qikvrt_zenodo_publish as publish

          root = Path.cwd().resolve()
          manifest_path = root / os.environ["MANIFEST_PATH"]
          manifest = publish.load_manifest(manifest_path, root)
          execution_head = publish._validate_repository_source_head(
              root, manifest_path, manifest
          )
          publish._validate_origin_repository(root, manifest["repository"])
          if execution_head != os.environ["EXECUTION_HEAD"]:
              raise SystemExit("BLOCK: normalized execution head differs")
          if manifest["manifest_sha256"] != os.environ["MANIFEST_SHA256"]:
              raise SystemExit("BLOCK: normalized manifest digest differs")
          if manifest["owner_authorization"]["authorization_id"] != os.environ["AUTHORIZATION_ID"]:
              raise SystemExit("BLOCK: normalized authorization id differs")
          if len(manifest["files"]) != 9:
              raise SystemExit("BLOCK: exact Zenodo upload count differs")
          pdf = manifest["files"][0]
          if (
              pdf["sha256"] != os.environ["TARGET_PDF_SHA256"]
              or pdf["size"] != int(os.environ["TARGET_PDF_BYTES"])
          ):
              raise SystemExit("BLOCK: primary PDF identity differs")
          print("ZENODO_EXECUTION_PREFLIGHT=VALID")
          PY
          python3 -B tools/qikvrt_integrity.py verify

      - name: Run complete repository gates before effect
        shell: bash
        run: |
          set -euo pipefail
          make test
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Recheck immutable remote bindings immediately before effect
        shell: bash
        env:
          SOURCE_MAIN_HEAD: ${{ steps.trigger.outputs.source_main_head }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXECUTION_HEAD"
          test ! -e "$EVIDENCE_PATH"
          remote_main="$(
            git ls-remote --heads origin 'refs/heads/main' |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_main" = "$SOURCE_MAIN_HEAD"
          remote_trigger="$(
            git ls-remote --heads origin \
              'refs/heads/automation/zenodo-anchor-terminal-pattern' |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_trigger" = "$GITHUB_SHA"

      - name: Consume authorization and publish exact files
        id: publish
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
        run: |
          set +e
          umask 077
          GITHUB_SHA="$EXECUTION_HEAD" \
          python3 -B tools/qikvrt_zenodo_publish.py \
            --manifest "$MANIFEST_PATH"
          status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist publication or recovery receipt on current main
        id: persist
        if: always()
        shell: bash
        env:
          SOURCE_MAIN_HEAD: ${{ steps.trigger.outputs.source_main_head }}
          RECEIPT_BRANCH: receipt/relational-time-evidence-sphere-zenodo-v1-${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test ! -f "$EVIDENCE_PATH"; then
            printf 'persisted=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state="$(
            GITHUB_SHA="$EXECUTION_HEAD" python3 -B - <<'PY'
          import os
          from pathlib import Path
          from tools import qikvrt_zenodo_publish as publish

          root = Path.cwd().resolve()
          manifest_path = root / os.environ["MANIFEST_PATH"]
          manifest = publish.load_manifest(manifest_path, root)
          value, _raw = publish.zenodo._load_json_file(
              root / os.environ["EVIDENCE_PATH"]
          )
          evidence = publish._validate_recovery_evidence(
              value, manifest_path, root, manifest, os.environ["EXECUTION_HEAD"]
          )
          print(evidence["state"])
          PY
          )"
          doi="$(
            python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path
          value = json.loads(Path(os.environ["EVIDENCE_PATH"]).read_text(encoding="utf-8"))
          print(value.get("doi") or "")
          PY
          )"
          cp "$EVIDENCE_PATH" /tmp/qikvrt-zenodo-publication.json
          git reset --hard
          git clean -fdx
          git checkout --detach "$SOURCE_MAIN_HEAD"
          test ! -e "$EVIDENCE_PATH"
          mkdir -p "$(dirname "$EVIDENCE_PATH")"
          cp /tmp/qikvrt-zenodo-publication.json "$EVIDENCE_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B - <<'PY'
          import os
          import subprocess

          expected = {
              "REPOSITORY_FILE_MANIFEST.json",
              "REPOSITORY_FILE_MANIFEST.json.sha256",
              "SHA256SUMS.txt",
              os.environ["EVIDENCE_PATH"],
          }
          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"]
          )
          observed = {
              item[3:].decode("utf-8")
              for item in raw.split(b"\0")
              if item
          }
          if observed != expected:
              raise SystemExit(
                  "BLOCK: receipt delta differs: " + ",".join(sorted(observed))
              )
          PY
          git config user.name 'qik-vrt-zenodo-publication[bot]'
          git config user.email 'qik-vrt-zenodo-publication[bot]@users.noreply.github.com'
          git switch -c "$RECEIPT_BRANCH"
          git add -- \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt \
            "$EVIDENCE_PATH"
          git diff --cached --check
          git commit -m 'zenodo: persist relational-time evidence-sphere anchor receipt'
          push_auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $push_auth" \
            push origin "HEAD:refs/heads/$RECEIPT_BRANCH"
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
          RECEIPT_BRANCH="$RECEIPT_BRANCH" \
          STATE="$state" \
          DOI="$doi" \
          python3 -B - <<'PY'
          import os
          from tools import qikvrt_zenodo_publish as publish

          body = (
              "Exact Zenodo publisher receipt state: `"
              + os.environ["STATE"]
              + "`."
          )
          if os.environ["DOI"]:
              body += "\n\nDOI: `" + os.environ["DOI"] + "`."
          body += (
              "\n\nThe receipt is based on the trigger-bound current main and "
              "contains only the publication/recovery evidence plus regenerated "
              "repository integrity projections."
          )
          publish._github_api_request(
              "POST",
              "/repos/Goldkelch/qik-vrt/pulls",
              os.environ["GITHUB_TOKEN"],
              payload={
                  "title": "Persist relational-time evidence-sphere Zenodo receipt",
                  "head": os.environ["RECEIPT_BRANCH"],
                  "base": "main",
                  "body": body,
              },
              accept=(201,),
          )
          PY
          printf 'persisted=true\n' >> "$GITHUB_OUTPUT"
          printf 'state=%s\n' "$state" >> "$GITHUB_OUTPUT"
          printf 'doi=%s\n' "$doi" >> "$GITHUB_OUTPUT"

      - name: Upload publication or recovery evidence
        if: always() && hashFiles('release/relational-time-monotonic-evidence-sphere-zenodo-v1/zenodo-publication.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relational-time-evidence-sphere-zenodo-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce terminal publication and durable receipt handling
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.publish.outputs.status }}" = '0'
          test "${{ steps.persist.outputs.persisted }}" = 'true'
          test "${{ steps.persist.outputs.state }}" = 'published'
          test -n "${{ steps.persist.outputs.doi }}"
