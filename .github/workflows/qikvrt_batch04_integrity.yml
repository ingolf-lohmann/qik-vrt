# Execution-only registered transport for Authority 7d87 Mirror construction.
name: QIKVRT repository evidence materialization

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: qikvrt-construct-mirror-7d87-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  construct-history-preserving-mirror-candidate:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'execution/history-preserving-mirror-sync-authority-7d87-from-afcd-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIRROR_PARENT: afcd0255aab6bc5ad18275a2d91516688a41e302
      AUTHORITY_MAIN: 7d87a6003135a6e3efbca34b2d898967d7f66018
      TARGET_REF: execution/history-preserving-mirror-sync-authority-7d87-from-afcd-v1
      RECEIPT_PATH: evidence/runtime/HISTORY_PRESERVING_MIRROR_CANDIDATE_7D87_FROM_AFCD.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify exact execution-only transport
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$MIRROR_PARENT" HEAD
          expected=$(printf '%s\n' \
            .github/workflows/qikvrt_batch04_integrity.yml \
            .github/workflows/qikvrt_construct_mirror_authority_7d87_from_afcd.yml \
            tools/qikvrt_construct_history_preserving_mirror_candidate_7d87.py | sort)
          actual=$(git diff --name-only "$MIRROR_PARENT" HEAD | sort)
          test "$actual" = "$expected"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MIRROR_PARENT"
          test "$(git ls-remote https://github.com/Goldkelch/qik-vrt.git refs/heads/main | cut -f1)" = "$AUTHORITY_MAIN"

      - name: Construct exact unreferenced candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -B tools/qikvrt_construct_history_preserving_mirror_candidate_7d87.py

      - name: Persist constructor receipt on execution branch
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RECEIPT_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$RECEIPT_PATH"
          git commit -m 'evidence: persist exact Mirror candidate constructor receipt'
          git push origin "HEAD:$TARGET_REF"

      - name: Upload immutable constructor receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-history-preserving-mirror-candidate-7d87-from-afcd
          retention-days: 30
          if-no-files-found: error
          path: evidence/runtime/HISTORY_PRESERVING_MIRROR_CANDIDATE_7D87_FROM_AFCD.json
