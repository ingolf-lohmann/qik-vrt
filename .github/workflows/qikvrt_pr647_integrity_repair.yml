name: PR647 canonical integrity repair
on:
  push:
    branches:
      - ci/s1-cancellation-diagnostic-20261031
    paths:
      - .github/workflows/qikvrt_pr647_integrity_repair.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: ci/s1-cancellation-diagnostic-20261031
      - name: Regenerate and verify exact canonical integrity trio
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git add REPOSITORY_FILE_MANIFEST.json SHA256SUMS.txt REPOSITORY_FILE_MANIFEST.json.sha256
          git diff --cached --exit-code && { echo 'No integrity changes'; exit 0; } || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'integrity: regenerate canonical manifest for S1 diagnostic workflow'
          git push origin HEAD:ci/s1-cancellation-diagnostic-20261031
