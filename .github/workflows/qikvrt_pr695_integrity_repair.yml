name: QIKVRT PR695 publication-catalog integrity repair

on:
  push:
    branches:
      - policy/public-devops-artifact-catalog-20261106

permissions:
  contents: write

concurrency:
  group: qikvrt-pr695-catalog-integrity-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ingolf-lohmann/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Bind exact branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote --heads origin refs/heads/policy/public-devops-artifact-catalog-20261106 | awk 'NR == 1 { print $1 }')"
          test "$remote_head" = "$GITHUB_SHA"
      - name: Regenerate exactly three integrity outputs and run publication contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest -v tests.test_public_artifact
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_public_artifact.py public-artifacts/index.json
          while IFS= read -r file; do
            case "$file" in
              REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt) ;;
              *) echo "BLOCK: unexpected modification: $file" >&2; exit 2 ;;
            esac
          done < <(git diff --name-only)
      - name: Commit only integrity outputs to the same branch
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          remote_head="$(git ls-remote --heads origin refs/heads/policy/public-devops-artifact-catalog-20261106 | awk 'NR == 1 { print $1 }')"
          test "$remote_head" = "$expected"
          git add -- REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Integrity outputs already match this head."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "integrity: regenerate public artifact catalog candidate"
          remote_head="$(git ls-remote --heads origin refs/heads/policy/public-devops-artifact-catalog-20261106 | awk 'NR == 1 { print $1 }')"
          test "$remote_head" = "$expected"
          git push origin HEAD:refs/heads/policy/public-devops-artifact-catalog-20261106
