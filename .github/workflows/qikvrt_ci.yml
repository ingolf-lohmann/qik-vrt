name: QIKVRT CI

on:
  push:
    branches-ignore:
      - automation/effect-ack-universality-reserve-20260722
      - automation/effect-ack-universality-finalize-20260722
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Full compile, launcher, protocol, handler, security and TCP/IP tests
        id: full_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          diagnostics=.qikvrt/runtime/ci-diagnostics
          mkdir -p "$diagnostics"
          make test > "$diagnostics/MAKE_TEST_FULL.log" 2>&1
          status=$?
          {
            printf 'MAKE_TEST_EXIT=%s\n' "$status"
            printf '%s\n' '--- LAST 500 LINES ---'
            tail -n 500 "$diagnostics/MAKE_TEST_FULL.log"
            printf '%s\n' '--- WORKTREE STATUS ---'
            git status --short --untracked-files=all
            printf '%s\n' '--- INTEGRITY MANIFEST DELTA ---'
            python3 -B - <<'PY'
          import json
          from pathlib import Path
          from tools import qikvrt_integrity as integrity

          stored = json.loads(Path(integrity.MANIFEST_NAME).read_text(encoding='utf-8'))
          _manifest, _index, _detached, expected = integrity.build_outputs()
          old = {entry['path']: entry for entry in stored['files']}
          new = {entry['path']: entry for entry in expected['files']}
          print('added=' + json.dumps(sorted(new.keys() - old.keys())))
          print('removed=' + json.dumps(sorted(old.keys() - new.keys())))
          changed = sorted(
              path for path in old.keys() & new.keys()
              if old[path] != new[path]
          )
          print('changed=' + json.dumps(changed))
          for path in changed[:50]:
              before = old[path]
              after = new[path]
              print(json.dumps({'path': path, 'stored': before, 'expected': after}, sort_keys=True))
          PY
          } > "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" 2>&1
          mkdir -p audit/ci-diagnostics
          cp "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" \
            audit/ci-diagnostics/MAKE_TEST_DIAGNOSTICS.log
          cat "$diagnostics/MAKE_TEST_DIAGNOSTICS.log"
          exit "$status"
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-ci-audit
          retention-days: 30
          path: |
            audit/**
            .qikvrt/**
          if-no-files-found: warn
          include-hidden-files: true
      - name: Same-writer successor re-entry to tested fixpoint
        id: fixpoint
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_REF: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          MAX_SUCCESSORS: "4"
        shell: bash
        run: |
          set -euo pipefail

          subject="$(git rev-parse --verify HEAD^{commit})"
          test "$subject" = "$EXPECTED_HEAD"

          for iteration in $(seq 0 "$MAX_SUCCESSORS"); do
            subject="$(git rev-parse --verify HEAD^{commit})"
            tree="$(git rev-parse --verify HEAD^{tree})"
            remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
            test "$remote" = "$subject"
            echo "QIKVRT_REENTRY_SUBJECT iteration=$iteration head=$subject tree=$tree"

            # Test the exact active subject. Integrity staleness is the only
            # expected pre-materialization failure and is repaired below.
            set +e
            make test > ".qikvrt-fixpoint-test-$iteration.log" 2>&1
            test_status=$?
            set -e

            python3 tools/qikvrt_integrity.py generate
            python3 tools/qikvrt_integrity.py verify

            # Re-run the complete gates against the regenerated state. Any
            # remaining failure is a real successor failure, not predecessor
            # evidence and must stop the writer fail-closed.
            make test
            python3 tools/qikvrt_integrity.py verify

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt

            if git diff --cached --quiet; then
              echo "QIKVRT_FIXPOINT_REACHED iteration=$iteration head=$subject tree=$tree predecessor_test_status=$test_status"
              exit 0
            fi

            test "$iteration" -lt "$MAX_SUCCESSORS"
            remote_pre_push="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
            test "$remote_pre_push" = "$subject"

            git commit -m "ci: materialize exact-subject repository integrity"
            successor="$(git rev-parse --verify HEAD^{commit})"
            successor_tree="$(git rev-parse --verify HEAD^{tree})"
            git push origin "HEAD:$TARGET_REF"

            remote_after="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
            test "$remote_after" = "$successor"
            git fetch --no-tags origin "$TARGET_REF"
            readback_head="$(git rev-parse --verify FETCH_HEAD^{commit})"
            readback_tree="$(git rev-parse --verify FETCH_HEAD^{tree})"
            test "$readback_head" = "$successor"
            test "$readback_tree" = "$successor_tree"

            echo "QIKVRT_SUCCESSOR_REENTRY iteration=$iteration predecessor=$subject successor=$successor successor_tree=$successor_tree readback_head=$readback_head readback_tree=$readback_tree"

            # The freshly read-back successor is now the next exact subject in
            # this same admitted writer; no nested workflow admission is used.
            git reset --hard "$readback_head"
          done

          echo "BLOCK successor fixpoint not reached within $MAX_SUCCESSORS mutations" >&2
          exit 2

      - name: Enforce terminal tested-fixpoint disposition
        if: always()
        env:
          FIXPOINT_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          FULL_TEST_OUTCOME: ${{ steps.full_test.outcome }}
          FIXPOINT_OUTCOME: ${{ steps.fixpoint.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          case "$FIXPOINT_REQUIRED" in
            true)
              # A same-repository PR writer may repair the predecessor. Only
              # its fully re-tested successor can establish the terminal result.
              test "$FIXPOINT_OUTCOME" = "success"
              mode=tested-fixpoint
              ;;
            false)
              # Push, manual and fork-PR runs do not admit the writer. Their
              # literal checkout must pass; continue-on-error cannot mask it.
              test "$FIXPOINT_OUTCOME" = "skipped"
              test "$FULL_TEST_OUTCOME" = "success"
              mode=full-test
              ;;
            *)
              echo "BLOCK: unknown fixpoint admission" >&2
              exit 1
              ;;
          esac
          echo "QIKVRT_TERMINAL_DISPOSITION PASS mode=$mode"

  offline_browser:
    # Reuse the frozen native offline suite for the derived Site32 client.
    # This gate has no dependence on Zenodo, a deployment or a native executor.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      QIKVRT_OFFLINE_CLIENT_DIR: ${{ github.workspace }}/docs/monitor/offline
      QIKVRT_PLAYWRIGHT_MODULE: ${{ github.workspace }}/runtime/offline/browser-tests/node_modules/playwright
      QIKVRT_OFFLINE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/offline/browser-tests/package-lock.json
      - name: Verify exact source, tool cache and package-bound browser lock
        env:
          QIKVRT_OFFLINE_EVIDENCE_DIR: ${{ runner.temp }}/offline-${{ matrix.engine }}
        run: |
          set -euo pipefail
          mkdir -p "$QIKVRT_OFFLINE_EVIDENCE_DIR"
          git rev-parse HEAD HEAD^{tree} > "$QIKVRT_OFFLINE_EVIDENCE_DIR/SUBJECT.txt"
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B tools/qikvrt_integrity.py verify
          npm ci --ignore-scripts --prefix runtime/offline/browser-tests
          node runtime/offline/browser-tests/browser.test.mjs --precheck
      - name: Install exact package-bound browser
        run: runtime/offline/browser-tests/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - name: Fresh offline and full browser-process restart controls
        env:
          QIKVRT_OFFLINE_EVIDENCE_DIR: ${{ runner.temp }}/offline-${{ matrix.engine }}
        run: |
          set -euo pipefail
          node runtime/offline/browser-tests/browser.test.mjs
          git rev-parse HEAD HEAD^{tree} > "$QIKVRT_OFFLINE_EVIDENCE_DIR/SUBJECT_AFTER.txt"
          cmp "$QIKVRT_OFFLINE_EVIDENCE_DIR/SUBJECT.txt" "$QIKVRT_OFFLINE_EVIDENCE_DIR/SUBJECT_AFTER.txt"
          git status --porcelain --untracked-files=no > "$QIKVRT_OFFLINE_EVIDENCE_DIR/TRACKED_STATUS.txt"
          test ! -s "$QIKVRT_OFFLINE_EVIDENCE_DIR/TRACKED_STATUS.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qikvrt-site32-offline-browser-${{ matrix.engine }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/offline-${{ matrix.engine }}/browser-readback.json
            ${{ runner.temp }}/offline-${{ matrix.engine }}/failure.json
            ${{ runner.temp }}/offline-${{ matrix.engine }}/SUBJECT*.txt
            ${{ runner.temp }}/offline-${{ matrix.engine }}/TRACKED_STATUS.txt
          retention-days: 30
          if-no-files-found: warn

  s1_firefox_extension:
    name: Reused S1 + Mozilla Release - Firefox 158 XPI admission
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact candidate XPI and existing probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify existing tool contract and negative admission controls
        run: |
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B -m unittest -v tests.test_self_host_firefox.FirefoxExtensionAdmissionTests
      - name: Admit only a materially changed image, XPI or probe
        id: effect-admission
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          evidence=Path(os.environ['RUNNER_TEMP'])/'s1-extension-evidence'
          evidence.mkdir(mode=0o777,exist_ok=True);evidence.chmod(0o777)
          root='browser/firefox/qikvrt-terminal/'
          files=['manifest.json','background.js','content.js','options.html','options.js','terminal.css']
          blob=lambda path:subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          work=json.loads(Path('state/work_units/QIKVRT_MAIN_CONVERGENCE_20261014_V1.json').read_bytes())
          upgrade=work.get('firefox158_s1_upgrade',{})
          signed=upgrade.get('signed_xpi_artifact')
          inputs={'image_digest':'sha256:eda9516930cf7a51f0342e9b154b430c386ad04b80ce6401ce6b7d1a103ac74d',
              'upgrade_dockerfile_blob':blob('runtime/self-host/Dockerfile'),
              'terminal_entrypoint_blob':blob('deploy/universal-terminal/entrypoint.sh'),
              'signed_xpi_artifact':signed,
              'probe_blob':blob('tools/qikvrt_self_host.py'),
              'extension_blobs':{name:blob(root+name) for name in files}}
          causal_digest=hashlib.sha256(json.dumps(inputs,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          work=json.loads(Path('state/work_units/QIKVRT_MAIN_CONVERGENCE_20261014_V1.json').read_bytes())
          prior=upgrade.get('native_observation',{})
          unchanged=(prior.get('causal_input_sha256')==causal_digest and
              prior.get('receipt',{}).get('state','').startswith('HOLD_'))
          if unchanged:
              r=dict(prior['receipt']);r.update(current_probe_executed=False,
                  reused_failure_source_head=prior['source_head'],reused_failure_run_id=prior['run_id'])
              (evidence/'extension-installation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
              print('NOOP_UNCHANGED_FIREFOX_RELEASE_OR_SIGNING_FAILURE')
          if signed is not None:
              import re
              assert signed['repository']=='ingolf-lohmann/qik-vrt'
              assert type(signed['run_id']) is int and signed['run_id']>0
              assert re.fullmatch(r'[A-Za-z0-9_.-]{1,160}',signed['artifact_name'])
              assert re.fullmatch(r'[A-Za-z0-9_.-]+[.]xpi',signed['file_name'])
              assert re.fullmatch(r'[a-f0-9]{64}',signed['xpi_sha256'])
          (evidence/'causal-inputs.json').write_text(json.dumps({'inputs':inputs,
              'sha256':causal_digest,'current_probe_required':not unchanged,
              'effect_ack_done':False},sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('probe_required='+str(not unchanged).lower()+'\n')
              output.write('signed_candidate='+str(signed is not None).lower()+'\n')
              if signed:
                  output.write('signed_run_id='+str(signed['run_id'])+'\n')
                  output.write('signed_artifact_name='+signed['artifact_name']+'\n')
          PY

      - name: Reuse original S1 source verifier
        if: steps.effect-admission.outputs.probe_required == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c1cca8fae42166d456c776e5c876c23ac7689aea
          path: .qikvrt/runtime/s1-baseline-source
          fetch-depth: 1
          persist-credentials: false
      - name: Retrieve existing proven OCI bytes without rebuilding runtime
        if: steps.effect-admission.outputs.probe_required == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 38475417828
          name: qikvrt-s1-container-c1cca8fae42166d456c776e5c876c23ac7689aea
          path: ${{ runner.temp }}/s1-original
      - name: Verify original archive, every OCI object and exact image binding
        if: steps.effect-admission.outputs.probe_required == 'true'
        run: |
          python3 -B - <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          import os
          original=Path(os.environ['RUNNER_TEMP'])/'s1-original'
          archive=original/'image.oci.tar'
          h=hashlib.sha256()
          with archive.open('rb') as f:
              for block in iter(lambda:f.read(8*1024*1024),b''): h.update(block)
          assert h.hexdigest()=='09ca059f741bdb93232c35fe463b37256dc8dfa25478804461a9c0b575b75b25'
          sys.path.insert(0,str(Path('.qikvrt/runtime/s1-baseline-source').resolve()))
          from tools import qikvrt_self_host_container as original_verifier
          r=original_verifier.oci(archive,'c1cca8fae42166d456c776e5c876c23ac7689aea',
              '65997163a6bee14f8d14f4a193038b51f4599ead')
          assert r['image_digest']=='sha256:eda9516930cf7a51f0342e9b154b430c386ad04b80ce6401ce6b7d1a103ac74d'
          evidence=Path(os.environ['RUNNER_TEMP'])/'s1-extension-evidence'
          evidence.mkdir(mode=0o777,exist_ok=True);evidence.chmod(0o777)
          (evidence/'original-oci.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
          mkdir "$RUNNER_TEMP/s1-original/load"
          python3 -B - <<'PYIMPORT'
          import os
          from pathlib import Path
          from tools import qikvrt_self_host as host
          p=Path(os.environ['RUNNER_TEMP'])/'s1-original'
          print(host.oci_to_docker_archive(p/'image.oci.tar',p/'load/image.docker.tar',
              'qikvrt-s1:firefox-158-baseline'))
          PYIMPORT
          docker load --input "$RUNNER_TEMP/s1-original/load/image.docker.tar"
          python3 -B - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'s1-extension-evidence'
          o=json.loads((p/'original-oci.json').read_bytes())
          live=json.loads(subprocess.check_output(['docker','image','inspect','qikvrt-s1:firefox-158-baseline']))[0]
          assert live['Id']==o['config_digest']
          assert live['RootFS']['Layers']==o['diff_ids']
          assert live['Config']['Labels']['org.opencontainers.image.revision']==o['source_head']
          assert live['Config']['Labels']['de.qikvrt.source-tree']==o['source_tree']
          (p/'image-readback.json').write_text(json.dumps({'image_id':live['Id'],
              'source_head':o['source_head'],'source_tree':o['source_tree'],
              'original_oci_archive_sha256':'09ca059f741bdb93232c35fe463b37256dc8dfa25478804461a9c0b575b75b25',
              'predecessor_acceptance_transferred':False,'rebuilt':False,
              'effect_ack_done':False},sort_keys=True,indent=2)+'\n')
          PY
      - name: Retrieve an explicitly pinned signed candidate when one is bound
        if: steps.effect-admission.outputs.probe_required == 'true' && steps.effect-admission.outputs.signed_candidate == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.effect-admission.outputs.signed_run_id }}
          name: ${{ steps.effect-admission.outputs.signed_artifact_name }}
          path: ${{ runner.temp }}/s1-signed-input
      - name: Package exact candidate source and bind all original extension blobs
        if: steps.effect-admission.outputs.probe_required == 'true'
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          evidence=Path(os.environ['RUNNER_TEMP'])/'s1-extension-evidence'
          root=Path('browser/firefox/qikvrt-terminal')
          names=['manifest.json','background.js','content.js','options.html','options.js','terminal.css']
          records=[]
          with zipfile.ZipFile(evidence/'candidate.xpi','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  raw=(root/name).read_bytes()
                  info=zipfile.ZipInfo(name,(2000,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o100644<<16
                  z.writestr(info,raw)
                  blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
                  assert blob==subprocess.check_output(['git','rev-parse','HEAD:'+str(root/name)],text=True).strip()
                  records.append({'path':str(root/name),'git_blob':blob,'sha256':hashlib.sha256(raw).hexdigest()})
          binding={'candidate_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'candidate_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'xpi_sha256':hashlib.sha256((evidence/'candidate.xpi').read_bytes()).hexdigest(),
              'source_files':records,'signed_production_package':False,'effect_ack_done':False}
          from tools import qikvrt_self_host as host
          work=json.loads(Path('state/work_units/QIKVRT_MAIN_CONVERGENCE_20261014_V1.json').read_bytes())
          signed=work.get('firefox158_s1_upgrade',{}).get('signed_xpi_artifact')
          if signed:
              import shutil
              incoming=Path(os.environ['RUNNER_TEMP'])/'s1-signed-input'/signed['file_name']
              checked=host.firefox_xpi_source_binding(incoming,root)
              assert checked['xpi_sha256']==signed['xpi_sha256']
              assert checked['signature_metadata_present'] is True
              shutil.copyfile(evidence/'candidate.xpi',evidence/'unsigned-signing-input.zip')
              shutil.copyfile(incoming,evidence/'candidate.xpi')
              binding.update(checked,signed_candidate_available=True,
                  signing_binding=signed,signed_production_package=False)
          else:
              binding.update(signed_candidate_available=False,
                  signing_blocker='MOZILLA_SIGNING_BINDING_AND_SIGNED_XPI_UNAVAILABLE')
              print('HOLD_SIGNED_XPI_UNAVAILABLE: no credential delivery or AMO signing effect is established')
          (evidence/'xpi-source-binding.json').write_text(json.dumps(binding,sort_keys=True,indent=2)+'\n')
          PY
      - name: Add only the supported Mozilla Release upgrade to verified S1 parent layers
        if: steps.effect-admission.outputs.probe_required == 'true'
        run: |
          docker build --target s1-firefox-release --file runtime/self-host/Dockerfile \
            --build-arg QIKVRT_S1_BASE_IMAGE=qikvrt-s1:firefox-158-baseline \
            --tag qikvrt-s1:firefox-158-release .
          python3 -B - <<'PYUPGRADE'
          import json,os,subprocess
          from pathlib import Path
          evidence=Path(os.environ['RUNNER_TEMP'])/'s1-extension-evidence'
          inspect=lambda image:json.loads(subprocess.check_output(['docker','image','inspect',image]))[0]
          parent=inspect('qikvrt-s1:firefox-158-baseline');current=inspect('qikvrt-s1:firefox-158-release')
          assert current['RootFS']['Layers'][:len(parent['RootFS']['Layers'])]==parent['RootFS']['Layers']
          provision=json.loads(subprocess.check_output(['docker','run','--rm','--network','none',
              '--entrypoint','cat','qikvrt-s1:firefox-158-release',
              '/opt/qikvrt/runtime/firefox-release/provision.json']))
          assert provision['minimum_satisfied'] is True
          blob=lambda path:subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          receipt={'image_id':current['Id'],'parent_image_id':parent['Id'],
              'parent_diff_ids':parent['RootFS']['Layers'],'diff_ids':current['RootFS']['Layers'],
              'all_original_parent_layers_retained':True,'native_components_rebuilt':False,
              'source_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'component_blobs':{path:blob(path) for path in ('runtime/self-host/Dockerfile',
                  'tools/qikvrt_self_host.py','deploy/universal-terminal/entrypoint.sh')},
              'provision':provision,'extension_activation_verified':False,'effect_ack_done':False}
          (evidence/'release-image-readback.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PYUPGRADE
      - name: Freeze the upgraded dependency image for later signed-XPI admission
        if: steps.effect-admission.outputs.probe_required == 'true'
        run: |
          mkdir "$RUNNER_TEMP/s1-firefox158-runtime"
          docker save --output "$RUNNER_TEMP/s1-firefox158-runtime/image.docker.tar" qikvrt-s1:firefox-158-release
          python3 -B - <<'PYFREEZE'
          import gzip,hashlib,json,os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);delivery=root/'s1-firefox158-runtime'
          raw=delivery/'image.docker.tar';frozen=delivery/'image.docker.tar.gz'
          with raw.open('rb') as source,frozen.open('wb') as destination:
              with gzip.GzipFile(fileobj=destination,mode='wb',compresslevel=1,mtime=0) as out:
                  shutil.copyfileobj(source,out,8*1024*1024)
          raw.unlink()
          with frozen.open('rb') as source: pin=hashlib.file_digest(source,'sha256').hexdigest()
          evidence=root/'s1-extension-evidence';receipt=json.loads((evidence/'release-image-readback.json').read_bytes())
          receipt.update(archive_sha256=pin,archive_bytes=frozen.stat().st_size,
              artifact_name='qikvrt-s1-firefox158-runtime-'+receipt['source_head'],
              run_id=int(os.environ['GITHUB_RUN_ID']),signing_material_excluded=True)
          text=json.dumps(receipt,sort_keys=True,indent=2)+'\n'
          (delivery/'release-image-readback.json').write_text(text)
          (evidence/'release-image-readback.json').write_text(text)
          PYFREEZE
      - name: Preserve the reusable upgraded S1 dependency bytes
        if: steps.effect-admission.outputs.probe_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-s1-firefox158-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/s1-firefox158-runtime
          retention-days: 90
          if-no-files-found: error
      - name: Reuse native Firefox, noVNC and persistent restart controls on the upgraded carrier
        if: steps.effect-admission.outputs.probe_required == 'true'
        run: |
          docker build --target test --file runtime/self-host/Dockerfile \
            --build-arg QIKVRT_DEPENDENCY_IMAGE=qikvrt-s1:firefox-158-release \
            --tag qikvrt-s1:firefox-158-release-test .
          docker run --rm --init --network none --shm-size 256m \
            --tmpfs /tmp:size=768m,mode=1777 --workdir /source \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/s1-extension-evidence,target=/evidence" \
            --env QIKVRT_FIREFOX_PACKAGE=firefox --env QIKVRT_BROWSER_TEST_EVIDENCE=/evidence \
            --entrypoint python3 qikvrt-s1:firefox-158-release-test \
            -B -m unittest -v tests.test_self_host_firefox.FirefoxCarrierTests
      - name: Actual package version, persistent installation and live AddonManager activation
        if: steps.effect-admission.outputs.probe_required == 'true'
        run: |
          docker run --rm --init --network none --user 10001:10001 --read-only \
            --env HOME=/tmp --cap-drop ALL --security-opt no-new-privileges:true --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,size=768m,mode=1777 \
            --mount "type=bind,source=$PWD/tools/qikvrt_self_host.py,target=/probe/qikvrt_self_host.py,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/s1-extension-evidence,target=/evidence" \
            --entrypoint python3 qikvrt-s1:firefox-158-release \
            -B /probe/qikvrt_self_host.py firefox-extension-check --extension-xpi /evidence/candidate.xpi \
            --output /evidence --firefox-package firefox
      - name: Enforce actual compatible activation; a diagnostic read is not admission
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'s1-extension-evidence'
          r=json.loads((p/'extension-installation.json').read_bytes())
          if (p/'xpi-source-binding.json').exists():
              b=json.loads((p/'xpi-source-binding.json').read_bytes())
              assert r['xpi_sha256']==b['xpi_sha256']
          assert r['strict_min_version']=='158.0'
          assert r.get('current_probe_executed',True) is True, 'NOOP: unchanged failed installation remains unaccepted'
          assert r['state']=='EXTENSION_ACTIVATION_AND_RESTART_VERIFIED', 'HOLD: actual extension activation is unverified'
          assert r['signed_production_package_verified'] is True, 'HOLD: a real Mozilla-signed XPI is required under default enforcement'
          assert r['extension_activation_verified'] is True, 'HOLD: default production signing-policy activation is not verified'
          PY
      - name: Preserve bounded original installation and activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-s1-firefox158-installation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/s1-extension-evidence/*.json
            ${{ runner.temp }}/s1-extension-evidence/*.log
            ${{ runner.temp }}/s1-extension-evidence/*.txt
            ${{ runner.temp }}/s1-extension-evidence/unsigned-signing-input.zip
            ${{ runner.temp }}/s1-extension-evidence/candidate.xpi
          retention-days: 30
          if-no-files-found: warn
