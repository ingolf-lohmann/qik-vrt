          PART_COUNT: ${{ steps.runtime-parts.outputs.part_count }}
          MANIFEST_SHA256: ${{ steps.runtime-parts.outputs.manifest_sha256 }}
          ARCHIVE_SHA256: ${{ steps.runtime-parts.outputs.archive_sha256 }}
          PART0_ID: ${{ steps.runtime-part-0.outputs.artifact-id }}
          PART0_DIGEST: ${{ steps.runtime-part-0.outputs.artifact-digest }}
          PART1_ID: ${{ steps.runtime-part-1.outputs.artifact-id }}
          PART1_DIGEST: ${{ steps.runtime-part-1.outputs.artifact-digest }}
          PART2_ID: ${{ steps.runtime-part-2.outputs.artifact-id }}
          PART2_DIGEST: ${{ steps.runtime-part-2.outputs.artifact-digest }}
          PART3_ID: ${{ steps.runtime-part-3.outputs.artifact-id }}
          PART3_DIGEST: ${{ steps.runtime-part-3.outputs.artifact-digest }}
        run: |
          python3 -B - <<'PYDELIVERED'
          import json,os,re,shutil,subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);metadata=root/'s1-firefox158-transport'
          delivered=root/'s1-firefox158-delivered'
          shutil.copyfile(metadata/'PARTS.json',delivered/'PARTS.json')
          subprocess.run(['python3','-B','tools/qikvrt_self_host.py','container-artifact-join',
              '--root',str(delivered),'--output',str(root/'s1-firefox158-original-restored.tar.gz'),
              '--manifest-sha256',os.environ['MANIFEST_SHA256'],
              '--transport-sha256',os.environ['ARCHIVE_SHA256'],
              '--receipt',str(metadata/'restore-readback.json')],check=True)
          original=json.loads((metadata/'ORIGINAL.json').read_bytes())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          parts=[]
          for index in range(int(os.environ['PART_COUNT'])):
              identity=os.environ['PART%d_ID'%index]
              digest=os.environ['PART%d_DIGEST'%index].removeprefix('sha256:')
              assert re.fullmatch(r'[1-9][0-9]*',identity) and re.fullmatch(r'[a-f0-9]{64}',digest)
              parts.append({'index':index,'artifact_id':int(identity),'zip_sha256':digest,
                  'artifact_name':'qikvrt-s1-firefox158-runtime-'+head+'-part-%03d'%index})
          binding={'schema':'qikvrt-container-artifact-delivery/v1','repository':os.environ['GITHUB_REPOSITORY'],
              'run_id':int(os.environ['GITHUB_RUN_ID']),'exporter_head':head,'exporter_tree':tree,
              'original_image':original,'parts_manifest_sha256':os.environ['MANIFEST_SHA256'],
              'parts':parts,'connector_max_artifact_bytes':536870912,
              'part_payload_max_bytes':268435456,'independent_download_back_verified':True,
              'original_archive_restored_verified':True,'image_imported':False,
              'extension_activation_verified':False,'public_production_verified':False,'effect_ack_done':False}
          (metadata/'DELIVERY.json').write_text(json.dumps(binding,sort_keys=True,indent=2)+'\n')
          PYDELIVERED
      - name: Preserve bounded original-byte transport and readback
        if: steps.runtime-parts.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-s1-firefox158-transport-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/s1-firefox158-transport/*.json
          retention-days: 90
          if-no-files-found: error
      - name: Reuse native Firefox, noVNC and persistent restart controls on the upgraded carrier
        if: steps.effect-admission.outputs.probe_required == 'true'
        run: |
          docker build --target test --file runtime/self-host/Dockerfile \
            --build-arg QIKVRT_DEPENDENCY_IMAGE=qikvrt-s1:firefox-158-release \
            --tag qikvrt-s1:firefox-158-release-test .
          docker run --rm --init --network none --shm-size 256m \
            --tmpfs /tmp:size=768m,mode=1777 --workdir /source \
            --mount "type=bind,source=$PWD,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/s1-extension-evidence,target=/evidence" \
            --env QIKVRT_FIREFOX_PACKAGE=firefox --env QIKVRT_BROWSER_TEST_EVIDENCE=/evidence \
            --entrypoint python3 qikvrt-s1:firefox-158-release-test \
            -B -m unittest -v tests.test_self_host_firefox.FirefoxCarrierTests
      - name: Actual package version, persistent installation and live AddonManager activation
        if: steps.effect-admission.outputs.probe_required == 'true'
        run: |
          docker run --rm --init --network none --user 10001:10001 --read-only \
            --env HOME=/tmp --cap-drop ALL --security-opt no-new-privileges:true --shm-size 256m \
            --tmpfs /tmp:rw,nosuid,size=768m,mode=1777 \
            --mount "type=bind,source=$PWD/tools/qikvrt_self_host.py,target=/probe/qikvrt_self_host.py,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/s1-extension-evidence,target=/evidence" \
            --entrypoint python3 qikvrt-s1:firefox-158-release \
            -B /probe/qikvrt_self_host.py firefox-extension-check --extension-xpi /evidence/candidate.xpi \
            --output /evidence --firefox-package firefox
      - name: Enforce actual compatible activation; a diagnostic read is not admission
        run: |
          python3 -B - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'s1-extension-evidence'
          r=json.loads((p/'extension-installation.json').read_bytes())
          if (p/'xpi-source-binding.json').exists():
              b=json.loads((p/'xpi-source-binding.json').read_bytes())
              assert r['xpi_sha256']==b['xpi_sha256']
          assert r['strict_min_version']=='158.0'
          assert r.get('current_probe_executed',True) is True, 'NOOP: unchanged failed installation remains unaccepted'
          assert r['state']=='EXTENSION_ACTIVATION_AND_RESTART_VERIFIED', 'HOLD: actual extension activation is unverified'
          assert r['signed_production_package_verified'] is True, 'HOLD: a real Mozilla-signed XPI is required under default enforcement'
          assert r['extension_activation_verified'] is True, 'HOLD: default production signing-policy activation is not verified'
          PY
      - name: Preserve bounded original installation and activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-s1-firefox158-installation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/s1-extension-evidence/*.json
            ${{ runner.temp }}/s1-extension-evidence/*.log
            ${{ runner.temp }}/s1-extension-evidence/*.txt
            ${{ runner.temp }}/s1-extension-evidence/unsigned-signing-input.zip
            ${{ runner.temp }}/s1-extension-evidence/candidate.xpi
          retention-days: 30
          if-no-files-found: warn

  container:
    name: Linux S1 native terminal production and smoke
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    outputs:
      head: ${{ steps.receipt.outputs.head }}
      tree: ${{ steps.receipt.outputs.tree }}
      digest: ${{ steps.receipt.outputs.digest }}
      manifest: ${{ steps.receipt.outputs.manifest }}
      terminal_profile: ${{ steps.receipt.outputs.terminal_profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.test.outputs.tested_head }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify exact source and existing tool/integrity/admission controls
        env:
          EXPECTED_HEAD: ${{ needs.test.outputs.tested_head }}
          EXPECTED_TREE: ${{ needs.test.outputs.tested_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          test "$(git rev-parse --verify HEAD^{tree})" = "$EXPECTED_TREE"
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B tools/qikvrt_integrity.py verify
          make self-host-container-test
      - name: Set up exact Docker Buildx and BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Prepare exact Skopeo tool from verified cache or pinned official source
        id: tool-loader
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-evidence"
          trap 'if test -f "$RUNNER_TEMP/skopeo-loader/version-check.json"; then cp "$RUNNER_TEMP/skopeo-loader/version-check.json" "$RUNNER_TEMP/container-evidence/skopeo-version-check.json"; fi' EXIT
          python3 -B tools/qikvrt_self_host.py container-tool-prepare \
            --output "$RUNNER_TEMP/skopeo-loader" --receipt "$RUNNER_TEMP/skopeo-loader/receipt.json"
          python3 -B - <<'PYTOOL'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'skopeo-loader/receipt.json').read_bytes())
          assert r['state']=='VERIFIED_TOOL_IMAGE_READY'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('image='+r['tool_image_id']+'\n')
              out.write('artifact='+r['cache_name']+'\n')
          PYTOOL
      - name: Retain verified exact tool before runtime build and smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.tool-loader.outputs.artifact }}
          path: ${{ runner.temp }}/skopeo-loader/skopeo-loader.docker.tar
          if-no-files-found: error
          retention-days: 90
      - name: Export credential-free committed build context
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/container-evidence"
          python3 -B tools/qikvrt_self_host.py container-context --root . \
            --output "$RUNNER_TEMP/s1-context" --receipt "$RUNNER_TEMP/container-evidence/context.json"
          docker version > "$RUNNER_TEMP/container-evidence/docker-version.txt"
          docker buildx version > "$RUNNER_TEMP/container-evidence/buildx-version.txt"
      - name: Verify and reuse original PR494 Docker carrier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_self_host.py container-carrier --root . \
            --output "$RUNNER_TEMP/frozen-carrier" \
            --carrier-oci-archive "$RUNNER_TEMP/container-evidence/carrier-original.oci.tar" \
            --receipt "$RUNNER_TEMP/container-evidence/carrier.json"
      - name: Two independent native terminal OCI builds from the original frozen carrier
        id: independent-builds
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          epoch="$(git show -s --format=%ct HEAD)"
          for build in 1 2; do
            docker buildx build --no-cache --platform linux/amd64 --target production-terminal \
              --file "$RUNNER_TEMP/s1-context/runtime/self-host/Dockerfile" \
              --provenance=false --sbom=false \
              --build-context "qikvrt-frozen-carrier=oci-layout://$RUNNER_TEMP/frozen-carrier@sha256:b2c5d065f9e9253d9f9eb454a86614e94592e6a8a251b8c9b44f26295ffb59b9" \
              --build-arg QIKVRT_PRODUCTION_IMAGE=qikvrt-frozen-carrier \
              --build-arg QIKVRT_TERMINAL_PROFILE=temdd \
              --build-arg "SOURCE_DATE_EPOCH=$epoch" \
              --build-arg "QIKVRT_SOURCE_HEAD=$head" --build-arg "QIKVRT_SOURCE_TREE=$tree" \
              --tag "qikvrt-s1:sha-$head" \
              --output "type=oci,dest=$RUNNER_TEMP/container-evidence/s1-$build.oci.tar,compression=gzip,compression-level=9,rewrite-timestamp=true" \
              "$RUNNER_TEMP/s1-context"
          done
          python3 -B tools/qikvrt_self_host.py container-oci-check \
            --oci-archive "$RUNNER_TEMP/container-evidence/s1-1.oci.tar" \
            --second-oci-archive "$RUNNER_TEMP/container-evidence/s1-2.oci.tar" \
            --expected-head "$head" --expected-tree "$tree" \
            --receipt "$RUNNER_TEMP/container-evidence/oci.json"
          mv "$RUNNER_TEMP/container-evidence/s1-1.oci.tar" "$RUNNER_TEMP/container-evidence/image.oci.tar"
          rm "$RUNNER_TEMP/container-evidence/s1-2.oci.tar"
      - name: Real unprivileged native terminal container and durable restart
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          loader="${{ steps.tool-loader.outputs.image }}"
          load_dir="$(mktemp -d "$RUNNER_TEMP/qikvrt-smoke-load.XXXXXX")"
          trap 'rm -rf "$load_dir"' EXIT
          docker run --rm --pull=never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true "$loader" --version \
            | tee "$RUNNER_TEMP/container-evidence/skopeo-version.txt"
          docker run --rm --pull=never --read-only --network none --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /tmp:rw,nosuid,size=128m,mode=1777 --tmpfs /var/tmp:rw,nosuid,size=2g,mode=1777 \
            --mount "type=bind,source=$RUNNER_TEMP/container-evidence/image.oci.tar,target=/input.oci.tar,readonly" \
            --mount "type=bind,source=$load_dir,target=/output" \
            "$loader" copy --format v2s2 oci-archive:/input.oci.tar \
            "docker-archive:/output/image.docker.tar:qikvrt-s1:sha-$head"
          docker load --input "$load_dir/image.docker.tar"
          python3 -B - <<'PYLOAD'
          import hashlib,json,os,subprocess
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'container-evidence'
          o=json.loads((p/'oci.json').read_bytes())
          assert o['independent_rebuild_digest_equal'] is True, 'independent OCI build gate required'
          digest=hashlib.sha256()
          with (p/'image.oci.tar').open('rb') as archive:
              for block in iter(lambda:archive.read(8*1024*1024),b''):
                  digest.update(block)
          assert digest.hexdigest()==o['oci_archive_sha256'], 'original OCI archive changed before load'
          image='qikvrt-s1:sha-'+o['source_head']
          loaded=json.loads(subprocess.check_output(['docker','image','inspect',image],text=True))[0]
          assert loaded['Id']==o['image_config_digest'], 'Docker import changed image configuration'
          assert loaded['RootFS']['Layers']==o['diff_ids'], 'Docker import changed ordered filesystem layers'
          labels=loaded['Config']['Labels']
          assert (labels['org.opencontainers.image.revision'],labels['de.qikvrt.source-tree'])==(o['source_head'],o['source_tree']), 'Docker import changed source binding'
          r={'state':'DOCKER_LOAD_EXACT_OCI_RUNTIME_VERIFIED','source_head':o['source_head'],
             'source_tree':o['source_tree'],'original_oci_image_digest':o['image_digest'],
             'docker_image_id':loaded['Id'],'ordered_diff_ids_verified':True,
             'effect_ack_done':False,'public_production_verified':False}
          (p/'load.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          print(json.dumps(r,sort_keys=True))
          PYLOAD
          python3 -B tools/qikvrt_self_host.py container-smoke \
            --image "qikvrt-s1:sha-$(git rev-parse HEAD)" --terminal-profile temdd \
            --output "$RUNNER_TEMP/container-evidence" \
            --receipt "$RUNNER_TEMP/container-evidence/smoke.json"
      - name: Bind exact image/package and CI execution identities
        id: receipt
        env:
          EVIDENCE: ${{ runner.temp }}/container-evidence
        run: |
          python3 -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=Path(os.environ['EVIDENCE'])
          o=json.loads((p/'oci.json').read_bytes()); s=json.loads((p/'smoke.json').read_bytes())
          assert (o['source_head'],o['source_tree']) == (s['source_head'],s['source_tree'])
          assert o['independent_rebuild_digest_equal'] is True
          assert s['state'] == 'CONTAINER_SMOKE_AND_RESTART_VERIFIED'
          profile=s['terminal_profile']
          assert profile in {'temdd','firefox'}
          assert type(s['firefox_acceptance_in_scope']) is bool
          assert s['firefox_acceptance_in_scope'] == (profile == 'firefox')
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == o['source_head']
          assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=no'])
          r={'repository':os.environ['GITHUB_REPOSITORY'],'run_id':os.environ['GITHUB_RUN_ID'],
             'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'source_head':o['source_head'],
             'source_tree':o['source_tree'],'image_digest':o['image_digest'],
             'manifest_sha256':s['manifest_sha256'],'container_production_verified':True,
             'terminal_profile':profile,'firefox_acceptance_in_scope':s['firefox_acceptance_in_scope'],
             'registry_publication_verified':False,'public_production_verified':False,'effect_ack_done':False}
          (p/'ci.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for k,v in [('head',o['source_head']),('tree',o['source_tree']),('digest',o['image_digest']),('manifest',s['manifest_sha256']),('terminal_profile',profile)]:
                  out.write(k+'='+v+'\n')
          print(json.dumps(r,sort_keys=True))
          PY
      - name: Preserve first original failed OCI build separately
        if: ${{ always() && steps.independent-builds.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-s1-rebuild-1-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/container-evidence/s1-1.oci.tar
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve second original failed OCI build separately
        if: ${{ always() && steps.independent-builds.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-s1-rebuild-2-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/container-evidence/s1-2.oci.tar
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve exact OCI image and non-secret original evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-s1-container-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/container-evidence
            !${{ runner.temp }}/container-evidence/s1-*.oci.tar
          if-no-files-found: error
          retention-days: 30

  container_publish:
    name: Reviewed versioned OCI publication
    needs: [test, container]
    if: github.ref == 'refs/heads/main' && vars.QIKVRT_CONTAINER_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: qikvrt-production
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
    concurrency:
      group: qikvrt-s1-publication-${{ github.repository }}-${{ needs.container.outputs.head }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.container.outputs.head }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reobserve protected Main, native required checks and independent review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B tools/qikvrt_self_host.py container-production-gate \
            --expected-head "$(git rev-parse HEAD)" --receipt "$RUNNER_TEMP/production-admission.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: qikvrt-s1-container-${{ needs.container.outputs.head }}
          path: ${{ runner.temp }}/container-evidence
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
      - name: Publish immutable application and original ZIP; independently read back both
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_DIGEST: ${{ needs.container.outputs.digest }}
          DOCKER_CONFIG: ${{ runner.temp }}/registry-auth
        run: |
          set -euo pipefail
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          head="$(git rev-parse HEAD)"
          image="ghcr.io/ingolf-lohmann/qik-vrt-s1"
          python3 -B tools/qikvrt_self_host.py container-oci-check \
            --oci-archive "$RUNNER_TEMP/container-evidence/image.oci.tar" \
            --expected-head "$head" --expected-tree "$(git rev-parse HEAD^{tree})" \
            --receipt "$RUNNER_TEMP/publish-oci-check.json"
          python3 -B tools/qikvrt_self_host.py container-tool-prepare \
            --output "$RUNNER_TEMP/skopeo-publisher" --receipt "$RUNNER_TEMP/skopeo-publisher/receipt.json"
          publisher="$(python3 -B -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"skopeo-publisher/receipt.json").read_bytes())["tool_image_id"])')"
          docker run --rm --pull=never --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true "$publisher" --version > "$RUNNER_TEMP/publisher-version.txt"
          for tag in "sha-$head" "s1-1.12.0-$head"; do
            if docker buildx imagetools inspect "$image:$tag" --raw > "$RUNNER_TEMP/registry.json" 2> "$RUNNER_TEMP/registry-error"; then
              : # An existing immutable version is verified below, never overwritten.
            else
              python3 -c 'import pathlib,re,os; assert re.search("not found|manifest unknown",pathlib.Path(os.environ["RUNNER_TEMP"]+"/registry-error").read_text(),re.I), "registry transport/authentication unavailable"'
              docker run --rm --pull=never --read-only --cap-drop ALL --security-opt no-new-privileges:true \
                --user "$(id -u):$(id -g)" --env HOME=/tmp \
                --tmpfs /tmp:rw,nosuid,size=128m,mode=1777 --tmpfs /var/tmp:rw,nosuid,size=2g,mode=1777 \
                --mount "type=bind,source=$DOCKER_CONFIG,target=/auth,readonly" \
                --mount "type=bind,source=$RUNNER_TEMP/container-evidence/image.oci.tar,target=/image.oci.tar,readonly" \
                "$publisher" copy --preserve-digests --dest-authfile /auth/config.json \
                oci-archive:/image.oci.tar "docker://$image:$tag"
              docker buildx imagetools inspect "$image:$tag" --raw > "$RUNNER_TEMP/registry.json"
            fi
            python3 -B - <<'PYREGISTRY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'registry.json';raw=p.read_bytes()
          expected=os.environ['EXPECTED_DIGEST']
          if 'sha256:'+hashlib.sha256(raw).hexdigest()!=expected:
              raw=raw.removesuffix(b'\n')
          assert 'sha256:'+hashlib.sha256(raw).hexdigest()==expected, 'immutable tested registry digest differs'
          p.write_bytes(raw)
          PYREGISTRY
          done
          # Reuse this same admitted publisher/package and token scope. The
          # original ZIP lives unchanged inside one deterministic OCI layer.
          # This publication does not activate a durable CI download source.
          python3 -B tools/qikvrt_self_host.py container-carrier-archive-check --root . \
            --oci-archive "$RUNNER_TEMP/container-evidence/carrier-original.oci.tar" \
            --receipt "$RUNNER_TEMP/carrier-publish-check.json"
          carrier_digest="$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/carrier-publish-check.json"))["image_digest"])')"
          carrier_tag="$(python3 -c 'import json; print("carrier-original-"+json.load(open("runtime/self-host/CONTAINER_CARRIER.json"))["archive_sha256"])')"
          if docker buildx imagetools inspect "$image:$carrier_tag" --raw > "$RUNNER_TEMP/carrier-registry.json" 2> "$RUNNER_TEMP/carrier-registry-error"; then
            : # Verify an existing version; never replace it.
          else
            python3 -c 'import pathlib,re,os; assert re.search("not found|manifest unknown",pathlib.Path(os.environ["RUNNER_TEMP"]+"/carrier-registry-error").read_text(),re.I), "registry transport/authentication unavailable"'
            docker run --rm --pull=never --read-only --cap-drop ALL --security-opt no-new-privileges:true \
              --user "$(id -u):$(id -g)" --env HOME=/tmp \
              --tmpfs /tmp:rw,nosuid,size=128m,mode=1777 --tmpfs /var/tmp:rw,nosuid,size=2g,mode=1777 \
              --mount "type=bind,source=$DOCKER_CONFIG,target=/auth,readonly" \
              --mount "type=bind,source=$RUNNER_TEMP/container-evidence/carrier-original.oci.tar,target=/carrier.oci.tar,readonly" \
              "$publisher" copy --preserve-digests --dest-authfile /auth/config.json \
              oci-archive:/carrier.oci.tar "docker://$image:$carrier_tag"
            docker buildx imagetools inspect "$image:$carrier_tag" --raw > "$RUNNER_TEMP/carrier-registry.json"
          fi
          CARRIER_DIGEST="$carrier_digest" python3 -B - <<'PYCARRIERDIGEST'
          import hashlib,os
          from pathlib import Path
          raw=(Path(os.environ['RUNNER_TEMP'])/'carrier-registry.json').read_bytes()
          if 'sha256:'+hashlib.sha256(raw).hexdigest()!=os.environ['CARRIER_DIGEST']:
              raw=raw.removesuffix(b'\n')
          assert 'sha256:'+hashlib.sha256(raw).hexdigest()==os.environ['CARRIER_DIGEST'], 'immutable original archive registry digest differs'
          PYCARRIERDIGEST
          mkdir "$RUNNER_TEMP/carrier-registry-readback"
          docker run --rm --pull=never --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --user "$(id -u):$(id -g)" --env HOME=/tmp \
            --tmpfs /tmp:rw,nosuid,size=128m,mode=1777 --tmpfs /var/tmp:rw,nosuid,size=2g,mode=1777 \
            --mount "type=bind,source=$DOCKER_CONFIG,target=/auth,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/carrier-registry-readback,target=/readback" \
            "$publisher" copy --preserve-digests --src-authfile /auth/config.json \
            "docker://$image@$carrier_digest" oci-archive:/readback/carrier.oci.tar
          python3 -B tools/qikvrt_self_host.py container-carrier-archive-check --root . \
            --oci-archive "$RUNNER_TEMP/carrier-registry-readback/carrier.oci.tar" \
            --receipt "$RUNNER_TEMP/carrier-registry-readback.json"
          printf 'carrier_archive_image=%s@%s\n' "$image" "$carrier_digest" >> "$GITHUB_OUTPUT"
          printf 'image=%s@%s\n' "$image" "$EXPECTED_DIGEST" >> "$GITHUB_OUTPUT"
          cp "$RUNNER_TEMP/production-admission.json" "$RUNNER_TEMP/container-evidence/production-admission.json"
          cp "$RUNNER_TEMP/registry.json" "$RUNNER_TEMP/container-evidence/published-manifest.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-s1-publication-${{ needs.container.outputs.head }}
          path: |
            ${{ runner.temp }}/production-admission.json
            ${{ runner.temp }}/registry.json
            ${{ runner.temp }}/carrier-publish-check.json
            ${{ runner.temp }}/carrier-registry.json
            ${{ runner.temp }}/carrier-registry-readback.json
          if-no-files-found: error
          retention-days: 30

  container_deploy:
    name: Original Linux host identity and admitted deployment via mutual TLS REST
    needs: [container, container_publish]
    # Read-only identity must remain observable when registry publication is
    # skipped. The existing publication/deployment guards still gate all writes.
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.container.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: qikvrt-production
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: read
    concurrency:
      group: qikvrt-s1-owner-node-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.host.outputs.deployed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.container.outputs.head }}
          fetch-depth: 1
          persist-credentials: false
      - name: Read original host identity before any admitted deployment or recovery
        id: host
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QIKVRT_HOST_BINDING: ${{ vars.QIKVRT_LINUX_HOST_BINDING_JSON }}
          QIKVRT_HOST_BINDING_SHA256: ${{ vars.QIKVRT_LINUX_HOST_BINDING_SHA256 }}
          QIKVRT_HOST_CA: ${{ secrets.QIKVRT_LINUX_HOST_CA }}
          QIKVRT_HOST_CERT: ${{ secrets.QIKVRT_LINUX_HOST_CERT }}
          QIKVRT_HOST_KEY: ${{ secrets.QIKVRT_LINUX_HOST_KEY }}
          EXPECTED_HEAD: ${{ needs.container.outputs.head }}
          EXPECTED_TREE: ${{ needs.container.outputs.tree }}
          EXPECTED_IMAGE: ghcr.io/ingolf-lohmann/qik-vrt-s1@${{ needs.container.outputs.digest }}
          EXPECTED_MANIFEST: ${{ needs.container.outputs.manifest }}
          PUBLISHED_IMAGE: ${{ needs.container_publish.outputs.image }}
          PUBLISH_RESULT: ${{ needs.container_publish.result }}
          DEPLOY_ENABLED: ${{ vars.QIKVRT_CONTAINER_DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          private="$RUNNER_TEMP/qikvrt-host-auth"
          trap 'rm -rf "$private"' EXIT
          python3 -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'qikvrt-host-auth'; p.mkdir(mode=0o700)
          fields={'binding.json':'QIKVRT_HOST_BINDING','ca.pem':'QIKVRT_HOST_CA','cert.pem':'QIKVRT_HOST_CERT','key.pem':'QIKVRT_HOST_KEY'}
          present={key:bool(os.environ.get(key,'')) for key in (*fields.values(),'QIKVRT_HOST_BINDING_SHA256')}
          delivery={'schema':'qikvrt-protected-host-input-delivery/v1','repository':'ingolf-lohmann/qik-vrt',
              'environment':'qikvrt-production','scope':'JOB_INPUT_PRESENCE_ONLY',
              'source_head':os.environ['EXPECTED_HEAD'],'source_tree':os.environ['EXPECTED_TREE'],
              'bindings':present,'state':'PROTECTED_INPUTS_PRESENT' if all(present.values()) else 'HOLD_PROTECTED_INPUT_DELIVERY',
              'job_credential_delivery_verified':False,'host_identity_verified':False,'effect_ack_done':False}
          (Path(os.environ['RUNNER_TEMP'])/'host-material-delivery.json').write_text(json.dumps(delivery,sort_keys=True)+'\n')
          assert all(present.values()), 'protected host binding/credential unavailable'
          for name,key in fields.items():
              value=os.environ[key]
              file=p/name;file.write_text(value);file.chmod(0o600)
          b=json.loads((p/'binding.json').read_bytes())
          assert hashlib.sha256((p/'binding.json').read_bytes()).hexdigest()==os.environ['QIKVRT_HOST_BINDING_SHA256']
          assert (b['source_head'],b['source_tree'])==(os.environ['EXPECTED_HEAD'],os.environ['EXPECTED_TREE'])
          assert b['manifest_sha256']==os.environ['EXPECTED_MANIFEST']
          assert b['image_digest']==os.environ['EXPECTED_IMAGE'].split('@')[1]
          PY
          export IDENTITY_NOT_BEFORE="$(python3 -c 'import datetime; print(datetime.datetime.now(datetime.timezone.utc).isoformat())')"
          python3 -B tools/qikvrt_self_host.py container-host-identity \
            --production-binding "$private/binding.json" --binding-sha256 "$QIKVRT_HOST_BINDING_SHA256" \
            --ca-file "$private/ca.pem" --cert-file "$private/cert.pem" --key-file "$private/key.pem" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$EXPECTED_TREE" \
            --manifest-sha256 "$EXPECTED_MANIFEST" --image "$EXPECTED_IMAGE" \
            --receipt "$RUNNER_TEMP/host-identity.json"
          python3 -B - <<'PYHOSTREADBACK'
          import datetime as dt,hashlib,json,os,re
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'host-identity.json').read_bytes())
          expected={'schema':'qikvrt-s1-container-receipt/v1',
              'state':'AUTHENTICATED_LINUX_HOST_IDENTITY_VERIFIED','scope':'HOST_IDENTITY_ONLY',
              'os_type':'linux','source_head':os.environ['EXPECTED_HEAD'],'source_tree':os.environ['EXPECTED_TREE'],
              'image_digest':os.environ['EXPECTED_IMAGE'].split('@')[1],
              'manifest_sha256':os.environ['EXPECTED_MANIFEST'],'binding_sha256':os.environ['QIKVRT_HOST_BINDING_SHA256'],
              'checker_sha256':hashlib.sha256(Path('tools/qikvrt_self_host_container.py').read_bytes()).hexdigest()}
          assert all(r.get(k)==v for k,v in expected.items()), 'host identity receipt pin mismatch'
          assert r.get('host_identity_verified') is True
          assert all(r.get(k) is False for k in ('host_package_verified','public_production_verified','effect_ack_done','ordinary_release'))
          assert re.fullmatch('[a-f0-9]{64}',r.get('daemon_info_sha256',''))
          observed=dt.datetime.fromisoformat(r['observed_at'])
          start=dt.datetime.fromisoformat(os.environ['IDENTITY_NOT_BEFORE'])
          now=dt.datetime.now(dt.timezone.utc)
          assert observed.utcoffset() is not None and start <= observed <= now
          assert (now-observed).total_seconds() <= 300, 'stale host identity receipt'
          PYHOSTREADBACK
          if test "$DEPLOY_ENABLED" = 'true' && test "$PUBLISH_RESULT" = 'success'; then
            test "$PUBLISHED_IMAGE" = "$EXPECTED_IMAGE"
            python3 -B tools/qikvrt_self_host.py container-deploy \
              --production-binding "$private/binding.json" --binding-sha256 "$QIKVRT_HOST_BINDING_SHA256" \
              --ca-file "$private/ca.pem" --cert-file "$private/cert.pem" --key-file "$private/key.pem" \
              --image "$EXPECTED_IMAGE" --receipt "$RUNNER_TEMP/host-start.json"
            printf 'deployed=true\n' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: qikvrt-s1-host-start-${{ needs.container.outputs.head }}
          path: |
            ${{ runner.temp }}/host-material-delivery.json
            ${{ runner.temp }}/host-identity.json
            ${{ runner.temp }}/host-start.json
          if-no-files-found: error
          retention-days: 30

  container_public_readback:
    name: Independent exact-domain TLS and terminal acceptance
    needs: [container, container_deploy]
    if: needs.container_deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.container.outputs.head }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qikvrt-s1-container-${{ needs.container.outputs.head }}
          path: ${{ runner.temp }}/container-evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: qikvrt-s1-host-start-${{ needs.container.outputs.head }}
          path: ${{ runner.temp }}/host-evidence
      - name: Verify HTTPS, fresh runtime/package pins and original terminal use
        run: |
          python3 -B tools/qikvrt_self_host.py container-readback \
            --root "$RUNNER_TEMP/container-evidence/public-package" \
            --production-binding "$RUNNER_TEMP/host-evidence/host-start.json" \
            --receipt "$RUNNER_TEMP/public-delivery.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: qikvrt-raumzeitterminal-delivery-${{ needs.container.outputs.head }}
          path: ${{ runner.temp }}/public-delivery.json
          if-no-files-found: error
          retention-days: 30

