name: QIKVRT CI

on:
  push:
    branches-ignore:
      - automation/effect-ack-universality-reserve-20260722
      - automation/effect-ack-universality-finalize-20260722
  pull_request:
  workflow_dispatch:
    inputs:
      amo_sign_unlisted:
        description: 'Explicit official Mozilla unlisted signing of the exact PR523 Standard source'
        type: boolean
        default: false
      amo_expected_head:
        description: 'Reviewed PR523 commit SHA; required for a signing effect'
        type: string
        default: ''
      amo_expected_tree:
        description: 'Reviewed PR523 root tree SHA; required for a signing effect'
        type: string
        default: ''
      amo_previous_run_id:
        description: 'Previous native signing run for journal recovery; zero only for the initial invocation'
        type: string
        default: '0'
      amo_executor_run_id:
        description: 'Original protected Main executor run; zero retains the direct Owner path'
        type: string
        default: '0'
      amo_intent_sha256:
        description: 'Digest of the original pre-published protected Main intent'
        type: string
        default: ''
      amo_readback_only:
        description: 'Only read the existing official version; never submit an upload'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    outputs:
      tested_head: ${{ steps.tested_subject.outputs.head }}
      tested_tree: ${{ steps.tested_subject.outputs.tree }}
    runs-on: ubuntu-latest
    # The admitted PR writer runs one initial suite, then two complete suites
    # per iteration (0..MAX_SUCCESSORS=4): at most 11 suites. Native PR38625640158
    # needed 17m50s already at iteration 0 and was cancelled by the old 15m limit.
    # Budget 90m for the bounded writer (~65m at measured suite times, plus margin).
    # Non-writer paths retain 15m; all tests and terminal enforcement stay intact.
    timeout-minutes: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 90 || 15 }}
    steps:
      - name: Set up standalone Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Set up standalone Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Full compile, launcher, protocol, handler, security and TCP/IP tests
        id: full_test
        continue-on-error: true
        shell: bash
        run: |
          set +e
          initial_head="$(git rev-parse --verify HEAD^{commit})"
          initial_tree="$(git rev-parse --verify HEAD^{tree})"
          diagnostics=.qikvrt/runtime/ci-diagnostics
          mkdir -p "$diagnostics"
          make test repository-monitor-test self-host-test > "$diagnostics/MAKE_TEST_FULL.log" 2>&1
          status=$?
          {
            printf 'MAKE_TEST_EXIT=%s\n' "$status"
            printf '%s\n' '--- LAST 500 LINES ---'
            tail -n 500 "$diagnostics/MAKE_TEST_FULL.log"
            printf '%s\n' '--- WORKTREE STATUS ---'
            git status --short --untracked-files=all
            printf '%s\n' '--- INTEGRITY MANIFEST DELTA ---'
            python3 -B - <<'PY'
          import json
          from pathlib import Path
          from tools import qikvrt_integrity as integrity

          stored = json.loads(Path(integrity.MANIFEST_NAME).read_text(encoding='utf-8'))
          _manifest, _index, _detached, expected = integrity.build_outputs()
          old = {entry['path']: entry for entry in stored['files']}
          new = {entry['path']: entry for entry in expected['files']}
          print('added=' + json.dumps(sorted(new.keys() - old.keys())))
          print('removed=' + json.dumps(sorted(old.keys() - new.keys())))
          changed = sorted(
              path for path in old.keys() & new.keys()
              if old[path] != new[path]
          )
          print('changed=' + json.dumps(changed))
          for path in changed[:50]:
              before = old[path]
              after = new[path]
              print(json.dumps({'path': path, 'stored': before, 'expected': after}, sort_keys=True))
          PY
          } > "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" 2>&1
          mkdir -p audit/ci-diagnostics
          cp "$diagnostics/MAKE_TEST_DIAGNOSTICS.log" \
            audit/ci-diagnostics/MAKE_TEST_DIAGNOSTICS.log
          cat "$diagnostics/MAKE_TEST_DIAGNOSTICS.log"
          if test "$status" -eq 0 && test "$(git rev-parse --verify HEAD^{commit})" = "$initial_head" &&
             test "$(git rev-parse --verify HEAD^{tree})" = "$initial_tree" && git diff --quiet HEAD -- &&
             test -z "$(git ls-files --others --exclude-standard)"; then
            printf 'head=%s\ntree=%s\n' "$initial_head" "$initial_tree" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-ci-audit
          retention-days: 30
          path: |
            audit/**
            .qikvrt/**
          if-no-files-found: warn
          include-hidden-files: true
      - name: Same-writer successor re-entry to tested fixpoint
        id: fixpoint
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          TARGET_REF: ${{ github.head_ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          MAX_SUCCESSORS: "4"
          INITIAL_FULL_TEST_OUTCOME: ${{ steps.full_test.outcome }}
          INITIAL_TESTED_HEAD: ${{ steps.full_test.outputs.head }}
          INITIAL_TESTED_TREE: ${{ steps.full_test.outputs.tree }}
        shell: bash
        run: |
          set -euo pipefail

          subject="$(git rev-parse --verify HEAD^{commit})"
          test "$subject" = "$EXPECTED_HEAD"

          # Reuse only the successful complete gate for this exact unchanged
          # subject. Missing proof, integrity drift or a changed ref retains
          # the original bounded repair/re-execution path below.
          tree="$(git rev-parse --verify HEAD^{tree})"
          if test "${INITIAL_FULL_TEST_OUTCOME:-}" = success &&
             test "${INITIAL_TESTED_HEAD:-}" = "$subject" &&
             test "${INITIAL_TESTED_TREE:-}" = "$tree" &&
             test "$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')" = "$subject" &&
             git diff --quiet HEAD -- && test -z "$(git ls-files --others --exclude-standard)" &&
             python3 -B tools/qikvrt_integrity.py verify; then
            echo "QIKVRT_FIXPOINT_REACHED iteration=0 head=$subject tree=$tree scope=INITIAL_EXACT_COMPLETE_GATE_REUSED"
            exit 0
          fi

          for iteration in $(seq 0 "$MAX_SUCCESSORS"); do
            subject="$(git rev-parse --verify HEAD^{commit})"
            tree="$(git rev-parse --verify HEAD^{tree})"
            remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
            test "$remote" = "$subject"
            echo "QIKVRT_REENTRY_SUBJECT iteration=$iteration head=$subject tree=$tree"

            # Test the exact active subject. Integrity staleness is the only
            # expected pre-materialization failure and is repaired below.
            set +e
            make test repository-monitor-test self-host-test > ".qikvrt-fixpoint-test-$iteration.log" 2>&1
            test_status=$?
            set -e

            # Learn from the predecessor: only the recognized deterministic
            # manifest-drift signature admits this automatic repair.
            if test "$test_status" -ne 0 &&
               ! grep -Fq "BLOCK repository manifest differs from deterministic regeneration" ".qikvrt-fixpoint-test-$iteration.log"; then
              echo "BLOCK_UNCLASSIFIED_FAILURE iteration=$iteration; no automatic mutation" >&2
              tail -n 80 ".qikvrt-fixpoint-test-$iteration.log" >&2
              exit 2
            fi
            python3 tools/qikvrt_integrity.py generate
            python3 tools/qikvrt_integrity.py verify
            # A manifest repair may change only these canonical outputs.
            unexpected="$(git diff --name-only | grep -Ev '^(REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt) against the regenerated state. Any
            # remaining failure is a real successor failure, not predecessor
            # evidence and must stop the writer fail-closed.
            make test repository-monitor-test self-host-test
            python3 tools/qikvrt_integrity.py verify

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt

            if git diff --cached --quiet; then
              echo "QIKVRT_FIXPOINT_REACHED iteration=$iteration head=$subject tree=$tree predecessor_test_status=$test_status"
              exit 0
            fi

            test "$iteration" -lt "$MAX_SUCCESSORS"
            remote_pre_push="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
            test "$remote_pre_push" = "$subject"

            git commit -m "ci: materialize exact-subject repository integrity"
            successor="$(git rev-parse --verify HEAD^{commit})"
            successor_tree="$(git rev-parse --verify HEAD^{tree})"
            git push origin "HEAD:$TARGET_REF"

            remote_after="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
            test "$remote_after" = "$successor"
            git fetch --no-tags origin "$TARGET_REF"
            readback_head="$(git rev-parse --verify FETCH_HEAD^{commit})"
            readback_tree="$(git rev-parse --verify FETCH_HEAD^{tree})"
            test "$readback_head" = "$successor"
            test "$readback_tree" = "$successor_tree"

            echo "QIKVRT_SUCCESSOR_REENTRY iteration=$iteration predecessor=$subject successor=$successor successor_tree=$successor_tree readback_head=$readback_head readback_tree=$readback_tree"

            # The freshly read-back successor is now the next exact subject in
            # this same admitted writer; no nested workflow admission is used.
            git reset --hard "$readback_head"
          done

          echo "BLOCK successor fixpoint not reached within $MAX_SUCCESSORS mutations" >&2
          exit 2

      - name: Enforce terminal tested-fixpoint disposition
        if: always()
        env:
          FIXPOINT_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          FULL_TEST_OUTCOME: ${{ steps.full_test.outcome }}
          FIXPOINT_OUTCOME: ${{ steps.fixpoint.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          case "$FIXPOINT_REQUIRED" in
            true)
              # A same-repository PR writer may repair the predecessor. Only
              # its fully re-tested successor can establish the terminal result.
              test "$FIXPOINT_OUTCOME" = "success"
              mode=tested-fixpoint
              ;;
            false)
              # Push, manual and fork-PR runs do not admit the writer. Their
              # literal checkout must pass; continue-on-error cannot mask it.
              test "$FIXPOINT_OUTCOME" = "skipped"
              test "$FULL_TEST_OUTCOME" = "success"
              mode=full-test
              ;;
            *)
              echo "BLOCK: unknown fixpoint admission" >&2
              exit 1
              ;;
          esac
          echo "QIKVRT_TERMINAL_DISPOSITION PASS mode=$mode"

      - name: Bind the committed subject actually accepted by the complete test gate
        id: tested_subject
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FIXPOINT_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          TARGET_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          git diff --quiet HEAD --
          if test "$FIXPOINT_REQUIRED" = true; then
            git merge-base --is-ancestor "$EXPECTED_HEAD" "$subject"
            # Only the existing integrity writer may advance the tested subject.
            changed="$(git diff --name-only "$EXPECTED_HEAD" "$subject" -- . \
              ':!REPOSITORY_FILE_MANIFEST.json' ':!REPOSITORY_FILE_MANIFEST.json.sha256' ':!SHA256SUMS.txt')"
            test -z "$changed"
            remote="$(git ls-remote --heads origin "refs/heads/$TARGET_REF" | awk 'NR == 1 { print $1 }')"
            test "$remote" = "$subject"
          else
            test "$FIXPOINT_REQUIRED" = false
            test "$subject" = "$EXPECTED_HEAD"
          fi
          printf 'head=%s\ntree=%s\n' "$subject" "$tree" >> "$GITHUB_OUTPUT"
          echo "QIKVRT_TESTED_SUBJECT head=$subject tree=$tree"
          mkdir -p .qikvrt/ci-tested-subject
          python3 - "$subject" "$tree" <<'PY'
          import json, os, pathlib, sys
          value = {"schema": "qikvrt-ci-tested-subject/v1", "repository": os.environ["GITHUB_REPOSITORY"],
                   "run_id": int(os.environ["GITHUB_RUN_ID"]), "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                   "head_sha": sys.argv[1], "tree_sha": sys.argv[2]}
          pathlib.Path(".qikvrt/ci-tested-subject/TESTED_SUBJECT.json").write_text(json.dumps(value, sort_keys=True) + "\n")
          PY

      - name: Preserve the exact terminal tested subject independently
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-ci-tested-subject-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qikvrt/ci-tested-subject/TESTED_SUBJECT.json
          if-no-files-found: error
          retention-days: 90

  offline_browser:
    needs: test
    # Reuse the frozen native offline suite for the derived Site32 client.
    # This gate has no dependence on Zenodo, a deployment or a native executor.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      QIKVRT_OFFLINE_CLIENT_DIR: ${{ github.workspace }}/docs/monitor/offline
      QIKVRT_PLAYWRIGHT_MODULE: ${{ github.workspace }}/runtime/offline/browser-tests/node_modules/playwright
      QIKVRT_OFFLINE_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.test.outputs.tested_head }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: runtime/offline/browser-tests/package-lock.json
      - name: Verify exact source, tool cache and package-bound browser lock
        env:
          QIKVRT_OFFLINE_EVIDENCE_DIR: ${{ runner.temp }}/offline-${{ matrix.engine }}
          EXPECTED_HEAD: ${{ needs.test.outputs.tested_head }}
          EXPECTED_TREE: ${{ needs.test.outputs.tested_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          test "$(git rev-parse --verify HEAD^{tree})" = "$EXPECTED_TREE"
          mkdir -p "$QIKVRT_OFFLINE_EVIDENCE_DIR"
          git rev-parse HEAD HEAD^{tree} > "$QIKVRT_OFFLINE_EVIDENCE_DIR/SUBJECT.txt"
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B tools/qikvrt_integrity.py verify
          npm ci --ignore-scripts --prefix runtime/offline/browser-tests
          node runtime/offline/browser-tests/browser.test.mjs --precheck
      # Keep Chromium's proven path unchanged. Diagnose the failing WebKit leg.
      - name: Install exact package-bound browser (Chromium)
        if: matrix.engine == 'chromium'
        run: runtime/offline/browser-tests/node_modules/.bin/playwright install --with-deps chromium
      # Reuse already downloaded WebKit system packages and the package-bound
      # browser binary. APT still verifies every reused .deb against the signed
      # index; a miss or stale archive falls back to the unchanged download path.
      - name: Bind WebKit package and browser caches
        id: webkit_cache_binding
        if: matrix.engine == 'webkit'
        shell: bash
        run: |
          set -euo pipefail
          : "${ImageOS:?RUNNER_IMAGE_OS_REQUIRED}"
          : "${ImageVersion:?RUNNER_IMAGE_VERSION_REQUIRED}"
          archives="/var/cache/qikvrt-webkit-apt/archives"
          sudo install -d -m 0755 /var/cache/qikvrt-webkit-apt
          sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 0755 "$archives"
          node runtime/offline/browser-tests/webkit-apt-cache.mjs config "$archives" \
            | sudo tee /etc/apt/apt.conf.d/99qikvrt-webkit-archive-cache >/dev/null
          # Retain APT's default unprivileged download user. Fail here if the
          # runner's directory permissions cannot support it; never use root.
          if [ "$(apt-config shell sandbox_user APT::Sandbox::User)" != "sandbox_user='_apt'" ]; then
            echo '::error::WEBKIT_APT_SANDBOX_USER_MISMATCH'
            exit 1
          fi
          sudo install -d -o _apt -g root -m 0700 "$archives/partial"
          sudo -u _apt test -w "$archives/partial"
          printf 'image=%s-%s\n' "$ImageOS" "$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Restore WebKit system package cache
        id: webkit_apt_cache
        if: matrix.engine == 'webkit'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/qikvrt-webkit-apt/archives/*.deb
          key: qikvrt-webkit-apt-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.webkit_cache_binding.outputs.image }}-${{ hashFiles('runtime/offline/browser-tests/package-lock.json') }}
          restore-keys: |
            qikvrt-webkit-apt-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.webkit_cache_binding.outputs.image }}-
      - name: Restore WebKit browser binary cache
        id: webkit_browser_cache
        if: matrix.engine == 'webkit'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright/webkit-*
          key: qikvrt-webkit-browser-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.webkit_cache_binding.outputs.image }}-${{ hashFiles('runtime/offline/browser-tests/package-lock.json') }}
      - name: Install WebKit system dependencies (bounded diagnosis)
        id: webkit_system_deps
        if: matrix.engine == 'webkit'
        shell: bash
        env:
          QIKVRT_OFFLINE_EVIDENCE_DIR: ${{ runner.temp }}/offline-${{ matrix.engine }}
          APT_CACHE_HIT: ${{ steps.webkit_apt_cache.outputs.cache-hit }}
          APT_CACHE_MATCHED_KEY: ${{ steps.webkit_apt_cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          mkdir -p "$QIKVRT_OFFLINE_EVIDENCE_DIR"
          receipt="$QIKVRT_OFFLINE_EVIDENCE_DIR/INSTALL_PHASE_SYSTEM_DEPS.txt"
          archives="/var/cache/qikvrt-webkit-apt/archives"
          started_epoch="$(date -u +%s)"
          printf 'phase=system-deps\nsource_head=%s\nstarted_utc=%s\ntimeout_seconds=720\n' \
            "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$receipt"
          printf 'apt_cache_exact_hit=%s\napt_cache_restored=%s\n' \
            "${APT_CACHE_HIT:-false}" "$([ -n "${APT_CACHE_MATCHED_KEY:-}" ] && echo true || echo false)" >> "$receipt"
          node runtime/offline/browser-tests/webkit-apt-cache.mjs summary "$archives" \
            "$QIKVRT_OFFLINE_EVIDENCE_DIR/APT_CACHE_BEFORE.json" | sed 's/^/before_/' >> "$receipt"
          apt_log="$RUNNER_TEMP/webkit-install-deps.log"
          set +e
          timeout --signal=TERM --kill-after=30s 12m runtime/offline/browser-tests/node_modules/.bin/playwright install-deps webkit 2>&1 | tee "$apt_log"
          status="${PIPESTATUS[0]}"
          set -e
          printf 'ended_utc=%s\nduration_seconds=%s\nexit_status=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(( $(date -u +%s) - started_epoch ))" "$status" >> "$receipt"
          node runtime/offline/browser-tests/webkit-apt-cache.mjs fetched "$apt_log" >> "$receipt" \
            || printf 'apt_archive_bytes_fetched=UNKNOWN\n' >> "$receipt"
          summary_status=0
          node runtime/offline/browser-tests/webkit-apt-cache.mjs summary "$archives" \
            "$QIKVRT_OFFLINE_EVIDENCE_DIR/APT_CACHE_AFTER.json" | sed 's/^/after_/' >> "$receipt" || summary_status=$?
          printf 'after_summary_exit_status=%s\n' "$summary_status" >> "$receipt"
          if [ "$summary_status" -ne 0 ] && [ "$status" -eq 0 ]; then
            echo '::error::WEBKIT_APT_CACHE_EVIDENCE_FAILED'
            status="$summary_status"
          fi
          cat "$receipt"
          if [ "$status" -eq 124 ]; then echo '::error::WEBKIT_SYSTEM_DEPENDENCIES_TIMEOUT'; fi
          exit "$status"
      - name: Save WebKit system package cache
        if: matrix.engine == 'webkit' && steps.webkit_system_deps.outcome == 'success' && steps.webkit_apt_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/qikvrt-webkit-apt/archives/*.deb
          key: ${{ steps.webkit_apt_cache.outputs.cache-primary-key }}
      - name: Observe root APT limits and same-package HTTP HTTPS transfer
        id: webkit_apt_diagnosis
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        timeout-minutes: 2
        env:
          QIKVRT_OFFLINE_EVIDENCE_DIR: ${{ runner.temp }}/offline-${{ matrix.engine }}
          EXPECTED_HEAD: ${{ needs.test.outputs.tested_head }}
          EXPECTED_TREE: ${{ needs.test.outputs.tested_tree }}
        run: |
          # A valid partial record returns 0 with transport state UNVERIFIED.
          # Source/checker failures remain nonzero; browser gates stay mandatory.
          node runtime/offline/browser-tests/apt-diagnosis.mjs "$QIKVRT_OFFLINE_EVIDENCE_DIR/APT_DIAGNOSIS.json"
      - name: Install exact package-bound WebKit binary (bounded diagnosis)
        id: webkit_browser_binary
        if: matrix.engine == 'webkit'
        shell: bash
        env:
          QIKVRT_OFFLINE_EVIDENCE_DIR: ${{ runner.temp }}/offline-${{ matrix.engine }}
        run: |
          set -euo pipefail
          receipt="$QIKVRT_OFFLINE_EVIDENCE_DIR/INSTALL_PHASE_BROWSER.txt"
          started_epoch="$(date -u +%s)"
          printf 'phase=browser-binary\nsource_head=%s\nstarted_utc=%s\ntimeout_seconds=480\n' \
            "$(git rev-parse HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$receipt"
          set +e
          timeout --signal=TERM --kill-after=30s 8m runtime/offline/browser-tests/node_modules/.bin/playwright install webkit
          status=$?
          set -e
          printf 'ended_utc=%s\nduration_seconds=%s\nexit_status=%s\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(( $(date -u +%s) - started_epoch ))" "$status" >> "$receipt"
          cat "$receipt"
          if [ "$status" -eq 124 ]; then echo '::error::WEBKIT_BROWSER_DOWNLOAD_TIMEOUT'; fi
          exit "$status"
      - name: Save WebKit browser binary cache
        if: matrix.engine == 'webkit' && steps.webkit_browser_binary.outcome == 'success' && steps.webkit_browser_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright/webkit-*
          key: ${{ steps.webkit_browser_cache.outputs.cache-primary-key }}
      - name: Fresh offline and full browser-process restart controls
        env:
          QIKVRT_OFFLINE_EVIDENCE_DIR: ${{ runner.temp }}/offline-${{ matrix.engine }}
        run: |
          set -euo pipefail
          node runtime/offline/browser-tests/browser.test.mjs
          git rev-parse HEAD HEAD^{tree} > "$QIKVRT_OFFLINE_EVIDENCE_DIR/SUBJECT_AFTER.txt"
          cmp "$QIKVRT_OFFLINE_EVIDENCE_DIR/SUBJECT.txt" "$QIKVRT_OFFLINE_EVIDENCE_DIR/SUBJECT_AFTER.txt"
          git status --porcelain --untracked-files=no > "$QIKVRT_OFFLINE_EVIDENCE_DIR/TRACKED_STATUS.txt"
          test ! -s "$QIKVRT_OFFLINE_EVIDENCE_DIR/TRACKED_STATUS.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qikvrt-site32-offline-browser-${{ matrix.engine }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/offline-${{ matrix.engine }}/browser-readback.json
            ${{ runner.temp }}/offline-${{ matrix.engine }}/failure.json
            ${{ runner.temp }}/offline-${{ matrix.engine }}/SUBJECT*.txt
            ${{ runner.temp }}/offline-${{ matrix.engine }}/TRACKED_STATUS.txt
            ${{ runner.temp }}/offline-${{ matrix.engine }}/INSTALL_PHASE*.txt
            ${{ runner.temp }}/offline-${{ matrix.engine }}/APT_DIAGNOSIS.json
            ${{ runner.temp }}/offline-${{ matrix.engine }}/APT_CACHE_*.json
          retention-days: 30
          if-no-files-found: warn

  amo_unlisted:
    name: Mozilla AMO unlisted access and exact-source signing
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: qikvrt-amo-unlisted-${{ inputs.amo_readback_only && format('readback-{0}', github.run_id) || 'standard-1.1.0' }}
      cancel-in-progress: false
    outputs:
      signed_binding: ${{ steps.sign.outputs.signed_binding }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.test.outputs.tested_head }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Verify the successful committed test subject before signing admission
        env:
          TEST_RESULT: ${{ needs.test.result }}
          EXPECTED_HEAD: ${{ needs.test.outputs.tested_head }}
          EXPECTED_TREE: ${{ needs.test.outputs.tested_tree }}
        run: |
          set -euo pipefail
          test "$TEST_RESULT" = success
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_HEAD"
          test "$(git rev-parse --verify HEAD^{tree})" = "$EXPECTED_TREE"
      - name: Verify existing tool contract and AMO adversarial controls without credentials
        run: |
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B -m unittest -v tests.test_self_host_firefox.FirefoxAMOUnlistedTests
      - name: Inspect only securely managed credential presence and exact effect admission
        id: admission
        env:
          AMO_ISSUER_PRESENT: ${{ secrets.AMO_JWT_ISSUER != '' }}
          AMO_SECRET_PRESENT: ${{ secrets.AMO_JWT_SECRET != '' }}
          SIGN_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.amo_sign_unlisted) || (github.event_name == 'push' && github.repository == 'ingolf-lohmann/qik-vrt' && github.actor == 'ingolf-lohmann' && github.triggering_actor == 'ingolf-lohmann' && github.ref == 'refs/heads/integration/515-519-521-522-20261012-eceb9b63') }}
          OWNER_CI_HANDOFF: ${{ github.event_name == 'push' && github.repository == 'ingolf-lohmann/qik-vrt' && github.actor == 'ingolf-lohmann' && github.triggering_actor == 'ingolf-lohmann' && github.ref == 'refs/heads/integration/515-519-521-522-20261012-eceb9b63' }}
          AMO_TEST_RESULT: ${{ needs.test.result }}
          AMO_TESTED_HEAD: ${{ needs.test.outputs.tested_head }}
          AMO_TESTED_TREE: ${{ needs.test.outputs.tested_tree }}
          EXPECTED_HEAD: ${{ inputs.amo_expected_head || needs.test.outputs.tested_head }}
          EXPECTED_TREE: ${{ inputs.amo_expected_tree || needs.test.outputs.tested_tree }}
          PREVIOUS_RUN_ID: ${{ inputs.amo_previous_run_id || '0' }}
          GH_TOKEN: ${{ github.token }}
          AMO_EXECUTOR_RUN_ID: ${{ inputs.amo_executor_run_id || '0' }}
          AMO_INTENT_SHA256: ${{ inputs.amo_intent_sha256 }}
          AMO_READBACK_ONLY: ${{ inputs.amo_readback_only || false }}
        run: |
          python3 -B - <<'PYAMO'
          import json,os,re,subprocess
          from pathlib import Path
          from tools import qikvrt_workflow_executor as executor
          p=Path(os.environ['RUNNER_TEMP'])/'amo-original';p.mkdir(mode=0o700)
          requested=os.environ['SIGN_REQUESTED']=='true'
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          issuer=os.environ['AMO_ISSUER_PRESENT']=='true';secret=os.environ['AMO_SECRET_PRESENT']=='true'
          r={'schema':'qikvrt-amo-secure-access-preflight/v1','repository':os.environ['GITHUB_REPOSITORY'],
              'source_head':head,'source_tree':tree,'issuer_present':issuer,'secret_present':secret,
              'secret_names':['AMO_JWT_ISSUER','AMO_JWT_SECRET'],'credential_values_read':False,
              'amo_authentication_verified':False,'signing_requested':requested,'effect_ack_done':False,
              'request_mode':('DIRECT_OWNER_TESTED_PUSH' if os.environ.get('OWNER_CI_HANDOFF')=='true' else 'WORKFLOW_DISPATCH') if requested else 'NONE',
              'executor_run_id':os.environ['AMO_EXECUTOR_RUN_ID'],
              'readback_only':os.environ['AMO_READBACK_ONLY']=='true','first_boundary':None}
          r['credential_delivery']=executor.amo_credential_delivery(
              {'issuer_present':issuer,'secret_present':secret})
          try:
              if requested:
                  assert os.environ['GITHUB_REPOSITORY']=='ingolf-lohmann/qik-vrt','AMO_WRONG_REPOSITORY'
                  assert head==os.environ['EXPECTED_HEAD'] and tree==os.environ['EXPECTED_TREE'],'AMO_EXACT_REVIEWED_SOURCE_REQUIRED'
                  assert re.fullmatch(r'0|[1-9][0-9]{0,19}',os.environ['PREVIOUS_RUN_ID']),'AMO_PREVIOUS_RUN_INVALID'
                  if os.environ.get('OWNER_CI_HANDOFF')=='true':
                      assert os.environ['AMO_EXECUTOR_RUN_ID']=='0','AMO_DIRECT_OWNER_CI_CONTEXT_REQUIRED'
                      r['owner_ci_handoff']=executor.amo_validate_owner_ci(Path.cwd())
                  elif os.environ['AMO_EXECUTOR_RUN_ID']!='0':
                      executor.amo_validate_delegation(Path.cwd())
                  else:
                      assert os.environ['GITHUB_ACTOR']=='ingolf-lohmann','AMO_DIRECT_OWNER_EXECUTION_REQUIRED'
                  if not (issuer and secret):
                      r['first_boundary']='AMO_CREDENTIAL_PAIR_NOT_DELIVERED_TO_THIS_JOB'
              else:
                  r['first_boundary']='AMO_SIGNING_NOT_REQUESTED'
          except Exception as exc:
              code=str(exc)
              r['first_boundary']=code if re.fullmatch(r'AMO_[A-Z0-9_]{1,100}',code) else 'AMO_SOURCE_ADMISSION_UNVERIFIED'
              raise SystemExit(r['first_boundary']) from None
          finally:
              (p/'ACCESS_PREFLIGHT.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('submit='+str(requested and issuer and secret).lower()+'\n')
              out.write('previous_run_id='+os.environ['PREVIOUS_RUN_ID']+'\n')
          print('AMO_SUBMISSION_NOT_REQUESTED' if not requested else (
              'AMO_ACCESS_PRESENT_UNVERIFIED' if issuer and secret else 'HOLD_AMO_AUTHORIZED_CREDENTIAL_PAIR_UNAVAILABLE'))
          PYAMO
      - name: Resolve the preceding actual signing invocation through existing GitHub REST reads
        id: journal
        if: steps.admission.outputs.submit == 'true' && !inputs.amo_readback_only
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PREVIOUS_RUN_ID: ${{ steps.admission.outputs.previous_run_id }}
        run: |
          python3 -B - <<'PYJOURNAL'
          import os
          from pathlib import Path
          from tools import qikvrt_workflow_executor as executor
          previous=executor.amo_signing_predecessor(Path.cwd(),int(os.environ['GITHUB_RUN_ID']),
              int(os.environ['GITHUB_RUN_ATTEMPT']),int(os.environ['REQUESTED_PREVIOUS_RUN_ID']))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('previous_run_id='+str(previous)+'\n')
          PYJOURNAL
      - name: Retrieve original preceding non-secret signing journal
        if: steps.admission.outputs.submit == 'true' && !inputs.amo_readback_only && steps.journal.outputs.previous_run_id != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.journal.outputs.previous_run_id }}
          pattern: qikvrt-amo-unlisted-*
          path: ${{ runner.temp }}/amo-previous
          merge-multiple: true
      - name: Official source-bound unlisted signing and original-byte readback
        id: sign
        if: steps.admission.outputs.submit == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GH_READ_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ inputs.amo_expected_head || needs.test.outputs.tested_head }}
          EXPECTED_TREE: ${{ inputs.amo_expected_tree || needs.test.outputs.tested_tree }}
          OWNER_CI_HANDOFF: ${{ github.event_name == 'push' && github.repository == 'ingolf-lohmann/qik-vrt' && github.actor == 'ingolf-lohmann' && github.triggering_actor == 'ingolf-lohmann' && github.ref == 'refs/heads/integration/515-519-521-522-20261012-eceb9b63' }}
          AMO_TEST_RESULT: ${{ needs.test.result }}
          AMO_TESTED_HEAD: ${{ needs.test.outputs.tested_head }}
          AMO_TESTED_TREE: ${{ needs.test.outputs.tested_tree }}
          PREVIOUS_RUN_ID: ${{ steps.journal.outputs.previous_run_id || '0' }}
          AMO_EXECUTOR_RUN_ID: ${{ inputs.amo_executor_run_id || '0' }}
          AMO_INTENT_SHA256: ${{ inputs.amo_intent_sha256 }}
          AMO_READBACK_ONLY: ${{ inputs.amo_readback_only || false }}
        run: |
          python3 -B - <<'PYAMO'
          import json,os,urllib.request
          from pathlib import Path
          from tools import qikvrt_self_host as host
          from tools import qikvrt_workflow_executor as executor
          if os.environ.get('OWNER_CI_HANDOFF')=='true':
              executor.amo_validate_owner_ci(Path.cwd())
          elif os.environ['AMO_EXECUTOR_RUN_ID']!='0':
              executor.amo_validate_delegation(Path.cwd())
          else:
              assert os.environ['GITHUB_ACTOR']=='ingolf-lohmann','AMO_DIRECT_OWNER_EXECUTION_REQUIRED'
              request=urllib.request.Request('https://api.github.com/repos/ingolf-lohmann/qik-vrt/pulls/523',
                  headers={'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],'Accept':'application/vnd.github+json'})
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs):return None
              with urllib.request.build_opener(NoRedirect).open(request,timeout=30) as response:
                  raw=response.read(1024*1024+1);assert len(raw)<=1024*1024;pr=json.loads(raw)
              assert pr['state']=='open' and pr['head']['repo']['full_name']=='ingolf-lohmann/qik-vrt'
              assert pr['head']['sha']==os.environ['EXPECTED_HEAD']==os.environ['GITHUB_SHA'],'AMO_PR523_HEAD_DRIFT'
          root=Path(os.environ['RUNNER_TEMP']);previous=root/'amo-previous/AMO_ATTEMPT.json'
          if os.environ['PREVIOUS_RUN_ID']!='0':
              if not previous.is_file():previous=root/'amo-previous/AMO_SIGNING_RECEIPT.json'
              assert previous.is_file(),'AMO_ORIGINAL_PREDECESSOR_JOURNAL_REQUIRED'
              previous.chmod(0o600)
          else:previous=None
          receipt=host.firefox_amo_unlisted(Path.cwd(),root/'amo-original',os.environ['EXPECTED_HEAD'],
              os.environ['EXPECTED_TREE'],root/'amo-state',submit=True,previous_state=previous,
              readback_only=os.environ['AMO_READBACK_ONLY']=='true')
          if receipt.get('signed_original_returned') is True:
              binding={'repository':'ingolf-lohmann/qik-vrt','run_id':int(os.environ['GITHUB_RUN_ID']),
                  'artifact_name':'qikvrt-amo-unlisted-'+os.environ['GITHUB_SHA'],
                  'file_name':receipt['file_name'],'xpi_sha256':receipt['xpi_sha256']}
              receipt['signed_xpi_artifact']=binding
              (root/'amo-original/AMO_SIGNING_RECEIPT.json').write_bytes(host.raw_json(receipt))
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  out.write('signed_binding='+json.dumps(binding,separators=(',',':'))+'\n')
          print(json.dumps(receipt,sort_keys=True))
          assert receipt.get('signed_original_returned') is True,receipt['state']
          PYAMO
      - name: Place the original non-secret attempt journal beside the exact XPI
        if: always()
        run: |
          python3 -B - <<'PYLAYOUT'
          import os,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          journal=root/'amo-state/AMO_ATTEMPT.json'
          if journal.is_file():
              destination=root/'amo-original/AMO_ATTEMPT.json'
              assert not journal.is_symlink() and not destination.exists()
              shutil.copyfile(journal,destination);destination.chmod(0o600)
              assert destination.read_bytes()==journal.read_bytes()
          PYLAYOUT
      - name: Preserve only non-secret signing receipts, journal and original XPI
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-amo-unlisted-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/amo-original/*.json
            ${{ runner.temp }}/amo-original/*.xpi
          retention-days: 90
          if-no-files-found: error

  s1_firefox_extension:
    outputs:
      signed_binding: ${{ steps.effect-admission.outputs.signed_binding }}
    name: Reused S1 + Mozilla Release - Firefox 158 XPI admission
    needs: [amo_unlisted, container]
    # The native-only package has no Firefox installation to admit. Keep the
    # existing browser gate for a browser package or an explicit signing path.
    if: ${{ always() && (needs.container.outputs.terminal_profile == 'firefox' || (github.event_name == 'workflow_dispatch' && (inputs.amo_sign_unlisted || inputs.amo_readback_only)) || needs.amo_unlisted.outputs.signed_binding != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out exact candidate XPI and existing probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Verify existing tool contract and negative admission controls
        run: |
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B -m unittest -v tests.test_self_host_firefox.FirefoxExtensionAdmissionTests
      - name: Admit only a materially changed image, XPI or probe
        id: effect-admission
        env:
          AMO_SIGNED_BINDING: ${{ needs.amo_unlisted.outputs.signed_binding }}
        run: |
          python3 -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          evidence=Path(os.environ['RUNNER_TEMP'])/'s1-extension-evidence'
          evidence.mkdir(mode=0o777,exist_ok=True);evidence.chmod(0o777)
          root='browser/firefox/qikvrt-terminal/'
          files=['manifest.json','background.js','content.js','options.html','options.js','terminal.css','client.html']
          blob=lambda path:subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          work=json.loads(Path('state/work_units/QIKVRT_MAIN_CONVERGENCE_20261014_V1.json').read_bytes())
          upgrade=work.get('firefox158_s1_upgrade',{})
          signed=json.loads(os.environ['AMO_SIGNED_BINDING']) if os.environ.get('AMO_SIGNED_BINDING') else upgrade.get('signed_xpi_artifact')
          cached=upgrade.get('runtime_artifact')
          # Validate the unchanged upgrade recipe from the retained parent
          # object; unrelated OCI stages must not retry a known signing failure.
          merge=work.get('oci_publication_merge_20261014',{})
          parent=merge.get('candidate_subject',{}).get('first_parent')
          same_recipe=False
          if parent:
              old=subprocess.check_output(['git','show',parent+':runtime/self-host/Dockerfile'])
              current=Path('runtime/self-host/Dockerfile').read_bytes()
              def recipe(raw):
                  lines=raw.splitlines(keepends=True)
                  arg=[line for line in lines if line.startswith(b'ARG QIKVRT_S1_BASE_IMAGE=')]
                  body=raw.split(b'FROM ${QIKVRT_S1_BASE_IMAGE} AS s1-firefox-release\n',1)[1]
                  body=body.split(b'\nFROM ',1)[0]
                  return arg,body
              same_recipe=recipe(old)==recipe(current)
              parent_recipe_blob=hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()
          recipe_blob_matches=lambda expected:(expected==blob('runtime/self-host/Dockerfile') or
              same_recipe and expected==parent_recipe_blob)
          inputs={'image_digest':'sha256:eda9516930cf7a51f0342e9b154b430c386ad04b80ce6401ce6b7d1a103ac74d',
              'upgrade_dockerfile_blob':blob('runtime/self-host/Dockerfile'),
              'terminal_entrypoint_blob':blob('deploy/universal-terminal/entrypoint.sh'),
              'signed_xpi_artifact':signed,
              'probe_blob':blob('tools/qikvrt_self_host.py'),
              'extension_blobs':{name:blob(root+name) for name in files}}
          from tools import qikvrt_self_host as host
          reuse=(cached is not None and recipe_blob_matches(cached['component_blobs'].get('runtime/self-host/Dockerfile')) and
              cached['component_blobs'].get('deploy/universal-terminal/entrypoint.sh')==blob('deploy/universal-terminal/entrypoint.sh') and
              (cached['component_blobs'].get('tools/qikvrt_self_host.py')==blob('tools/qikvrt_self_host.py') or
               cached.get('probe_runtime_sha256')==host.firefox_amo_runtime_fingerprint(Path('tools/qikvrt_self_host.py').read_bytes())))
          if reuse:
              assert cached['repository']=='ingolf-lohmann/qik-vrt'
              assert cached['parent_image_id']=='sha256:2f35af27a2cfd36e383ae0ced8f85eca4ff328d888a7169d7cdafa62810dfe2e'
              assert type(cached['run_id']) is int and cached['run_id']>0
              import re
              assert re.fullmatch(r'[A-Za-z0-9_.-]{1,160}',cached['artifact_name'])
              assert re.fullmatch(r'[a-f0-9]{64}',cached['archive_sha256'])
          runtime_inputs={k:v for k,v in inputs.items() if k!='probe_blob'}
          runtime_inputs['probe_runtime_sha256']=host.firefox_amo_runtime_fingerprint(Path('tools/qikvrt_self_host.py').read_bytes())
          causal_digest=hashlib.sha256(json.dumps(runtime_inputs,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          work=json.loads(Path('state/work_units/QIKVRT_MAIN_CONVERGENCE_20261014_V1.json').read_bytes())
          prior=upgrade.get('native_observation',{})
          equivalent_inputs=dict(runtime_inputs)
          if same_recipe: equivalent_inputs['upgrade_dockerfile_blob']=parent_recipe_blob
          equivalent_digest=hashlib.sha256(json.dumps(equivalent_inputs,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          unchanged=(prior.get('runtime_causal_input_sha256') in (causal_digest,equivalent_digest) and
              prior.get('receipt',{}).get('state','').startswith('HOLD_'))
          if unchanged:
              r=dict(prior['receipt']);r.update(current_probe_executed=False,
                  reused_failure_source_head=prior['source_head'],reused_failure_run_id=prior['run_id'])
              (evidence/'extension-installation.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
              print('NOOP_UNCHANGED_FIREFOX_RELEASE_OR_SIGNING_FAILURE')
          if signed is not None:
              import re
              assert signed['repository']=='ingolf-lohmann/qik-vrt'
              assert type(signed['run_id']) is int and signed['run_id']>0
              assert re.fullmatch(r'[A-Za-z0-9_.-]{1,160}',signed['artifact_name'])
              assert re.fullmatch(r'[A-Za-z0-9_.-]+[.]xpi',signed['file_name'])
              assert re.fullmatch(r'[a-f0-9]{64}',signed['xpi_sha256'])
          (evidence/'causal-inputs.json').write_text(json.dumps({'inputs':inputs,
              'sha256':causal_digest,'current_probe_required':not unchanged,
              'effect_ack_done':False},sort_keys=True,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('probe_required='+str(not unchanged).lower()+'\n')
              output.write('signed_candidate='+str(signed is not None).lower()+'\n')
              output.write('signed_binding='+json.dumps(signed,separators=(',',':'))+'\n')
              output.write('runtime_reuse='+str(reuse).lower()+'\n')
              if reuse:
                  output.write('runtime_run_id='+str(cached['run_id'])+'\n')
                  output.write('runtime_artifact_name='+cached['artifact_name']+'\n')
              if signed:
                  output.write('signed_run_id='+str(signed['run_id'])+'\n')
                  output.write('signed_artifact_name='+signed['artifact_name']+'\n')
          PY

      - name: Admit reuse of the already delivered dependency parts
        id: transport-admission
        env:
          RUNTIME_REUSE: ${{ steps.effect-admission.outputs.runtime_reuse }}
        run: |
          python3 -B - <<'PYTRANSFER'
          import json,os,re,subprocess
          from pathlib import Path
          upgrade=json.loads(Path('state/work_units/QIKVRT_MAIN_CONVERGENCE_20261014_V1.json').read_bytes())['firefox158_s1_upgrade']
          cached=upgrade.get('runtime_artifact')
          transport=upgrade.get('bounded_transport_repair_20261017',{}).get('delivery_cache')
          reuse=False
          if transport is not None:
              assert transport['schema']=='qikvrt-runtime-transport-cache/v1'
              delivery=transport['delivery'];metadata=transport['metadata_artifact']
              assert delivery['repository']=='ingolf-lohmann/qik-vrt'
              assert delivery['schema']=='qikvrt-container-artifact-delivery/v1'
              assert type(delivery['run_id']) is int and delivery['run_id']>0
              assert delivery['independent_download_back_verified'] is True
              assert delivery['original_archive_restored_verified'] is True
              assert delivery['image_imported'] is False and delivery['extension_activation_verified'] is False
              assert delivery['public_production_verified'] is False and delivery['effect_ack_done'] is False
              assert all(re.fullmatch(r'[a-f0-9]{40}',delivery[key]) for key in ('exporter_head','exporter_tree'))
              assert type(metadata['id']) is int and metadata['id']>0 and 0<metadata['bytes']<536870912
              assert re.fullmatch(r'[A-Za-z0-9_.-]{1,160}',metadata['name'])
              for pin in (metadata['sha256'],transport['delivery_json_sha256'],delivery['parts_manifest_sha256']):
                  assert re.fullmatch(r'[a-f0-9]{64}',pin)
              assert 1<=len(delivery['parts'])<=4
              for index,part in enumerate(delivery['parts']):
                  assert type(part['index']) is int and part['index']==index
                  assert type(part['artifact_id']) is int and part['artifact_id']>0
                  assert re.fullmatch(r'[A-Za-z0-9_.-]{1,160}',part['artifact_name'])
