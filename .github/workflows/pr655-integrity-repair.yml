name: QIKVRT PR655 integrity repair
on:
  push:
    branches:
      - feat/static-terminal-devops-client-20261031
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pr655-integrity-repair
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Regenerate canonical integrity and verify
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
      - name: Commit generated integrity outputs
        run: |
          set -euo pipefail
          git config user.name 'qik-vrt-integrity[bot]'
          git config user.email 'qik-vrt-integrity[bot]@users.noreply.github.com'
          git add REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(integrity): regenerate canonical PR655 metadata'
            git push origin HEAD:refs/heads/feat/static-terminal-devops-client-20261031
          fi
