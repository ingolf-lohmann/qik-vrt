name: QIK-VRT one-shot PR516 ordered QCE Mirror port

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/qikvrt_pr516_qce_mirror_port_once.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: qikvrt-pr516-qce-mirror-port-v1
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'ingolf-lohmann/qik-vrt' &&
      github.event.pull_request.head.ref == 'port/pr516-ordered-qce-stack-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind exact Mirror base and candidate head
        shell: bash
        run: |
          set -euo pipefail
          expected_base='1d275702c35ff76a4c8188258c236e28d8b3cce6'
          test "${{ github.event.pull_request.base.sha }}" = "$expected_base"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse origin/main)" = "$expected_base"

      - name: Fetch exact promoted Authority source
        shell: bash
        run: |
          set -euo pipefail
          authority="${RUNNER_TEMP}/qikvrt-authority-pr516"
          git init "${authority}"
          git -C "${authority}" remote add origin https://github.com/Goldkelch/qik-vrt.git
          git -C "${authority}" fetch --depth=1 origin 0dc66b4e8a52ec439bae4ef033851a6377bd2e69
          git -C "${authority}" checkout --detach FETCH_HEAD
          test "$(git -C "${authority}" rev-parse HEAD)" = "0dc66b4e8a52ec439bae4ef033851a6377bd2e69"
          test "$(git -C "${authority}" rev-parse 'HEAD^{tree}')" = "9e606990a00bb09b423d8d13d1b1f16be24d92d8"

      - name: Copy exactly 27 non-generated functional paths
        shell: bash
        run: |
          set -euo pipefail
          authority="${RUNNER_TEMP}/qikvrt-authority-pr516"
          portable=(
            '.github/workflows/qikvrt_measurement_derived_dimensions.yml'
            '.github/workflows/qikvrt_qce_c_measurement_binding.yml'
            '.github/workflows/qikvrt_qce_causal_axis_bridge.yml'
            '.github/workflows/qikvrt_qce_causal_axis_selection.yml'
            '.github/workflows/qikvrt_qce_now_serialization.yml'
            '.github/workflows/qikvrt_qce_null_calibration_ratio.yml'
            'docs/publications/2026-08-07-measurement-derived-dimensions/MeasurementDerivedDimensions.lean'
            'docs/publications/2026-08-07-measurement-derived-dimensions/MeasurementDerivedDimensionsAxiomAudit.lean'
            'docs/publications/2026-08-07-measurement-derived-dimensions/lake-manifest.json'
            'docs/publications/2026-08-07-measurement-derived-dimensions/lakefile.lean'
            'docs/publications/2026-08-07-measurement-derived-dimensions/lean-toolchain'
            'docs/publications/2026-08-07-qce-c-measurement-binding/QCECMeasurementBinding.lean'
            'docs/publications/2026-08-07-qce-c-measurement-binding/QCECMeasurementBindingAxiomAudit.lean'
            'docs/publications/2026-08-07-qce-causal-axis-bridge/QCECausalAxisBridge.lean'
            'docs/publications/2026-08-07-qce-causal-axis-bridge/QCECausalAxisBridgeAxiomAudit.lean'
            'docs/publications/2026-08-07-qce-causal-axis-selection/QCECausalAxisSelection.lean'
            'docs/publications/2026-08-07-qce-causal-axis-selection/QCECausalAxisSelectionAxiomAudit.lean'
            'docs/publications/2026-08-07-qce-now-serialization/QCENowSerialization.lean'
            'docs/publications/2026-08-07-qce-now-serialization/QCENowSerializationAxiomAudit.lean'
            'docs/publications/2026-08-07-qce-null-calibration-ratio/QCENullCalibrationRatio.lean'
            'docs/publications/2026-08-07-qce-null-calibration-ratio/QCENullCalibrationRatioAxiomAudit.lean'
            'state/work_units/MEASUREMENT_DERIVED_DIMENSIONS_V2.json'
            'state/work_units/QCE_CAUSAL_AXIS_BRIDGE_V1.json'
            'state/work_units/QCE_CAUSAL_AXIS_SELECTION_V1.json'
            'state/work_units/QCE_C_MEASUREMENT_BINDING_V1.json'
            'state/work_units/QCE_NOW_SERIALIZATION_V1.json'
            'state/work_units/QCE_NULL_CALIBRATION_RATIO_V1.json'
          )
          test "${#portable[@]}" -eq 27
          for path in "${portable[@]}"; do
            test -f "${authority}/${path}"
            mkdir -p "$(dirname "${path}")"
            cp -a "${authority}/${path}" "${path}"
          done
          git rm -- .github/workflows/qikvrt_pr516_qce_mirror_port_once.yml

      - name: Verify portable Git-blob identity before integrity regeneration
        shell: bash
        run: |
          set -euo pipefail
          authority="${RUNNER_TEMP}/qikvrt-authority-pr516"
          portable=(
            '.github/workflows/qikvrt_measurement_derived_dimensions.yml'
            '.github/workflows/qikvrt_qce_c_measurement_binding.yml'
            '.github/workflows/qikvrt_qce_causal_axis_bridge.yml'
            '.github/workflows/qikvrt_qce_causal_axis_selection.yml'
            '.github/workflows/qikvrt_qce_now_serialization.yml'
            '.github/workflows/qikvrt_qce_null_calibration_ratio.yml'
            'docs/publications/2026-08-07-measurement-derived-dimensions/MeasurementDerivedDimensions.lean'
            'docs/publications/2026-08-07-measurement-derived-dimensions/MeasurementDerivedDimensionsAxiomAudit.lean'
            'docs/publications/2026-08-07-measurement-derived-dimensions/lake-manifest.json'
            'docs/publications/2026-08-07-measurement-derived-dimensions/lakefile.lean'
            'docs/publications/2026-08-07-measurement-derived-dimensions/lean-toolchain'
            'docs/publications/2026-08-07-qce-c-measurement-binding/QCECMeasurementBinding.lean'
            'docs/publications/2026-08-07-qce-c-measurement-binding/QCECMeasurementBindingAxiomAudit.lean'
            'docs/publications/2026-08-07-qce-causal-axis-bridge/QCECausalAxisBridge.lean'
            'docs/publications/2026-08-07-qce-causal-axis-bridge/QCECausalAxisBridgeAxiomAudit.lean'
            'docs/publications/2026-08-07-qce-causal-axis-selection/QCECausalAxisSelection.lean'
            'docs/publications/2026-08-07-qce-causal-axis-selection/QCECausalAxisSelectionAxiomAudit.lean'
            'docs/publications/2026-08-07-qce-now-serialization/QCENowSerialization.lean'
            'docs/publications/2026-08-07-qce-now-serialization/QCENowSerializationAxiomAudit.lean'
            'docs/publications/2026-08-07-qce-null-calibration-ratio/QCENullCalibrationRatio.lean'
            'docs/publications/2026-08-07-qce-null-calibration-ratio/QCENullCalibrationRatioAxiomAudit.lean'
            'state/work_units/MEASUREMENT_DERIVED_DIMENSIONS_V2.json'
            'state/work_units/QCE_CAUSAL_AXIS_BRIDGE_V1.json'
            'state/work_units/QCE_CAUSAL_AXIS_SELECTION_V1.json'
            'state/work_units/QCE_C_MEASUREMENT_BINDING_V1.json'
            'state/work_units/QCE_NOW_SERIALIZATION_V1.json'
            'state/work_units/QCE_NULL_CALIBRATION_RATIO_V1.json'
          )
          for path in "${portable[@]}"; do
            source_blob="$(git -C "${authority}" hash-object "${path}")"
            mirror_blob="$(git hash-object "${path}")"
            test "$source_blob" = "$mirror_blob" || {
              echo "BLOCK byte drift: ${path}" >&2
              exit 1
            }
          done

      - name: Regenerate Mirror-native repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Enforce bounded final diff
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import subprocess

          base = '1d275702c35ff76a4c8188258c236e28d8b3cce6'
          allowed = {
              '.github/workflows/qikvrt_pr516_qce_mirror_port_once.yml',
              '.github/workflows/qikvrt_measurement_derived_dimensions.yml',
              '.github/workflows/qikvrt_qce_c_measurement_binding.yml',
              '.github/workflows/qikvrt_qce_causal_axis_bridge.yml',
              '.github/workflows/qikvrt_qce_causal_axis_selection.yml',
              '.github/workflows/qikvrt_qce_now_serialization.yml',
              '.github/workflows/qikvrt_qce_null_calibration_ratio.yml',
              'REPOSITORY_FILE_MANIFEST.json',
              'REPOSITORY_FILE_MANIFEST.json.sha256',
              'SHA256SUMS.txt',
              'docs/publications/2026-08-07-measurement-derived-dimensions/MeasurementDerivedDimensions.lean',
              'docs/publications/2026-08-07-measurement-derived-dimensions/MeasurementDerivedDimensionsAxiomAudit.lean',
              'docs/publications/2026-08-07-measurement-derived-dimensions/lake-manifest.json',
              'docs/publications/2026-08-07-measurement-derived-dimensions/lakefile.lean',
              'docs/publications/2026-08-07-measurement-derived-dimensions/lean-toolchain',
              'docs/publications/2026-08-07-qce-c-measurement-binding/QCECMeasurementBinding.lean',
              'docs/publications/2026-08-07-qce-c-measurement-binding/QCECMeasurementBindingAxiomAudit.lean',
              'docs/publications/2026-08-07-qce-causal-axis-bridge/QCECausalAxisBridge.lean',
              'docs/publications/2026-08-07-qce-causal-axis-bridge/QCECausalAxisBridgeAxiomAudit.lean',
              'docs/publications/2026-08-07-qce-causal-axis-selection/QCECausalAxisSelection.lean',
              'docs/publications/2026-08-07-qce-causal-axis-selection/QCECausalAxisSelectionAxiomAudit.lean',
              'docs/publications/2026-08-07-qce-now-serialization/QCENowSerialization.lean',
              'docs/publications/2026-08-07-qce-now-serialization/QCENowSerializationAxiomAudit.lean',
              'docs/publications/2026-08-07-qce-null-calibration-ratio/QCENullCalibrationRatio.lean',
              'docs/publications/2026-08-07-qce-null-calibration-ratio/QCENullCalibrationRatioAxiomAudit.lean',
              'state/work_units/MEASUREMENT_DERIVED_DIMENSIONS_V2.json',
              'state/work_units/QCE_CAUSAL_AXIS_BRIDGE_V1.json',
              'state/work_units/QCE_CAUSAL_AXIS_SELECTION_V1.json',
              'state/work_units/QCE_C_MEASUREMENT_BINDING_V1.json',
              'state/work_units/QCE_NOW_SERIALIZATION_V1.json',
              'state/work_units/QCE_NULL_CALIBRATION_RATIO_V1.json',
          }
          committed = subprocess.check_output(
              ['git', 'diff', '--name-only', base + '...HEAD'], text=True
          ).splitlines()
          porcelain = subprocess.check_output(
              ['git', 'status', '--porcelain=v1'], text=True
          ).splitlines()
          normalized = {path for path in committed if path}
          for item in porcelain:
              if len(item) < 4:
                  raise SystemExit('BLOCK malformed porcelain entry: ' + repr(item))
              path = item[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path:
                  normalized.add(path)
          unexpected = sorted(path for path in normalized if path not in allowed)
          if unexpected:
              raise SystemExit('BLOCK unexpected paths: ' + ', '.join(unexpected))
          functional = sorted(
              path for path in normalized
              if path not in {
                  '.github/workflows/qikvrt_pr516_qce_mirror_port_once.yml',
                  'REPOSITORY_FILE_MANIFEST.json',
                  'REPOSITORY_FILE_MANIFEST.json.sha256',
                  'SHA256SUMS.txt',
              }
          )
          if len(functional) != 27:
              raise SystemExit(f'BLOCK expected 27 functional paths, got {len(functional)}')
          PY

      - name: Persist exactly one materialized Mirror successor commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "port(pr516): materialize ordered QCE tranche with Mirror-native integrity"
          git push origin HEAD:port/pr516-ordered-qce-stack-v1
