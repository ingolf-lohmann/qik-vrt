name: QIKVRT live status watch

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows:
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIKVRT requested review executor"
      - "QIKVRT required code-owner review"
      - "QIKVRT reciprocal Mesh review"
      - "QIKVRT universal terminal materialization"
      - "QIKVRT reflexive repository watchdog"
    types: [requested, in_progress, completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to project"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

# Isolate v2 from still-running default-branch v1 writers. Every event for
# one PR uses the same writer group, including workflow_run notifications.
concurrency:
  group: qikvrt-live-terminal-v2-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr || github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false
  # Up to 100 pending runs; overflow is cancellation, never closure evidence.
  queue: max

jobs:
  project:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'issue_comment' ||
      github.event_name == 'workflow_run' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Project one causal event into the persistent terminal surface
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr }}
          # Keep the v1 comment as history; never migrate or overwrite it.
          MARKER: '<!-- qikvrt-universal-terminal-live-surface-v2 -->'
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "${RUNNER_TEMP:?}/qikvrt-live-status-readback.json"

          event="$GITHUB_EVENT_PATH"
          pr=''
          verb='OBSERVE'
          subject=''
          detail=''
          source_id="$GITHUB_RUN_ID"
          source_attempt=1
          transition="$(jq -r '.action // "observe"' "$event")"
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]

          case "$EVENT_NAME" in
            pull_request)
              pr="$(jq -r '.pull_request.number' "$event")"
              head="$(jq -r '.pull_request.head.sha' "$event")"
              action="$(jq -r '.action' "$event")"
              subject="PR #$pr @ $head"
              detail="pull_request:$action"
              ;;
            pull_request_review)
              pr="$(jq -r '.pull_request.number' "$event")"
              head="$(jq -r '.review.commit_id' "$event")"
              state="$(jq -r '.review.state' "$event")"
              actor="$(jq -r '.review.user.login' "$event")"
              subject="PR #$pr @ $head"
              verb='READBACK'
              detail="review:$state by $actor"
              ;;
            issue_comment)
              if [ "$(jq -r '.issue.pull_request != null' "$event")" != true ]; then exit 0; fi
              pr="$(jq -r '.issue.number' "$event")"
              body="$(jq -r '.comment.body' "$event")"
              if [[ "$body" == *"$MARKER"* ]] && [ "$(jq -r '.comment.user.login' "$event")" = 'github-actions[bot]' ]; then exit 0; fi
              [[ "$pr" =~ ^[1-9][0-9]*$ ]]
              head="$(gh api "repos/$REPOSITORY/pulls/$pr" --jq '.head.sha')"
              subject="PR #$pr @ $head"
              detail="issue_comment by $(jq -r '.comment.user.login' "$event")"
              ;;
            workflow_run)
              pr="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$event")"
              if [ -z "$pr" ]; then exit 0; fi
              head="$(jq -r '.workflow_run.head_sha' "$event")"
              name="$(jq -r '.workflow_run.name' "$event")"
              state="$(jq -r '.workflow_run.conclusion // .workflow_run.status' "$event")"
              run_url="$(jq -r '.workflow_run.html_url' "$event")"
              source_id="$(jq -r '.workflow_run.id' "$event")"
              source_attempt="$(jq -r '.workflow_run.run_attempt // 1' "$event")"
              transition="$state"
              subject="PR #$pr @ $head"
              case "$state" in
                # Workflow success is an observation, not an external effect.
                success) verb='OBSERVE' ;;
                # A surface conclusion cannot prove that all issue, PR and branch
                # carriers are exhausted; it cannot authoritatively emit HOLD.
                failure|cancelled|action_required|timed_out) verb='CLASSIFY' ;;
                *) verb='OBSERVE' ;;
              esac
              detail="$name → $state ($run_url)"
              ;;
            workflow_dispatch)
              pr="$DISPATCH_PR"
              [[ "$pr" =~ ^[1-9][0-9]*$ ]]
              head="$(gh api "repos/$REPOSITORY/pulls/$pr" --jq '.head.sha')"
              subject="PR #$pr @ $head"
              detail='manual surface bind'
              ;;
            *) exit 0 ;;
          esac

          [[ "$pr" =~ ^[1-9][0-9]*$ ]]
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_attempt" =~ ^[1-9][0-9]*$ ]]
          [[ "$transition" =~ ^[a-z_]+$ ]]
          now="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          event_id="${EVENT_NAME}:${source_id}:${source_attempt}:${transition}"
          line="- \`$now\` **$verb** · \`$subject\` · $detail · event \`$event_id\`"

          # Page size does not lower the REST request count. Search a bounded,
          # complete inventory; never interpret a truncated page as absence.
          comment_id=''
          old=''
          inventory_complete=0
          for page in 1 2 3 4 5; do
            comments="$(gh api "repos/$REPOSITORY/issues/$pr/comments?per_page=100&page=$page")"
            printf '%s' "$comments" | jq -e 'type == "array"' >/dev/null
            matches="$(printf '%s' "$comments" | jq -c --arg marker "$MARKER" '[.[] | select(.user.login == "github-actions[bot]" and .user.type == "Bot") | select((.body // "") | startswith($marker))]')"
            count="$(printf '%s' "$matches" | jq 'length')"
            if [ "$count" -gt 1 ] || { [ "$count" -eq 1 ] && [ -n "$comment_id" ]; }; then
              echo 'BLOCK: duplicate live-surface comments' >&2
              exit 1
            fi
            if [ "$count" -eq 1 ]; then
              comment_id="$(printf '%s' "$matches" | jq -r '.[0].id')"
              old="$(printf '%s' "$matches" | jq -r '.[0].body')"
              [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
            fi
            if [ "$(printf '%s' "$comments" | jq 'length')" -lt 100 ]; then
              inventory_complete=1
              break
            fi
          done
          if [ "$inventory_complete" -ne 1 ]; then
            echo 'BLOCK: live-surface inventory exceeds five pages; no write' >&2
            exit 1
          fi
          # Deduplication suppresses mutation, never the exact object readback.
          # The same identifier with a different source payload is a conflict.
          duplicate=false
          if printf '%s\n' "$old" | grep -Fq "· event \`$event_id\`"; then
            expected="**$verb** · \`$subject\` · $detail · event \`$event_id\`"
            matches="$(printf '%s\n' "$old" | awk -v suffix="$expected" '
              /^- `/ && length($0) >= length(suffix) &&
              substr($0, length($0)-length(suffix)+1) == suffix {n++}
              END {print n+0}')"
            identifiers="$(printf '%s\n' "$old" | grep -Fc "· event \`$event_id\`")"
            if [ "$matches" -ne 1 ] || [ "$identifiers" -ne 1 ]; then
              echo 'BLOCK: conflicting source transition; no write' >&2
              exit 1
            fi
            duplicate=true
          fi
          tree="$(gh api "repos/$REPOSITORY/git/commits/$head" --jq '.tree.sha')"
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]

          if [ -n "$comment_id" ]; then
            journal="$(printf '%s\n' "$old" | awk '/^## Live event journal/{f=1;next} f && /^- `/{print}' | tail -n 119)"
          else
            journal=''
          fi

          body="$MARKER

          ## QIKVRT Universal Terminal — live mirror surface

          This comment is an **event-driven projection**. It does not poll. Each eligible repository event performs one bounded update and exits.

          **Observed event subject:** \`$subject\`
          **Event subject tree:** \`$tree\`
          This historical event binding is not a claim about the current PR head.
          **Last event:** \`$event_id\`
          **Last transition:** **$verb**
          **Observed at:** \`$now\`

          ## Live event journal
          $journal
          $line

          _Causality is derived from exact-subject/event receipts; timestamps are display metadata only. TRANSPORT_ACK != EFFECT_ACK._"

          if [ "$duplicate" = true ]; then
            body="$old"
          elif [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$body" >/dev/null
          else
            comment_id="$(gh api --method POST "repos/$REPOSITORY/issues/$pr/comments" -f body="$body" --jq '.id')"
          fi
          # A successful write response is not persistence evidence. Re-read
          # the exact object once; errors, overwrite races and mismatch fail closed.
          [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
          readback="$(gh api "repos/$REPOSITORY/issues/comments/$comment_id")"
          printf '%s' "$readback" | jq -e --argjson id "$comment_id" --arg body "$body" --arg issue "https://api.github.com/repos/$REPOSITORY/issues/$pr" '.id == $id and .issue_url == $issue and .body == $body and .user.login == "github-actions[bot]" and .user.type == "Bot"' >/dev/null
          export PROJECTION_REPO="$REPOSITORY" PROJECTION_PR="$pr"
          export PROJECTION_HEAD="$head" PROJECTION_TREE="$tree"
          export PROJECTION_EVENT="$event_id" PROJECTION_COMMENT="$comment_id"
          export PROJECTION_BODY="$body" PROJECTION_DUPLICATE="$duplicate"
          python3 -B - <<'PY_RECEIPT'
          import hashlib,json,os,pathlib
          env=os.environ
          receipt={
              'schema':'qikvrt_live_status_readback_v1',
              'repository':env['PROJECTION_REPO'],
              'pr_number':int(env['PROJECTION_PR']),
              'source_head':env['PROJECTION_HEAD'],
              'source_tree':env['PROJECTION_TREE'],
              'event_id':env['PROJECTION_EVENT'],
              'comment_id':int(env['PROJECTION_COMMENT']),
              'body_sha256':hashlib.sha256(env['PROJECTION_BODY'].encode()).hexdigest(),
              'run_id':int(env['GITHUB_RUN_ID']),
              'run_attempt':int(env['GITHUB_RUN_ATTEMPT']),
              'readback_verified':True,
              'duplicate':env['PROJECTION_DUPLICATE']=='true',
              'write_performed':env['PROJECTION_DUPLICATE']!='true',
              'binding_scope':'HISTORICAL_EVENT_SOURCE',
              'current_pr_or_main_validated':False,
              'effect_ack_done':False,
          }
          path=pathlib.Path(env['RUNNER_TEMP'])/'qikvrt-live-status-readback.json'
          data=json.dumps(receipt,sort_keys=True,indent=2)+'\n'
          path.write_text(data,encoding='utf-8')
          if path.read_text(encoding='utf-8') != data:
              raise SystemExit('BLOCK: local readback receipt persistence mismatch')
          PY_RECEIPT
          if [ "$duplicate" = true ]; then
            echo "PROJECTION_ALREADY_PRESENT event=$event_id"
          fi
          printf 'PROJECTION_READBACK_OK head=%s tree=%s event=%s comment=%s\n' "$head" "$tree" "$event_id" "$comment_id"
      - name: Preserve independently read-back event receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-live-status-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-live-status-readback.json
          if-no-files-found: ignore
          retention-days: 30
