name: One-shot Authority PR568 workflow-executor Mesh Mirror port

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/_materialize_authority_pr568_workflow_executor_mesh_port.yml"

permissions:
  contents: write

concurrency:
  group: qikvrt-mirror-port-authority-pr568-workflow-executor-mesh
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'mirror/port-authority-pr568-workflow-executor-mesh-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_MIRROR_BASE: 04622e3f96b9c547e26dfc89cc2d363ccbc37666
      EXPECTED_MIRROR_BASE_TREE: 72fc0be18b175e71bb5a3f29f6623a0e304b46a6
      AUTHORITY_PARENT: 9659ecc301850955d64d7ffdb13d3d17b88fa4cb
      AUTHORITY_COMMIT: 134f53a1d82e3175a5a1bff4cdd3464a506b7e5f
      AUTHORITY_TREE: 7c834f434b0477a9f574f581a5bf7cb829b428c8
      SOURCE_BRANCH: mirror/port-authority-pr568-workflow-executor-mesh-v1
      CARRIER_PATH: .github/workflows/_materialize_authority_pr568_workflow_executor_mesh_port.yml
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out literal carrier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact portable Authority bytes and Mirror-native integrity
        id: materialize
        shell: bash
        run: |
          set -Eeuo pipefail

          receipt_dir="$RUNNER_TEMP/qikvrt-mirror-pr568-port"
          mkdir -p "$receipt_dir"
          exec > >(tee "$receipt_dir/materialize.log") 2>&1
          stage=START
          trap 'status=$?; printf "%s\n" "$stage" > "$receipt_dir/final-stage.txt"; printf "%s\n" "$status" > "$receipt_dir/materialize-status.txt"' EXIT

          stage=VERIFY_CARRIER_BINDING
          test "$(git rev-parse --verify HEAD^{commit})" = "$EVENT_HEAD"
          git merge-base --is-ancestor "$EXPECTED_MIRROR_BASE" HEAD
          test "$(git rev-parse --verify "$EXPECTED_MIRROR_BASE^{tree}")" = "$EXPECTED_MIRROR_BASE_TREE"

          carrier_expected="$RUNNER_TEMP/pr568-carrier-expected.txt"
          carrier_actual="$RUNNER_TEMP/pr568-carrier-actual.txt"
          printf '%s\n' \
            "$CARRIER_PATH" \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt | LC_ALL=C sort > "$carrier_expected"
          git diff --name-only "$EXPECTED_MIRROR_BASE" HEAD -- | LC_ALL=C sort > "$carrier_actual"
          diff -u "$carrier_expected" "$carrier_actual"

          live_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$live_main" = "$EXPECTED_MIRROR_BASE"

          stage=FETCH_AUTHORITY_ISOLATED
          authority_git="$RUNNER_TEMP/authority-pr568.git"
          rm -rf "$authority_git"
          git init --bare "$authority_git"
          git -C "$authority_git" fetch --no-tags --depth=1 \
            https://github.com/Goldkelch/qik-vrt.git \
            "$AUTHORITY_COMMIT"
          test "$(git -C "$authority_git" rev-parse --verify FETCH_HEAD^{commit})" = "$AUTHORITY_COMMIT"
          test "$(git -C "$authority_git" rev-parse --verify FETCH_HEAD^{tree})" = "$AUTHORITY_TREE"
          git -C "$authority_git" fetch --no-tags --depth=1 \
            https://github.com/Goldkelch/qik-vrt.git \
            "$AUTHORITY_PARENT"
          test "$(git -C "$authority_git" rev-parse --verify FETCH_HEAD^{commit})" = "$AUTHORITY_PARENT"

          portable_paths=(
            .github/workflows/qikvrt_autonomous_pr_continuation.yml
            .github/workflows/qikvrt_live_status_watch.yml
            .github/workflows/qikvrt_workflow_executor.yml
            .github/workflows/qikvrt_workflow_executor_watchdog.yml
            AI
            acceptance/WORKFLOW_EXECUTOR_MESH_NODE_CONTINUITY_ACCEPTANCE_TEST.md
            registry/NODE_DISCOVERY_POLICY.json
            state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json
            state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json
            state/work_units/WORKFLOW_EXECUTOR_LITERAL_PR_HEAD_BINDING_REPAIR_V1.json
            tests/test_qikvrt_autonomous_pr_continuation.py
            tests/test_qikvrt_workflow_executor_mesh_contract.py
            tests/test_seed_workflows.py
            tools/qikvrt_seed_common.py
            tools/qikvrt_workflow_executor.py
          )

          authority_entry() {
            git -C "$authority_git" ls-tree -r --full-tree \
              --format='%(objectmode) %(objecttype) %(objectname)%x09%(path)' \
              "$AUTHORITY_COMMIT" -- "$1"
          }

          mirror_base_entry() {
            git ls-tree -r --full-tree \
              --format='%(objectmode) %(objecttype) %(objectname)%x09%(path)' \
              "$EXPECTED_MIRROR_BASE" -- "$1"
          }

          stage=COPY_PORTABLE_PATHS
          for path in "${portable_paths[@]}"; do
            entry="$(authority_entry "$path")"
            printf 'PORT_LOOKUP path=%s entry=%q\n' "$path" "$entry"
            test -n "$entry"
            metadata="${entry%%$'\t'*}"
            tree_path="${entry#*$'\t'}"
            read -r mode type blob <<< "$metadata"
            printf 'PORT_PATH path=%s mode=%s type=%s blob=%s\n' "$path" "$mode" "$type" "$blob"
            test "$mode" = "100644"
            test "$type" = "blob"
            test "$tree_path" = "$path"
            mkdir -p "$(dirname "$path")"
            git -C "$authority_git" cat-file blob "$AUTHORITY_COMMIT:$path" > "$path"
            chmod 0644 "$path"
            raw_blob="$(git hash-object --no-filters "$path")"
            printf 'PORT_RAW_HASH path=%s raw=%s expected=%s\n' "$path" "$raw_blob" "$blob"
            test "$raw_blob" = "$blob"
          done

          stage=APPLY_SEMANTIC_MAKEFILE_PORT
          authority_parent_makefile="$RUNNER_TEMP/Makefile.authority-parent"
          authority_pr568_makefile="$RUNNER_TEMP/Makefile.authority-pr568"
          merged_makefile="$RUNNER_TEMP/Makefile.merged"
          git -C "$authority_git" show "$AUTHORITY_PARENT:Makefile" > "$authority_parent_makefile"
          git -C "$authority_git" show "$AUTHORITY_COMMIT:Makefile" > "$authority_pr568_makefile"
          git show "$EXPECTED_MIRROR_BASE:Makefile" > Makefile
          set +e
          git merge-file --stdout Makefile "$authority_parent_makefile" "$authority_pr568_makefile" > "$merged_makefile"
          merge_status=$?
          set -e
          printf 'MAKEFILE_THREE_WAY_STATUS=%s\n' "$merge_status"
          test "$merge_status" = "0"
          test -s "$merged_makefile"
          ! grep -q '^<<<<<<<\|^=======\|^>>>>>>>' "$merged_makefile"
          mv "$merged_makefile" Makefile
          makefile_expected_blob="$(git hash-object --no-filters Makefile)"
          test "$makefile_expected_blob" != "$(git rev-parse "$EXPECTED_MIRROR_BASE:Makefile")"
          printf 'MAKEFILE_SEMANTIC_BLOB=%s\n' "$makefile_expected_blob"

          rm -- "$CARRIER_PATH"

          stage=GENERATE_MIRROR_INTEGRITY
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

          expected="$RUNNER_TEMP/pr568-port-expected.txt"
          actual="$RUNNER_TEMP/pr568-port-actual.txt"
          {
            printf '%s\n' \
              Makefile \
              REPOSITORY_FILE_MANIFEST.json \
              REPOSITORY_FILE_MANIFEST.json.sha256 \
              SHA256SUMS.txt
            for path in "${portable_paths[@]}"; do
              authority="$(authority_entry "$path")"
              base_entry="$(mirror_base_entry "$path")"
              if test "$authority" != "$base_entry"; then
                printf '%s\n' "$path"
              else
                printf 'PORT_ALREADY_CANONICAL path=%s\n' "$path" >&2
              fi
            done
          } | LC_ALL=C sort > "$expected"
          cp "$expected" "$receipt_dir/expected-final-paths.txt"
          printf 'EXPECTED_EFFECTIVE_DIFF_COUNT=%s\n' "$(wc -l < "$expected")"

          stage=VERIFY_BOUNDED_DIFF
          {
            git diff --name-only "$EXPECTED_MIRROR_BASE" --
            git ls-files --others --exclude-standard
          } | LC_ALL=C sort -u > "$actual"
          diff -u "$expected" "$actual"
          git diff --check "$EXPECTED_MIRROR_BASE" --

          for path in "${portable_paths[@]}"; do
            entry="$(authority_entry "$path")"
            metadata="${entry%%$'\t'*}"
            tree_path="${entry#*$'\t'}"
            read -r mode type blob <<< "$metadata"
            test "$mode" = "100644"
            test "$type" = "blob"
            test "$tree_path" = "$path"
            test "$(git hash-object --no-filters "$path")" = "$blob"
          done
          test "$(git hash-object --no-filters Makefile)" = "$makefile_expected_blob"

          stage=RUN_COMPLETE_TESTS
          make test

          stage=CREATE_MATERIALIZED_COMMIT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          for path in "${portable_paths[@]}"; do
            entry="$(authority_entry "$path")"
            metadata="${entry%%$'\t'*}"
            tree_path="${entry#*$'\t'}"
            read -r mode type blob <<< "$metadata"
            test "$mode" = "100644"
            test "$type" = "blob"
            test "$tree_path" = "$path"
            test "$(git hash-object --no-filters "$path")" = "$blob"
            staged_blob="$(git rev-parse ":$path")"
            if test "$staged_blob" != "$blob"; then
              printf 'PORT_INDEX_REPIN path=%s staged=%s expected=%s\n' "$path" "$staged_blob" "$blob"
              git update-index --add --cacheinfo "$mode,$blob,$path"
            fi
            test "$(git rev-parse ":$path")" = "$blob"
          done

          staged_makefile_blob="$(git rev-parse ':Makefile')"
          if test "$staged_makefile_blob" != "$makefile_expected_blob"; then
            printf 'MAKEFILE_INDEX_REPIN staged=%s expected=%s\n' "$staged_makefile_blob" "$makefile_expected_blob"
            git update-index --add --cacheinfo "100644,$makefile_expected_blob,Makefile"
          fi
          test "$(git rev-parse ':Makefile')" = "$makefile_expected_blob"

          git diff --cached --name-only "$EXPECTED_MIRROR_BASE" -- | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          git diff --cached --check
          git commit -m "Port Authority PR #568 workflow executor Mesh scope" \
            -m "Establish exact identity for 15 portable Authority blobs, three-way rebase the exact PR568 Makefile delta onto the Mirror base, regenerate Mirror-native integrity, preserve history, and perform no Zenodo/IETF/release/deployment effect."

          materialized_commit="$(git rev-parse HEAD)"
          materialized_tree="$(git rev-parse HEAD^{tree})"
          test "$(git rev-parse HEAD^1)" = "$EVENT_HEAD"

          stage=VERIFY_MATERIALIZED_TREE
          for path in "${portable_paths[@]}"; do
            entry="$(authority_entry "$path")"
            metadata="${entry%%$'\t'*}"
            tree_path="${entry#*$'\t'}"
            read -r mode type blob <<< "$metadata"
            test "$tree_path" = "$path"
            test "$(git rev-parse "HEAD:$path")" = "$blob"
          done
          test "$(git rev-parse 'HEAD:Makefile')" = "$makefile_expected_blob"

          printf '%s\n' "$materialized_commit" > "$receipt_dir/materialized-commit.txt"
          printf '%s\n' "$materialized_tree" > "$receipt_dir/materialized-tree.txt"
          printf '%s\n' "$makefile_expected_blob" > "$receipt_dir/makefile-semantic-blob.txt"
          printf '%s\n' "$EVENT_HEAD" > "$receipt_dir/carrier-head.txt"
          printf '%s\n' "$EXPECTED_MIRROR_BASE" > "$receipt_dir/mirror-base.txt"
          printf '%s\n' "$AUTHORITY_COMMIT" > "$receipt_dir/authority-commit.txt"
          printf '%s\n' "$AUTHORITY_TREE" > "$receipt_dir/authority-tree.txt"
          git diff-tree --no-commit-id --name-only -r HEAD | LC_ALL=C sort > "$receipt_dir/changed-paths.txt"
          git bundle create "$receipt_dir/materialized-commit.bundle" HEAD ^"$EXPECTED_MIRROR_BASE"

          stage=ATTEMPT_HISTORY_PRESERVING_PUSH
          set +e
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH" > "$receipt_dir/push.log" 2>&1
          push_status=$?
          set -e
          printf '%s\n' "$push_status" > "$receipt_dir/push-status.txt"
          cat "$receipt_dir/push.log"

          echo "materialized_commit=$materialized_commit" >> "$GITHUB_OUTPUT"
          echo "materialized_tree=$materialized_tree" >> "$GITHUB_OUTPUT"
          echo "push_status=$push_status" >> "$GITHUB_OUTPUT"
          echo "QIKVRT_MATERIALIZED_COMMIT=$materialized_commit"
          echo "QIKVRT_MATERIALIZED_TREE=$materialized_tree"
          echo "QIKVRT_PUSH_STATUS=$push_status"
          stage=COMPLETE

      - name: Preserve exact materialization receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-mirror-pr568-port-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/qikvrt-mirror-pr568-port
