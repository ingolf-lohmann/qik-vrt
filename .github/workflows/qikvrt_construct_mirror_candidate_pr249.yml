name: QIKVRT construct history-preserving Mirror candidate for PR249

on:
  push:
    branches:
      - execution/history-preserving-mirror-sync-pr249-v1
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qikvrt-construct-mirror-pr249-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  construct:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'execution/history-preserving-mirror-sync-pr249-v1'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify exact owner-authorized transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_construct_history_preserving_mirror_candidate_pr249
          python3 -B tools/qikvrt_construct_history_preserving_mirror_candidate_pr249.py --check-request --json
      - name: Construct and attach exact one-parent candidate
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/qikvrt-mirror-pr249-candidate.json"
          python3 -B tools/qikvrt_construct_history_preserving_mirror_candidate_pr249.py --json | tee "$result"
          grep -F '"sole_parent_verified": true' "$result"
          grep -F '"authority_tree_equality_verified": true' "$result"
          grep -F '"repository_manifest_git_blob_sha1": "bcfa9f5f91bddf17328edbe22afa44b4dc1ebeff"' "$result"
          grep -F '"repository_content_tree_sha256": "1116331256858d9b4206f9e80f6d1db2e6a67c5a8bd86a4bfba53c893655d0c0"' "$result"
          grep -F '"mirror_promoted": false' "$result"
          grep -F '"reciprocal_equality_receipt_materialized": false' "$result"
          grep -F '"zenodo_mutation_authorized": false' "$result"
          grep -F '"proof_corpus_published_on_zenodo": false' "$result"
          grep -F '"pass": false' "$result"
          grep -F '"final_pass": false' "$result"
          grep -F '"effect_ack_done": false' "$result"
          {
            echo '## History-preserving Mirror candidate'
            echo
            echo '```json'
            cat "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
