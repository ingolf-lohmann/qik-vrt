name: QIKVRT Batch-003 remaining subject disposition

on:
  push:
    branches:
      - agent/batch003-subject-172dd-public-freeze-probe
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      archive_retry_evidence_path:
        description: Versioned, original-failure-bound external response evidence
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: qikvrt-batch003-remaining-disposition-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      QIKVRT_ARCHIVE_JOURNAL_REPOSITORY: ${{ github.repository }}
      QIKVRT_ARCHIVE_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      QIKVRT_GITHUB_TOKEN: ${{ github.token }}
      QIKVRT_ARCHIVE_RETRY_EVIDENCE_FILE: ${{ inputs.archive_retry_evidence_path || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ env.QIKVRT_ARCHIVE_SOURCE_HEAD }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        id: python
        with:
          python-version: '3.12'
      - name: Set up standalone Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify standalone runtime for complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          sh tools/bootstrap-runtime.sh --check-only --profile self-host --adapter none
          python3 -I -c 'import sys; assert sys.platform == "linux" and sys.version_info[:2] == (3, 12), "LINUX_NODE24_PYTHON312_REQUIRED"'
          node --version
          python3 --version
          git rev-parse --verify HEAD
          git rev-parse --verify HEAD^{tree}
      - name: Classify archive admission before materialization
        id: archive_preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
            --preflight --json | tee "$RUNNER_TEMP/qikvrt-archive-preflight.json"
          python3 - "$RUNNER_TEMP/qikvrt-archive-preflight.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as stream:
              result = json.load(stream)
          admitted = result.get('materialization_admitted')
          if (result.get('schema') != 'qikvrt_remaining_archive_admission_v1'
                  or type(admitted) is not bool
                  or result.get('state') != ('READY' if admitted else 'NOOP')
                  or result.get('external_get_count') != 0
                  or result.get('materialization_started') is not False):
              raise SystemExit('ARCHIVE_PREFLIGHT_OUTPUT_INVALID')
          print('admitted=' + str(admitted).lower())
          PY
      - name: Materialize all remaining subject dispositions read-only
        id: archive_materialization
        if: steps.archive_preflight.outputs.admitted == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives \
            --materialize --json \
            | tee /tmp/qikvrt-remaining-disposition.log
          grep -F '"pass": false' /tmp/qikvrt-remaining-disposition.log
          grep -F '"final_pass": false' /tmp/qikvrt-remaining-disposition.log
          grep -F '"effect_ack_done": false' /tmp/qikvrt-remaining-disposition.log
          grep -F '"zenodo_mutation_authorized": false' /tmp/qikvrt-remaining-disposition.log
          grep -F '"proof_corpus_published_on_zenodo": false' /tmp/qikvrt-remaining-disposition.log
      - name: Preserve archive causal diagnostics even when access is blocked
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-archive-causal-journal-disposition-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          include-hidden-files: true
          path: .qikvrt/runtime/archive-get-journal/**
      - name: Verify deterministic materialization without network
        id: offline_disposition
        # Verify committed evidence even after archive HOLD; never claim a new
        # public readback or hide drift/partial materialization behind success.
        if: >-
          !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m tools.qikvrt_content_disposition_batch_003_remaining_archives --check --json
          python3 -B tools/qikvrt_content_disposition_batch_003_dispatch.py --check-status-projection --json
      - name: Regenerate and verify repository integrity
        id: repository_integrity
        if: >-
          !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qikvrt_integrity.py generate
          python3 tools/qikvrt_integrity.py verify
      - name: Run complete repository gates
        id: repository_gates
        if: >-
          !cancelled() && steps.checkout.outcome == 'success' && steps.python.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          make test repository-monitor-test self-host-test
          python3 tools/qikvrt_integrity.py verify
      - name: Persist exact evidence head
        if: ${{ success() && steps.archive_preflight.outputs.admitted == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-b4849e1a2d6b2270 \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-7956d8acdc473825 \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-ce2390f18618ad0c \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-780b9bf86425cee3 \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/subject-dispositions/SUBJECT-7fdb36aa7c07c07d \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-003/CONTENT_DISPOSITION_BATCH_003_RECEIPT.json \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/retrospective-proof-corpus \
            work-units/CREATE_VERSIONED_CORRECTED_CANDIDATES_REMAINING_CORPUS_SUBJECTS.json \
            work-units/REQUEST_SEPARATE_ZENODO_MUTATION_AUTHORIZATION_RETROSPECTIVE_PROOF_CORPUS.json \
            AI_PROGRESS.json \
            AI_STATUS.md \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'Evidence is already byte-current.'
            exit 0
          fi
          git commit -m 'evidence: disposition remaining Zenodo subjects and verify proof corpus'
          git push origin "HEAD:$TARGET_REF"

