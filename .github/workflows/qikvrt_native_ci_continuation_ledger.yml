name: QIKVRT native CI continuation ledger
on:
  workflow_run:
    workflows: ["QIKVRT CI", "QIKVRT Collective Proposal Review"]
    types: [completed]
permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
jobs:
  record-terminal-evidence:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Bind completed run and persist unresolved gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          # Event-driven: consume each terminal native workflow completion.
          # No polling schedule, timer, or fabricated success state.
          test -n "$RUN_ID"
          candidates="$RUN_ID"
          for run_id in $candidates; do
            actual="$(gh api "repos/$GH_REPO/actions/runs/$run_id")"
            subject="$(jq -r '.head_sha' <<< "$actual")"
            conclusion="$(jq -r '.conclusion' <<< "$actual")"
            url="$(jq -r '.html_url' <<< "$actual")"
            event="$(jq -r '.event' <<< "$actual")"
            workflow_name="$(jq -r '.name' <<< "$actual")"
            test "$event" = pull_request || continue
            test "$conclusion" != null || continue
            if test -n "${RUN_ID:-}"; then
              test "$subject" = "$RUN_SHA"
              test "$conclusion" = "$RUN_CONCLUSION"
            fi
            # A commit previously associated with a PR is NOT sufficient.
            # The current open PR head must equal the exact completed subject.
            prs="$(gh api "repos/$GH_REPO/commits/$subject/pulls" --jq '.[] | select(.state == "open" and .head.sha == "'$subject'") | .number')"
            if test -z "$prs"; then
              echo "STALE_OR_UNBOUND run=$run_id head=$subject"
              continue
            fi
            title="QIKVRT $workflow_name terminal gate: $subject"
            existing="$(gh issue list --state all --limit 100 --search "$subject in:title" --json number,title | jq -r --arg title "$title" '.[] | select(.title == $title) | .number' | head -n 1)"
            if test "$conclusion" = success; then
              if test -n "$existing"; then
                gh issue comment "$existing" --body "Exact-head CI succeeded: $url. This does not certify merge, Main CI, host, domain or publication."
                gh issue close "$existing" --reason completed
              fi
              echo "CI_SUCCESS run=$run_id head=$subject; remaining DoD gates are separate"
              continue
            fi
            # Retry only an explicitly timed-out run, once per run ID.
            # Never retry deterministic test failures, cancellations or stale heads.
            attempt="$(jq -r '.run_attempt' <<< "$actual")"
            if test "$conclusion" = timed_out && test "$attempt" = 1; then
              if gh api -X POST "repos/$GH_REPO/actions/runs/$run_id/rerun-failed-jobs" >/dev/null; then
                echo "BOUNDED_TIMEOUT_RETRY run=$run_id head=$subject attempt=1"
              else
                echo "TIMEOUT_RETRY_NOT_ADMITTED run=$run_id" >&2
              fi
            fi
            failed_steps="$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | (.name + ": " + ([.steps[]? | select(.conclusion == "failure") | .name] | join(", ")))] | join("; ")')"
            # Persist an actionable observation and a bounded hypothesis for
            # the next iteration, without pretending that diagnosis is repair.
            learning="Unclassified failure: inspect the failed native step and attach a reproducible correction."
            if [[ "$failed_steps" == *"Run mandatory repository test suite"* ]]; then
              learning="Hypothesis: repository integrity manifest is stale. Verify the exact failure log; if it reports deterministic regeneration drift, materialize only the canonical manifest trio before the mandatory suite. Require a fresh exact-head native CI after any change."
            elif [[ "$failed_steps" == *"Same-writer successor re-entry to tested fixpoint"* ]]; then
              learning="Hypothesis: the bounded integrity writer failed or timed out. Read back the writer's last iteration, remote head, manifest verification and TESTED_SUBJECT; do not reset the subject blindly."
            fi
            body="$(printf 'Native CI requires continuation.\n\nRun: %s\nExact HEAD: %s\nConclusion: %s\nFailed jobs/steps: %s\n\nLearning for next iteration: %s\n\nNext gate: diagnose, apply bounded authorized repair, re-run exact-head CI, verify governance, integrate and read back. No merge or production effect is inferred.\n' "$url" "$subject" "$conclusion" "$failed_steps" "$learning")
            if test -n "$existing"; then
              gh issue comment "$existing" --body "$body"
              if gh issue view "$existing" --json state --jq '.state' | grep -qx CLOSED; then
                gh issue reopen "$existing"
              fi
            else
              gh issue create --title "$title" --body "$body"
            fi
          done
