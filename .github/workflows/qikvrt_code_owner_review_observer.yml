name: QIKVRT code-owner review observer

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions: {}

jobs:
  signal:
    name: Review event observed (no enforcement or approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate pull-request event selector without repository access
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          pr = event.get("pull_request") or {}
          number = pr.get("number")
          if not isinstance(number, int) or number <= 0:
              raise SystemExit("BLOCK: pull-request number is unavailable")
          if pr.get("base", {}).get("ref") != "main":
              raise SystemExit("BLOCK: pull request is not based on main")
          print(f"EVENT_OBSERVED_ONLY: PR #{number}; native enforcement and independent approval NOT_EVALUATED")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as stream:
                  stream.write("## Review event observation only\n\nSuccessful execution validates an event selector. Native Ruleset enforcement and independent Code Owner approval are NOT_EVALUATED. Governance acceptance requires the fresh `QIKVRT required code-owner review` status and native rules/reviews.\n")
          PY
