name: EMP integrity TEMDD diagnosis
on:
  pull_request:
    paths:
      - 'runtime/emp/**'
      - 'tests/test_emp_*.py'
      - 'tools/emp_integrity_diagnose.py'
      - 'docs/protocols/**'
      - '.github/workflows/emp-*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit regression
        run: python -m unittest -v tests.test_emp_integrity_diagnose
      - name: Produce deterministic TEMDD delta without modifying sealed files
        id: diagnose
        continue-on-error: true
        run: |
          python -m tools.emp_integrity_diagnose > "$RUNNER_TEMP/emp-integrity-delta.json"
      - name: Upload exact-head diagnosis
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: emp-integrity-delta-${{ github.sha }}
          path: ${{ runner.temp }}/emp-integrity-delta.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on unresolved drift
        if: ${{ steps.diagnose.outcome != 'success' }}
        run: |
          echo 'Repository integrity differs; no manifest regeneration or merge was authorized.'
          exit 1
