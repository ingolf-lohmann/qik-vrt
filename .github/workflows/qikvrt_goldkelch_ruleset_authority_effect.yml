name: QIKVRT Goldkelch ruleset authority effect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qikvrt_goldkelch_ruleset_authority_effect.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-goldkelch-ruleset-authority-effect-19344903
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPOSITORY: Goldkelch/qik-vrt
      RULESET_ID: "19344903"
      EXPECTED_PRE_SHA256: c6af530067c49e0d7bfa9512f081c5be291d33815cdcc76595a8bc24796d8e32
      EXPECTED_POST_SHA256: 45da27f3608b38f04b8252d7fc709a6337bff49d40fa2cf9baa4425dd36ec0dd
      ADMIN_TOKEN: ${{ secrets.QIKVRT_GITHUB_ADMIN_TOKEN }}

    steps:
      - name: Fail closed on authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ADMIN_TOKEN:-}"

      - name: Conditional canonical projection with exact readback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["TARGET_REPOSITORY"]
          ruleset_id = int(os.environ["RULESET_ID"])
          token = os.environ["ADMIN_TOKEN"]
          expected_pre = os.environ["EXPECTED_PRE_SHA256"]
          expected_post = os.environ["EXPECTED_POST_SHA256"]
          url = f"https://api.github.com/repos/{repo}/rulesets/{ruleset_id}"

          desired = {
              "name": "QIK-VRT main protection",
              "target": "branch",
              "enforcement": "active",
              "conditions": {
                  "ref_name": {
                      "exclude": [],
                      "include": ["refs/heads/main"],
                  }
              },
              "bypass_actors": [],
              "rules": [
                  {
                      "type": "pull_request",
                      "parameters": {
                          "allowed_merge_methods": ["merge", "squash", "rebase"],
                          "dismiss_stale_reviews_on_push": True,
                          "require_code_owner_review": True,
                          "require_extra_approval_for_unattributed_changes": True,
                          "require_last_push_approval": True,
                          "required_approving_review_count": 1,
                          "required_review_thread_resolution": True,
                          "required_reviewers": [],
                      },
                  },
                  {
                      "type": "required_status_checks",
                      "parameters": {
                          "do_not_enforce_on_create": False,
                          "required_status_checks": [
                              {
                                  "context": "QIKVRT required code-owner review",
                                  "integration_id": 15368,
                              },
                              {
                                  "context": "test",
                                  "integration_id": 15368,
                              },
                          ],
                          "strict_required_status_checks_policy": True,
                      },
                  },
                  {"type": "non_fast_forward"},
                  {"type": "deletion"},
              ],
          }

          def canonical_bytes(value):
              return (
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True,
                      indent=2,
                      allow_nan=False,
                  )
                  + "\n"
              ).encode("utf-8")

          def digest(value):
              return hashlib.sha256(canonical_bytes(value)).hexdigest()

          def normalize(value):
              rules = []
              for raw in value.get("rules") or []:
                  item = json.loads(json.dumps(raw))
                  parameters = item.get("parameters")
                  if isinstance(parameters, dict):
                      checks = parameters.get("required_status_checks")
                      if isinstance(checks, list):
                          parameters["required_status_checks"] = sorted(
                              checks,
                              key=lambda check: (
                                  str(check.get("context", "")),
                                  int(check.get("integration_id") or 0),
                              ),
                          )
                      reviewers = parameters.get("required_reviewers")
                      if isinstance(reviewers, list):
                          parameters["required_reviewers"] = sorted(
                              reviewers,
                              key=lambda reviewer: json.dumps(
                                  reviewer, sort_keys=True
                              ),
                          )
                  rules.append(item)
              return {
                  "name": value.get("name"),
                  "target": value.get("target"),
                  "enforcement": value.get("enforcement"),
                  "conditions": value.get("conditions"),
                  "bypass_actors": value.get("bypass_actors") or [],
                  "rules": sorted(rules, key=lambda item: item["type"]),
              }

          def request(method, *, payload=None, etag=None):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if etag:
                  headers["If-Match"] = etag
              data = canonical_bytes(payload) if payload is not None else None
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  url, data=data, method=method, headers=headers
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      value = json.load(response)
                      return value, response.headers.get("ETag")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub ruleset API HTTP {exc.code}: {detail}"
                  ) from exc

          desired_hash = digest(normalize(desired))
          if desired_hash != expected_post:
              raise SystemExit(
                  f"desired digest mismatch: {desired_hash} != {expected_post}"
              )

          initial, initial_etag = request("GET")
          if initial.get("id") != ruleset_id or initial.get("source") != repo:
              raise SystemExit("ruleset identity/source mismatch")

          pre_hash = digest(normalize(initial))
          if pre_hash == expected_post:
              print(json.dumps({
                  "state": "CURRENT",
                  "mutation": "NONE",
                  "pre_sha256": pre_hash,
                  "post_sha256": pre_hash,
                  "effect_observed": True,
              }, sort_keys=True))
              raise SystemExit(0)

          if pre_hash != expected_pre:
              raise SystemExit(
                  f"unexpected pre-state drift: {pre_hash} "
                  f"not in {{{expected_pre}, {expected_post}}}"
              )

          reobserved, reobserved_etag = request("GET")
          reobserved_hash = digest(normalize(reobserved))
          if reobserved_hash != pre_hash:
              raise SystemExit(
                  "ruleset drifted after planning; refusing mutation"
              )

          conditional_etag = reobserved_etag or initial_etag
          if not conditional_etag:
              raise SystemExit(
                  "ruleset response omitted ETag; conditional update unavailable"
              )

          request("PUT", payload=desired, etag=conditional_etag)

          observed, _ = request("GET")
          post_hash = digest(normalize(observed))
          if post_hash != expected_post:
              raise SystemExit(
                  f"post-effect digest mismatch: {post_hash} != {expected_post}"
              )

          print(json.dumps({
              "state": "CURRENT",
              "mutation": "PUT",
              "pre_sha256": pre_hash,
              "post_sha256": post_hash,
              "effect_observed": True,
          }, sort_keys=True))
          PY
