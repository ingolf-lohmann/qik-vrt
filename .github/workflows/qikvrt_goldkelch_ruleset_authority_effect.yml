name: QIKVRT Goldkelch ruleset authority effect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qikvrt_goldkelch_ruleset_authority_effect.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-goldkelch-ruleset-authority-effect-19344903
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_REPOSITORY: ${{ github.repository }}
      RULESET_NAME: "QIK-VRT main protection"
      EXPECTED_POST_SHA256: 79557f204ba7aae51c530d5555cb9b8dee5213c26525cdd57677c2abe9493011
      RULESET_ADMIN_TOKEN: ${{ secrets.QIKVRT_RULESET_ADMIN_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.QIKVRT_GITHUB_ADMIN_TOKEN }}
      MESH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN }}
      RULESET_APP_ID: ${{ vars.QIKVRT_RULESET_APP_ID }}
      RULESET_APP_PRIVATE_KEY: ${{ secrets.QIKVRT_RULESET_APP_PRIVATE_KEY }}

    steps:
      - name: Resolve least-privilege authority route
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          direct=false
          app=false
          if [ -n "${RULESET_ADMIN_TOKEN:-}${ADMIN_TOKEN:-}${MESH_TOKEN:-}" ]; then
            direct=true
          fi
          if [ -n "${RULESET_APP_ID:-}" ] && [ -n "${RULESET_APP_PRIVATE_KEY:-}" ]; then
            app=true
          fi
          echo "direct=$direct" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          if [ "$direct" != true ] && [ "$app" != true ]; then
            echo "No repository-provided authority credential route is configured." >&2
            exit 2
          fi

      - name: Mint target-scoped GitHub App administration token
        id: app-token
        if: steps.authority.outputs.direct != 'true' && steps.authority.outputs.app == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.QIKVRT_RULESET_APP_ID }}
          private-key: ${{ secrets.QIKVRT_RULESET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: write

      - name: Conditional canonical projection with exact readback
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["TARGET_REPOSITORY"]
          ruleset_name = os.environ["RULESET_NAME"]
          token = (os.environ.get("RULESET_ADMIN_TOKEN", "") or
                   os.environ.get("ADMIN_TOKEN", "") or
                   os.environ.get("MESH_TOKEN", "") or
                   os.environ.get("APP_TOKEN", ""))
          if not token:
              raise SystemExit("no authority token available")
          expected_post = os.environ["EXPECTED_POST_SHA256"]
          collection_url = f"https://api.github.com/repos/{repo}/rulesets"
          url = None

          desired = {
              "name": "QIK-VRT main protection",
              "target": "branch",
              "enforcement": "active",
              "conditions": {
                  "ref_name": {
                      "exclude": [],
                      "include": ["refs/heads/main"],
                  }
              },
              "bypass_actors": [],
              "rules": [
                  {
                      "type": "pull_request",
                      "parameters": {
                          "allowed_merge_methods": ["merge", "squash", "rebase"],
                          "dismiss_stale_reviews_on_push": True,
                          "require_code_owner_review": True,
                          "require_extra_approval_for_unattributed_changes": True,
                          "require_last_push_approval": True,
                          "required_approving_review_count": 1,
                          "required_review_thread_resolution": True,
                          "required_reviewers": [],
                      },
                  },
                  {
                      "type": "required_status_checks",
                      "parameters": {
                          "do_not_enforce_on_create": False,
                          "required_status_checks": [
                              {
                                  # Canonical commit status from REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json.
                                  "context": "QIKVRT requested review execution",
                                  "integration_id": 15368,
                              },
                              {
                                  "context": "test",
                                  "integration_id": 15368,
                              },
                          ],
                          "strict_required_status_checks_policy": True,
                      },
                  },
                  {"type": "non_fast_forward"},
                  {"type": "deletion"},
              ],
          }

          def canonical_bytes(value):
              return (
                  json.dumps(
                      value,
                      ensure_ascii=False,
                      sort_keys=True,
                      indent=2,
                      allow_nan=False,
                  )
                  + "\n"
              ).encode("utf-8")

          def digest(value):
              return hashlib.sha256(canonical_bytes(value)).hexdigest()

          def normalize(value):
              rules = []
              for raw in value.get("rules") or []:
                  item = json.loads(json.dumps(raw))
                  parameters = item.get("parameters")
                  if isinstance(parameters, dict):
                      checks = parameters.get("required_status_checks")
                      if isinstance(checks, list):
                          parameters["required_status_checks"] = sorted(
                              checks,
                              key=lambda check: (
                                  str(check.get("context", "")),
                                  int(check.get("integration_id") or 0),
                              ),
                          )
                      reviewers = parameters.get("required_reviewers")
                      if isinstance(reviewers, list):
                          parameters["required_reviewers"] = sorted(
                              reviewers,
                              key=lambda reviewer: json.dumps(
                                  reviewer, sort_keys=True
                              ),
                          )
                  rules.append(item)
              return {
                  "name": value.get("name"),
                  "target": value.get("target"),
                  "enforcement": value.get("enforcement"),
                  "conditions": value.get("conditions"),
                  "bypass_actors": value.get("bypass_actors") or [],
                  "rules": sorted(rules, key=lambda item: item["type"]),
              }

          def request(method, *, payload=None, etag=None, request_url=None):
              headers = {
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + token,
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if etag:
                  headers["If-Match"] = etag
              data = canonical_bytes(payload) if payload is not None else None
              if data is not None:
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(
                  request_url or url, data=data, method=method, headers=headers
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      value = json.load(response)
                      return value, response.headers.get("ETag")
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(
                      f"GitHub ruleset API HTTP {exc.code}: {detail}"
                  ) from exc

          desired_hash = digest(normalize(desired))
          if desired_hash != expected_post:
              raise SystemExit(
                  f"desired digest mismatch: {desired_hash} != {expected_post}"
              )

          collection, _ = request("GET", request_url=collection_url)
          matching = [item for item in collection if item.get("name") == ruleset_name]
          if len(matching) > 1:
              raise SystemExit("multiple matching rulesets; refusing mutation")

          if not matching:
              created, _ = request("POST", payload=desired, request_url=collection_url)
              ruleset_id = created.get("id")
              if not isinstance(ruleset_id, int):
                  raise SystemExit("ruleset create omitted numeric id")
              url = f"https://api.github.com/repos/{repo}/rulesets/{ruleset_id}"
              mutation = "POST"
              pre_hash = None
          else:
              ruleset_id = matching[0].get("id")
              if not isinstance(ruleset_id, int):
                  raise SystemExit("matching ruleset omitted numeric id")
              url = f"https://api.github.com/repos/{repo}/rulesets/{ruleset_id}"
              initial, initial_etag = request("GET")
              if initial.get("id") != ruleset_id or initial.get("source") != repo:
                  raise SystemExit("ruleset identity/source mismatch")
              pre_hash = digest(normalize(initial))
              if pre_hash == expected_post:
                  print(json.dumps({
                      "state": "CURRENT",
                      "mutation": "NONE",
                      "ruleset_id": ruleset_id,
                      "pre_sha256": pre_hash,
                      "post_sha256": pre_hash,
                      "effect_observed": True,
                  }, sort_keys=True))
                  raise SystemExit(0)
              reobserved, reobserved_etag = request("GET")
              reobserved_hash = digest(normalize(reobserved))
              if reobserved_hash != pre_hash:
                  raise SystemExit("ruleset drifted after planning; refusing mutation")
              conditional_etag = reobserved_etag or initial_etag
              if not conditional_etag:
                  raise SystemExit("ruleset response omitted ETag; conditional update unavailable")
              request("PUT", payload=desired, etag=conditional_etag)
              mutation = "PUT"

          observed, _ = request("GET")
          post_hash = digest(normalize(observed))
          if post_hash != expected_post:
              raise SystemExit(
                  f"post-effect digest mismatch: {post_hash} != {expected_post}"
              )

          print(json.dumps({
              "state": "CURRENT",
              "mutation": mutation,
              "ruleset_id": ruleset_id,
              "pre_sha256": pre_hash,
              "post_sha256": post_hash,
              "effect_observed": True,
          }, sort_keys=True))
          PY
