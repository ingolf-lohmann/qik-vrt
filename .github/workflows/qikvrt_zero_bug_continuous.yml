name: QIKVRT zero-bug continuous invariant

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qikvrt-zero-bug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact observed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact head and tree
        id: bind
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          head="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          test "$head" = "$expected"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"

      - name: Verify zero-bug policy self-check
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_zero_bug.py --self-check | tee /tmp/qikvrt-zero-bug-self-check.json

      - name: Run bound zero-bug regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v \
            tests.test_qikvrt_zero_bug \
            tests.test_qikvrt_perfect_optimum \
            tests.test_qikvrt_bit_audit \
            tests.test_qikvrt_repository_writer_lease
          touch /tmp/qikvrt-regressions.ok
          touch /tmp/qikvrt-writer-lease.ok

      - name: Verify deterministic repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py verify
          touch /tmp/qikvrt-integrity.ok

      - name: Run complete deterministic repository gates
        shell: bash
        run: |
          set -euo pipefail
          make test
          touch /tmp/qikvrt-full-tests.ok

      - name: Audit every tracked Git object byte
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_bit_audit.py \
            --head '${{ steps.bind.outputs.head }}' \
            --receipt /tmp/qikvrt-bit-audit.json \
            --inventory /tmp/qikvrt-bit-inventory.jsonl

      - name: Derive local exact-head zero-bug state only from measured evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_zero_bug.py --derive \
            --head '${{ steps.bind.outputs.head }}' \
            --tree '${{ steps.bind.outputs.tree }}' \
            --expected-head '${{ github.event.pull_request.head.sha || github.sha }}' \
            --bit-audit /tmp/qikvrt-bit-audit.json \
            --regressions-marker /tmp/qikvrt-regressions.ok \
            --integrity-marker /tmp/qikvrt-integrity.ok \
            --tests-marker /tmp/qikvrt-full-tests.ok \
            --writer-lease-marker /tmp/qikvrt-writer-lease.ok \
            --write-observation /tmp/qikvrt-zero-bug-observation.json \
            | tee /tmp/qikvrt-zero-bug-receipt.json

      - name: Reobserve exact head and immutable worktree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = '${{ steps.bind.outputs.head }}'
          test "$(git rev-parse --verify HEAD^{tree})" = '${{ steps.bind.outputs.tree }}'
          test -z "$(git status --porcelain)"

      - name: Preserve exact-head local audit bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-zero-bug-local-${{ steps.bind.outputs.head }}
          path: |
            /tmp/qikvrt-zero-bug-self-check.json
            /tmp/qikvrt-zero-bug-observation.json
            /tmp/qikvrt-zero-bug-receipt.json
            /tmp/qikvrt-bit-audit.json
            /tmp/qikvrt-bit-inventory.jsonl
          if-no-files-found: error
          retention-days: 14
