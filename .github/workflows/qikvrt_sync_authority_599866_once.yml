# One-shot self-removing exact-tree synchronizer.
name: QIKVRT one-shot Authority global completion sync

on:
  push:
    branches:
      - sync/authority-599866-global-completion
    paths:
      - .github/workflows/qikvrt_sync_authority_599866_once.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/qikvrt_sync_authority_599866_once.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: qikvrt-sync-authority-599866-global-completion
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact Mirror synchronization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sync/authority-599866-global-completion
          fetch-depth: 0
      - name: Create a Mirror-history commit with the exact Authority tree
        shell: bash
        run: |
          set -euo pipefail
          authority_repository='Goldkelch/qik-vrt'
          authority_commit='599866689400bcb825e5534bd85e4653db44432f'
          target_ref='refs/heads/sync/authority-599866-global-completion'
          remote_main="$(git ls-remote "https://github.com/${authority_repository}.git" refs/heads/main | cut -f1)"
          [ "$remote_main" = "$authority_commit" ] || {
            echo "BLOCK: Authority main moved: $remote_main" >&2
            exit 1
          }
          git fetch --no-tags "https://github.com/${authority_repository}.git" "$authority_commit"
          [ "$(git rev-parse FETCH_HEAD)" = "$authority_commit" ]
          authority_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          parent="$(git rev-parse HEAD)"
          export GIT_AUTHOR_NAME='qikvrt-mirror-sync[bot]'
          export GIT_AUTHOR_EMAIL='qikvrt-mirror-sync[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          new_commit="$(printf '%s\n' \
            'Synchronize Mirror to Authority global completion tree 59986668' \
            '' \
            "Authority commit: $authority_commit" \
            "Authority tree: $authority_tree" \
            | git commit-tree "$authority_tree" -p "$parent")"
          [ "$(git rev-parse "${new_commit}^{tree}")" = "$authority_tree" ]
          git push origin "$new_commit:$target_ref"
          printf 'AUTHORITY_COMMIT=%s\nSHARED_TREE=%s\nMIRROR_HEAD=%s\n' \
            "$authority_commit" "$authority_tree" "$new_commit"
