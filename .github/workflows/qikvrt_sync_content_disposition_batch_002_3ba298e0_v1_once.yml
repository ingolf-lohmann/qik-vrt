name: QIK-VRT exact-tree Batch-002 Mirror sync 3ba298e0 v1
on:
  push:
    branches:
      - trusted/trigger-content-disposition-batch-002-sync-3ba298e0-v1
    paths:
      - .github/workflows/qikvrt_sync_content_disposition_batch_002_3ba298e0_v1_once.yml
permissions:
  contents: write
concurrency:
  group: qikvrt-sync-content-disposition-batch-002-3ba298e0-v1
  cancel-in-progress: false
jobs:
  construct-exact-authority-tree:
    if: github.repository == 'ingolf-lohmann/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
      EXPECTED_AUTHORITY_MAIN: 3ba298e09753a5096c65ec09f82a3b568bd30efa
      EXPECTED_MIRROR_MAIN: 1bb5af6597e1d90075396a9abf6c61e993388a59
      TRIGGER_BRANCH: trusted/trigger-content-disposition-batch-002-sync-3ba298e0-v1
      WORKFLOW_PATH: .github/workflows/qikvrt_sync_content_disposition_batch_002_3ba298e0_v1_once.yml
      TARGET_BRANCH: sync/content-disposition-batch-002-3ba298e0-v1
      FIXED_GIT_DATE: '2026-07-28T20:50:00+02:00'
    steps:
      - name: Check out exact Mirror trigger branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: trusted/trigger-content-disposition-batch-002-sync-3ba298e0-v1
          fetch-depth: 0
          persist-credentials: false
      - name: Construct, verify and persist exact Authority tree
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = 'ingolf-lohmann/qik-vrt' ]
          [ "$GITHUB_REF_NAME" = "$TRIGGER_BRANCH" ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MIRROR_MAIN" ]
          [ "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_MIRROR_MAIN" ]
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MIRROR_MAIN" HEAD -- | LC_ALL=C sort)
          [ "${#changed[@]}" -eq 1 ]
          [ "${changed[0]}" = "$WORKFLOW_PATH" ]
          [ -n "$PUSH_TOKEN" ]
          git remote add authority "https://github.com/${AUTHORITY_REPOSITORY}.git"
          observed_authority="$(git ls-remote authority refs/heads/main | cut -f1)"
          [ "$observed_authority" = "$EXPECTED_AUTHORITY_MAIN" ]
          git fetch --no-tags authority "$EXPECTED_AUTHORITY_MAIN"
          authority_tree="$(git rev-parse "$EXPECTED_AUTHORITY_MAIN^{tree}")"
          message_file="$RUNNER_TEMP/qikvrt-sync-message.txt"
          cat > "$message_file" <<EOF
          Synchronize content-disposition Batch 002 from Authority 3ba298e0

          Authority repository: $AUTHORITY_REPOSITORY
          Authority commit: $EXPECTED_AUTHORITY_MAIN
          Authority tree: $authority_tree
          Previous Mirror main: $EXPECTED_MIRROR_MAIN
          Semantics: preserve Mirror history as sole parent while replacing the complete content tree with the exact verified Authority tree.
          Batch-002 candidate byte freeze complete; terminal claim disposition remains incomplete.
          No PASS, FINAL_PASS or EFFECT_ACK_DONE is claimed.
          EOF
          sed -i 's/^          //' "$message_file"
          sync_commit="$(env GIT_AUTHOR_NAME='QIK-VRT Repository Mesh' GIT_AUTHOR_EMAIL='ingolf.lohmann@live.com' GIT_AUTHOR_DATE="$FIXED_GIT_DATE" GIT_COMMITTER_NAME='QIK-VRT Repository Mesh' GIT_COMMITTER_EMAIL='ingolf.lohmann@live.com' GIT_COMMITTER_DATE="$FIXED_GIT_DATE" git commit-tree "$authority_tree" -p "$EXPECTED_MIRROR_MAIN" < "$message_file")"
          [ "$(git rev-parse "$sync_commit^{tree}")" = "$authority_tree" ]
          [ "$(git show -s --format=%P "$sync_commit")" = "$EXPECTED_MIRROR_MAIN" ]
          git diff --exit-code "$EXPECTED_AUTHORITY_MAIN" "$sync_commit" --
          verify_root="$RUNNER_TEMP/qikvrt-batch-002-mirror-sync"
          git worktree add --detach "$verify_root" "$sync_commit"
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$verify_root/tools/qikvrt_integrity.py" verify
          python3 -B - <<'PY'
          import json, pathlib
          root=pathlib.Path("$verify_root")
          s=json.loads((root/'.well-known/qik-vrt-self-disclosure.json').read_text())
          assert s['state']=='AVAILABLE'
          assert s['completion_claims']=={'pass':False,'final_pass':False,'effect_ack_done':False}
          r=json.loads((root/'release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-002/public-candidate-byte-freeze/PUBLIC_CANDIDATE_BYTE_FREEZE_RECEIPT.json').read_text())
          assert r['record_count']==6 and r['file_count']==70
          assert r['completion_claims']['candidate_byte_freeze_complete'] is True
          assert r['completion_claims']['claim_disposition_complete'] is False
          PY
          push_url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$push_url" --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_MIRROR_MAIN" "$sync_commit:refs/heads/$TARGET_BRANCH"
          persisted="$(git ls-remote "$push_url" refs/heads/$TARGET_BRANCH | cut -f1)"
          [ "$persisted" = "$sync_commit" ]
          printf '%s\n' "authority_commit=$EXPECTED_AUTHORITY_MAIN" "authority_tree=$authority_tree" "previous_mirror_main=$EXPECTED_MIRROR_MAIN" "mirror_candidate=$persisted" "complete_file_diff_empty=true" >> "$GITHUB_STEP_SUMMARY"
