name: QIK-VRT exact-tree Batch-002 Mirror sync 3ba298e0 v3
on:
  push:
    branches:
      - trusted/trigger-content-disposition-batch-002-sync-3ba298e0-v1
    paths:
      - .github/workflows/qikvrt_sync_content_disposition_batch_002_3ba298e0_v1_once.yml
permissions:
  contents: write
concurrency:
  group: qikvrt-sync-content-disposition-batch-002-3ba298e0-v3
  cancel-in-progress: false
jobs:
  construct-exact-authority-tree:
    if: github.repository == 'ingolf-lohmann/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
      EXPECTED_AUTHORITY_MAIN: 3ba298e09753a5096c65ec09f82a3b568bd30efa
      EXPECTED_MIRROR_MAIN: 1bb5af6597e1d90075396a9abf6c61e993388a59
      TRIGGER_BRANCH: trusted/trigger-content-disposition-batch-002-sync-3ba298e0-v1
      WORKFLOW_PATH: .github/workflows/qikvrt_sync_content_disposition_batch_002_3ba298e0_v1_once.yml
      TARGET_BRANCH: sync/content-disposition-batch-002-3ba298e0-v1
      FIXED_GIT_DATE: '2026-07-28T21:20:00+02:00'
    steps:
      - name: Check out immutable event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind immutable event and frozen refs
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = 'ingolf-lohmann/qik-vrt' ]
          [ "$GITHUB_REF_NAME" = "$TRIGGER_BRANCH" ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [ -n "$PUSH_TOKEN" ]
          observed_mirror="$(git ls-remote origin refs/heads/main | cut -f1)"
          observed_target="$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)"
          [ "$observed_mirror" = "$EXPECTED_MIRROR_MAIN" ]
          [ "$observed_target" = "$EXPECTED_MIRROR_MAIN" ]

      - name: Validate execution-only trigger delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MIRROR_MAIN" "$GITHUB_SHA" -- | LC_ALL=C sort)
          printf 'changed_path=%s\n' "${changed[@]}"
          allowed=(
            "$WORKFLOW_PATH"
            "REPOSITORY_FILE_MANIFEST.json"
            "REPOSITORY_FILE_MANIFEST.json.sha256"
            "SHA256SUMS.txt"
          )
          for path in "${changed[@]}"; do
            ok=false
            for accepted in "${allowed[@]}"; do
              [ "$path" = "$accepted" ] && ok=true && break
            done
            [ "$ok" = true ]
          done
          printf '%s\n' "${changed[@]}" | grep -Fxq "$WORKFLOW_PATH"

      - name: Fetch frozen Authority head
        shell: bash
        run: |
          set -euo pipefail
          git remote remove authority 2>/dev/null || true
          git remote add authority "https://github.com/${AUTHORITY_REPOSITORY}.git"
          observed_authority="$(git ls-remote authority refs/heads/main | cut -f1)"
          [ "$observed_authority" = "$EXPECTED_AUTHORITY_MAIN" ]
          git fetch --no-tags authority "$EXPECTED_AUTHORITY_MAIN"
          authority_tree="$(git rev-parse "$EXPECTED_AUTHORITY_MAIN^{tree}")"
          echo "AUTHORITY_TREE=$authority_tree" >> "$GITHUB_ENV"

      - name: Construct history-preserving exact-tree candidate
        shell: bash
        run: |
          set -euo pipefail
          message_file="$RUNNER_TEMP/qikvrt-sync-message.txt"
          cat > "$message_file" <<EOF
          Synchronize content-disposition Batch 002 from Authority 3ba298e0

          Authority repository: $AUTHORITY_REPOSITORY
          Authority commit: $EXPECTED_AUTHORITY_MAIN
          Authority tree: $AUTHORITY_TREE
          Previous Mirror main: $EXPECTED_MIRROR_MAIN
          Semantics: preserve Mirror history as sole parent while replacing the complete content tree with the exact verified Authority tree.
          Batch-002 candidate byte freeze complete; terminal claim disposition remains incomplete.
          No PASS, FINAL_PASS or EFFECT_ACK_DONE is claimed.
          EOF
          sed -i 's/^          //' "$message_file"
          sync_commit="$(env \
            GIT_AUTHOR_NAME='QIK-VRT Repository Mesh' \
            GIT_AUTHOR_EMAIL='ingolf.lohmann@live.com' \
            GIT_AUTHOR_DATE="$FIXED_GIT_DATE" \
            GIT_COMMITTER_NAME='QIK-VRT Repository Mesh' \
            GIT_COMMITTER_EMAIL='ingolf.lohmann@live.com' \
            GIT_COMMITTER_DATE="$FIXED_GIT_DATE" \
            git commit-tree "$AUTHORITY_TREE" -p "$EXPECTED_MIRROR_MAIN" < "$message_file")"
          [ "$(git rev-parse "$sync_commit^{tree}")" = "$AUTHORITY_TREE" ]
          [ "$(git show -s --format=%P "$sync_commit")" = "$EXPECTED_MIRROR_MAIN" ]
          git diff --exit-code "$EXPECTED_AUTHORITY_MAIN" "$sync_commit" --
          echo "SYNC_COMMIT=$sync_commit" >> "$GITHUB_ENV"

      - name: Verify repository integrity and Batch-002 truth boundary
        shell: bash
        run: |
          set -euo pipefail
          verify_root="$RUNNER_TEMP/qikvrt-batch-002-mirror-sync"
          git worktree add --detach "$verify_root" "$SYNC_COMMIT"
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$verify_root/tools/qikvrt_integrity.py" verify
          VERIFY_ROOT="$verify_root" python3 -B - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['VERIFY_ROOT'])
          disclosure = json.loads((root / '.well-known/qik-vrt-self-disclosure.json').read_text())
          assert disclosure['state'] == 'AVAILABLE'
          assert disclosure['completion_claims'] == {
              'pass': False,
              'final_pass': False,
              'effect_ack_done': False,
          }
          receipt = json.loads((root / 'release/zenodo-corpus-proof-2026-07-28/canonical-union/content-disposition-batch-002/public-candidate-byte-freeze/PUBLIC_CANDIDATE_BYTE_FREEZE_RECEIPT.json').read_text())
          assert receipt['record_count'] == 6
          assert receipt['file_count'] == 70
          assert receipt['completion_claims']['candidate_byte_freeze_complete'] is True
          assert receipt['completion_claims']['claim_disposition_complete'] is False
          PY

      - name: Persist exact Mirror candidate under frozen lease
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          push_url="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$push_url" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_MIRROR_MAIN" \
            "$SYNC_COMMIT:refs/heads/$TARGET_BRANCH"
          persisted="$(git ls-remote "$push_url" refs/heads/$TARGET_BRANCH | cut -f1)"
          [ "$persisted" = "$SYNC_COMMIT" ]
          echo "PERSISTED_CANDIDATE=$persisted" >> "$GITHUB_ENV"

      - name: Emit synchronization receipt
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "authority_commit=$EXPECTED_AUTHORITY_MAIN" \
            "authority_tree=$AUTHORITY_TREE" \
            "previous_mirror_main=$EXPECTED_MIRROR_MAIN" \
            "mirror_candidate=$PERSISTED_CANDIDATE" \
            "candidate_parent_verified=true" \
            "complete_file_diff_empty=true" \
            "repository_integrity_verified=true" \
            "candidate_byte_freeze_complete=true" \
            "claim_disposition_complete=false" \
            "PASS=false" \
            "FINAL_PASS=false" \
            "EFFECT_ACK_DONE=false" >> "$GITHUB_STEP_SUMMARY"
