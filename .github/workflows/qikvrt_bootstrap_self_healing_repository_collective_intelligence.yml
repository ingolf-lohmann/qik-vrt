name: QIK-VRT bootstrap self-healing repository publication once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/qikvrt_bootstrap_self_healing_repository_collective_intelligence.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-bootstrap-self-healing-repository-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/self-healing-repository-collective-intelligence-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and verify exact Authority bytes
        env:
          AUTHORITY_COMMIT: f2a0843c05037f31f44f72d5c127111bdde55f78
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import hashlib
          import os
          import urllib.request
          from pathlib import Path

          commit = os.environ['AUTHORITY_COMMIT']
          prefix = f'https://raw.githubusercontent.com/Goldkelch/qik-vrt/{commit}/'
          paths = [
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/ARTICLE_WHATSAPP_DE.md',
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/README.md',
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/EDITORIAL_NOTE.md',
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/CLAIM_MATRIX.json',
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/SOURCE_EVIDENCE_BINDINGS.json',
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/EVIDENCE_BOUNDARY.md',
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/BOUNDARY_TEST_REPORT.json',
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/CITATION.cff',
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/LICENSE_NOTICE.md',
              'docs/publications/2026-08-06-self-healing-repository-collective-intelligence/verify_package.py',
              'release/self-healing-repository-collective-intelligence-zenodo-v1/CLAIM_MATRIX_V2.json',
              'release/self-healing-repository-collective-intelligence-zenodo-v1/MACHINE_PROOF_BUNDLE.json',
              'release/self-healing-repository-collective-intelligence-zenodo-v1/PREPUBLICATION_RETURN_RECEIPT.json',
              'release/self-healing-repository-collective-intelligence-zenodo-v1/ZENODO_FILESET.md',
              'release/self-healing-repository-collective-intelligence-zenodo-v1/ZENODO_LICENSE_NOTICE.md',
              'release/self-healing-repository-collective-intelligence-zenodo-v1/ZENODO_METADATA.json',
              'release/self-healing-repository-collective-intelligence-zenodo-v1/ZENODO_SHA256SUMS',
              'work-units/REQUEST_EXACT_ZENODO_AUTHORIZATION_SELF_HEALING_REPOSITORY_V1.json',
          ]
          expected = {
              paths[0]: '83200d3e23d4bc2e17459f4df506cb823b3e08318dac5f0fdd7635739a94387d',
              paths[3]: '76860dc0bb06a9de132da9e0e6c805d3b344d703794219fde1b16c6c7c788e59',
              paths[4]: 'e868413678c146161d637e9f7a51ddb2a23ef437858774520345b520c576c1a1',
              paths[5]: 'b49254b7890e5b61fe3607f6bc48a4c2545d8f4274396a0504f1032351b7f0dd',
              paths[6]: '2351fc2489ae59f357e5d679801b43acdf1bfb1d4a5b5f6fc2fc31bbf3c3746b',
              paths[11]: '4fa477b9b2160382c1c231911e0bae20db05471599352c247a390672bb4fd5cc',
              paths[12]: '7d056139f355e1b81bdf040ff674e2fc0c69d66f3477f87eb38d7d6ff48513b9',
              paths[15]: 'acebc139ecda233dc9b47fdf565f2fbbeea8340ea045cc842d363e7f3a6e12f6',
          }
          for path in paths:
              with urllib.request.urlopen(prefix + path, timeout=60) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              if path in expected and digest != expected[path]:
                  raise SystemExit(f'BLOCK hash mismatch {path}: {digest}')
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          Path(paths[9]).chmod(0o755)
          print(f'OK materialized {len(paths)} exact Authority paths from {commit}')
          PY
          python3 -B docs/publications/2026-08-06-self-healing-repository-collective-intelligence/verify_package.py
          rm .github/workflows/qikvrt_bootstrap_self_healing_repository_collective_intelligence.yml
          git config user.name 'qik-vrt mirror bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A \
            docs/publications/2026-08-06-self-healing-repository-collective-intelligence \
            release/self-healing-repository-collective-intelligence-zenodo-v1 \
            work-units/REQUEST_EXACT_ZENODO_AUTHORIZATION_SELF_HEALING_REPOSITORY_V1.json \
            .github/workflows/qikvrt_bootstrap_self_healing_repository_collective_intelligence.yml
          git commit -m 'docs: mirror exact full-sphere article and Zenodo candidate'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
