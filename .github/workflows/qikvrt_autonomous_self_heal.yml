name: QIK-VRT autonomous bounded self-heal

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qikvrt-autonomous-self-heal-${{ github.repository }}
  cancel-in-progress: false

jobs:
  observe-repair-propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Execute bounded repository-native repairs
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_autonomous_self_heal.py apply > /tmp/qikvrt-self-heal.json
          cat /tmp/qikvrt-self-heal.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open('/tmp/qikvrt-self-heal.json', encoding='utf-8'))
          print(f"state={value['state']}")
          print(f"base_sha={value.get('observed_base_revision') or ''}")
          print(f"fingerprint={value.get('semantic_fingerprint') or ''}")
          print(f"candidate_id={value.get('candidate_identity') or ''}")
          PY

      - name: Verify repaired repository state
        if: steps.repair.outputs.state == 'CANDIDATE_READY'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_anticipation.py check
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest -v tests.test_qikvrt_autonomous_self_heal
          test -z "$(git diff --name-only -- . | grep -v -E '^(anticipation/(current.json|history.jsonl|trends.json|derivatives.json|next-effect.json)|receipts/anticipation/000[12]-[^/]+\.json|REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt)$' || true)"

      - name: Create one base-and-fingerprint-bound draft repair PR
        if: steps.repair.outputs.state == 'CANDIDATE_READY'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.repair.outputs.base_sha }}
          FINGERPRINT: ${{ steps.repair.outputs.fingerprint }}
          CANDIDATE_ID: ${{ steps.repair.outputs.candidate_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$FINGERPRINT"
          test -n "$CANDIDATE_ID"
          test "$(git rev-parse --verify HEAD^{commit})" = "$BASE_SHA"
          branch="automation/self-heal-${CANDIDATE_ID:0:24}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "qik-vrt-autonomous-self-heal"
          git config user.email "qik-vrt-autonomous-self-heal@users.noreply.github.com"
          git switch -c "$branch"
          git add -- \
            anticipation/current.json \
            anticipation/history.jsonl \
            anticipation/trends.json \
            anticipation/derivatives.json \
            anticipation/next-effect.json \
            receipts/anticipation/0001-contract-bound.json \
            receipts/anticipation/0002-anticipation-materialized.json \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git commit -m "fix(autonomy): apply bounded deterministic self-heal ${CANDIDATE_ID:0:16}"
          candidate_head="$(git rev-parse --verify HEAD^{commit})"
          git push origin "HEAD:refs/heads/$branch"
          cat > /tmp/qikvrt-self-heal-pr.md <<EOF
          Repository-native scheduled repair candidate.

          Exact bindings:
          - observed current-main base: \`$BASE_SHA\`
          - candidate head: \`$candidate_head\`
          - semantic fingerprint: \`$FINGERPRINT\`
          - base-and-fingerprint candidate identity: \`$CANDIDATE_ID\`

          Scope is restricted to deterministic anticipation projections and repository-native integrity.

          Unconditional automatic merge is forbidden. Expected-head-bound promotion is allowed only after current-base reobservation, unchanged-head verification, allowlisted-diff verification, confirmation of no external effect, terminal green completion of every applicable exact-head gate, and confirmation that no competing writer exists. The proposal workflow itself does not merge.

          No force push, release, deployment, Zenodo or IETF mutation, credentialed external write, repository-wide PASS, FINAL_PASS, EFFECT_ACK_DONE, full synchronization, or symmetric canonicality is claimed.
          EOF
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "fix(autonomy): bounded deterministic self-heal ${CANDIDATE_ID:0:16}" \
            --body-file /tmp/qikvrt-self-heal-pr.md

      - name: Assert unchanged state is a repository NOOP
        if: steps.repair.outputs.state == 'NOOP'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
