name: QIK-VRT autonomous bounded self-heal

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
    types: [completed]
  pull_request:
    paths:
      - ".github/workflows/qikvrt_autonomous_self_heal.yml"
      - ".github/workflows/qikvrt_autonomous_exact_head_verify.yml"
      - ".github/workflows/qikvrt_expected_head_promotion.yml"
      - ".github/workflows/qikvrt_autonomous_pr_continuation.yml"
      - "tests/test_qikvrt_continuous_auto_repair.py"
      - "tools/qikvrt_node_liveness.py"
      - "tests/test_qikvrt_node_liveness.py"
      - "tools/qikvrt_autonomous_self_heal.py"
      - "tools/qikvrt_autonomous_pre_effect_controller.py"
      - "tools/qikvrt_expected_head_promotion.py"
      - "tests/test_qikvrt_autonomous_self_heal.py"
      - "tests/test_qikvrt_autonomous_pre_effect_controller.py"
      - "tests/test_qikvrt_expected_head_promotion.py"
      - "tests/test_qikvrt_expected_head_promotion_contract.py"
      - "tests/test_qikvrt_autonomous_pr_continuation.py"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"
      - "state/autonomy/AUTONOMOUS_PRE_EFFECT_POLICY_V1.json"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: qikvrt-autonomous-self-heal-${{ github.repository }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  validate-continuous-opportunity-contract:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify continuous opportunistic auto-repair contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_continuous_auto_repair

  observe-repair-propose:
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_branch == 'main')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify continuous opportunistic auto-repair contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 python3 -B -m unittest -v \
            tests.test_qikvrt_continuous_auto_repair

      - name: Execute bounded repository-native repairs before external effects
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 -B tools/qikvrt_autonomous_pre_effect_controller.py apply > /tmp/qikvrt-self-heal.json
          rc=$?
          set -e
          cat /tmp/qikvrt-self-heal.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import base64
          import json
          value = json.load(open('/tmp/qikvrt-self-heal.json', encoding='utf-8'))
          paths = '\0'.join(value.get('changed_paths', [])).encode('utf-8')
          print(f"state={value['state']}")
          print(f"base_sha={value.get('observed_base_revision') or ''}")
          print(f"fingerprint={value.get('semantic_fingerprint') or ''}")
          print(f"candidate_id={value.get('candidate_identity') or ''}")
          print(f"changed_paths_b64={base64.b64encode(paths).decode('ascii')}")
          PY
          exit "$rc"

      - name: Preserve autonomous pre-effect controller receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-self-heal-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/qikvrt-self-heal.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify repaired repository state
        if: steps.repair.outputs.state == 'CANDIDATE_READY'
        env:
          CHANGED_PATHS_B64: ${{ steps.repair.outputs.changed_paths_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_anticipation.py check
          python3 -B tools/qikvrt_publication_overview.py check
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B tools/qikvrt_node_liveness.py check
          python3 -B -m unittest -v \
            tests.test_qikvrt_publication_overview \
            tests.test_qikvrt_autonomous_self_heal \
            tests.test_qikvrt_autonomous_pre_effect_controller \
            tests.test_qikvrt_node_liveness \
            tests.test_qikvrt_expected_head_promotion \
            tests.test_qikvrt_expected_head_promotion_contract \
            tests.test_qikvrt_continuous_auto_repair
          python3 -B - <<'PY'
          import base64
          import os
          import subprocess
          expected = sorted(
              path for path in base64.b64decode(os.environ['CHANGED_PATHS_B64']).decode('utf-8').split('\0')
              if path
          )
          actual = sorted(
              {
                  path
                  for output in (
                      subprocess.check_output(
                          ['git', 'diff', '--name-only', 'HEAD', '--'], text=True
                      ),
                      subprocess.check_output(
                          ['git', 'ls-files', '--others', '--exclude-standard'],
                          text=True,
                      ),
                  )
                  for path in output.splitlines()
                  if path
              }
          )
          if actual != expected:
              raise SystemExit(f'BLOCK: controller/worktree path mismatch: expected={expected}, actual={actual}')
          PY

      - name: Create one base-and-fingerprint-bound draft repair PR
        if: steps.repair.outputs.state == 'CANDIDATE_READY'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ steps.repair.outputs.base_sha }}
          FINGERPRINT: ${{ steps.repair.outputs.fingerprint }}
          CANDIDATE_ID: ${{ steps.repair.outputs.candidate_id }}
          CHANGED_PATHS_B64: ${{ steps.repair.outputs.changed_paths_b64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          test -n "$FINGERPRINT"
          test -n "$CANDIDATE_ID"
          test "$(git rev-parse --verify HEAD^{commit})" = "$BASE_SHA"
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$BASE_SHA"
          branch="automation/self-heal-${CANDIDATE_ID:0:24}"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100" > /tmp/qikvrt-open-self-heal-prs.json
          existing_pr="$(python3 -B - <<'PY'
          import json
          import os

          base = os.environ["BASE_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          pages = json.load(
              open("/tmp/qikvrt-open-self-heal-prs.json", encoding="utf-8")
          )
          fingerprint = os.environ["FINGERPRINT"]
          marker = (
              "<!-- qikvrt-self-heal-candidate:"
              f"base:{base} fingerprint:{fingerprint} -->"
          )
          for page in pages:
              for pull in page:
                  head_repo = ((pull.get("head") or {}).get("repo") or {}).get(
                      "full_name"
                  )
                  if (
                      pull.get("draft") is True
                      and head_repo == repository
                      and marker in (pull.get("body") or "")
                  ):
                      print(pull["number"])
                      raise SystemExit(0)
          PY
          )"
          if test -n "$existing_pr"; then
            echo "A current-base autonomous self-heal candidate already exists: #$existing_pr"
            exit 0
          fi
          python3 -B - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import sys

          repository = os.environ['GITHUB_REPOSITORY']
          base = os.environ['BASE_SHA']
          candidate = {
              path
              for path in base64.b64decode(
                  os.environ['CHANGED_PATHS_B64']
              ).decode('utf-8').split('\0')
              if path
          }
          pages = json.load(
              open('/tmp/qikvrt-open-self-heal-prs.json', encoding='utf-8')
          )
          for page in pages:
              for pull in page:
                  if (pull.get('base') or {}).get('sha') != base:
                      continue
                  number = pull.get('number')
                  raw = subprocess.check_output(
                      [
                          'gh', 'api', '--paginate', '--slurp',
                          f'repos/{repository}/pulls/{number}/files?per_page=100',
                      ],
                      text=True,
                  )
                  changed = {
                      name
                      for response in json.loads(raw)
                      for item in response
                      for name in (item.get('filename'), item.get('previous_filename'))
                      if isinstance(name, str) and name
                  }
                  overlap = sorted(candidate & changed)
                  if overlap:
                      raise SystemExit(
                          f'BLOCK: current-base competing writer #{number} overlaps {overlap}'
                      )
          PY
          remote_main_after_scan="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$remote_main_after_scan" = "$BASE_SHA"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "qik-vrt-autonomous-self-heal"
          git config user.email "qik-vrt-autonomous-self-heal@users.noreply.github.com"
          git switch -c "$branch"
          python3 -B - <<'PY'
          import base64
          import os
          import subprocess
          paths = [
              path for path in base64.b64decode(os.environ['CHANGED_PATHS_B64']).decode('utf-8').split('\0')
              if path
          ]
          if not paths:
              raise SystemExit('BLOCK: candidate has no declared changed paths')
          subprocess.check_call(['git', 'add', '--', *paths])
          PY
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"
          git commit -m "fix(autonomy): apply bounded deterministic self-heal ${CANDIDATE_ID:0:16}"
          candidate_head="$(git rev-parse --verify HEAD^{commit})"
          git push origin "HEAD:refs/heads/$branch"
          python3 -B - <<'PY' > /tmp/qikvrt-self-heal-paths.txt
          import base64
          import os
          for path in base64.b64decode(os.environ['CHANGED_PATHS_B64']).decode('utf-8').split('\0'):
              if path:
                  print(f'- `{path}`')
          PY
          cat > /tmp/qikvrt-self-heal-pr.md <<EOF
          <!-- qikvrt-expected-head-promotion:enabled external_effect=NONE -->
          <!-- qikvrt-autonomous-self-heal:enabled -->
          <!-- qikvrt-self-heal-candidate:base:$BASE_SHA fingerprint:$FINGERPRINT -->

          Repository-native opportunistic pre-effect repair candidate.

          Exact bindings:
          - observed current-main base: \`$BASE_SHA\`
          - candidate head: \`$candidate_head\`
          - semantic fingerprint: \`$FINGERPRINT\`
          - base-and-fingerprint candidate identity: \`$CANDIDATE_ID\`

          Exact allowlisted paths:
          $(cat /tmp/qikvrt-self-heal-paths.txt)

          Unconditional automatic merge is forbidden. Expected-head-bound promotion is allowed only after current-base reobservation, unchanged-head verification, allowlisted-diff verification, confirmation of no external effect, terminal green completion of every applicable exact-head gate, and confirmation that no competing writer exists. This proposal workflow never merges; the separate expected-head promotion executor may merge only the exact reobserved head after independently rechecking those conditions.

          Execution stops before Zenodo publication, IETF submission, DOI creation, public release, external credential consumption, or any other irreversible external effect and requires the separately persisted exact external-effect authorization contract.

          No force push, release, deployment, Zenodo or IETF mutation, credentialed external write, scientific confirmation, physical correspondence, repository-wide PASS, FINAL_PASS, EFFECT_ACK_DONE, full synchronization, or symmetric canonicality is claimed.
          EOF
          pr_url="$(gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "fix(autonomy): bounded deterministic self-heal ${CANDIDATE_ID:0:16}" \
            --body-file /tmp/qikvrt-self-heal-pr.md)"
          pr_number="${pr_url##*/}"
          test -n "$pr_number"
          python3 -B - <<PY > /tmp/qikvrt-autonomous-dispatch.json
          import json
          print(json.dumps({
              'event_type': 'qikvrt_autonomous_exact_head_verify',
              'client_payload': {
                  'repository': '${GITHUB_REPOSITORY}',
                  'pull_request': int('${pr_number}'),
                  'head_ref': '${branch}',
                  'head_sha': '${candidate_head}',
                  'base_sha': '${BASE_SHA}',
              },
          }))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            --input /tmp/qikvrt-autonomous-dispatch.json

      - name: Assert unchanged state is a repository NOOP
        if: steps.repair.outputs.state == 'NOOP'
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
