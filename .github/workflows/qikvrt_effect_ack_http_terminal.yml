name: QIKVRT EFFECT_ACK HTTP Firefox terminal

on:
  pull_request:
    paths:
      - "external/ietf/draft-lohmann-qikvrt-effect-ack-http-00.xml"
      - "policy/QIKVRT_EFFECT_ACK_HTTP_TERMINAL_V1.json"
      - "browser/firefox/qikvrt-terminal/**"
      - "docs/terminal/QIKVRT_TERMINAL_FRAME_V1.schema.json"
      - "docs/terminal/FIREFOX_EFFECT_ACK_TERMINAL_PROXY_V1.md"
      - "src/qikvrt_effect_ack_http_terminal.py"
      - "src/qikvrt_temdd_event_ledger.py"
      - "deploy/universal-terminal/**"
      - "tests/test_self_host_temdd.py"
      - "tests/test_self_host_firefox.py"
      - "tests/test_self_host_systemd.py"
      - "tests/test_self_host_migration.py"
      - "tests/test_self_host_capture.py"
      - "tests/test_qikvrt_effect_ack_http_terminal.py"
      - "tests/test_self_host.py"
      - "runtime/self-host/**"
      - "docs/monitor/**"
      - "tools/qikvrt_self_host.py"
      - "tools/qikvrt_self_host_migration.py"
      - "tools/qikvrt_mesh_monitor_readback.mjs"
      - ".github/workflows/qikvrt_effect_ack_http_terminal.yml"
  push:
    paths:
      - "external/ietf/draft-lohmann-qikvrt-effect-ack-http-00.xml"
      - "policy/QIKVRT_EFFECT_ACK_HTTP_TERMINAL_V1.json"
      - "browser/firefox/qikvrt-terminal/**"
      - "docs/terminal/QIKVRT_TERMINAL_FRAME_V1.schema.json"
      - "docs/terminal/FIREFOX_EFFECT_ACK_TERMINAL_PROXY_V1.md"
      - "src/qikvrt_effect_ack_http_terminal.py"
      - "src/qikvrt_temdd_event_ledger.py"
      - "deploy/universal-terminal/**"
      - "tests/test_self_host_temdd.py"
      - "tests/test_self_host_firefox.py"
      - "tests/test_self_host_systemd.py"
      - "tests/test_self_host_migration.py"
      - "tests/test_self_host_capture.py"
      - "tests/test_qikvrt_effect_ack_http_terminal.py"
      - "tests/test_self_host.py"
      - "runtime/self-host/**"
      - "docs/monitor/**"
      - "tools/qikvrt_self_host.py"
      - "tools/qikvrt_self_host_migration.py"
      - "tools/qikvrt_mesh_monitor_readback.mjs"
      - ".github/workflows/qikvrt_effect_ack_http_terminal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up standalone Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Run standalone package, negative and crash-restart controls
        id: standalone-runtime
        env:
          QIKVRT_STATE_RECOVERY_TEST_EVIDENCE: ${{ runner.temp }}/qikvrt-state-recovery-readback
          QIKVRT_MESH_WORK_TEST_EVIDENCE: ${{ runner.temp }}/qikvrt-state-recovery-readback
        run: make self-host-test

      - name: Verify static React source and browser-module syntax
        run: |
          node --check docs/monitor/react-runtime.js
          node --check docs/monitor/mesh-react.js
          node --check docs/monitor/self-host.mjs

      - name: Preserve original native state restoration readback
        if: ${{ always() && steps.standalone-runtime.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-native-state-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qikvrt-state-recovery-readback
          if-no-files-found: error
          retention-days: 30

      - name: Verify existing native systemd crash and admission restoration recovery
        id: systemd-runtime
        env:
          QIKVRT_SYSTEMD_TEST_EVIDENCE: ${{ runner.temp }}/qikvrt-systemd-readback
        run: |
          sh tools/bootstrap-runtime.sh --check-only --profile self-host-systemd --adapter none
          python3 -B -m unittest -v tests.test_self_host_systemd

      - name: Preserve native systemd recovery readback
        if: ${{ always() && steps.systemd-runtime.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-systemd-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qikvrt-systemd-readback
          if-no-files-found: error
          retention-days: 30

      - name: Build isolated Firefox and noVNC dependency carrier
        shell: bash
        run: |
          set -euo pipefail
          docker build --target test --file runtime/self-host/Dockerfile --tag qikvrt-self-host-firefox-test .

      - name: Verify productive exported Firefox and noVNC without provider network
        id: firefox-runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qikvrt-firefox-readback"
          docker image inspect qikvrt-self-host-firefox-test \
            --format '{{json .Id}}' > "$RUNNER_TEMP/qikvrt-firefox-readback/OCI_IMAGE_ID.json"
          docker version --format '{{json .Server.Version}}' > "$RUNNER_TEMP/qikvrt-firefox-readback/DOCKER_ENGINE_VERSION.json"
          docker run --rm --init --network none --shm-size 256m --tmpfs /tmp:size=768m,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/qikvrt-firefox-readback,target=/evidence" \
            --env QIKVRT_BROWSER_TEST_EVIDENCE=/evidence \
            qikvrt-self-host-firefox-test \
            python3 -B -m unittest -v tests.test_self_host_firefox tests.test_self_host_capture

      - name: Preserve isolated runtime readback and dependency versions
        if: ${{ always() && steps.firefox-runtime.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-productive-terminal-readback-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qikvrt-firefox-readback
          if-no-files-found: error
          retention-days: 30

      - name: Freeze matching Firefox package and archive runtime image
        shell: bash
        run: |
          set -euo pipefail
          delivery="$RUNNER_TEMP/qikvrt-firefox-delivery"
          mkdir -p "$delivery"
          head="$(git rev-parse --verify HEAD^{commit})"
          tree="$(git rev-parse --verify HEAD^{tree})"
          # Reuse the tested build cache; export only the runtime target.
          tag="qikvrt-self-host-firefox-runtime:$head"
          docker build --target runtime --file runtime/self-host/Dockerfile --tag "$tag" .
          docker image inspect "$tag" > "$delivery/RUNTIME_IMAGE.json"
          docker run --rm --network none \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$delivery,target=/delivery" \
            qikvrt-self-host-firefox-test \
            python3 -B tools/qikvrt_self_host.py pack --root /source \
              --expected-head "$head" --expected-tree "$tree" \
              --browser-assets-root /usr/share/novnc --output /delivery/package \
            > "$delivery/PACKAGE_BUILD_RECEIPT.json"
          pin="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_sha256"])' "$delivery/PACKAGE_BUILD_RECEIPT.json")"
          # The exported package must verify in the actual Git-free runtime image.
          docker run --rm --network none --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --mount "type=bind,source=$delivery/package,target=/package,readonly" \
            --workdir /package "$tag" \
            python3 -B tools/qikvrt_self_host.py verify --root /package --manifest-sha256 "$pin" \
            > "$delivery/RUNTIME_PACKAGE_READBACK.json"
          docker run --rm --network none --read-only "$tag" \
            cat /usr/local/share/qikvrt-distribution-packages.tsv \
            > "$delivery/DISTRIBUTION_PACKAGES.tsv"
          docker save --output "$delivery/runtime-image.tar" "$tag"
          python3 - "$delivery" <<'PY'
          import gzip, pathlib, shutil, sys
          root = pathlib.Path(sys.argv[1])
          with (root / 'runtime-image.tar').open('rb') as source:
              with (root / 'runtime-image.tar.gz').open('wb') as target:
                  with gzip.GzipFile(filename='', fileobj=target, mode='wb', mtime=0) as transport:
                      shutil.copyfileobj(source, transport)
          (root / 'runtime-image.tar').unlink()
          PY
          # Load the actual compressed transport, not a different intermediate.
          docker load --input "$delivery/runtime-image.tar.gz" > "$delivery/IMAGE_LOAD_READBACK.txt"
          docker image inspect "$tag" > "$delivery/LOADED_IMAGE.json"
          python3 - "$delivery" "$head" "$tree" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          original = json.loads((root / 'RUNTIME_IMAGE.json').read_bytes())[0]
          loaded = json.loads((root / 'LOADED_IMAGE.json').read_bytes())[0]
          if original['Id'] != loaded['Id'] or original['RootFS'] != loaded['RootFS']:
              raise SystemExit('RUNTIME_IMAGE_LOAD_BINDING_MISMATCH')
          receipt = json.loads((root / 'PACKAGE_BUILD_RECEIPT.json').read_bytes())
          manifest = json.loads((root / 'package/MANIFEST.json').read_bytes())
          if (receipt['source_head'], receipt['source_tree']) != tuple(sys.argv[2:]):
              raise SystemExit('DELIVERY_SOURCE_BINDING_MISMATCH')
          if 'browser_runtime' not in manifest:
              raise SystemExit('FIREFOX_PACKAGE_REQUIRED')
          files = {}
          for name in ('runtime-image.tar.gz', 'package.tar', 'PACKAGE_BUILD_RECEIPT.json',
                       'RUNTIME_PACKAGE_READBACK.json', 'RUNTIME_IMAGE.json', 'LOADED_IMAGE.json',
                       'IMAGE_LOAD_READBACK.txt', 'DISTRIBUTION_PACKAGES.tsv'):
              path = root / name
              with path.open('rb') as source:
                  sha = hashlib.file_digest(source, 'sha256').hexdigest()
              files[name] = {'bytes': path.stat().st_size, 'sha256': sha}
          result = {'schema': 'qikvrt-firefox-runtime-delivery/v1',
                    'source_head': sys.argv[2], 'source_tree': sys.argv[3],
                    'runtime_image_id': original['Id'], 'os': original['Os'],
                    'architecture': original['Architecture'], 'files': files,
                    'manifest_sha256': receipt['manifest_sha256'],
                    'image_load_scope': 'SAME_CI_ENGINE; NOT_EMPTY_HOST_RESTORE',
                    'public_https_verified': False, 'effect_ack_done': False}
          (root / 'DELIVERY.json').write_text(json.dumps(result, sort_keys=True, indent=2) + '\n')
          PY

      - name: Preserve complete runtime image and matching Firefox package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-firefox-runtime-delivery-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/qikvrt-firefox-delivery/*.json
            ${{ runner.temp }}/qikvrt-firefox-delivery/*.txt
            ${{ runner.temp }}/qikvrt-firefox-delivery/*.tsv
            ${{ runner.temp }}/qikvrt-firefox-delivery/*.tar
            ${{ runner.temp }}/qikvrt-firefox-delivery/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

      - name: Parse machine-readable contracts and RFCXML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool policy/QIKVRT_EFFECT_ACK_HTTP_TERMINAL_V1.json >/dev/null
          python3 -m json.tool browser/firefox/qikvrt-terminal/manifest.json >/dev/null
          python3 -m json.tool docs/terminal/QIKVRT_TERMINAL_FRAME_V1.schema.json >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('external/ietf/draft-lohmann-qikvrt-effect-ack-03.xml')
          ET.parse('external/ietf/draft-lohmann-qikvrt-effect-ack-http-00.xml')
          PY

      - name: Install locked RFCXML renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r runtime/toolchains/requirements-xml2rfc-3.34.0.txt
          test "$(xml2rfc --version | head -n1)" = "xml2rfc 3.34.0"

      - name: Render core and companion Internet-Drafts as TXT and HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-ietf-render
          for draft in draft-lohmann-qikvrt-effect-ack-03 draft-lohmann-qikvrt-effect-ack-http-00; do
            xml2rfc "external/ietf/${draft}.xml" --v3 --text --skip-config-files --out "/tmp/qikvrt-ietf-render/${draft}.txt"
            xml2rfc "external/ietf/${draft}.xml" --v3 --html --skip-config-files --out "/tmp/qikvrt-ietf-render/${draft}.html"
            test -s "/tmp/qikvrt-ietf-render/${draft}.txt"
            test -s "/tmp/qikvrt-ietf-render/${draft}.html"
          done

      - name: Check Python syntax
        run: |
          python3 -m py_compile src/qikvrt_effect_ack_http_terminal.py tests/test_qikvrt_effect_ack_http_terminal.py

      - name: Check Firefox JavaScript syntax
        run: |
          node --check browser/firefox/qikvrt-terminal/background.js
          node --check browser/firefox/qikvrt-terminal/content.js
          node --check browser/firefox/qikvrt-terminal/options.js

      - name: Run HTTP terminal contract and E2E tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python3 -B -m unittest -v tests.test_qikvrt_effect_ack_http_terminal

      - name: Freeze and verify exact-head standalone package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qikvrt/runtime/self-host
          python3 -B tools/qikvrt_self_host.py pack --root . \
            --expected-head "$(git rev-parse --verify HEAD^{commit})" \
            --expected-tree "$(git rev-parse --verify HEAD^{tree})" \
            --output "$RUNNER_TEMP/qikvrt-self-host" \
            > .qikvrt/runtime/self-host/PACKAGE_BUILD_RECEIPT.json
          cat .qikvrt/runtime/self-host/PACKAGE_BUILD_RECEIPT.json
          pin="$(python3 -c 'import json; print(json.load(open(".qikvrt/runtime/self-host/PACKAGE_BUILD_RECEIPT.json"))["manifest_sha256"])')"
          python3 -B tools/qikvrt_self_host.py verify \
            --root "$RUNNER_TEMP/qikvrt-self-host" --manifest-sha256 "$pin"

      - name: Upload exact-head standalone package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-self-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/qikvrt-self-host.tar
            ${{ runner.temp }}/qikvrt-self-host/MANIFEST.json
            .qikvrt/runtime/self-host/PACKAGE_BUILD_RECEIPT.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Package verified Firefox reference client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-firefox-package
          (
            cd browser/firefox/qikvrt-terminal
            zip -X -9 /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi \
              manifest.json background.js content.js terminal.css options.html options.js README.md
          )
          sha256sum /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi \
            > /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi.sha256
          test -s /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi
          test -s /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi.sha256

      - name: Preserve verified Firefox package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-firefox-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/qikvrt-firefox-package
          if-no-files-found: error
          retention-days: 30
