name: QIKVRT EFFECT_ACK HTTP Firefox terminal

on:
  pull_request:
    paths:
      - "external/ietf/draft-lohmann-qikvrt-effect-ack-http-00.xml"
      - "policy/QIKVRT_EFFECT_ACK_HTTP_TERMINAL_V1.json"
      - "browser/firefox/qikvrt-terminal/**"
      - "docs/terminal/QIKVRT_TERMINAL_FRAME_V1.schema.json"
      - "docs/terminal/FIREFOX_EFFECT_ACK_TERMINAL_PROXY_V1.md"
      - "src/qikvrt_effect_ack_http_terminal.py"
      - "tests/test_qikvrt_effect_ack_http_terminal.py"
      - ".github/workflows/qikvrt_effect_ack_http_terminal.yml"
      - "docs/monitor/**"
      - "evidence/monitor-feedback/react/**"
      - "runtime/toolchains/**"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact monitor candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify fresh monitor source and captured-404 replay
        env:
          QIKVRT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$QIKVRT_EXPECTED_HEAD"
          python3 -B tools/qikvrt_integrity.py verify
          make monitor-test
          git diff --exit-code
      - name: Provision existing locked Playwright and desktop browser
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          mkdir -p "$RUNNER_TEMP/qikvrt-monitor-tests"
          cp docs/monitor/browser-tests/package.json docs/monitor/browser-tests/package-lock.json "$RUNNER_TEMP/qikvrt-monitor-tests/"
          npm ci --prefix "$RUNNER_TEMP/qikvrt-monitor-tests" --ignore-scripts --omit=optional --no-audit --no-fund
          python3 -B - <<'PY'
          import hashlib,json,os,urllib.request,zipfile
          from pathlib import Path
          lock=json.loads(Path('docs/monitor/browser-tests/BROWSER_LOCK.json').read_bytes())
          directory=Path(os.environ['RUNNER_TEMP'])/'qikvrt-monitor-browser'
          directory.mkdir(mode=0o700)
          archive=directory/'browser.zip'
          with urllib.request.urlopen(lock['archive_url'],timeout=60) as source,archive.open('xb') as dest:
            while chunk:=source.read(1024*1024): dest.write(chunk)
          raw=archive.read_bytes()
          assert len(raw)==lock['archive_bytes'] and hashlib.sha256(raw).hexdigest()==lock['archive_sha256']
          with zipfile.ZipFile(archive) as bundle:
            for item in bundle.infolist():
              assert not item.filename.startswith('/') and '..' not in Path(item.filename).parts
            bundle.extractall(directory)
            for item in bundle.infolist():
              path=directory/item.filename
              if path.is_file():path.chmod(0o755 if (item.external_attr>>16)&0o111 else 0o644)
          executable=directory/lock['executable_relative_path']
          with Path(os.environ['GITHUB_ENV']).open('a') as env:
            env.write('QIKVRT_MONITOR_CHROMIUM='+str(executable)+'\n')
            env.write('QIKVRT_MONITOR_PLAYWRIGHT_ROOT='+str(Path(os.environ['RUNNER_TEMP'])/'qikvrt-monitor-tests')+'\n')
          PY
      - name: Execute fresh actual ReactDOM 404 and alert browser controls
        env:
          QIKVRT_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          QIKVRT_MONITOR_BROWSER_REPORT: ${{ runner.temp }}/react-monitor-witness
        shell: bash
        run: |
          set -euo pipefail
          node --test docs/monitor/react-feedback.browser.test.mjs 2>&1 | tee "$RUNNER_TEMP/react-monitor-browser-tests.log"
          git diff --exit-code
      - name: Preserve exact-head React browser witness
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-react-monitor-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/react-monitor-witness/
            ${{ runner.temp }}/react-monitor-browser-tests.log
          if-no-files-found: error
          retention-days: 30
  contract-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Parse machine-readable contracts and RFCXML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool policy/QIKVRT_EFFECT_ACK_HTTP_TERMINAL_V1.json >/dev/null
          python3 -m json.tool browser/firefox/qikvrt-terminal/manifest.json >/dev/null
          python3 -m json.tool docs/terminal/QIKVRT_TERMINAL_FRAME_V1.schema.json >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('external/ietf/draft-lohmann-qikvrt-effect-ack-03.xml')
          ET.parse('external/ietf/draft-lohmann-qikvrt-effect-ack-http-00.xml')
          PY

      - name: Install locked RFCXML renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r runtime/toolchains/requirements-xml2rfc-3.34.0.txt
          test "$(xml2rfc --version | head -n1)" = "xml2rfc 3.34.0"

      - name: Render core and companion Internet-Drafts as TXT and HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-ietf-render
          for draft in draft-lohmann-qikvrt-effect-ack-03 draft-lohmann-qikvrt-effect-ack-http-00; do
            xml2rfc "external/ietf/${draft}.xml" --v3 --text --skip-config-files --out "/tmp/qikvrt-ietf-render/${draft}.txt"
            xml2rfc "external/ietf/${draft}.xml" --v3 --html --skip-config-files --out "/tmp/qikvrt-ietf-render/${draft}.html"
            test -s "/tmp/qikvrt-ietf-render/${draft}.txt"
            test -s "/tmp/qikvrt-ietf-render/${draft}.html"
          done

      - name: Check Python syntax
        run: |
          python3 -m py_compile src/qikvrt_effect_ack_http_terminal.py tests/test_qikvrt_effect_ack_http_terminal.py

      - name: Check Firefox JavaScript syntax
        run: |
          node --check browser/firefox/qikvrt-terminal/background.js
          node --check browser/firefox/qikvrt-terminal/content.js
          node --check browser/firefox/qikvrt-terminal/options.js

      - name: Run HTTP terminal contract and E2E tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python3 -B -m unittest -v tests.test_qikvrt_effect_ack_http_terminal

      - name: Package verified Firefox reference client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-firefox-package
          (
            cd browser/firefox/qikvrt-terminal
            zip -X -9 /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi \
              manifest.json background.js content.js terminal.css options.html options.js README.md
          )
          sha256sum /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi \
            > /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi.sha256
          test -s /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi
          test -s /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi.sha256

      - name: Preserve verified Firefox package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-firefox-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/qikvrt-firefox-package
          if-no-files-found: error
          retention-days: 30
