# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: QIKVRT EFFECT_ACK HTTP Firefox terminal

on:
  pull_request:
    paths:
      - "external/ietf/draft-lohmann-qikvrt-effect-ack-http-00.xml"
      - "policy/QIKVRT_EFFECT_ACK_HTTP_TERMINAL_V1.json"
      - "browser/firefox/qikvrt-terminal/**"
      - "docs/terminal/QIKVRT_TERMINAL_FRAME_V1.schema.json"
      - "docs/terminal/FIREFOX_EFFECT_ACK_TERMINAL_PROXY_V1.md"
      - "src/qikvrt_effect_ack_http_terminal.py"
      - "src/qikvrt_temdd_event_ledger.py"
      - "deploy/universal-terminal/**"
      - "tests/test_self_host_temdd.py"
      - "tests/test_self_host_firefox.py"
      - "tests/test_self_host_systemd.py"
      - "tests/test_self_host_migration.py"
      - "tests/test_qikvrt_effect_ack_http_terminal.py"
      - "tests/test_self_host.py"
      - "runtime/self-host/**"
      - "next/core/**"
      - "runtime/native/**"
      - "runtime/m68000/**"
      - "runtime/temdd/**"
      - "runtime/toolchains/**"
      - "src/temdd_core.c"
      - "include/temdd_core.h"
      - "src/smalltalk/**"
      - "tests/smalltalk/**"
      - "tests/temdd/**"
      - "tests/test_temdd_core.c"
      - "tests/test_native_release.py"
      - "tools/qikvrt_native_release.py"
      - "tools/qikvrt_smalltalk.py"
      - "docs/monitor/**"
      - "tools/qikvrt_self_host.py"
      - "tools/qikvrt_self_host_migration.py"
      - "tools/qikvrt_mesh_monitor_readback.mjs"
      - ".github/workflows/qikvrt_effect_ack_http_terminal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-candidate:
    needs: [native-runtime, smalltalk-runtime, m68000-runtime, contract-and-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: ${{ runner.temp }}/qikvrt-variant-readbacks
      - name: Freeze source-bound publication candidate on every successful variant build
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_native_release.py catalog \
            --artifacts "$RUNNER_TEMP/qikvrt-variant-readbacks" \
            --expected-head "$(git rev-parse HEAD)" --expected-tree "$(git rev-parse 'HEAD^{tree}')" \
            --output "$RUNNER_TEMP/qikvrt-runtime-publication-candidate"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-runtime-publication-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qikvrt-runtime-publication-candidate
          if-no-files-found: error
          retention-days: 30

  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute exact-source native build, SQL and Git-free rebuild
        shell: python {0}
        run: |
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          package = temp / 'qikvrt-native'
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          tree = subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip()
          subprocess.run([sys.executable, '-B', 'tools/qikvrt_tool_cache.py', 'verify'], check=True)
          subprocess.run([sys.executable, '-B', '-m', 'unittest', '-v', 'tests.test_native_release'], check=True)
          raw = subprocess.check_output([sys.executable, '-B', 'tools/qikvrt_native_release.py', 'build',
            '--root', str(root), '--expected-head', head, '--expected-tree', tree, '--output', str(package)])
          print(raw.decode())
          receipt = json.loads(raw)
          (temp / 'NATIVE_BUILD.json').write_bytes(raw)
          pin = receipt['manifest_sha256']
          subprocess.run([sys.executable, '-B', 'tools/qikvrt_native_release.py', 'sql',
            '--package', str(package), '--manifest-sha256', pin], check=True)
          raw = subprocess.check_output([sys.executable, '-B', str(package / 'source/tools/qikvrt_native_release.py'),
            'rebuild', '--package', str(package), '--manifest-sha256', pin, '--output', str(temp / 'qikvrt-native-rebuilt')])
          print(raw.decode())
          (temp / 'NATIVE_REBUILD.json').write_bytes(raw)
      - name: Preserve target binaries, sources, licenses and fresh receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-native-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/qikvrt-native.zip
            ${{ runner.temp }}/qikvrt-native-rebuilt.zip
            ${{ runner.temp }}/NATIVE_BUILD.json
            ${{ runner.temp }}/NATIVE_REBUILD.json
          if-no-files-found: error
          retention-days: 30

  smalltalk-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute locked Smalltalk bootstrap, restore and exhaustive comparison
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          mkdir -p "$RUNNER_TEMP/qikvrt-smalltalk"
          python3 -B tools/qikvrt_smalltalk.py install --cache-dir "$RUNNER_TEMP/pharo-cache"
          python3 -B tools/qikvrt_smalltalk.py test --cache-dir "$RUNNER_TEMP/pharo-cache" \
            | tee "$RUNNER_TEMP/qikvrt-smalltalk/EXECUTION.log"
          python3 -B tools/qikvrt_smalltalk.py build --cache-dir "$RUNNER_TEMP/pharo-cache" \
            --output "$RUNNER_TEMP/qikvrt-smalltalk"
          cp runtime/toolchains/pharo-*LICENSE.txt "$RUNNER_TEMP/qikvrt-smalltalk/"
          cp runtime/toolchains/pharo-13.lock.json "$RUNNER_TEMP/qikvrt-smalltalk/"
          cp LICENSE LICENSES/PolyForm-Noncommercial-1.0.0.txt LICENSES/CC-BY-NC-ND-4.0.txt "$RUNNER_TEMP/qikvrt-smalltalk/"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, platform
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qikvrt-smalltalk'
          files = {p.name: {'bytes':p.stat().st_size, 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.iterdir() if p.is_file()}
          receipt = {'schema':'qikvrt-smalltalk-package/v1','source_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'target':platform.platform(),'files':files,'effect_ack_done':False,'historical_evidence_transferred':False}
          (root / 'MANIFEST.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-smalltalk-linux-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/qikvrt-smalltalk
            ${{ runner.temp }}/pharo-cache/pharo/*/image.zip
            ${{ runner.temp }}/pharo-cache/pharo/*/vm.zip
          if-no-files-found: error
          retention-days: 30

  m68000-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Execute MC68000 ABI and retain object, raw bytes and toolchain witness
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-m68k-linux-gnu libc6-dev-m68k-cross qemu-user binutils-m68k-linux-gnu
          out="$RUNNER_TEMP/qikvrt-m68000"
          mkdir -p "$out"
          m68k-linux-gnu-gcc -m68000 -c runtime/m68000/temdd_transition.s -o "$out/temdd-transition.o"
          m68k-linux-gnu-objcopy -O binary -j .text "$out/temdd-transition.o" "$out/temdd-transition.bin"
          m68k-linux-gnu-gcc -m68000 -std=c90 -pedantic-errors -Wall -Wextra -Werror -static \
            tests/temdd/runtime-m68000.c "$out/temdd-transition.o" -o "$out/temdd-m68000-linux-abi"
          m68k-linux-gnu-objdump -d "$out/temdd-transition.o" > "$out/DISASSEMBLY.txt"
          qemu-m68k "$out/temdd-m68000-linux-abi" | tee "$out/EXECUTION.log"
          grep -F 'TEMDD_M68000_EXECUTED vectors=515' "$out/EXECUTION.log"
          m68k-linux-gnu-gcc --version > "$out/COMPILER.txt"
          qemu-m68k --version > "$out/EMULATOR.txt"
          dpkg-query -W gcc-m68k-linux-gnu libc6-dev-m68k-cross qemu-user binutils-m68k-linux-gnu > "$out/DISTRIBUTION_PACKAGES.tsv"
          cp LICENSE LICENSES/PolyForm-Noncommercial-1.0.0.txt "$out/"
          cp runtime/m68000/temdd_transition.s tests/temdd/runtime-m68000.c "$out/"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'qikvrt-m68000'
          files = {p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.iterdir() if p.is_file()}
          tools = {}
          import shutil
          for name in ['m68k-linux-gnu-gcc','m68k-linux-gnu-objcopy','m68k-linux-gnu-objdump','qemu-m68k']:
            path = pathlib.Path(shutil.which(name)).resolve()
            tools[name] = {'sha256':hashlib.sha256(path.read_bytes()).hexdigest()}
          receipt = {'schema':'qikvrt-m68000-package/v1','source_head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'source_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
            'target':'mc68000-d0-kernel-with-m68k-linux-abi-emulator-witness','files':files,'tools':tools,
            'effect_ack_done':False,'historical_evidence_transferred':False,'physical_hardware_witness':False}
          (root / 'MANIFEST.json').write_text(json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-m68000-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qikvrt-m68000
          if-no-files-found: error
          retention-days: 30

  contract-and-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up standalone Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Run standalone package, negative and crash-restart controls
        id: standalone-runtime
        env:
          QIKVRT_STATE_RECOVERY_TEST_EVIDENCE: ${{ runner.temp }}/qikvrt-state-recovery-readback
        run: make self-host-test

      - name: Preserve original native state restoration readback
        if: ${{ always() && steps.standalone-runtime.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-native-state-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qikvrt-state-recovery-readback
          if-no-files-found: error
          retention-days: 30

      - name: Verify existing native systemd crash and admission restoration recovery
        id: systemd-runtime
        env:
          QIKVRT_SYSTEMD_TEST_EVIDENCE: ${{ runner.temp }}/qikvrt-systemd-readback
        run: |
          sh tools/bootstrap-runtime.sh --check-only --profile self-host-systemd --adapter none
          python3 -B -m unittest -v tests.test_self_host_systemd

      - name: Preserve native systemd recovery readback
        if: ${{ always() && steps.systemd-runtime.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-systemd-recovery-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qikvrt-systemd-readback
          if-no-files-found: error
          retention-days: 30

      - name: Build isolated Firefox and noVNC dependency carrier
        shell: bash
        run: |
          set -euo pipefail
          docker build --target test --file runtime/self-host/Dockerfile --tag qikvrt-self-host-firefox-test .

      - name: Verify productive exported Firefox and noVNC without provider network
        id: firefox-runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qikvrt-firefox-readback"
          docker image inspect qikvrt-self-host-firefox-test \
            --format '{{json .Id}}' > "$RUNNER_TEMP/qikvrt-firefox-readback/OCI_IMAGE_ID.json"
          docker version --format '{{json .Server.Version}}' > "$RUNNER_TEMP/qikvrt-firefox-readback/DOCKER_ENGINE_VERSION.json"
          docker run --rm --init --network none --shm-size 256m --tmpfs /tmp:size=768m,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/source,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/qikvrt-firefox-readback,target=/evidence" \
            --env QIKVRT_BROWSER_TEST_EVIDENCE=/evidence \
            qikvrt-self-host-firefox-test \
            python3 -B -m unittest -v tests.test_self_host_firefox

      - name: Preserve isolated runtime readback and dependency versions
        if: ${{ always() && steps.firefox-runtime.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-productive-terminal-readback-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/qikvrt-firefox-readback
          if-no-files-found: error
          retention-days: 30

      - name: Parse machine-readable contracts and RFCXML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool policy/QIKVRT_EFFECT_ACK_HTTP_TERMINAL_V1.json >/dev/null
          python3 -m json.tool browser/firefox/qikvrt-terminal/manifest.json >/dev/null
          python3 -m json.tool docs/terminal/QIKVRT_TERMINAL_FRAME_V1.schema.json >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('external/ietf/draft-lohmann-qikvrt-effect-ack-03.xml')
          ET.parse('external/ietf/draft-lohmann-qikvrt-effect-ack-http-00.xml')
          PY

      - name: Install locked RFCXML renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -r runtime/toolchains/requirements-xml2rfc-3.34.0.txt
          test "$(xml2rfc --version | head -n1)" = "xml2rfc 3.34.0"

      - name: Render core and companion Internet-Drafts as TXT and HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-ietf-render
          for draft in draft-lohmann-qikvrt-effect-ack-03 draft-lohmann-qikvrt-effect-ack-http-00; do
            xml2rfc "external/ietf/${draft}.xml" --v3 --text --skip-config-files --out "/tmp/qikvrt-ietf-render/${draft}.txt"
            xml2rfc "external/ietf/${draft}.xml" --v3 --html --skip-config-files --out "/tmp/qikvrt-ietf-render/${draft}.html"
            test -s "/tmp/qikvrt-ietf-render/${draft}.txt"
            test -s "/tmp/qikvrt-ietf-render/${draft}.html"
          done

      - name: Check Python syntax
        run: |
          python3 -m py_compile src/qikvrt_effect_ack_http_terminal.py tests/test_qikvrt_effect_ack_http_terminal.py

      - name: Check Firefox JavaScript syntax
        run: |
          node --check browser/firefox/qikvrt-terminal/background.js
          node --check browser/firefox/qikvrt-terminal/content.js
          node --check browser/firefox/qikvrt-terminal/options.js

      - name: Run HTTP terminal contract and E2E tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: python3 -B -m unittest -v tests.test_qikvrt_effect_ack_http_terminal

      - name: Freeze and verify exact-head standalone package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qikvrt/runtime/self-host
          python3 -B tools/qikvrt_self_host.py pack --root . \
            --expected-head "$(git rev-parse --verify HEAD^{commit})" \
            --expected-tree "$(git rev-parse --verify HEAD^{tree})" \
            --output "$RUNNER_TEMP/qikvrt-self-host" \
            > .qikvrt/runtime/self-host/PACKAGE_BUILD_RECEIPT.json
          cat .qikvrt/runtime/self-host/PACKAGE_BUILD_RECEIPT.json
          pin="$(python3 -c 'import json; print(json.load(open(".qikvrt/runtime/self-host/PACKAGE_BUILD_RECEIPT.json"))["manifest_sha256"])')"
          python3 -B tools/qikvrt_self_host.py verify \
            --root "$RUNNER_TEMP/qikvrt-self-host" --manifest-sha256 "$pin"

      - name: Upload exact-head standalone package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-self-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/qikvrt-self-host.tar
            ${{ runner.temp }}/qikvrt-self-host/MANIFEST.json
            .qikvrt/runtime/self-host/PACKAGE_BUILD_RECEIPT.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Package verified Firefox reference client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qikvrt-firefox-package
          (
            cd browser/firefox/qikvrt-terminal
            zip -X -9 /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi \
              manifest.json background.js content.js terminal.css options.html options.js README.md
          )
          sha256sum /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi \
            > /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi.sha256
          test -s /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi
          test -s /tmp/qikvrt-firefox-package/qikvrt-ai-terminal.xpi.sha256

      - name: Preserve verified Firefox package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-firefox-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/qikvrt-firefox-package
          if-no-files-found: error
          retention-days: 30
