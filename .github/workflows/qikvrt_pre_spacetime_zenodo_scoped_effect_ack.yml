name: QIKVRT pre-spacetime Zenodo scoped Effect-ACK

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/workflows/qikvrt_pre_spacetime_zenodo_scoped_effect_ack.yml
      - receipts/effects/pre-spacetime-ontology-zenodo-publication-v1.json
      - tests/test_pre_spacetime_ontology_zenodo_effect_ack.py

permissions:
  contents: read

concurrency:
  group: qikvrt-pre-spacetime-zenodo-scoped-effect-ack-${{ github.repository }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify exact-head binding and scoped Effect-ACK receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "${{ github.event.pull_request.head.sha }}"
          PYTHONDONTWRITEBYTECODE=1 PYTHONNOUSERSITE=1 \
            python3 -B -m unittest -v \
              tests.test_pre_spacetime_ontology_zenodo_effect_ack
          test -z "$(git status --porcelain=v1)"
