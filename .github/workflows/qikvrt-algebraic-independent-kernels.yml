name: QIKVRT algebraic independent Lean kernels
on:
  push:
    paths:
      - 'formalization/algebraic-root/paranoid/**'
      - '.github/workflows/qikvrt-algebraic-independent-kernels.yml'
  pull_request:
    paths:
      - 'formalization/algebraic-root/paranoid/**'
      - '.github/workflows/qikvrt-algebraic-independent-kernels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multiple-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install sandbox and Lean 4.35 with independent kernels
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Independently verify exact theorem source
        working-directory: formalization/algebraic-root/paranoid
        shell: bash
        run: |
          set -euo pipefail
          lean --version | tee toolchain.txt
          cmp Root.lean ../Root.lean
          sha256sum Root.lean ../Root.lean | tee hashes.txt
          lake update
          lake build
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          lake check --paranoid --json > multi-kernel-report.json
          python3 -m json.tool multi-kernel-report.json > /dev/null
          cat multi-kernel-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: algebraic-root-independent-lean-kernels
          path: |
            formalization/algebraic-root/paranoid/multi-kernel-report.json
            formalization/algebraic-root/paranoid/hashes.txt
            formalization/algebraic-root/paranoid/toolchain.txt
