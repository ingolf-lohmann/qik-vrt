name: QIK-VRT paired current-main anticipation refresh PR366 PR211
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/qikvrt_paired_anticipation_refresh_pr366_pr211.yml]
permissions:
  contents: write
concurrency:
  group: qikvrt-paired-anticipation-refresh-pr366-pr211-${{ github.repository }}
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'ingolf-lohmann/qik-vrt' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/current-main-anticipation-refresh-pr366-pr211-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/current-main-anticipation-refresh-pr366-pr211-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Refresh bounded anticipation input and projections
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7925fe1a97a3dc5d99a891441ec60ba854137172 HEAD
          test "$(git diff --name-only 7925fe1a97a3dc5d99a891441ec60ba854137172 HEAD --)" = ".github/workflows/qikvrt_paired_anticipation_refresh_pr366_pr211.yml"
          python3 -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          authority_main = "b17c0c1e730e61648c571473bae3fa51005c35de"
          mirror_main = "7925fe1a97a3dc5d99a891441ec60ba854137172"
          receipt_path = "evidence/receipts/authority-mirror-equality-2026-08-04-aphorism-corpus-pr356-pr204.json"
          index_path = "evidence/receipts/index.json"
          path = Path("anticipation/INPUT.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          def binding(p):
              raw = Path(p).read_bytes()
              return {"path": p, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
          metrics = dict(value["observations"][-1]["metrics"])
          metrics["scoped_reciprocal_equality_receipts_materialized_on_both_mains"] = max(3, metrics.get("scoped_reciprocal_equality_receipts_materialized_on_both_mains", 0) + 1)
          observation = {"classification":"TEILFORTSCHRITT","evidence":[f"authority-git-commit:{authority_main}",f"mirror-git-commit:{mirror_main}","authority-pull-request:366","mirror-pull-request:211",receipt_path,index_path],"metrics":metrics,"observed_at":"2026-08-04T04:55:00Z","productive_chain_position":"POST_PR366_PR211_RECIPROCAL_EQUALITY_PROMOTED_R11_EVIDENCE_BINDING_OPEN","state_id":"post-pr366-pr211-reciprocal-equality-promoted-r11-evidence-binding-open"}
          if value["observations"][-1].get("state_id") != observation["state_id"]: value["observations"].append(observation)
          value["observed_at"] = observation["observed_at"]
          value["source_revision"] = "git-tree:18c89bb1939d9f695b62a428e9e827bbf3fe77a6"
          value["source_bindings"] = [binding("AI_PROGRESS.json"),binding("AI_STATUS.md"),binding(receipt_path),binding(index_path)]
          value["next_effect"] = {"anticipated_state_id":"r11-draft-shape-observation-receipt-pair-exact-head-green","description":"Resolve the exact Authority R11 push run for 26a45a0af463dcd8bb1667897d1a999230375307, download and verify the bounded draft-shape observation artifact, verify the unchanged C2 SHA-256, persist a receipt-only Authority successor, port the byte-identical substantive receipt to Mirror, regenerate repository-native integrity outputs, run all mandatory exact-head gates, and verify reciprocal Authority/Mirror synchronization. No Zenodo mutation, publication, release, deployment, IETF action, PASS, FINAL_PASS, or EFFECT_ACK_DONE is authorized.","effect_id":"RESOLVE_AND_PERSIST_R11_DRAFT_SHAPE_OBSERVATION_RECEIPT_PAIR","executor_capability":"qikvrt.repository.anticipation.v1","expected_receipt":"receipts/anticipation/0005-r11-draft-shape-observation-receipt-pair.json","preconditions":["AUTHORITY_MAIN_EQUALS_B17C0C1E730E61648C571473BAE3FA51005C35DE","MIRROR_MAIN_EQUALS_7925FE1A97A3DC5D99A891441EC60BA854137172","PR366_PR211_RECIPROCAL_RECEIPT_PROMOTED","RECEIPT_BLOB_04B30A72B3303933E2F857FD5D9AF562EEF6CEED_PRESERVED","RECEIPT_INDEX_APPEND_ONLY_EQUALITY_PRESERVED","RESOLVE_EXACT_R11_PUSH_RUN","VERIFY_R11_ARTIFACT_AND_UNCHANGED_C2","PERSIST_RECEIPT_ONLY_SUCCESSORS","RUN_MANDATORY_EXACT_HEAD_GATES","VERIFY_AUTHORITY_MIRROR_SYNCHRONIZATION","NO_ZENODO_MUTATION","NO_EXTERNAL_DISPATCH"]}
          value["completion_claims"]={"PASS":False,"FINAL_PASS":False,"EFFECT_ACK_DONE":False}
          path.write_text(json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(",",":"))+"\n",encoding="utf-8")
          PY
          python3 -B tools/qikvrt_anticipation.py materialize
          python3 -B tools/qikvrt_anticipation.py check
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
      - name: Persist projections and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qikvrt_paired_anticipation_refresh_pr366_pr211.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anticipation receipts/anticipation REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git add -u .github/workflows/qikvrt_paired_anticipation_refresh_pr366_pr211.yml
          git commit -m "anticipation: bind PR366 PR211 promotion and select R11 receipt pair"
          git push origin HEAD:agent/current-main-anticipation-refresh-pr366-pr211-v1
