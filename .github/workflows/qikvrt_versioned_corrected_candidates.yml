name: QIKVRT versioned corrected corpus candidates

on:
  push:
    branches:
      - agent/versioned-corrected-candidates-remaining-corpus-v1
  pull_request:
    branches:
      - agent/batch003-subject-172dd-public-freeze-probe
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qikvrt-versioned-corrected-candidates-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'agent/versioned-corrected-candidates-remaining-corpus-v1')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REF: agent/versioned-corrected-candidates-remaining-corpus-v1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile exact candidate builder
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m py_compile \
            tools/qikvrt_create_versioned_corrected_candidates.py \
            tools/qikvrt_create_versioned_corrected_candidates_entrypoint.py
      - name: Recover exact public bytes and materialize six candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_create_versioned_corrected_candidates_entrypoint.py --materialize \
            | tee /tmp/qikvrt-versioned-corrected-candidates.log
      - name: Verify committed candidate contract offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_create_versioned_corrected_candidates_entrypoint.py --check
          grep -Fx 'PASS=false' /tmp/qikvrt-versioned-corrected-candidates.log
          grep -Fx 'FINAL_PASS=false' /tmp/qikvrt-versioned-corrected-candidates.log
          grep -Fx 'EFFECT_ACK_DONE=false' /tmp/qikvrt-versioned-corrected-candidates.log
          grep -Fx 'ZENODO_MUTATION=false' /tmp/qikvrt-versioned-corrected-candidates.log
      - name: Regenerate and verify repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
      - name: Run complete mandatory repository suite
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 -B tools/qikvrt_integrity.py verify
      - name: Persist exact owner-return evidence head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tools/qikvrt_create_versioned_corrected_candidates.py \
            tools/qikvrt_create_versioned_corrected_candidates_entrypoint.py \
            .github/workflows/qikvrt_versioned_corrected_candidates.yml \
            release/zenodo-corpus-proof-2026-07-28/canonical-union/versioned-corrected-candidates \
            work-units/CREATE_VERSIONED_CORRECTED_CANDIDATES_REMAINING_CORPUS_SUBJECTS.json \
            work-units/OWNER_DECISION_VERSIONED_CORRECTED_CANDIDATES.json \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Exact owner-return evidence is already current."
            exit 0
          fi
          git commit -m "Materialize six versioned corrected corpus candidates"
          git push origin "HEAD:${TARGET_REF}"
      - name: Upload exact owner-return package
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-versioned-corrected-candidates-owner-return
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            release/zenodo-corpus-proof-2026-07-28/canonical-union/versioned-corrected-candidates/**
