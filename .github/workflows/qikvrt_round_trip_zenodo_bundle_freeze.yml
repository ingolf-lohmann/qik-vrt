name: QIK-VRT Round Trip Zenodo bundle freeze

on:
  pull_request:
    paths:
      - 'docs/publications/2026-08-07-universum-als-round-trip/**'
      - 'release/round-trip-canonical-publication-zenodo-v1/**'
      - 'release/zenodo-corpus-proof-2026-07-28/canonical-union/**'
      - 'evidence/receipts/corpus-correction-temporal-precedence-current.json'
      - 'evidence/receipts/corpus-closure-effective-current.json'
      - 'policy/zenodo-machine-proof-policy-v2.json'
      - 'policy/qikvrt-zenodo-machine-proof-bundle-v2.schema.json'
      - 'policy/qikvrt-prepublication-return-receipt-v2.schema.json'
      - 'state/work_units/ROUND_TRIP_ZENODO_BUNDLE_FREEZE_V1.json'
      - 'tools/qikvrt_round_trip_zenodo_bundle_freeze.py'
      - 'tests/test_round_trip_zenodo_bundle_freeze.py'
      - '.github/workflows/qikvrt_round_trip_zenodo_bundle_freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-round-trip-zenodo-bundle-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source head and tree
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          test "$head" = "$expected"
          test "${#head}" -eq 40
          test "${#tree}" -eq 40
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: '3.12'

      - name: Verify exact frozen bundle through existing v2 machinery
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_round_trip_zenodo_bundle_freeze.py \
            --check --json | tee "$RUNNER_TEMP/BUNDLE_FREEZE_CHECK.json"

      - name: Run bounded regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest tests.test_round_trip_zenodo_bundle_freeze

      - name: Upload exact freeze evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-round-trip-zenodo-bundle-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/BUNDLE_FREEZE_CHECK.json
            release/round-trip-canonical-publication-zenodo-v1/BUNDLE_FREEZE_RECEIPT.json
            release/round-trip-canonical-publication-zenodo-v1/CLAIM_MATRIX.json
            release/round-trip-canonical-publication-zenodo-v1/MACHINE_PROOF_BUNDLE.json
            release/round-trip-canonical-publication-zenodo-v1/PROMOTED_FORMAL_KERNEL_RECEIPTS.json
            release/round-trip-canonical-publication-zenodo-v1/PROMOTED_FORMAL_SOURCE_BINDINGS.json
            release/round-trip-canonical-publication-zenodo-v1/RETROSPECTIVE_SOURCE_CONSTITUENTS.json
            release/round-trip-canonical-publication-zenodo-v1/ZENODO_FILESET.md
            release/round-trip-canonical-publication-zenodo-v1/ZENODO_METADATA.json
            release/round-trip-canonical-publication-zenodo-v1/ZENODO_SHA256SUMS
            release/round-trip-canonical-publication-zenodo-v1/ZENODO_TARGET_RECORD.json
