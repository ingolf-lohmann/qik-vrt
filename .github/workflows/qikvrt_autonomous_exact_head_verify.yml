name: QIK-VRT autonomous exact-head verification

on:
  repository_dispatch:
    types: [qikvrt_autonomous_exact_head_verify]
  pull_request:
    paths:
      - "Makefile"
      - ".gitattributes"
      - ".github/workflows/qikvrt_autonomous_pr_continuation.yml"
      - ".github/workflows/qikvrt_autonomous_exact_head_verify.yml"
      - "tools/qikvrt_autonomous_self_heal.py"
      - "tests/test_qikvrt_autonomous_pr_continuation.py"
      - "state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json"

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-autonomous-exact-head-${{ github.event.pull_request.number || github.event.client_payload.pull_request }}-${{ github.event.pull_request.head.sha || github.event.client_payload.head_sha }}
  cancel-in-progress: false

jobs:
  verify-pr-contract:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact contract candidate without writer credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify pipeline invariants and actual continuation behavior
        env:
          EXPECTED_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_CANDIDATE"
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B tools/qikvrt_autonomous_self_heal.py pipeline-bind \
            --reference "$EXPECTED_CANDIDATE" > /tmp/qikvrt-candidate-pipeline.json
          python3 -B tools/qikvrt_autonomous_self_heal.py pipeline-verify \
            --binding /tmp/qikvrt-candidate-pipeline.json
          make test
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'READ_ONLY_CONTRACT_VERIFIED; Main activation, autonomous dispatch and product acceptance remain separate.'

  verify:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
      TARGET_PR: ${{ github.event.client_payload.pull_request }}
      TARGET_REF: ${{ github.event.client_payload.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.head_sha }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.base_sha }}
    steps:
      - name: Validate dispatch envelope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "${#TARGET_SHA}" -eq 40
          test "${#TARGET_BASE_SHA}" -eq 40
          current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" --jq '.head.sha')"
          test "$current" = "$TARGET_SHA"

      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.client_payload.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact checkout and repository-native contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_BASE_SHA" HEAD
          python3 -B tools/qikvrt_publication_overview.py check
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest -v \
            tests.test_qikvrt_publication_overview \
            tests.test_qikvrt_autonomous_self_heal
          make test

      - name: Set up Lean for QCE when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          test: false

      - name: Install QCE document inspection tools
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Re-execute QCE finite formal model when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        working-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
        shell: bash
        run: |
          set -euo pipefail
          lake build
          python3 -B verify_qce_package.py \
            --lean "$(command -v lean)" \
            --axiom-output "$RUNNER_TEMP/qce-autonomous-axiom-output.txt" \
            > "$RUNNER_TEMP/qce-autonomous-verification.json"

      - name: Publish exact-head success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='QIKVRT autonomous exact-head verification' \
            -f description='Deterministic repair, full suite and candidate-specific gates succeeded' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > /tmp/qikvrt-autonomous-verified.md <<EOF
          <!-- qikvrt-autonomous-exact-head-verification -->
          Exact-head autonomous verification completed successfully for \`${TARGET_SHA}\`.

          Repository-internal deterministic gates are green for this verification scope. Any declared independent human review, Mirror promotion, or separately authorized publication remains a distinct downstream gate. No repository-wide PASS, FINAL_PASS, or EFFECT_ACK_DONE is claimed.
          EOF
          gh pr comment "$TARGET_PR" --body-file /tmp/qikvrt-autonomous-verified.md

      - name: Publish exact-head failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='QIKVRT autonomous exact-head verification' \
            -f description='Fail-closed exact-head verification found a blocker' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
