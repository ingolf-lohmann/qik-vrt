name: QIK-VRT autonomous exact-head verification

on:
  repository_dispatch:
    types: [qikvrt_autonomous_exact_head_verify]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-autonomous-exact-head-${{ github.event.client_payload.pull_request }}-${{ github.event.client_payload.head_sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository }}
      TARGET_PR: ${{ github.event.client_payload.pull_request }}
      TARGET_REF: ${{ github.event.client_payload.head_ref }}
      TARGET_SHA: ${{ github.event.client_payload.head_sha }}
      TARGET_BASE_SHA: ${{ github.event.client_payload.base_sha }}
      VERIFIER_STATUS_CONTEXT: "QIK-VRT autonomous exact-head verification"
    steps:
      - name: Check out exact base validation contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.client_payload.base_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate dispatch envelope
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "$GITHUB_REPOSITORY"
          test "${#TARGET_SHA}" -eq 40
          test "${#TARGET_BASE_SHA}" -eq 40
          test "$(git rev-parse --verify HEAD^{commit})" = "$TARGET_BASE_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${TARGET_PR}" \
            > /tmp/qikvrt-exact-head-pr.json
          python3 -B - <<'PY'
          import json
          import os
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          expected_head = os.environ['TARGET_SHA']
          expected_base = os.environ['TARGET_BASE_SHA']
          expected_ref = os.environ['TARGET_REF']
          promotion_marker = (
              '<!-- qikvrt-expected-head-promotion:enabled external_effect=NONE -->'
          )
          continuation_marker = '<!-- qikvrt-autonomous-self-heal:enabled -->'
          pr = json.load(open('/tmp/qikvrt-exact-head-pr.json', encoding='utf-8'))
          if (
              pr.get('state') != 'open'
              or (pr.get('base') or {}).get('ref') != 'main'
              or (pr.get('base') or {}).get('sha') != expected_base
              or (pr.get('head') or {}).get('sha') != expected_head
              or (pr.get('head') or {}).get('ref') != expected_ref
              or ((pr.get('head') or {}).get('repo') or {}).get('full_name') != repository
              or not isinstance(expected_ref, str)
              or not expected_ref.startswith('automation/self-heal-')
              or promotion_marker not in (pr.get('body') or '')
              or continuation_marker not in (pr.get('body') or '')
          ):
              raise SystemExit('BLOCK: dispatch does not bind an exact autonomous self-heal PR')
          contract = json.load(open(
              'state/autonomy/AUTONOMOUS_SELF_HEALING_CONTRACT_V1.json',
              encoding='utf-8',
          ))
          allowed = {
              path
              for handler in contract['allowlisted_handlers']
              for path in handler['mutable_paths']
          }
          raw = subprocess.check_output([
              'gh', 'api', '--paginate', '--slurp',
              f'repos/{repository}/pulls/{pr["number"]}/files?per_page=100',
          ], text=True)
          files = {
              name
              for page in json.loads(raw)
              for item in page
              for name in (item.get('filename'), item.get('previous_filename'))
              if isinstance(name, str) and name
          }
          required_integrity = {
              'REPOSITORY_FILE_MANIFEST.json',
              'REPOSITORY_FILE_MANIFEST.json.sha256',
              'SHA256SUMS.txt',
          }
          if not files or not files <= allowed or not required_integrity <= files:
              raise SystemExit('BLOCK: dispatch candidate diff is not the allowlisted integrity-bound scope')
          PY

      - name: Check out exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.client_payload.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify exact checkout and repository-native contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$TARGET_SHA"
          git merge-base --is-ancestor "$TARGET_BASE_SHA" HEAD
          python3 -B tools/qikvrt_publication_overview.py check
          python3 -B tools/qikvrt_integrity.py verify
          python3 -B -m unittest -v \
            tests.test_qikvrt_publication_overview \
            tests.test_qikvrt_autonomous_self_heal \
            tests.test_qikvrt_node_liveness \
            tests.test_qikvrt_expected_head_promotion \
            tests.test_qikvrt_expected_head_promotion_contract
          make test

      - name: Set up Lean for QCE when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          test: false

      - name: Install QCE document inspection tools
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Re-execute QCE finite formal model when present
        if: ${{ hashFiles('docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/lean-toolchain') != '' }}
        working-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
        shell: bash
        run: |
          set -euo pipefail
          lake build
          python3 -B verify_qce_package.py \
            --lean "$(command -v lean)" \
            --axiom-output qce-autonomous-axiom-output.txt \
            > qce-autonomous-verification.json

      - name: Publish exact-head success status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context="$VERIFIER_STATUS_CONTEXT" \
            -f description="Exact-head verified: pr=${TARGET_PR}; base=${TARGET_BASE_SHA}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          cat > /tmp/qikvrt-autonomous-verified.md <<EOF
          <!-- qikvrt-autonomous-exact-head-verification -->
          Exact-head autonomous verification completed successfully for \`${TARGET_SHA}\`.

          Repository-internal deterministic gates are green for this verification scope. Any declared independent human review, Mirror promotion, or separately authorized publication remains a distinct downstream gate. No repository-wide PASS, FINAL_PASS, or EFFECT_ACK_DONE is claimed.
          EOF
          gh pr comment "$TARGET_PR" --body-file /tmp/qikvrt-autonomous-verified.md

      - name: Publish exact-head failure status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context="$VERIFIER_STATUS_CONTEXT" \
            -f description="Exact-head blocked: pr=${TARGET_PR}; base=${TARGET_BASE_SHA}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
