name: QIKVRT common Roundtrip publication
on:
  push:
    branches: [publication/roundtrip-unified-20260920]
    paths: [release/roundtrip-unified-publication-request.json]
permissions:
  contents: read
concurrency:
  group: qikvrt-common-roundtrip-publication-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish-exact-html:
    if: github.repository == 'Goldkelch/qik-vrt' || github.repository == 'ingolf-lohmann/qik-vrt'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the exact activation without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify complete tool coverage
        run: python3 -B tools/qikvrt_tool_cache.py verify
      - name: Verify publisher negative cases
        run: python3 -B -m unittest -q tests.test_qikvrt_roundtrip_release
      - name: Validate source and peer, publish exact HTML, read public asset back
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B tools/qikvrt_roundtrip_release.py --publish
      - name: Preserve the exact publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-common-roundtrip-publication
          path: |
            .qikvrt/runtime/roundtrip-release-readback.json
            ${{ runner.temp }}/qikvrt-roundtrip-make-test.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
