# Carrier revision 3: the transport PR is closed during this push-only materialization.
name: QIKVRT one-shot exact Mirror R11 V2 materializer

on:
  push:
    branches:
      - transport/r11-v2-mirror-materializer-once
    paths:
      - .github/workflows/qikvrt_materialize_r11_v2_mirror_once.yml
  pull_request:
    branches: [main]
    types: [opened]
    paths:
      - .github/workflows/qikvrt_materialize_r11_v2_mirror_once.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-r11-v2-mirror-materializer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'ingolf-lohmann/qik-vrt' &&
      github.actor != 'github-actions[bot]' &&
      ((github.event_name == 'push' &&
        github.ref_name == 'transport/r11-v2-mirror-materializer-once') ||
       (github.event_name == 'pull_request' &&
        github.event.action == 'opened' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'transport/r11-v2-mirror-materializer-once' &&
        github.event.pull_request.base.sha == '8cdf8e71fe5edbadae4d80c606c07bdeea3ed4bc'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: transport/r11-v2-mirror-materializer-once
      MIRROR_BASE: 8cdf8e71fe5edbadae4d80c606c07bdeea3ed4bc
      AUTHORITY_SOURCE: 0b2360fa0c66c86e6ee6e71798adcdaf3ac2fac5
      AUTHORITY_TREE: ee7b66f6e1be72b340e28ab825dd7c18478d043d
      SOURCE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact Mirror carrier head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: true
          path: mirror

      - name: Check out exact promoted Authority V2 source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Goldkelch/qik-vrt
          ref: 0b2360fa0c66c86e6ee6e71798adcdaf3ac2fac5
          fetch-depth: 1
          persist-credentials: false
          path: authority

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Materialize exact portable V2 bytes and Mirror-native integrity
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/mirror"
          authority="$GITHUB_WORKSPACE/authority"
          cd "$root"

          test "$(git rev-parse --verify HEAD^{commit})" = "$SOURCE_HEAD"
          test "$(git rev-parse --verify origin/main^{commit})" = "$MIRROR_BASE"
          test "$(git -C "$authority" rev-parse --verify HEAD^{commit})" = "$AUTHORITY_SOURCE"
          test "$(git -C "$authority" rev-parse --verify HEAD^{tree})" = "$AUTHORITY_TREE"

          copy_exact() {
            path="$1"
            expected_mode="$2"
            expected_blob="$3"
            expected_sha256="$4"
            authority_mode="$(git -C "$authority" ls-tree "$AUTHORITY_SOURCE" -- "$path" | awk '{print $1}')"
            authority_blob="$(git -C "$authority" rev-parse "$AUTHORITY_SOURCE:$path")"
            test "$authority_mode" = "$expected_mode"
            test "$authority_blob" = "$expected_blob"
            mkdir -p "$(dirname "$path")"
            git -C "$authority" show "$AUTHORITY_SOURCE:$path" > "$path"
            cmp -s "$path" "$authority/$path"
            test "$(git hash-object "$path")" = "$expected_blob"
            test "$(sha256sum "$path" | awk '{print $1}')" = "$expected_sha256"
            if [ "$expected_mode" = 100755 ]; then
              chmod 0755 "$path"
            else
              chmod 0644 "$path"
            fi
          }

          copy_exact \
            state/authorization/r11/R11_READ_ONLY_OBSERVATION_DISPATCH_V2.json \
            100644 \
            c760c1c00847d055948ec957af6bd24a0439ed31 \
            a07b32938b7c05a1a20537413d773baa8ea9b07167dba5f9fd7d35e45ee2a70e
          copy_exact \
            tools/qikvrt_r11_read_only_observation_dispatch_v2.py \
            100755 \
            5e78b9ad9ceb1d2846d692933c883565d27a0645 \
            cbb8a89ad9075e20068d3f9000837c2ccc819eff895661160bd8a9f1564e23aa
          copy_exact \
            tests/test_r11_read_only_observation_dispatch_contract_v2.py \
            100644 \
            9f8aa3b9ed99d80ed98b5ca7cfe570c647400055 \
            7ac8d21f483037f7d6d62822e6efb33ed43519cab85fac27f0d15ee9ee025cff

          rm -- .github/workflows/qikvrt_materialize_r11_v2_mirror_once.yml

          python3 -B tests/test_r11_read_only_observation_dispatch_contract_v2.py
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

          git add -A
          cat > "$RUNNER_TEMP/r11-v2-mirror-expected-paths.txt" <<'EOF'
          REPOSITORY_FILE_MANIFEST.json
          REPOSITORY_FILE_MANIFEST.json.sha256
          SHA256SUMS.txt
          state/authorization/r11/R11_READ_ONLY_OBSERVATION_DISPATCH_V2.json
          tests/test_r11_read_only_observation_dispatch_contract_v2.py
          tools/qikvrt_r11_read_only_observation_dispatch_v2.py
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/r11-v2-mirror-expected-paths.txt"
          git diff --cached --name-only "$MIRROR_BASE" -- | LC_ALL=C sort > "$RUNNER_TEMP/r11-v2-mirror-actual-paths.txt"
          diff -u "$RUNNER_TEMP/r11-v2-mirror-expected-paths.txt" "$RUNNER_TEMP/r11-v2-mirror-actual-paths.txt"
          test "$(git ls-files -s tools/qikvrt_r11_read_only_observation_dispatch_v2.py | awk '{print $1}')" = 100755
          test "$(git hash-object state/authorization/r11/R11_READ_ONLY_OBSERVATION_DISPATCH_V2.json)" = c760c1c00847d055948ec957af6bd24a0439ed31
          test "$(git hash-object tools/qikvrt_r11_read_only_observation_dispatch_v2.py)" = 5e78b9ad9ceb1d2846d692933c883565d27a0645
          test "$(git hash-object tests/test_r11_read_only_observation_dispatch_contract_v2.py)" = 9f8aa3b9ed99d80ed98b5ca7cfe570c647400055

          remote_before="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk 'NR == 1 {print $1}')"
          test "$remote_before" = "$SOURCE_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(r11): port exact read-only observation successor V2 to Mirror'
          remote_after_commit="$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk 'NR == 1 {print $1}')"
          test "$remote_after_commit" = "$SOURCE_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          printf '%s\n' MIRROR_R11_V2_PORTABLE_BYTES_EXACT=true
          printf '%s\n' MIRROR_R11_V2_EXTERNAL_EFFECT=NONE
