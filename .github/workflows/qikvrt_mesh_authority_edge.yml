name: QIKVRT Mesh authority edge

on:
  push:
    branches: [work/firefox-windows-witness-20261001]
    paths: [.github/workflows/qikvrt_mesh_authority_edge.yml]
  repository_dispatch:
    types: [qikvrt-authority-admit]
  workflow_dispatch:
    inputs:
      repository:
        description: Exact target repository
        required: true
        default: Goldkelch/qik-vrt
      run_id:
        description: Exact ACTION_REQUIRED workflow run id
        required: true
      head_sha:
        description: Exact target head SHA
        required: true

permissions:
  contents: read

jobs:
  admit:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
      TARGET_RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      EXPECTED_HEAD: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
      ADMIN_TOKEN: ${{ secrets.QIKVRT_GITHUB_ADMIN_TOKEN }}
    steps:
      - name: Fail closed on target contract
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "Goldkelch/qik-vrt"
          test "$EXPECTED_HEAD" != ""
          test "$TARGET_RUN_ID" != ""
          test "$ADMIN_TOKEN" != ""
      - name: Bind exact ACTION_REQUIRED run and head
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$TARGET_REPOSITORY/actions/runs/$TARGET_RUN_ID"
          receipt="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          python3 - "$EXPECTED_HEAD" "$TARGET_RUN_ID" <<'PY' <<<"$receipt"
          import json,sys
          expected_head, expected_run = sys.argv[1], int(sys.argv[2])
          value=json.load(sys.stdin)
          assert value['id'] == expected_run, value
          assert value['head_sha'] == expected_head, value
          assert value['status'] == 'completed', value
          assert value['conclusion'] == 'action_required', value
          PY
      - name: Approve exact workflow execution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET_REPOSITORY/actions/runs/$TARGET_RUN_ID/approve"
      - name: Effect readback
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$TARGET_REPOSITORY/actions/runs/$TARGET_RUN_ID"
          receipt="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          python3 - "$EXPECTED_HEAD" "$TARGET_RUN_ID" <<'PY' <<<"$receipt"
          import json,sys
          expected_head, expected_run = sys.argv[1], int(sys.argv[2])
          value=json.load(sys.stdin)
          assert value['id'] == expected_run, value
          assert value['head_sha'] == expected_head, value
          assert value.get('conclusion') != 'action_required', value
          print(json.dumps({'run_id': value['id'], 'head_sha': value['head_sha'], 'status': value['status'], 'conclusion': value.get('conclusion')}, sort_keys=True))
          PY

  pages-readback:
    if: github.event_name == 'push' && github.repository == 'ingolf-lohmann/qik-vrt' && github.actor == 'ingolf-lohmann'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Fixed inline GET-only observer: no checkout, dispatch payload or candidate code.
    env:
      ADMIN_TOKEN: ${{ secrets.QIKVRT_GITHUB_ADMIN_TOKEN }}
      RULESET_ADMIN_TOKEN: ${{ secrets.QIKVRT_RULESET_ADMIN_TOKEN }}
      MESH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN }}
      OBSERVER_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD: ${{ github.sha }}
      OBSERVER_RUN_ID: ${{ github.run_id }}
      OBSERVER_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Read fixed Authority Pages contract without publishing
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, urllib.error, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def get(url, token=''):
              headers = {'Accept': 'application/vnd.github+json', 'Cache-Control': 'no-cache'}
              if token:
                  assert url.startswith('https://api.github.com/repos/')
                  headers.update({'Authorization': 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28'})
              request = urllib.request.Request(url, headers=headers)
              try:
                  response = opener.open(request, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              except (OSError, urllib.error.URLError):
                  return {'url': url, 'state': 'HOLD_TRANSPORT', 'status': None}
              with response:
                  body = response.read(2097153)
                  if len(body) > 2097152:
                      return {'url': url, 'state': 'HOLD_BODY_BOUND', 'status': response.code}
                  result = {'url': url, 'status': response.code, 'body_sha256': hashlib.sha256(body).hexdigest(),
                            'body_bytes': len(body), 'date': response.headers.get('Date'),
                            'request_id': response.headers.get('X-GitHub-Request-Id')}
                  try:
                      result['json'] = json.loads(body)
                  except (ValueError, UnicodeDecodeError):
                      pass
                  return result
          head = os.environ['CANDIDATE_HEAD']
          candidate = get('https://api.github.com/repos/ingolf-lohmann/qik-vrt/git/commits/' + head,
                          os.environ['OBSERVER_TOKEN'])
          tree = candidate.get('json', {}).get('tree', {}).get('sha')
          token = ''
          route = None
          probes = {}
          for name in ('RULESET_ADMIN_TOKEN', 'ADMIN_TOKEN', 'MESH_TOKEN'):
              credential = os.environ.get(name, '')
              probes[name] = {'credential_present': bool(credential)}
              if credential:
                  probes[name]['pages'] = get('https://api.github.com/repos/Goldkelch/qik-vrt/pages', credential)
                  if route is None and probes[name]['pages'].get('status') == 200:
                      route, token = name, credential
          authority = {}
          if token:
              authority['pages'] = probes[route]['pages']
              for path in ('pages/builds/latest', 'branches/main'):
                  authority[path] = get('https://api.github.com/repos/Goldkelch/qik-vrt/' + path, token)
          receipt = {'schema': 'qikvrt_authority_pages_rest_probe_v1',
                     'observed_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'candidate_repository': 'ingolf-lohmann/qik-vrt', 'candidate_head': head, 'candidate_tree': tree,
                     'run_id': os.environ['OBSERVER_RUN_ID'], 'run_attempt': os.environ['OBSERVER_RUN_ATTEMPT'],
                     'credential_present': any(x['credential_present'] for x in probes.values()),
                     'credential_route': route, 'credential_route_probes': probes,
                     'authority_repository': 'Goldkelch/qik-vrt',
                     'authority_reads': authority,
                     'public_reads': [get('https://goldkelch.github.io/qik-vrt/' + path) for path in ('', 'mesh/live/')],
                     'state': ('OBSERVED_AUTHORITY_PAGES' if tree and authority.get('pages', {}).get('status') == 200
                               else 'HOLD_AUTHORITY_PAGES_READ_UNAVAILABLE'),
                     'publication_mutated': False, 'deployed_candidate_head_tree_verified': False,
                     'persistent_signed_installation_verified': False, 'authenticated_runtime_readback': False,
                     'personal_release_effect_ack_done': False}
          pathlib.Path('PAGES_REST_READBACK.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          print(receipt['state'])
          PY
      - name: Retain exact run Pages REST receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-authority-pages-rest-readback
          path: PAGES_REST_READBACK.json
          if-no-files-found: error
          retention-days: 30
