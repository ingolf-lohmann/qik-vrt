name: QIKVRT Mesh authority edge

on:
  push:
    branches: [work/authority-url-probe-20261003-6fb101b]
    paths:
      - .github/workflows/qikvrt_mesh_authority_edge.yml
      - tools/qikvrt_authority_url_probe.py
      - tests/test_qikvrt_authority_url_probe.py
  repository_dispatch:
    types: [qikvrt-authority-admit]
  workflow_dispatch:
    inputs:
      operation:
        description: Bound authority operation
        type: choice
        options: [admit, authority_url_probe]
        required: true
        default: admit
      repository:
        description: Exact target repository
        required: true
        default: Goldkelch/qik-vrt
      run_id:
        description: Exact ACTION_REQUIRED workflow run id
        required: false
      head_sha:
        description: Exact target head SHA
        required: false

permissions:
  contents: read

jobs:
  authority-url-probe:
    if: >-
      github.repository == 'ingolf-lohmann/qik-vrt' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/work/authority-url-probe-20261003-6fb101b') ||
       (github.event_name == 'workflow_dispatch' && inputs.operation == 'authority_url_probe'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact native event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Verify probe boundaries before credential consumption
        id: probe-boundaries
        run: python3 -B -m unittest -v tests.test_qikvrt_authority_url_probe
      - name: Resolve existing direct or App credential route
        id: probe-credential-route
        env:
          RULESET_ADMIN_TOKEN: ${{ secrets.QIKVRT_RULESET_ADMIN_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.QIKVRT_GITHUB_ADMIN_TOKEN }}
          MESH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN }}
          RULESET_APP_ID: ${{ vars.QIKVRT_RULESET_APP_ID }}
          RULESET_APP_PRIVATE_KEY: ${{ secrets.QIKVRT_RULESET_APP_PRIVATE_KEY }}
        run: |
          direct=false
          app=false
          if [ -n "${RULESET_ADMIN_TOKEN:-}${ADMIN_TOKEN:-}${MESH_TOKEN:-}" ]; then direct=true; fi
          if [ -n "${RULESET_APP_ID:-}" ] && [ -n "${RULESET_APP_PRIVATE_KEY:-}" ]; then app=true; fi
          echo "direct=$direct" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - name: Mint existing App credential for fixed Authority read scope
        id: authority-app-token
        if: steps.probe-credential-route.outputs.direct != 'true' && steps.probe-credential-route.outputs.app == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.QIKVRT_RULESET_APP_ID }}
          private-key: ${{ secrets.QIKVRT_RULESET_APP_PRIVATE_KEY }}
          owner: Goldkelch
          repositories: qik-vrt
          permission-contents: read
      - name: Read fixed Authority subject and original QR URL
        if: always() && steps.probe-boundaries.outcome == 'success'
        env:
          QIKVRT_RULESET_ADMIN_TOKEN: ${{ secrets.QIKVRT_RULESET_ADMIN_TOKEN }}
          QIKVRT_GITHUB_ADMIN_TOKEN: ${{ secrets.QIKVRT_GITHUB_ADMIN_TOKEN }}
          QIKVRT_MESH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN }}
          QIKVRT_AUTHORITY_APP_TOKEN: ${{ steps.authority-app-token.outputs.token }}
          QIKVRT_RULESET_APP_ID: ${{ vars.QIKVRT_RULESET_APP_ID }}
          QIKVRT_RULESET_APP_PRIVATE_KEY: ${{ secrets.QIKVRT_RULESET_APP_PRIVATE_KEY }}
          QIKVRT_APP_TOKEN_ISSUANCE_OUTCOME: ${{ steps.authority-app-token.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B tools/qikvrt_authority_url_probe.py --output .qikvrt/evidence/authority-url-probe/readback.json
      - name: Persist metadata-only diagnostic readback
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: authority-url-probe-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qikvrt/evidence/authority-url-probe/readback.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  admit:
    if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.operation == 'admit')
    runs-on: ubuntu-24.04
    env:
      TARGET_REPOSITORY: ${{ github.event.client_payload.repository || inputs.repository }}
      TARGET_RUN_ID: ${{ github.event.client_payload.run_id || inputs.run_id }}
      EXPECTED_HEAD: ${{ github.event.client_payload.head_sha || inputs.head_sha }}
      ADMIN_TOKEN: ${{ secrets.QIKVRT_GITHUB_ADMIN_TOKEN }}
    steps:
      - name: Fail closed on target contract
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET_REPOSITORY" = "Goldkelch/qik-vrt"
          test "$EXPECTED_HEAD" != ""
          test "$TARGET_RUN_ID" != ""
          test "$ADMIN_TOKEN" != ""
      - name: Bind exact ACTION_REQUIRED run and head
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$TARGET_REPOSITORY/actions/runs/$TARGET_RUN_ID"
          receipt="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          python3 - "$EXPECTED_HEAD" "$TARGET_RUN_ID" <<'PY' <<<"$receipt"
          import json,sys
          expected_head, expected_run = sys.argv[1], int(sys.argv[2])
          value=json.load(sys.stdin)
          assert value['id'] == expected_run, value
          assert value['head_sha'] == expected_head, value
          assert value['status'] == 'completed', value
          assert value['conclusion'] == 'action_required', value
          PY
      - name: Approve exact workflow execution
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$TARGET_REPOSITORY/actions/runs/$TARGET_RUN_ID/approve"
      - name: Effect readback
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$TARGET_REPOSITORY/actions/runs/$TARGET_RUN_ID"
          receipt="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"
          python3 - "$EXPECTED_HEAD" "$TARGET_RUN_ID" <<'PY' <<<"$receipt"
          import json,sys
          expected_head, expected_run = sys.argv[1], int(sys.argv[2])
          value=json.load(sys.stdin)
          assert value['id'] == expected_run, value
          assert value['head_sha'] == expected_head, value
          assert value.get('conclusion') != 'action_required', value
          print(json.dumps({'run_id': value['id'], 'head_sha': value['head_sha'], 'status': value['status'], 'conclusion': value.get('conclusion')}, sort_keys=True))
          PY
