name: Materialize exact Authority tree 4211d774

on:
  push:
    branches:
      - agent/authority-4211d774-materialized
    paths:
      - .github/workflows/authority-exact-tree-materialize-4211d774.yml

permissions:
  contents: write

concurrency:
  group: authority-exact-tree-materialize-4211d774
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import exact Authority tree into Mirror object database
        shell: bash
        env:
          AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
          AUTHORITY_SHA: 4211d774fcd848af7b37ab35401b0971c9479ffa
          AUTHORITY_TREE: 0d1d23ae6811f755ce3b08f36b34df673d86c0e4
          MIRROR_BASE: 781cf7a9c1a3457b31004934166e6dacc223c4b9
          TARGET_BRANCH: agent/authority-4211d774-exact-transfer
          MESH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$MIRROR_BASE"
          test -n "${MESH_TOKEN:-}"
          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "BLOCK: target branch already exists" >&2
            exit 1
          fi
          git remote add authority "https://github.com/${AUTHORITY_REPOSITORY}.git"
          git fetch --no-tags authority "$AUTHORITY_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$AUTHORITY_SHA"
          test "$(git rev-parse "$AUTHORITY_SHA^{tree}")" = "$AUTHORITY_TREE"
          git config user.name "qik-vrt-exact-tree-materializer[bot]"
          git config user.email "qik-vrt-exact-tree-materializer[bot]@users.noreply.github.com"
          candidate="$(printf '%s\n' "Materialize Authority exact tree $AUTHORITY_SHA" | git commit-tree "$AUTHORITY_TREE" -p "$MIRROR_BASE")"
          test "$(git rev-parse "$candidate^{tree}")" = "$AUTHORITY_TREE"
          test "$(git rev-parse "$candidate^1")" = "$MIRROR_BASE"
          git push "https://x-access-token:${MESH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$candidate:refs/heads/$TARGET_BRANCH"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_STEP_SUMMARY"
          printf 'authority=%s\n' "$AUTHORITY_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'tree=%s\n' "$AUTHORITY_TREE" >> "$GITHUB_STEP_SUMMARY"
          printf 'mirror_base=%s\n' "$MIRROR_BASE" >> "$GITHUB_STEP_SUMMARY"
