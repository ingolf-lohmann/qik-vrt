name: QIK-VRT one-shot quantum-classical runtime article Mirror sync 3a186

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/qikvrt_sync_quantum_classical_runtime_article_3a186_once.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-sync-quantum-classical-runtime-article-3a186
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
      AUTHORITY_COMMIT: 3a186cb54077e959f9072b78bd24eb85a61b5c3d
      MIRROR_BASE: dc217c8cb19bc113401a1f91dae27bf1733b5b5e
      TARGET_BRANCH: sync/quantum-classical-runtime-article-3a186-v1
      EXECUTION_WORKFLOW: .github/workflows/qikvrt_sync_quantum_classical_runtime_article_3a186_once.yml
    steps:
      - name: Check out exact Mirror execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: sync/quantum-classical-runtime-article-3a186-v1
          fetch-depth: 0
      - name: Verify executor and canonical integrity authorization boundary
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = 'ingolf-lohmann/qik-vrt' ]
          [ "${{ github.event.pull_request.base.sha }}" = "$MIRROR_BASE" ]
          [ "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}' ]
          [ "$(git merge-base HEAD "$MIRROR_BASE")" = "$MIRROR_BASE" ]
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MIRROR_BASE" ]
          [ "$(git ls-remote https://github.com/$AUTHORITY_REPOSITORY.git refs/heads/main | cut -f1)" = "$AUTHORITY_COMMIT" ]
          mapfile -t changed < <(git diff --name-only "$MIRROR_BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            "$EXECUTION_WORKFLOW"
            'REPOSITORY_FILE_MANIFEST.json'
            'REPOSITORY_FILE_MANIFEST.json.sha256'
            'SHA256SUMS.txt'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [ "${#changed[@]}" -eq "${#expected_sorted[@]}" ]
          for i in "${!expected_sorted[@]}"; do [ "${changed[$i]}" = "${expected_sorted[$i]}" ]; done
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py verify
      - name: Fetch and verify exact Authority tree in isolation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/$AUTHORITY_REPOSITORY.git "$AUTHORITY_COMMIT"
          [ "$(git rev-parse FETCH_HEAD)" = "$AUTHORITY_COMMIT" ]
          authority_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          test -n "$authority_tree"
          worktree="$RUNNER_TEMP/qikvrt-authority-3a186"
          git worktree add --detach "$worktree" "$AUTHORITY_COMMIT"
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$worktree/tools/qikvrt_integrity.py" verify
          python3 -B "$worktree/tests/test_quantum_classical_runtime_article.py"
          python3 -B "$worktree/tools/qikvrt_global_completion.py" check
          make -C "$worktree" test
          (
            cd "$worktree/formalization/QIKVRT_Formalization_v2.0"
            lake build
            lake env lean QIKVRTEffectAck/QuantumClassicalRuntime.lean
          )
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$worktree/tools/qikvrt_integrity.py" verify
          echo "AUTHORITY_TREE=$authority_tree" >> "$GITHUB_ENV"
      - name: Construct and persist exact Authority tree with Mirror history
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}' ]
          [ "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = '${{ github.event.pull_request.head.sha }}' ]
          message="$(printf '%s\n' \
            'Synchronize quantum-classical runtime article, proof and Zenodo receipt from Authority 3a186' \
            '' \
            "Authority commit: $AUTHORITY_COMMIT" \
            "Authority tree: $AUTHORITY_TREE" \
            "Previous Mirror main: $MIRROR_BASE" \
            'Zenodo DOI: 10.5281/zenodo.21640173' \
            'Concept DOI: 10.5281/zenodo.21640172' \
            'Real QPU integration QRT-018 remains IMPLEMENTATION_OPEN.' \
            'No final pair equality is claimed by this commit.')"
          sync_commit="$(printf '%s\n' "$message" | env \
            GIT_AUTHOR_NAME='QIK-VRT Repository Mesh' \
            GIT_AUTHOR_EMAIL='ingolf.lohmann@live.com' \
            GIT_COMMITTER_NAME='QIK-VRT Repository Mesh' \
            GIT_COMMITTER_EMAIL='ingolf.lohmann@live.com' \
            git commit-tree "$AUTHORITY_TREE" -p '${{ github.event.pull_request.head.sha }}')"
          [ "$(git rev-parse "$sync_commit^{tree}")" = "$AUTHORITY_TREE" ]
          [ "$(git show -s --format=%P "$sync_commit")" = '${{ github.event.pull_request.head.sha }}' ]
          git push origin "$sync_commit:refs/heads/$TARGET_BRANCH"
