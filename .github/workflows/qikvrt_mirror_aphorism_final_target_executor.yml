name: QIK-VRT Mirror aphorism final target executor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/qikvrt_mirror_aphorism_final_target_executor.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-mirror-aphorism-final-target-v3
  cancel-in-progress: false

jobs:
  port-target:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'repair/mirror-aphorism-final-boundary-v3' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_REF: agent/aphorism-corpus-scientific-assessment-mirror-v2
      EXPECTED_TARGET_HEAD: 8e0bb8f68e5424ab9dc3f9455512575df07fd984
      MIRROR_PARENT: 3568e24a31764ad0b3704d15645b1b2dbd3d2ec4
      AUTHORITY_BASE: bad1a0558b88b9bc13a6b47fe621ac27d8bfaa62
      AUTHORITY_HEAD: 770ac0c1e192aba7134020d972f42e50c27889ca
      CARRIER_PATH: .github/workflows/qikvrt_mirror_aphorism_corpus_port_carrier.yml
      EXPECTED_CARRIER_BLOB: 2dfb9a2db6be4beea17f962e166046948f39225d
      MIRROR_MAKEFILE_BLOB: 469bd4fa9a3af1f3a1f3bcff140f4ca41f4f53f3
    steps:
      - name: Check out exact target branch with bounded write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify exact target and bounded pre-port state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --verify HEAD^{commit})" = "$EXPECTED_TARGET_HEAD"
          git merge-base --is-ancestor "$MIRROR_PARENT" HEAD
          test -f "$CARRIER_PATH"
          test ! -L "$CARRIER_PATH"
          test "$(git hash-object "$CARRIER_PATH")" = "$EXPECTED_CARRIER_BLOB"
          carrier_seen=0
          while IFS= read -r path; do
            case "$path" in
              "$CARRIER_PATH") carrier_seen=1 ;;
              REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt) ;;
              *)
                printf 'BLOCK: unexpected target path before port: %s\n' "$path" >&2
                exit 2
                ;;
            esac
          done < <(git diff --name-only "$MIRROR_PARENT" HEAD --)
          test "$carrier_seen" = 1
          test "$(git rev-parse "$MIRROR_PARENT:Makefile")" = "$MIRROR_MAKEFILE_BLOB"

      - name: Fetch exact Authority source and copy portable paths
        shell: bash
        run: |
          set -euo pipefail
          git remote add authority https://github.com/Goldkelch/qik-vrt.git
          git fetch --no-tags authority "$AUTHORITY_BASE" "$AUTHORITY_HEAD"
          test "$(git rev-parse --verify "$AUTHORITY_BASE^{commit}")" = "$AUTHORITY_BASE"
          test "$(git rev-parse --verify "$AUTHORITY_HEAD^{commit}")" = "$AUTHORITY_HEAD"
          git merge-base --is-ancestor "$AUTHORITY_BASE" "$AUTHORITY_HEAD"

          mapfile -t all_paths < <(
            git diff --name-only --no-renames "$AUTHORITY_BASE" "$AUTHORITY_HEAD" --
          )
          test "${#all_paths[@]}" -eq 76
          : > "$RUNNER_TEMP/portable_paths.txt"
          for path in "${all_paths[@]}"; do
            case "$path" in
              Makefile|REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt)
                continue
                ;;
            esac
            status="$(
              git diff --name-status --no-renames \
                "$AUTHORITY_BASE" "$AUTHORITY_HEAD" -- "$path" |
                awk 'NR == 1 { print $1 }'
            )"
            case "$status" in
              A|M) ;;
              *)
                printf 'BLOCK: unsupported Authority status %s for %s\n' \
                  "$status" "$path" >&2
                exit 2
                ;;
            esac
            printf '%s\n' "$path" >> "$RUNNER_TEMP/portable_paths.txt"
            git checkout "$AUTHORITY_HEAD" -- "$path"
            test "$(git hash-object "$path")" = \
              "$(git rev-parse "$AUTHORITY_HEAD:$path")"
          done
          test "$(wc -l < "$RUNNER_TEMP/portable_paths.txt")" -eq 72

      - name: Adapt only the Mirror Makefile registration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Makefile)" = "$MIRROR_MAKEFILE_BLOB"
          python3 -B - <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "tests/test_virtual_past_reception.py tests/test_quantum_classical_runtime_article.py",
                  "tests/test_virtual_past_reception.py tests/test_aphorism_corpus_v2.py tests/test_quantum_classical_runtime_article.py",
              ),
              (
                  "tests.test_virtual_past_reception tests.test_quantum_classical_runtime_article",
                  "tests.test_virtual_past_reception tests.test_aphorism_corpus_v2 tests.test_quantum_classical_runtime_article",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"BLOCK: Mirror Makefile anchor count differs: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          test "$(git hash-object Makefile)" != "$MIRROR_MAKEFILE_BLOB"

      - name: Provision declared publication runtime
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for command in xelatex pdfinfo pdftotext pdftoppm pdffonts; do
            command -v "$command" >/dev/null 2>&1 || missing=1
          done
          if test "$missing" -ne 0; then
            sudo apt-get update -o Acquire::Retries=3
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends \
                texlive-xetex \
                texlive-latex-extra \
                texlive-lang-german \
                texlive-fonts-recommended \
                fonts-lmodern \
                poppler-utils
          fi
          command -v xelatex
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          command -v pdffonts
          xelatex --version | sed -n '1p'
          pdfinfo -v 2>&1 | sed -n '1p'

      - name: Re-materialize and verify the portable scientific bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_aphorism_corpus_v2.py --materialize --json
          python3 -B tools/qikvrt_aphorism_corpus_v2.py --check --json
          python3 -B -m unittest -v tests.test_aphorism_corpus_v2
          while IFS= read -r path; do
            expected="$(git rev-parse "$AUTHORITY_HEAD:$path")"
            observed="$(git hash-object "$path")"
            test "$observed" = "$expected" || {
              printf 'BLOCK: portable blob differs: %s\n' "$path" >&2
              exit 2
            }
          done < "$RUNNER_TEMP/portable_paths.txt"

      - name: Remove target carrier and regenerate Mirror-native integrity
        shell: bash
        run: |
          set -euo pipefail
          rm "$CARRIER_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Run complete Mirror repository gates
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Verify exact final path and status boundary
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/portable_paths.txt" "$RUNNER_TEMP/allowed_paths.txt"
          printf '%s\n' \
            Makefile \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt >> "$RUNNER_TEMP/allowed_paths.txt"
          sort -u "$RUNNER_TEMP/allowed_paths.txt" -o "$RUNNER_TEMP/allowed_paths.txt"
          python3 -B - "$RUNNER_TEMP/allowed_paths.txt" <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import sys

          expected = set(Path(sys.argv[1]).read_text(encoding="utf-8").splitlines())
          observed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", os.environ["MIRROR_PARENT"], "--"],
                  text=True,
              ).splitlines()
          )
          if observed != expected:
              raise SystemExit(
                  "BLOCK: final path set differs; "
                  f"missing={sorted(expected - observed)!r}; "
                  f"unexpected={sorted(observed - expected)!r}"
              )

          carrier = os.environ["CARRIER_PATH"]
          carrier_delta = subprocess.check_output(
              ["git", "diff", "--name-status", "--no-renames", "HEAD", "--", carrier],
              text=True,
          ).splitlines()
          if carrier_delta != [f"D\t{carrier}"]:
              raise SystemExit(
                  f"BLOCK: exact carrier deletion delta differs: {carrier_delta!r}"
              )

          raw = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-z", "--untracked-files=all"]
          entries = [entry for entry in raw.split(b"\0") if entry]
          if not entries:
              raise SystemExit("BLOCK: Mirror candidate has no materialized delta")
          seen_carrier = False
          for entry in entries:
              status = entry[:2].decode("ascii")
              path = entry[3:].decode("utf-8")
              if path == carrier:
                  if status not in {" D", "D "}:
                      raise SystemExit(
                          f"BLOCK: carrier deletion status differs: {status!r}"
                      )
                  seen_carrier = True
                  continue
              if status.startswith(("R", "C")):
                  raise SystemExit(f"BLOCK: rename/copy outside contract: {path}")
              if path not in expected:
                  raise SystemExit(
                      f"BLOCK: unexpected status path {status!r}: {path}"
                  )
          if not seen_carrier:
              raise SystemExit("BLOCK: exact carrier deletion is absent from status")
          PY
          test -f \
            docs/publications/2026-08-04-aphorism-corpus-scientific-assessment/QIK-VRT_Aphorism_Corpus_Scientific_Assessment_2026-08-04.pdf
          test -f tests/test_ietf_revision_02.py
          test -f tests/test_aphorism_corpus_v2.py
          test ! -e "$CARRIER_PATH"

      - name: Persist exact Mirror candidate without external effect
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          test "$source_head" = "$EXPECTED_TARGET_HEAD"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head" = "$source_head"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m "science: materialize Mirror aphorism corpus assessment"
          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          test "$remote_head_after_commit" = "$source_head"
          printf 'FINAL_COMMIT=%s\n' "$(git rev-parse --verify HEAD^{commit})"
          printf 'FINAL_TREE=%s\n' "$(git rev-parse --verify HEAD^{tree})"
          printf 'PORTABLE_PATH_COUNT=%s\n' \
            "$(wc -l < "$RUNNER_TEMP/portable_paths.txt")"
          printf 'FINAL_CHANGED_PATH_COUNT=%s\n' \
            "$(git diff --name-only "$MIRROR_PARENT" HEAD -- | wc -l)"
          git push origin "HEAD:$TARGET_REF"
