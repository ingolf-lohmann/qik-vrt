name: QIKVRT IONOS DNS
on:
  workflow_dispatch:
    inputs:
      operation:
        description: GET-only readback or exact-state-bound existing-record apply
        type: choice
        default: readback
        options: [readback, apply, web-readback, web-apply]
      zone:
        description: DNS zone
        type: string
        default: raumzeitterminal.de
      target_ipv4:
        description: Independently verified public IPv4 of the owned TLS origin
        type: string
        default: ""
      disable_apex_aaaa:
        description: Explicitly disable the bound single apex AAAA for legacy apply
        type: boolean
        default: false
      disable_web_aaaa:
        description: Explicitly disable bound apex/www AAAA records for web-apply
        type: boolean
        default: false
      expected_records_sha256:
        description: Exact prior apex digest, or whole-zone digest for web-apply
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: qikvrt-ionos-dns-${{ inputs.zone }}
  cancel-in-progress: false
jobs:
  dns:
    if: github.repository == 'ingolf-lohmann/qik-vrt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ionos-production
    timeout-minutes: 5
    steps:
      - name: Check out exact trusted main event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up declared Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Run bounded IONOS DNS operation
        if: success()
        env:
          IONOS_DNS_API_KEY: ${{ secrets.IONOS_DNS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          ZONE: ${{ inputs.zone }}
          TARGET_IPV4: ${{ inputs.target_ipv4 }}
          EXPECTED_SHA256: ${{ inputs.expected_records_sha256 }}
          DISABLE_APEX_AAAA: ${{ inputs.disable_apex_aaaa }}
          DISABLE_WEB_AAAA: ${{ inputs.disable_web_aaaa }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/qikvrt-ionos-dns"
          receipt="$RUNNER_TEMP/qikvrt-ionos-dns/receipt.json"
          case "$OPERATION" in
            apply)
              args=(apply --zone "$ZONE" --target-ipv4 "$TARGET_IPV4" --expected-records-sha256 "$EXPECTED_SHA256")
              if [ "$DISABLE_APEX_AAAA" = true ]; then args+=(--disable-apex-aaaa); fi
              ;;
            web-apply)
              args=(web-apply --zone "$ZONE" --target-ipv4 "$TARGET_IPV4" --expected-records-sha256 "$EXPECTED_SHA256")
              if [ "$DISABLE_WEB_AAAA" = true ]; then args+=(--disable-web-aaaa); fi
              ;;
            readback|web-readback) args=("$OPERATION" --zone "$ZONE");;
            *) echo HOLD_UNKNOWN_OPERATION; exit 2;;
          esac
          python3 -B tools/qikvrt_ionos_dns.py "${args[@]}" | tee "$receipt"
      - name: Persist DNS receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-ionos-dns-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qikvrt-ionos-dns/receipt.json
          if-no-files-found: error
          retention-days: 30
