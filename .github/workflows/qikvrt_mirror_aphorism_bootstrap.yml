name: QIK-VRT Mirror aphorism-corpus bootstrap

on:
  push:
    branches:
      - agent/aphorism-corpus-scientific-assessment-v2-mirror
    paths:
      - .github/workflows/qikvrt_mirror_aphorism_bootstrap.yml
  pull_request:
    paths:
      - .github/workflows/qikvrt_mirror_aphorism_bootstrap.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-mirror-aphorism-bootstrap-v2
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == 'agent/aphorism-corpus-scientific-assessment-v2-mirror' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TARGET_REF: agent/aphorism-corpus-scientific-assessment-v2-mirror
      EXPECTED_PREDECESSOR: 3568e24a31764ad0b3704d15645b1b2dbd3d2ec4
      AUTHORITY_HEAD: 770ac0c1e192aba7134020d972f42e50c27889ca
      AUTHORITY_RAW: https://raw.githubusercontent.com/Goldkelch/qik-vrt/770ac0c1e192aba7134020d972f42e50c27889ca
    steps:
      - name: Check out exact Mirror bootstrap head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Verify predecessor and one-path bootstrap delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P HEAD)" = "$EXPECTED_PREDECESSOR"
          test "$(git diff --name-only "$EXPECTED_PREDECESSOR" HEAD --)" = \
            ".github/workflows/qikvrt_mirror_aphorism_bootstrap.yml"
          test "$(git hash-object .github/workflows/qikvrt_batch04_integrity.yml)" = \
            "282b0b875fe847194a09cfaa4d0cc5191eb4a048"
          test "$(git hash-object tests/test_ietf_revision_02.py)" = \
            "e8bb5c4fcbc9732133212b22c57e058ed588fc53"
          for path in \
            tests/test_aphorism_corpus_v2.py \
            tools/qikvrt_aphorism_corpus_v2.py \
            tools/qikvrt_aphorism_corpus_v2_impl/impl.py.zlib \
            tools/qikvrt_aphorism_corpus_v2_payload/payload.tar.xz.00 \
            tools/qikvrt_aphorism_corpus_v2_payload/payload.tar.xz.01 \
            tools/qikvrt_aphorism_corpus_v2_payload/payload.tar.xz.02 \
            tools/qikvrt_aphorism_corpus_v2_payload/payload.tar.xz.03; do
            test ! -e "$path"
          done

      - name: Materialize and verify exact Authority source bytes
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r path expected_bytes expected_sha256 expected_blob; do
            test -n "$path"
            mkdir -p "$(dirname "$path")"
            tmp="$(mktemp)"
            curl --fail --location --silent --show-error \
              --retry 3 --retry-all-errors \
              --proto '=https' --tlsv1.2 \
              "$AUTHORITY_RAW/$path" \
              --output "$tmp"
            test "$(wc -c < "$tmp" | tr -d ' ')" = "$expected_bytes"
            test "$(sha256sum "$tmp" | awk '{print $1}')" = "$expected_sha256"
            test "$(git hash-object "$tmp")" = "$expected_blob"
            mv "$tmp" "$path"
          done <<'EOF'
          .github/workflows/qikvrt_batch04_integrity.yml|15199|74357bc710a0aed7fb0eb17ff2e236aa7919572307485587b2a6df79b49b1b87|becccbcfa60658fc131ed572b2860d2f170f8ea2
          tests/test_aphorism_corpus_v2.py|5769|682c1af489e9c243dbfb0d2e37984809f30ccdc1623a268d186ae8c02f59ce82|762578578842b72bf03d1a329da4008a7371f5e3
          tests/test_ietf_revision_02.py|42301|6d46c3c839de6e60e234fa2095669ce7b590ed4d12f22fa583f6a1e7e2ef80e6|c2dba3145d96c2ee1ed760e7785b4383381d4acb
          tools/qikvrt_aphorism_corpus_v2.py|1630|fdd8ad6610cc685d66ba5c8d9655f3e7ba5aff79d13381e84938d22b3396e9ba|b2618a31ba71754d65d667ba81b181b5738fdc07
          tools/qikvrt_aphorism_corpus_v2_impl/impl.py.zlib|5603|b4091daaa7679d73a444ed424613d966d6039ee00b5d7f3ae38f4c01e5656ea0|d13a2b13231320a16fd6e4487a9bac35d6e10698
          tools/qikvrt_aphorism_corpus_v2_payload/payload.tar.xz.00|7000|7d4aa3dc1de8723e816e7511c4b253ce018e608dc60ad0855eeb5c3ebbeda3de|ba827d8ebe9cf8e7c1d844ca8a666ab64b5951f3
          tools/qikvrt_aphorism_corpus_v2_payload/payload.tar.xz.01|7000|04578c22df365aaae5bc62a3250860caf347189231d388b5f38b0920e9527248|ac754f36b2d649182dd88f12fdad5a83e9ef5987
          tools/qikvrt_aphorism_corpus_v2_payload/payload.tar.xz.02|7000|4af5bc413ee0177e1eb6e9c33bb9e87657f27e295b5a28296ad20030a5e0465d|435fc9ab7d9aa646c6ded921053cfdcfae131514
          tools/qikvrt_aphorism_corpus_v2_payload/payload.tar.xz.03|5872|122ebce7521eb1365c1cde8c699692f70e1124a5c7ced4e0c223d4e6edb8a774|a89815a4ddf4ec239745bdec0321406e8dc03120
          EOF
          chmod 0755 tools/qikvrt_aphorism_corpus_v2.py

      - name: Provision and verify publication runtime
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for command in xelatex pdfinfo pdftotext pdftoppm pdffonts; do
            if ! command -v "$command" >/dev/null 2>&1; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            sudo apt-get update -o Acquire::Retries=3
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends \
                texlive-xetex \
                texlive-latex-extra \
                texlive-lang-german \
                texlive-fonts-recommended \
                fonts-lmodern \
                poppler-utils
          fi
          command -v xelatex
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          command -v pdffonts
          xelatex --version | sed -n '1p'
          pdfinfo -v 2>&1 | sed -n '1p'

      - name: Materialize and verify scientific bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_aphorism_corpus_v2.py --materialize --json
          python3 -B tools/qikvrt_aphorism_corpus_v2.py --check --json
          python3 -B -m unittest -v tests.test_aphorism_corpus_v2

      - name: Regenerate integrity and run complete Mirror gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Persist history-preserving Mirror successor
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse --verify HEAD^{commit})"
          remote_head="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head" != "$source_head" ]; then
            echo "BLOCK: Mirror target ref advanced before persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head=$remote_head" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/qikvrt_batch04_integrity.yml \
            tests/test_aphorism_corpus_v2.py \
            tests/test_ietf_revision_02.py \
            tools/qikvrt_aphorism_corpus_v2.py \
            tools/qikvrt_aphorism_corpus_v2_impl/impl.py.zlib \
            tools/qikvrt_aphorism_corpus_v2_payload \
            docs/publications/2026-08-04-aphorism-corpus-scientific-assessment \
            docs/publications/index.json \
            docs/publications/index.html \
            work-units/MATERIALIZE_APHORISM_CORPUS_SCIENTIFIC_ASSESSMENT_V2.json \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt
          git rm .github/workflows/qikvrt_mirror_aphorism_bootstrap.yml
          test -n "$(git diff --cached --name-only)"
          git commit -m "science: port aphorism corpus assessment to Mirror"
          remote_head_after_commit="$(
            git ls-remote --heads origin "refs/heads/$TARGET_REF" |
              awk 'NR == 1 { print $1 }'
          )"
          if [ "$remote_head_after_commit" != "$source_head" ]; then
            echo "BLOCK: Mirror target ref advanced during persistence" >&2
            echo "source_head=$source_head" >&2
            echo "remote_head_after_commit=$remote_head_after_commit" >&2
            exit 2
          fi
          git push origin "HEAD:$TARGET_REF"
