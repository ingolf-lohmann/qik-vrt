name: QIK-VRT Mirror aphorism candidate bytes transport

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/qikvrt_mirror_aphorism_candidate_bytes_transport.yml

permissions:
  contents: read

concurrency:
  group: qikvrt-mirror-aphorism-candidate-bytes-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'transport/mirror-aphorism-candidate-bytes-20260804-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MIRROR_PARENT: 3568e24a31764ad0b3704d15645b1b2dbd3d2ec4
      AUTHORITY_BASE: bad1a0558b88b9bc13a6b47fe621ac27d8bfaa62
      AUTHORITY_HEAD: 770ac0c1e192aba7134020d972f42e50c27889ca
      CARRIER_PATH: .github/workflows/qikvrt_mirror_aphorism_candidate_bytes_transport.yml
      MIRROR_MAKEFILE_BLOB: 469bd4fa9a3af1f3a1f3bcff140f4ca41f4f53f3
      OUTPUT_DIR: ${{ runner.temp }}/qikvrt-mirror-aphorism-candidate
    steps:
      - name: Check out exact transport head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify sole carrier delta and preserved predecessor
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$MIRROR_PARENT" HEAD
          test "$(git diff --name-only --no-renames "$MIRROR_PARENT" HEAD --)" = \
            "$CARRIER_PATH"
          test "$(git rev-parse "$MIRROR_PARENT:Makefile")" = \
            "$MIRROR_MAKEFILE_BLOB"

      - name: Fetch exact Authority source and copy portable paths
        shell: bash
        run: |
          set -euo pipefail
          git remote add authority https://github.com/Goldkelch/qik-vrt.git
          git fetch --no-tags authority "$AUTHORITY_BASE" "$AUTHORITY_HEAD"
          test "$(git rev-parse --verify "$AUTHORITY_BASE^{commit}")" = \
            "$AUTHORITY_BASE"
          test "$(git rev-parse --verify "$AUTHORITY_HEAD^{commit}")" = \
            "$AUTHORITY_HEAD"
          git merge-base --is-ancestor "$AUTHORITY_BASE" "$AUTHORITY_HEAD"

          mapfile -t all_paths < <(
            git diff --name-only --no-renames \
              "$AUTHORITY_BASE" "$AUTHORITY_HEAD" --
          )
          test "${#all_paths[@]}" -eq 76

          : > "$RUNNER_TEMP/portable_paths.txt"
          for path in "${all_paths[@]}"; do
            case "$path" in
              Makefile|REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt)
                continue
                ;;
            esac
            status="$(
              git diff --name-status --no-renames \
                "$AUTHORITY_BASE" "$AUTHORITY_HEAD" -- "$path" |
                awk 'NR == 1 { print $1 }'
            )"
            case "$status" in
              A|M) ;;
              *)
                printf 'BLOCK: unsupported Authority path status %s for %s\n' \
                  "$status" "$path" >&2
                exit 2
                ;;
            esac
            printf '%s\n' "$path" >> "$RUNNER_TEMP/portable_paths.txt"
            git checkout "$AUTHORITY_HEAD" -- "$path"
            test "$(git hash-object "$path")" = \
              "$(git rev-parse "$AUTHORITY_HEAD:$path")"
          done
          test "$(wc -l < "$RUNNER_TEMP/portable_paths.txt")" -eq 72

      - name: Adapt only the Mirror Makefile registration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object Makefile)" = "$MIRROR_MAKEFILE_BLOB"
          python3 -B - <<'PY'
          from pathlib import Path

          path = Path("Makefile")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "tests/test_virtual_past_reception.py tests/test_quantum_classical_runtime_article.py",
                  "tests/test_virtual_past_reception.py tests/test_aphorism_corpus_v2.py tests/test_quantum_classical_runtime_article.py",
                  "py_compile registration",
              ),
              (
                  "tests.test_virtual_past_reception tests.test_quantum_classical_runtime_article",
                  "tests.test_virtual_past_reception tests.test_aphorism_corpus_v2 tests.test_quantum_classical_runtime_article",
                  "unittest registration",
              ),
          )
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"BLOCK: Mirror Makefile {label} anchor count is {count}, expected 1"
                  )
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          test "$(git hash-object Makefile)" != "$MIRROR_MAKEFILE_BLOB"

      - name: Provision and verify declared publication runtime
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for command in xelatex pdfinfo pdftotext pdftoppm pdffonts; do
            if ! command -v "$command" >/dev/null 2>&1; then
              missing=1
            fi
          done
          if test "$missing" -ne 0; then
            sudo apt-get update -o Acquire::Retries=3
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends \
                texlive-xetex \
                texlive-latex-extra \
                texlive-lang-german \
                texlive-fonts-recommended \
                fonts-lmodern \
                poppler-utils
          fi
          command -v xelatex
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          command -v pdffonts
          xelatex --version | sed -n '1p'
          pdfinfo -v 2>&1 | sed -n '1p'
          pdftotext -v 2>&1 | sed -n '1p'
          pdftoppm -v 2>&1 | sed -n '1p'
          pdffonts -v 2>&1 | sed -n '1p'

      - name: Re-materialize and verify the portable scientific bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_aphorism_corpus_v2.py \
            --materialize --json
          python3 -B tools/qikvrt_aphorism_corpus_v2.py \
            --check --json
          python3 -B -m unittest -v tests.test_aphorism_corpus_v2

          while IFS= read -r path; do
            test "$(git hash-object "$path")" = \
              "$(git rev-parse "$AUTHORITY_HEAD:$path")" || {
                printf 'BLOCK: portable blob differs after materialization: %s\n' \
                  "$path" >&2
                exit 2
              }
          done < "$RUNNER_TEMP/portable_paths.txt"

      - name: Remove transport carrier and regenerate Mirror-native integrity
        shell: bash
        run: |
          set -euo pipefail
          rm "$CARRIER_PATH"
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify

      - name: Run complete Mirror repository gates
        shell: bash
        run: |
          set -euo pipefail
          make test
          python3 -B tools/qikvrt_integrity.py verify

      - name: Stage and verify exact 76-path candidate boundary
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          mapfile -t final_paths < <(
            git diff --cached --name-only --no-renames "$MIRROR_PARENT" --
          )
          test "${#final_paths[@]}" -eq 76

          cp "$RUNNER_TEMP/portable_paths.txt" "$RUNNER_TEMP/allowed_paths.txt"
          printf '%s\n' \
            Makefile \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt >> "$RUNNER_TEMP/allowed_paths.txt"
          sort -u "$RUNNER_TEMP/allowed_paths.txt" \
            -o "$RUNNER_TEMP/allowed_paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/allowed_paths.txt")" -eq 76

          for path in "${final_paths[@]}"; do
            grep -Fqx "$path" "$RUNNER_TEMP/allowed_paths.txt" || {
              printf 'BLOCK: unexpected final candidate path: %s\n' "$path" >&2
              exit 2
            }
          done
          test ! -e "$CARRIER_PATH"
          test -f \
            docs/publications/2026-08-04-aphorism-corpus-scientific-assessment/QIK-VRT_Aphorism_Corpus_Scientific_Assessment_2026-08-04.pdf

      - name: Emit exact candidate map and bounded native bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          cp Makefile "$OUTPUT_DIR/Makefile"
          cp REPOSITORY_FILE_MANIFEST.json \
            "$OUTPUT_DIR/REPOSITORY_FILE_MANIFEST.json"
          cp REPOSITORY_FILE_MANIFEST.json.sha256 \
            "$OUTPUT_DIR/REPOSITORY_FILE_MANIFEST.json.sha256"
          cp SHA256SUMS.txt "$OUTPUT_DIR/SHA256SUMS.txt"

          python3 -B - "$OUTPUT_DIR/CANDIDATE_MAP.json" \
            "$RUNNER_TEMP/portable_paths.txt" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          output = Path(sys.argv[1])
          portable_paths = Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
          mirror_native = [
              "Makefile",
              "REPOSITORY_FILE_MANIFEST.json",
              "REPOSITORY_FILE_MANIFEST.json.sha256",
              "SHA256SUMS.txt",
          ]
          entries = []
          for path_text in portable_paths + mirror_native:
              path = Path(path_text)
              raw = path.read_bytes()
              if path_text in portable_paths:
                  blob = subprocess.check_output(
                      ["git", "rev-parse", f"{os.environ['AUTHORITY_HEAD']}:{path_text}"],
                      text=True,
                  ).strip()
                  mode = subprocess.check_output(
                      ["git", "ls-tree", os.environ["AUTHORITY_HEAD"], "--", path_text],
                      text=True,
                  ).split()[0]
                  provenance = "authority_portable"
              else:
                  blob = subprocess.check_output(
                      ["git", "hash-object", path_text], text=True
                  ).strip()
                  mode = "100644"
                  provenance = "mirror_native"
              entries.append(
                  {
                      "path": path_text,
                      "mode": mode,
                      "type": "blob",
                      "blob_sha1": blob,
                      "bytes": len(raw),
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "provenance": provenance,
                  }
              )

          pdf_path = Path(
              "docs/publications/2026-08-04-aphorism-corpus-scientific-assessment/"
              "QIK-VRT_Aphorism_Corpus_Scientific_Assessment_2026-08-04.pdf"
          )
          pdf_raw = pdf_path.read_bytes()
          receipt = {
              "schema": "qikvrt_mirror_aphorism_candidate_map_v1",
              "repository": "ingolf-lohmann/qik-vrt",
              "mirror_parent": os.environ["MIRROR_PARENT"],
              "authority_base": os.environ["AUTHORITY_BASE"],
              "authority_head": os.environ["AUTHORITY_HEAD"],
              "portable_path_count": len(portable_paths),
              "mirror_native_path_count": len(mirror_native),
              "final_changed_path_count": len(entries),
              "pdf": {
                  "path": pdf_path.as_posix(),
                  "bytes": len(pdf_raw),
                  "sha256": hashlib.sha256(pdf_raw).hexdigest(),
                  "git_blob_sha1": subprocess.check_output(
                      ["git", "hash-object", pdf_path.as_posix()], text=True
                  ).strip(),
              },
              "entries": entries,
              "pass": False,
              "final_pass": False,
              "effect_ack_done": False,
              "effect_state": "EFFECT_ACK_CONTINUE",
          }
          output.write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY

      - name: Upload bounded candidate map and Mirror-native bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-mirror-aphorism-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
          path: ${{ runner.temp }}/qikvrt-mirror-aphorism-candidate/**
