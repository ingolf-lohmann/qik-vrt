name: QIKVRT requested review executor

on:
  pull_request:
    types: [opened, review_requested, synchronize, ready_for_review, reopened]
  workflow_run:
    workflows:
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT Batch-003 remaining subject disposition"
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional pull request number"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-requested-review-executor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  review-one:
    name: Requested review disposition (no independent approval)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      STATUS_CONTEXT: QIKVRT requested review disposition
      REVIEW_MARKER: qikvrt-requested-review-executor:v1
      REQUIRED_GATES_JSON: >-
        ["QIKVRT CI","QIKVRT repository evidence materialization","QIKVRT Collective Proposal Review","QIK-VRT global claim completion"]
    steps:
      - name: Check out current main review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Detect trusted-main activation
        id: active
        shell: bash
        run: |
          if test -f tools/qikvrt_requested_review_executor.py && python3 -B - <<'PY'
          import os, sys
          from tools import qikvrt_required_review_gate as gate
          from tools import qikvrt_requested_review_executor as review_core
          if any(not callable(getattr(review_core, name, None)) for name in ('native_review_candidate', 'snapshot_from_reads', 'technical_update_plan')):
              print('BOOTSTRAP_NOOP: native review routing is not yet promoted to trusted main.')
              sys.exit(2)
          resolver = getattr(gate, 'resolve_required_code_owner', None)
          if not callable(resolver):
              print('BOOTSTRAP_NOOP: current Mesh Authority binding is not yet promoted.')
              sys.exit(2)
          try:
              resolver(os.environ['REPOSITORY'])
          except (OSError, ValueError) as exc:
              print(f'BOOTSTRAP_NOOP: Mesh Authority binding invalid: {type(exc).__name__}')
              sys.exit(2)
          PY
          then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'BOOTSTRAP_NOOP: executor is not yet promoted to trusted main.'
          fi

      - name: Set up Python
        if: steps.active.outputs.active == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Select one requested review
        if: steps.active.outputs.active == 'true'
        id: select
        env:
          REQUESTED_PR: ${{ inputs.pr || '' }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' > /tmp/qikvrt-review-selection.json
          import json, os, subprocess
          from pathlib import Path
          from tools.qikvrt_requested_review_executor import native_review_candidate, snapshot_from_reads, technical_update_plan
          from tools.qikvrt_required_review_gate import resolve_required_code_owner
          resolve_required_code_owner(os.environ['REPOSITORY'])
          repo=os.environ['REPOSITORY']; requested=os.environ.get('REQUESTED_PR','').strip(); event_pr=os.environ.get('EVENT_PR','').strip(); event_head=os.environ.get('EVENT_HEAD','').strip()
          def one(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          def pages(path):
              value=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',path],text=True)); out=[]
              for page in value:
                  if isinstance(page,dict) and 'workflow_runs' in page: out.extend(page['workflow_runs'])
                  else: out.extend(page if isinstance(page,list) else [page])
              return out
          if requested: prs=[one(f'repos/{repo}/pulls/{int(requested)}')]
          elif event_pr: prs=[one(f'repos/{repo}/pulls/{int(event_pr)}')]
          else:
              prs=pages(f'repos/{repo}/pulls?state=open&base=main&per_page=100')
              if event_head: prs=[pr for pr in prs if (pr.get('head') or {}).get('sha')==event_head]
          policy=json.loads(Path('policy/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json').read_text())
          marker=os.environ['REVIEW_MARKER']; candidates=[]
          for pr in prs:
              if pr.get('state')!='open' or pr.get('base',{}).get('ref')!='main': continue
              people=[x.get('login') for x in pr.get('requested_reviewers',[]) if x.get('login')]; teams=[x.get('slug') for x in pr.get('requested_teams',[]) if x.get('slug')]
              if not people and not teams and not native_review_candidate(pr,policy,repo): continue
              head=pr['head']['sha']; reviews=pages(f"repos/{repo}/pulls/{pr['number']}/reviews?per_page=100")
              if any(f'<!-- {marker} head={head} ' in (review.get('body') or '') for review in reviews):
                  snap=snapshot_from_reads(repo,pr['number'],policy,json.loads(os.environ['REQUIRED_GATES_JSON']),one,pages)
                  statuses=pages(f'repos/{repo}/commits/{snap["head_sha"]}/statuses?per_page=100')
                  if technical_update_plan(snap,reviews,statuses,marker)['action']=='NOOP': continue
              candidates.append(pr)
          candidates.sort(key=lambda pr:(pr.get('created_at') or '',pr['number'])); chosen=candidates[0] if candidates else None
          print(json.dumps({'state':'CANDIDATE' if chosen else 'NOOP','pr_number':chosen['number'] if chosen else None},sort_keys=True))
          PY
          cat /tmp/qikvrt-review-selection.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          v=json.load(open('/tmp/qikvrt-review-selection.json')); print(f"state={v['state']}"); print(f"pr={v.get('pr_number') or ''}")
          PY

      - name: Materialize exact-head review snapshot
        if: steps.active.outputs.active == 'true' && steps.select.outputs.state == 'CANDIDATE'
        id: decision
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' > /tmp/qikvrt-review-snapshot.json
          import json, os, subprocess
          from pathlib import Path
          from tools.qikvrt_requested_review_executor import native_review_candidate, snapshot_from_reads, technical_update_plan
          repo=os.environ['REPOSITORY']; n=int(os.environ['PR_NUMBER']); required=json.loads(os.environ['REQUIRED_GATES_JSON'])
          def one(path): return json.loads(subprocess.check_output(['gh','api',path],text=True))
          def pages(path):
              value=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',path],text=True)); out=[]
              for page in value:
                  if isinstance(page,dict) and 'workflow_runs' in page: out.extend(page['workflow_runs'])
                  else: out.extend(page if isinstance(page,list) else [page])
              return out
          policy=json.loads(Path('policy/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json').read_text())
          snapshot=snapshot_from_reads(repo,n,policy,required,one,pages)
          print(json.dumps(snapshot,sort_keys=True))
          reviews=pages(f'repos/{repo}/pulls/{n}/reviews?per_page=100')
          statuses=pages(f'repos/{repo}/commits/{snapshot["head_sha"]}/statuses?per_page=100')
          plan=technical_update_plan(snapshot,reviews,statuses,os.environ['REVIEW_MARKER'])
          Path('/tmp/qikvrt-review-plan.json').write_text(json.dumps(plan,sort_keys=True))
          PY
          set +e
          python3 -B tools/qikvrt_requested_review_executor.py evaluate --input /tmp/qikvrt-review-snapshot.json > /tmp/qikvrt-review-decision.json
          rc=$?
          set -e
          cat /tmp/qikvrt-review-decision.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          v=json.load(open('/tmp/qikvrt-review-decision.json')); plan=json.load(open('/tmp/qikvrt-review-plan.json')); print(f"state={v['state'] if plan['action']!='NOOP' else 'NOOP'}"); print(f"head={v.get('head_sha') or ''}"); print(f"tree={v.get('tree_sha') or ''}"); print(f"blocker={v.get('first_blocker') or ''}")
          PY
          exit 0

      - name: Persist precise waiting state
        if: steps.active.outputs.active == 'true' && steps.decision.outputs.state == 'WAIT'
        env:
          EXPECTED_HEAD: ${{ steps.decision.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          detail="$(python3 -c 'import json; print(json.load(open("/tmp/qikvrt-review-decision.json"))["detail"])')"
          description="$(python3 -c 'import json; print(json.load(open("/tmp/qikvrt-review-plan.json"))["status_description"])')"
          gh api --method POST "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" -f state=pending -f context="$STATUS_CONTEXT" -f description="$description" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Persist substantive review disposition
        if: steps.active.outputs.active == 'true' && steps.decision.outputs.state != '' && steps.decision.outputs.state != 'WAIT' && steps.decision.outputs.state != 'NOOP'
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.decision.outputs.head }}
          EXPECTED_TREE: ${{ steps.decision.outputs.tree }}
          DISPOSITION: ${{ steps.decision.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" = "$EXPECTED_HEAD"
          detail="$(python3 -c 'import json; print(json.load(open("/tmp/qikvrt-review-decision.json"))["detail"])')"
          scope_count="$(python3 -c 'import json; print(len(json.load(open("/tmp/qikvrt-review-decision.json"))["reviewed_scope"]))')"
          marker="<!-- ${REVIEW_MARKER} head=${EXPECTED_HEAD} disposition=${DISPOSITION} -->"
          cat > /tmp/qikvrt-review-body.md <<EOF
          ${marker}
          QIKVRT repository technical review execution.
          This evaluates observed gates; semantic AI code inspection requires an attributable cognitive client. No Copilot subscription is required.

          - exact head: \`${EXPECTED_HEAD}\`
          - exact tree: \`${EXPECTED_TREE}\`
          - reviewed paths: \`${scope_count}\`
          - substantive disposition: \`${DISPOSITION}\`
          - evidence: ${detail}
          - platform identity: \`github-actions[bot]\` / repository workflow token
          - independent Code-Owner approval: **not implied**

          Any head/tree/scope drift invalidates this review. No merge, release, publication, PASS, FINAL_PASS or EFFECT_ACK_DONE is implied.
          EOF
          # A technical APPROVE disposition is recorded as COMMENT, never as a
          # native approval by this automated executor.
          event="$DISPOSITION"; if [ "$event" = COMMENT_WITH_BLOCKER ] || [ "$event" = APPROVE ]; then event=COMMENT; fi
          review_required="$(python3 -c 'import json; print(str(json.load(open("/tmp/qikvrt-review-plan.json"))["review_required"]).lower())')"
          if [ "$review_required" = true ]; then
          set +e
          gh api --method POST "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" -f commit_id="$EXPECTED_HEAD" -f event="$event" --raw-field body="$(cat /tmp/qikvrt-review-body.md)" > /tmp/qikvrt-review-write.json 2>/tmp/qikvrt-review-write.err
          review_rc=$?
          set -e
          platform_state="$event"
          if [ "$review_rc" -ne 0 ]; then
            # A lost response may already have created the review. Read it
            # independently; never issue a second review POST as fallback.
            gh api --paginate --slurp "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" > /tmp/qikvrt-review-readback.json
            python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          pages=json.loads(Path('/tmp/qikvrt-review-readback.json').read_text())
          wanted=Path('/tmp/qikvrt-review-body.md').read_text().rstrip('\n')
          matches=[r for page in pages for r in page if r.get('commit_id')==os.environ['EXPECTED_HEAD'] and r.get('body')==wanted and (r.get('user') or {}).get('login')=='github-actions[bot]']
          if len(matches)!=1: raise SystemExit('REVIEW_WRITE_OUTCOME_UNVERIFIED; no retry admitted')
          Path('/tmp/qikvrt-review-write.json').write_text(json.dumps(matches[0]))
          PY
          fi
          fi
          status="$(python3 -c 'import json; print(json.load(open("/tmp/qikvrt-review-plan.json"))["status_state"])')"
          description="$(python3 -c 'import json; print(json.load(open("/tmp/qikvrt-review-plan.json"))["status_description"])')"
          gh api --method POST "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" -f state="$status" -f context="$STATUS_CONTEXT" -f description="${description:0:140}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Strict NOOP when no requested review exists
        if: steps.active.outputs.active == 'true' && steps.select.outputs.state != 'CANDIDATE'
        run: echo 'No unexecuted requested review is currently actionable.'

      - name: Bootstrap NOOP before trusted-main promotion
        if: steps.active.outputs.active != 'true'
        run: echo 'Executor definition is under review; trusted main remains the only executable source.'

      - name: Report execution scope without governance acceptance
        if: always()
        env:
          SELECTION: ${{ steps.select.outputs.state || 'NOT_EVALUATED' }}
          DISPOSITION: ${{ steps.decision.outputs.state || 'NOT_EVALUATED' }}
        run: |
          {
            echo '## Requested review disposition only'
            echo
            echo "Selection: ${SELECTION}; technical disposition: ${DISPOSITION}."
            echo 'NOOP, WAIT, COMMENT and successful workflow execution do not establish native Ruleset enforcement or independent Code Owner approval.'
            echo 'The executor never writes the native governance status or its legacy alias and never submits an automated APPROVE review.'
          } >> "$GITHUB_STEP_SUMMARY"
