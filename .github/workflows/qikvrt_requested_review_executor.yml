name: QIKVRT requested review executor
run-name: ${{ inputs.mode == 'mesh-worker' && format('QIKVRT mesh review {0} {1}', inputs.source_run_id, inputs.work_sha256) || format('QIKVRT requested review pr={0} head={1} fp={2}', inputs.pr || 'event', inputs.head || 'event', inputs.fingerprint || 'event') }}

on:
  pull_request:
    types: [review_requested, synchronize, ready_for_review, reopened]
  workflow_run:
    workflows:
      - "QIKVRT CI"
      - "QIKVRT repository evidence materialization"
      - "QIKVRT Collective Proposal Review"
      - "QIK-VRT global claim completion"
      - "QIKVRT Batch-003 remaining subject disposition"
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Existing review or read-only counterpart computation"
        type: choice
        options: [review, mesh-worker]
        default: review
      source_repository:
        description: "Exact configured counterpart for mesh-worker"
        type: string
      source_run_id:
        description: "Exact source Actions run carrying the immutable work artifact"
        type: string
      work_sha256:
        description: "Exact work manifest SHA-256"
        type: string
      head:
        description: "Exact source review head for mesh-worker"
        type: string
      pr:
        description: "Optional pull request number"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: qikvrt-requested-review-executor-${{ github.repository }}-${{ inputs.mode == 'mesh-worker' && inputs.work_sha256 || 'review' }}
  cancel-in-progress: false

jobs:
  review-one:
    if: inputs.mode != 'mesh-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      QIKVRT_REVIEW_READ_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN }}
      QIKVRT_OBSERVATION_ROOT: .qikvrt/github-observations
      REPOSITORY: ${{ github.repository }}
      STATUS_CONTEXT: QIKVRT requested review execution
      REVIEW_MARKER: qikvrt-requested-review-executor:v1
      REQUIRED_GATES_JSON: >-
        ["QIKVRT CI","QIKVRT repository evidence materialization","QIKVRT Collective Proposal Review","QIK-VRT global claim completion"]
    steps:
      - name: Check out current main review code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Detect trusted-main activation
        id: active
        shell: bash
        run: |
          if test -f tools/qikvrt_requested_review_executor.py; then
            echo 'active=true' >> "$GITHUB_OUTPUT"
          else
            echo 'active=false' >> "$GITHUB_OUTPUT"
            echo 'BOOTSTRAP_NOOP: executor is not yet promoted to trusted main.'
          fi

      - name: Set up Python
        if: steps.active.outputs.active == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Select one requested review
        if: steps.active.outputs.active == 'true'
        id: select
        env:
          REQUESTED_PR: ${{ inputs.pr || '' }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' > /tmp/qikvrt-review-selection.json
          import json, os, subprocess
          repo=os.environ['REPOSITORY']; requested=os.environ.get('REQUESTED_PR','').strip(); event_pr=os.environ.get('EVENT_PR','').strip(); event_head=os.environ.get('EVENT_HEAD','').strip()
          from pathlib import Path
          if Path('tools/qikvrt_github_observation.py').is_file():
              from tools.qikvrt_github_observation import environment_client
          else:
              environment_client=None
          def one(path):
              if environment_client is not None: return environment_client().get(path)[0]
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          def pages(path):
              if environment_client is not None: value=environment_client().pages(path)
              else: value=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',path],text=True))
              out=[]
              for page in value: out.extend(page if isinstance(page,list) else [page])
              return out
          if requested: prs=[one(f'repos/{repo}/pulls/{int(requested)}')]
          elif event_pr: prs=[one(f'repos/{repo}/pulls/{int(event_pr)}')]
          else:
              prs=pages(f'repos/{repo}/pulls?state=open&base=main&per_page=100')
              if event_head: prs=[pr for pr in prs if (pr.get('head') or {}).get('sha')==event_head]
          marker=os.environ['REVIEW_MARKER']; candidates=[]
          for pr in prs:
              if pr.get('state')!='open' or pr.get('base',{}).get('ref')!='main': continue
              people=[x.get('login') for x in pr.get('requested_reviewers',[]) if x.get('login')]; teams=[x.get('slug') for x in pr.get('requested_teams',[]) if x.get('slug')]
              if not people and not teams: continue
              head=pr['head']['sha']; reviews=pages(f"repos/{repo}/pulls/{pr['number']}/reviews?per_page=100")
              if any(f'<!-- {marker} head={head} ' in (review.get('body') or '') for review in reviews): continue
              candidates.append(pr)
          candidates.sort(key=lambda pr:(pr.get('created_at') or '',pr['number'])); chosen=candidates[0] if candidates else None
          print(json.dumps({'state':'CANDIDATE' if chosen else 'NOOP','pr_number':chosen['number'] if chosen else None},sort_keys=True))
          PY
          cat /tmp/qikvrt-review-selection.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          v=json.load(open('/tmp/qikvrt-review-selection.json')); print(f"state={v['state']}"); print(f"pr={v.get('pr_number') or ''}")
          PY

      - name: Materialize exact-head review snapshot
        if: steps.active.outputs.active == 'true' && steps.select.outputs.state == 'CANDIDATE'
        id: decision
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY' > /tmp/qikvrt-review-snapshot.json
          import json, os, subprocess
          repo=os.environ['REPOSITORY']; n=int(os.environ['PR_NUMBER']); required=json.loads(os.environ['REQUIRED_GATES_JSON'])
          from pathlib import Path
          if Path('tools/qikvrt_github_observation.py').is_file():
              from tools.qikvrt_github_observation import environment_client
          else:
              environment_client=None
          def one(path):
              if environment_client is not None: return environment_client().get(path)[0]
              return json.loads(subprocess.check_output(['gh','api',path],text=True))
          def pages(path):
              if environment_client is not None: value=environment_client().pages(path)
              else: value=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp',path],text=True))
              out=[]
              for page in value:
                  if isinstance(page,dict) and 'workflow_runs' in page: out.extend(page['workflow_runs'])
                  else: out.extend(page if isinstance(page,list) else [page])
              return out
          pr=one(f'repos/{repo}/pulls/{n}'); main=one(f'repos/{repo}/commits/main')['sha']; head=pr['head']['sha']; observed=one(f'repos/{repo}/pulls/{n}')['head']['sha']; tree=one(f'repos/{repo}/git/commits/{head}')['tree']['sha']; files=pages(f'repos/{repo}/pulls/{n}/files?per_page=100'); runs=pages(f'repos/{repo}/actions/runs?head_sha={head}&event=pull_request&per_page=100')
          owner,name=repo.split('/',1); query='''query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}'''; graph=json.loads(subprocess.check_output(['gh','api','graphql','-f',f'query={query}','-F',f'owner={owner}','-F',f'name={name}','-F',f'number={n}'],text=True)); nodes=graph['data']['repository']['pullRequest']['reviewThreads']['nodes']
          print(json.dumps({'repository':repo,'pr_number':n,'current_main_sha':main,'base_sha':pr['base']['sha'],'head_sha':head,'observed_head_sha':observed,'tree_sha':tree,'draft':bool(pr.get('draft')),'requested_reviewers':[x.get('login') for x in pr.get('requested_reviewers',[]) if x.get('login')],'requested_team_reviewers':[x.get('slug') for x in pr.get('requested_teams',[]) if x.get('slug')],'changed_paths':sorted(x['filename'] for x in files),'unresolved_review_threads':sum(1 for x in nodes if not x.get('isResolved')),'required_gates':required,'workflow_runs':[{'name':r.get('name'),'status':r.get('status'),'conclusion':r.get('conclusion'),'run_number':r.get('run_number')} for r in runs]},sort_keys=True))
          PY
          set +e
          python3 -B tools/qikvrt_requested_review_executor.py evaluate --input /tmp/qikvrt-review-snapshot.json > /tmp/qikvrt-review-decision.json
          rc=$?
          set -e
          cat /tmp/qikvrt-review-decision.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          v=json.load(open('/tmp/qikvrt-review-decision.json')); print(f"state={v['state']}"); print(f"head={v.get('head_sha') or ''}"); print(f"tree={v.get('tree_sha') or ''}"); print(f"blocker={v.get('first_blocker') or ''}")
          PY
          exit 0

      - name: Persist precise waiting state
        if: steps.active.outputs.active == 'true' && steps.decision.outputs.state == 'WAIT'
        env:
          EXPECTED_HEAD: ${{ steps.decision.outputs.head }}
        shell: bash
        run: |
          set -euo pipefail
          detail="$(python3 -c 'import json; print(json.load(open("/tmp/qikvrt-review-decision.json"))["detail"])')"
          gh api --method POST "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" -f state=pending -f context="$STATUS_CONTEXT" -f description="${detail:0:140}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Persist substantive review disposition
        if: steps.active.outputs.active == 'true' && steps.decision.outputs.state != '' && steps.decision.outputs.state != 'WAIT'
        env:
          PR_NUMBER: ${{ steps.select.outputs.pr }}
          EXPECTED_HEAD: ${{ steps.decision.outputs.head }}
          EXPECTED_TREE: ${{ steps.decision.outputs.tree }}
          DISPOSITION: ${{ steps.decision.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')" = "$EXPECTED_HEAD"
          detail="$(python3 -c 'import json; print(json.load(open("/tmp/qikvrt-review-decision.json"))["detail"])')"
          scope_count="$(python3 -c 'import json; print(len(json.load(open("/tmp/qikvrt-review-decision.json"))["reviewed_scope"]))')"
          marker="<!-- ${REVIEW_MARKER} head=${EXPECTED_HEAD} disposition=${DISPOSITION} -->"
          cat > /tmp/qikvrt-review-body.md <<EOF
          ${marker}
          QIKVRT autonomous requested-review execution.

          - exact head: \`${EXPECTED_HEAD}\`
          - exact tree: \`${EXPECTED_TREE}\`
          - reviewed paths: \`${scope_count}\`
          - substantive disposition: \`${DISPOSITION}\`
          - evidence: ${detail}
          - platform identity: \`github-actions[bot]\` / repository workflow token
          - independent Code-Owner approval: **not implied**

          Any head/tree/scope drift invalidates this review. No merge, release, publication, PASS, FINAL_PASS or EFFECT_ACK_DONE is implied.
          EOF
          event="$DISPOSITION"; if [ "$event" = COMMENT_WITH_BLOCKER ]; then event=COMMENT; fi
          set +e
          gh api --method POST "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" -f commit_id="$EXPECTED_HEAD" -f event="$event" --raw-field body="$(cat /tmp/qikvrt-review-body.md)" > /tmp/qikvrt-review-write.json 2>/tmp/qikvrt-review-write.err
          review_rc=$?
          set -e
          platform_state="$event"
          if [ "$review_rc" -ne 0 ]; then
            gh api --method POST "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" -f commit_id="$EXPECTED_HEAD" -f event=COMMENT --raw-field body="$(cat /tmp/qikvrt-review-body.md)\n\nPlatform limitation: requested ${event} was rejected; persisted as COMMENT." > /tmp/qikvrt-review-write.json
            platform_state=COMMENT
          fi
          if [ "$DISPOSITION" = APPROVE ]; then status=success; description="substantive requested review executed; platform=${platform_state}"; else status=failure; description="requested review disposition=${DISPOSITION}; platform=${platform_state}"; fi
          gh api --method POST "repos/${REPOSITORY}/statuses/${EXPECTED_HEAD}" -f state="$status" -f context="$STATUS_CONTEXT" -f description="${description:0:140}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Strict NOOP when no requested review exists
        if: steps.active.outputs.active == 'true' && steps.select.outputs.state != 'CANDIDATE'
        run: echo 'No unexecuted requested review is currently actionable.'

      - name: Bootstrap NOOP before trusted-main promotion
        if: steps.active.outputs.active != 'true'
        run: echo 'Executor definition is under review; trusted main remains the only executable source.'

      - name: Preserve fresh observation receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-review-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qikvrt/github-observations
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  # qikvrt-mesh-review-worker:v1
  mesh-worker:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'mesh-worker'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out current trusted counterpart main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact counterpart route before artifact access
        env:
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          WORK_SHA256: ${{ inputs.work_sha256 }}
        run: |
          python3 -B - <<'PY'
          import os, re
          from tools.qikvrt_review_mesh_work import PAIR, require
          require(PAIR.get(os.environ['SOURCE_REPOSITORY']) == os.environ['GITHUB_REPOSITORY'], 'WORKER_ROUTE_INVALID')
          require(re.fullmatch(r'[0-9a-f]{64}', os.environ['WORK_SHA256']), 'WORK_DIGEST_INVALID')
          require(os.environ['SOURCE_RUN_ID'].isdecimal() and int(os.environ['SOURCE_RUN_ID']) > 0, 'SOURCE_RUN_ID_INVALID')
          PY
      - name: Read exact source work artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ secrets.QIKVRT_MESH_TOKEN || github.token }}
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}
          name: qikvrt-mesh-work-${{ inputs.work_sha256 }}
          path: .qikvrt/mesh-work
      - name: Verify current source Main and authenticated source run
        id: source
        env:
          GH_TOKEN: ${{ secrets.QIKVRT_MESH_TOKEN || github.token }}
          WORK_SHA256: ${{ inputs.work_sha256 }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_review_mesh_work.py verify-source \
            --bundle .qikvrt/mesh-work --expected-digest "$WORK_SHA256" \
            --repository "$GITHUB_REPOSITORY" > /tmp/qikvrt-source-evaluator.json
          python3 -B - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value=json.load(open('/tmp/qikvrt-source-evaluator.json',encoding='utf-8'))
          for key in ('repository','sha','worker_head','worker_tree'):
              print(f'{key}={value[key]}')
          PY
      - name: Check out verified source evaluator in an isolated directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          path: .qikvrt/source-evaluator
          fetch-depth: 1
          persist-credentials: false
      - name: Evaluate exact source bytes without a write credential
        working-directory: .qikvrt/source-evaluator
        env:
          WORK_SHA256: ${{ inputs.work_sha256 }}
          QIKVRT_WORKER_HEAD: ${{ steps.source.outputs.worker_head }}
          QIKVRT_WORKER_TREE: ${{ steps.source.outputs.worker_tree }}
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_review_mesh_work.py worker \
            --bundle "$GITHUB_WORKSPACE/.qikvrt/mesh-work" --expected-digest "$WORK_SHA256" \
            --repository "$GITHUB_REPOSITORY" --output "$GITHUB_WORKSPACE/.qikvrt/mesh-result"
      - name: Preserve exact counterpart result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-mesh-result-${{ inputs.work_sha256 }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          path: .qikvrt/mesh-result
