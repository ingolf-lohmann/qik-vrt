name: Recover exact Authority PR582 Mirror port tree

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/_recover_authority_pr582_reflexive_watchdog_port.yml"

permissions:
  actions: read
  contents: write

concurrency:
  group: qikvrt-recover-authority-pr582-reflexive-watchdog-port
  cancel-in-progress: false

jobs:
  recover-exact-artifact-tree:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'mirror/port-authority-pr582-reflexive-watchdog-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPOSITORY: ${{ github.repository }}
      SOURCE_BRANCH: mirror/port-authority-pr582-reflexive-watchdog-v1
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MIRROR_BASE: b559841ea03d3103435125f8d0ac095ff8e2346e
      SOURCE_RUN_ID: '31419887528'
      SOURCE_ARTIFACT_ID: '9074972541'
      EXPECTED_GENERATED_COMMIT: 76733f185237fddf72511b2e18d1236f7c1d7840
      EXPECTED_GENERATED_TREE: 85eed6631de0920dc45cae87b62b07db774e6d03
      RECOVERY_PATH: .github/workflows/_recover_authority_pr582_reflexive_watchdog_port.yml
      ORIGINAL_CARRIER_PATH: .github/workflows/_materialize_authority_pr582_reflexive_watchdog_port.yml
    steps:
      - name: Check out literal recovery head with complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Recover and fast-forward the exact artifact tree
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/qikvrt-mirror-pr582-exact-tree-recovery"
          mkdir -p "$receipt_dir"
          trap 'status=$?; printf "%s\n" "$status" > "$receipt_dir/recovery-step-status.txt"' EXIT

          test "$(git rev-parse --verify HEAD^{commit})" = "$EVENT_HEAD"
          test "$(git merge-base "$EXPECTED_MIRROR_BASE" "$EVENT_HEAD")" = "$EXPECTED_MIRROR_BASE"

          gh api "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            > "$receipt_dir/source-artifact.zip"
          unzip -q "$receipt_dir/source-artifact.zip" -d "$receipt_dir/source-artifact"
          bundle="$receipt_dir/source-artifact/materialized-commit.bundle"
          test -s "$bundle"
          test "$(cat "$receipt_dir/source-artifact/materialized-commit.txt")" = "$EXPECTED_GENERATED_COMMIT"
          test "$(cat "$receipt_dir/source-artifact/materialized-tree.txt")" = "$EXPECTED_GENERATED_TREE"
          test "$(cat "$receipt_dir/source-artifact/materialize-step-status.txt")" = 0

          git bundle verify "$bundle" > "$receipt_dir/bundle-verify.txt"
          git fetch "$bundle" HEAD:refs/remotes/qikvrt/exact-generated-port
          recovered_commit="$(git rev-parse --verify refs/remotes/qikvrt/exact-generated-port^{commit})"
          recovered_tree="$(git rev-parse --verify refs/remotes/qikvrt/exact-generated-port^{tree})"
          test "$recovered_commit" = "$EXPECTED_GENERATED_COMMIT"
          test "$recovered_tree" = "$EXPECTED_GENERATED_TREE"

          expected_paths="$receipt_dir/expected-final-paths.txt"
          actual_paths="$receipt_dir/recovered-final-paths.txt"
          printf '%s\n' \
            .github/workflows/qikvrt_reflexive_repository_watchdog.yml \
            .github/workflows/qikvrt_workflow_executor_watchdog.yml \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt \
            docs/REFLEXIVE_REPOSITORY_WATCHDOG.md \
            registry/NODE_DISCOVERY_POLICY.json \
            state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json \
            state/work_units/REFLEXIVE_REPOSITORY_WATCHDOG_V1.json \
            tests/test_qikvrt_reflexive_repository_watchdog.py \
            tools/qikvrt_reflexive_repository_watchdog.py | LC_ALL=C sort > "$expected_paths"
          git diff --name-only "$EXPECTED_MIRROR_BASE" "$recovered_commit" -- | LC_ALL=C sort \
            > "$actual_paths"
          diff -u "$expected_paths" "$actual_paths"
          test -z "$(git ls-tree -r --name-only "$recovered_commit" -- "$RECOVERY_PATH")"
          test -z "$(git ls-tree -r --name-only "$recovered_commit" -- "$ORIGINAL_CARRIER_PATH")"

          while read -r mode type blob path; do
            test "$type" = blob
            case "$path" in
              .github/workflows/qikvrt_reflexive_repository_watchdog.yml)
                test "$mode" = 100644; test "$blob" = e9246cb308d8500fb5a4a51dab40efde009964b5 ;;
              .github/workflows/qikvrt_workflow_executor_watchdog.yml)
                test "$mode" = 100644; test "$blob" = a84f94cee96c2565f97091a5d4829c8ad25d5413 ;;
              docs/REFLEXIVE_REPOSITORY_WATCHDOG.md)
                test "$mode" = 100644; test "$blob" = 7215e9ee8fbca9331c470bd9058eb91162af5472 ;;
              registry/NODE_DISCOVERY_POLICY.json)
                test "$mode" = 100644; test "$blob" = 9ce71eb8e79d4e28aff3ee9b6eeaabcd780b219e ;;
              state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json)
                test "$mode" = 100644; test "$blob" = f2d79298f810cecdec8a444c160bad14f101ac87 ;;
              state/work_units/REFLEXIVE_REPOSITORY_WATCHDOG_V1.json)
                test "$mode" = 100644; test "$blob" = d66e0105311ba59c95d1fa73dd64fc7913c65a8d ;;
              tests/test_qikvrt_reflexive_repository_watchdog.py)
                test "$mode" = 100644; test "$blob" = 2b709ac1de0cebb35fd08e5caac9fb3b557ffefb ;;
              tools/qikvrt_reflexive_repository_watchdog.py)
                test "$mode" = 100755; test "$blob" = fefaacaba22c454669738b8b445220318e77dd16 ;;
              *)
                echo "unexpected portable path $path" >&2
                exit 2 ;;
            esac
          done < <(
            git ls-tree -r "$recovered_commit" -- \
              .github/workflows/qikvrt_reflexive_repository_watchdog.yml \
              .github/workflows/qikvrt_workflow_executor_watchdog.yml \
              docs/REFLEXIVE_REPOSITORY_WATCHDOG.md \
              registry/NODE_DISCOVERY_POLICY.json \
              state/autonomy/WORKFLOW_EXECUTOR_MESH_CONTRACT_V1.json \
              state/work_units/REFLEXIVE_REPOSITORY_WATCHDOG_V1.json \
              tests/test_qikvrt_reflexive_repository_watchdog.py \
              tools/qikvrt_reflexive_repository_watchdog.py
          )

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$EVENT_HEAD" > "$receipt_dir/recovery-event-head.txt"
          printf '%s\n' "$recovered_commit" > "$receipt_dir/generated-commit.txt"
          printf '%s\n' "$recovered_tree" > "$receipt_dir/generated-tree.txt"
          printf '%s\n' "$SOURCE_RUN_ID" > "$receipt_dir/source-run-id.txt"
          printf '%s\n' "$SOURCE_ARTIFACT_ID" > "$receipt_dir/source-artifact-id.txt"

          pushed=false
          successor=""
          for attempt in 1 2 3; do
            git fetch origin "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
            live_head="$(git rev-parse --verify refs/remotes/origin/$SOURCE_BRANCH^{commit})"
            live_tree="$(git rev-parse --verify "$live_head^{tree}")"
            printf '%s %s %s\n' "$attempt" "$live_head" "$live_tree" \
              >> "$receipt_dir/live-head-attempts.txt"

            if test "$live_tree" = "$EXPECTED_GENERATED_TREE"; then
              successor="$live_head"
              pushed=true
              break
            fi

            git merge-base --is-ancestor "$EVENT_HEAD" "$live_head"
            mapfile -t advanced_paths < <(git diff --name-only "$EVENT_HEAD" "$live_head" --)
            for path in "${advanced_paths[@]}"; do
              case "$path" in
                REPOSITORY_FILE_MANIFEST.json|REPOSITORY_FILE_MANIFEST.json.sha256|SHA256SUMS.txt)
                  ;;
                *)
                  echo "BLOCK: unexpected concurrent branch path $path" >&2
                  exit 2 ;;
              esac
            done

            successor="$(
              printf '%s\n' \
                'Recover exact Authority PR #582 reflexive-watchdog Mirror tree' \
                '' \
                'Adopt the exact artifact-generated tree 85eed6631de0920dc45cae87b62b07db774e6d03 as a history-preserving fast-forward successor. No content reconstruction, force push, release, deployment, Zenodo/DOI/IETF effect, PASS, FINAL_PASS, EFFECT_ACK_DONE, Authority-Mirror equality, universal database-superiority, or global deadlock-freedom claim.' \
                | git commit-tree "$EXPECTED_GENERATED_TREE" -p "$live_head"
            )"
            test "$(git rev-parse --verify "$successor^{tree}")" = "$EXPECTED_GENERATED_TREE"
            printf '%s\n' "$successor" > "$receipt_dir/successor-attempt-$attempt.txt"
            if git push origin "$successor:refs/heads/$SOURCE_BRANCH" \
              > "$receipt_dir/push-attempt-$attempt.log" 2>&1; then
              pushed=true
              break
            fi
          done

          test "$pushed" = true
          test -n "$successor"
          final_remote="$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | awk '{print $1}')"
          test "$final_remote" = "$successor"
          test "$(git rev-parse --verify "$successor^{tree}")" = "$EXPECTED_GENERATED_TREE"
          printf '%s\n' "$successor" > "$receipt_dir/adopted-successor-commit.txt"
          printf '%s\n' "$EXPECTED_GENERATED_TREE" > "$receipt_dir/adopted-successor-tree.txt"
          printf '%s\n' "$final_remote" > "$receipt_dir/final-remote-head.txt"
          echo "adopted_successor=$successor" >> "$GITHUB_OUTPUT"
          echo "adopted_tree=$EXPECTED_GENERATED_TREE" >> "$GITHUB_OUTPUT"

      - name: Preserve exact recovery receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-mirror-pr582-exact-tree-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/qikvrt-mirror-pr582-exact-tree-recovery
