name: Issue agent auto-finish

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, reopened, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Compatibility input; completion always scans the entire local repository
        required: false
        type: string

# This observer cannot merge, close, synchronize, or tag. A closure proposal is
# not a current-subject effect receipt. Keep effects at their separate boundary.
permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-agent-autofinish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    env:
      REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Observe the complete role-local pending-work set
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, subprocess
          repository = os.environ["REPOSITORY"]
          # REST issues includes pull requests; paginate instead of capping at 200.
          pages = json.loads(subprocess.check_output([
              "gh", "api", "--paginate", "--slurp",
              f"repos/{repository}/issues?state=open&per_page=100"
          ], text=True))
          items = [item for page in pages for item in page]
          issues = sorted(item["number"] for item in items if "pull_request" not in item)
          prs = sorted(item["number"] for item in items if "pull_request" in item)
          main = json.loads(subprocess.check_output([
              "gh", "api", f"repos/{repository}/git/ref/heads/main"
          ], text=True))["object"]["sha"]
          receipt = {
              "repository": repository,
              "observed_main": main,
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "open_issues": issues,
              "open_pull_requests": prs,
              "queue_observation": "HOLD_OPEN_WORK" if items else "EMPTY_AT_OBSERVATION",
              "atomic_snapshot": False,
              "effects_performed": [],
              "completion_proven": False,
              "cross_repository_evidence_reused": False,
          }
          print(json.dumps(receipt, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Role-local completion observation\n\n")
              output.write("\x60\x60\x60json\n" + json.dumps(receipt, indent=2) + "\n\x60\x60\x60\n")
              output.write("\nAn empty queue is not proof that requested effects were delivered.\n")
          PY
