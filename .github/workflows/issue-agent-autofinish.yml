name: Issue agent auto-finish

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional single issue number
        required: false
        type: string

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-agent-autofinish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      REQUESTED_ISSUE: ${{ inputs.issue_number }}
    steps:
      - name: Check out trusted main governance code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Set up declared Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Resolve canonical roles from trusted Main
        run: |
          set -euo pipefail
          mkdir -p .qikvrt/issue-autofinish
          python3 -B tools/qikvrt_workflow_executor.py roles --json > .qikvrt/issue-autofinish/roles.json
      - name: Hand terminal issues to the existing native governance and promotion path
        run: |
          set -euo pipefail
          python3 -B - <<'PY' > .qikvrt/issue-autofinish/receipt.json
          import json, os
          from tools.qikvrt_workflow_executor import validate_role_projections
          from tools.qikvrt_autonomous_self_heal import GitHubREST
          from tools.qikvrt_required_review_gate import resolve_required_code_owner, evaluate_required_review
          roles = validate_role_projections()
          repository = os.environ['REPOSITORY']
          if repository != roles['AUTHORITY']:
              raise SystemExit('HOLD: ISSUE_FINISH_REQUIRES_CANONICAL_AUTHORITY')
          api = GitHubREST(repository)
          owner = resolve_required_code_owner(repository)
          requested = os.environ.get('REQUESTED_ISSUE', '').strip()
          if requested and (not requested.isdecimal() or int(requested) < 1):
              raise SystemExit('HOLD: INVALID_ISSUE_NUMBER')
          rules = api.pages('rules/branches/main?per_page=100')
          candidates = []
          for pr in api.pages('pulls?state=open&base=main&per_page=100'):
              branch = (pr.get('head') or {}).get('ref', '')
              if not branch.startswith('issue-agent/') or (requested and branch != 'issue-agent/' + requested):
                  continue
              reviews = api.pages(f"pulls/{pr['number']}/reviews?per_page=100")
              gate = evaluate_required_review(pr, rules, reviews, required_code_owner=owner)
              candidates.append({'pr_number': pr['number'], 'head_sha': pr['head']['sha'],
                                 'native_review_gate': gate, 'promotion_execution': 'SEPARATE_REQUIRED_PATH'})
          print(json.dumps({'schema': 'qikvrt_issue_autofinish_governance_handoff_v1',
                            'repository': repository, 'role_policy_path': 'policy/CANONICAL_UPSTREAM_REMOTE_V1.json',
                            'state': 'GOVERNED_PROMOTION_REQUIRED' if candidates else 'NO_ELIGIBLE_ISSUE_PR',
                            'candidates': candidates,
                            'promotion_workflow': '.github/workflows/qikvrt_expected_head_promotion.yml',
                            'lifecycle_policy': 'policy/REQUESTED_REVIEW_AND_ISSUE_LIFECYCLE_V1.json',
                            'external_effect': 'NONE', 'main_activation': False,
                            'completion_claims': {'PASS': False, 'FINAL_PASS': False, 'EFFECT_ACK_DONE': False}},
                           sort_keys=True, indent=2))
          PY
      - name: Preserve governance handoff evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-issue-autofinish-${{ github.run_id }}-${{ github.run_attempt }}
          path: .qikvrt/issue-autofinish
          if-no-files-found: error
          retention-days: 30
