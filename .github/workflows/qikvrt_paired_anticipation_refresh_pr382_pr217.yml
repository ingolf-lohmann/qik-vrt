name: QIK-VRT paired current-main anticipation refresh PR382 PR217

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/qikvrt_paired_anticipation_refresh_pr382_pr217.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-paired-anticipation-refresh-pr382-pr217-${{ github.repository }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.repository == 'ingolf-lohmann/qik-vrt' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/current-main-anticipation-refresh-pr382-pr217-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/current-main-anticipation-refresh-pr382-pr217-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Refresh receipt-bound anticipation input and projections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show -s --format=%P HEAD)" = "613988771badecdd36b02db7edcaec076734722c"
          python3 -B - <<'PY'
          import hashlib, json
          from pathlib import Path
          authority_main = "c19c94e2e11bc0832352214816690f5318a14e73"
          mirror_main = "613988771badecdd36b02db7edcaec076734722c"
          r11_head = "26a45a0af463dcd8bb1667897d1a999230375307"
          receipt_path = "evidence/receipts/authority-mirror-equality-2026-08-05-pre-spacetime-ontology-pr368-pr214.json"
          index_path = "evidence/receipts/index.json"
          path = Path("anticipation/INPUT.json")
          value = json.loads(path.read_text(encoding="utf-8"))
          def binding(p):
              raw = Path(p).read_bytes()
              return {"path": p, "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
          metrics = dict(value["observations"][-1]["metrics"])
          metrics["scoped_reciprocal_equality_receipts_materialized_on_both_mains"] = max(4, metrics.get("scoped_reciprocal_equality_receipts_materialized_on_both_mains", 0) + 1)
          observation = {
              "classification": "TEILFORTSCHRITT",
              "evidence": [f"authority-git-commit:{authority_main}", f"mirror-git-commit:{mirror_main}", "authority-pull-request:382", "mirror-pull-request:217", f"r11-git-commit:{r11_head}", receipt_path, index_path],
              "metrics": metrics,
              "observed_at": "2026-08-05T06:15:00Z",
              "productive_chain_position": "POST_PR382_PR217_RECIPROCAL_RECEIPT_PROMOTED_R11_EVIDENCE_BINDING_OPEN",
              "state_id": "post-pr382-pr217-reciprocal-receipt-promoted-r11-evidence-binding-open"
          }
          if value["observations"][-1].get("state_id") != observation["state_id"]:
              value["observations"].append(observation)
          value["observed_at"] = observation["observed_at"]
          value["source_revision"] = "git-tree:ce1b6d6142d5cd56167455907aca255f73759fb5"
          value["source_bindings"] = [binding("AI_PROGRESS.json"), binding("AI_STATUS.md"), binding(receipt_path), binding(index_path)]
          value["next_effect"] = {
              "anticipated_state_id": "r11-draft-shape-observation-receipt-pair-exact-head-green",
              "description": "Reobserve the current Authority and Mirror mains after promotion of the PR368-to-PR214 reciprocal receipt pair, then resolve exactly once the existing Authority R11 push run for 26a45a0af463dcd8bb1667897d1a999230375307 under the standing Owner delegation. Download and verify the bounded read-only draft-shape observation artifact, verify the unchanged C2 SHA-256, persist receipt-only successors, run mandatory exact-head gates, and verify reciprocal Authority/Mirror synchronization. Automatic external dispatch, Zenodo mutation, publication, release, deployment, IETF action, PASS, FINAL_PASS, and EFFECT_ACK_DONE remain forbidden.",
              "effect_id": "RESOLVE_AND_PERSIST_R11_DRAFT_SHAPE_OBSERVATION_RECEIPT_PAIR",
              "executor_capability": "qikvrt.repository.anticipation.v1",
              "expected_receipt": "receipts/anticipation/0005-r11-draft-shape-observation-receipt-pair.json",
              "preconditions": [
                  "AUTHORITY_MAIN_DESCENDS_FROM_C19C94E2E11BC0832352214816690F5318A14E73",
                  "MIRROR_MAIN_DESCENDS_FROM_613988771BADECDD36B02DB7EDCAEC076734722C",
                  "AUTHORITY_PR382_AND_MIRROR_PR217_RECIPROCAL_RECEIPT_PROMOTED_AT_VERIFIED_EXACT_HEADS",
                  "REOBSERVE_CURRENT_AUTHORITY_AND_MIRROR_MAINS_BEFORE_R11_RESOLUTION",
                  "RECIPROCAL_RECEIPT_GIT_BLOB_0068CFFD6143C4A681E32FF78907A3B6CEADD72E_PRESERVED",
                  "RECEIPT_INDEX_GIT_BLOB_CBFED500DBFA9BFA9F9D76C0060F8D13EA47B681_PRESERVED",
                  "PAIRED_ANTICIPATION_PROJECTION_BYTES_PRESERVED",
                  "R11_HEAD_EQUALS_26A45A0AF463DCD8BB1667897D1A999230375307",
                  "OWNER_STANDING_DELEGATION_AUTHORIZES_EXACTLY_ONE_READ_ONLY_R11_RESOLUTION",
                  "RESOLVE_EXACT_R11_PUSH_RUN",
                  "VERIFY_R11_ARTIFACT_AND_UNCHANGED_C2",
                  "PERSIST_RECEIPT_ONLY_SUCCESSORS",
                  "RUN_MANDATORY_EXACT_HEAD_GATES",
                  "VERIFY_AUTHORITY_MIRROR_SYNCHRONIZATION",
                  "NO_ZENODO_MUTATION",
                  "NO_EXTERNAL_DISPATCH"
              ]
          }
          value["completion_claims"] = {"PASS": False, "FINAL_PASS": False, "EFFECT_ACK_DONE": False}
          path.write_text(json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          PY
          python3 -B tools/qikvrt_anticipation.py materialize
          python3 -B tools/qikvrt_anticipation.py check
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git diff --check
      - name: Persist projections and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/qikvrt_paired_anticipation_refresh_pr382_pr217.yml
          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anticipation receipts/anticipation REPOSITORY_FILE_MANIFEST.json REPOSITORY_FILE_MANIFEST.json.sha256 SHA256SUMS.txt
          git add -u .github/workflows/qikvrt_paired_anticipation_refresh_pr382_pr217.yml
          git commit -m "anticipation: bind PR382 PR217 reciprocal receipt and select R11"
          git push origin HEAD:agent/current-main-anticipation-refresh-pr382-pr217-v1
