name: QIK-VRT manuscript proof coverage

on:
  push:
    paths:
      - "formalization/QIKVRT_Formalization_v2.0/**"
      - "tools/qikvrt_canonical_temporal_memory_kernel_evidence.py"
      - "tools/qikvrt_survival_connectability_kernel_evidence.py"
      - "tests/test_survival_connectability_kernel_evidence_tool.py"
      - "tests/test_survival_connectability_publication.py"
      - "docs/publications/2026-07-30-canonical-temporal-memory-effect-ack/CLAIM_MATRIX.json"
      - "docs/publications/2026-07-30-canonical-temporal-memory-effect-ack/KERNEL_PROOF_PLAN.json"
      - "docs/publications/2026-07-31-survival-anschlussfaehigsten/**"
      - "docs/publications/2026-08-02-causality-is-relation-vrtcore/**"
      - "docs/publications/2026-08-02-vrtcore-smg-h5/**"
      - "docs/publications/2026-08-02-vrtcore-virtual-sphere-h6/**"
      - ".github/workflows/qikvrt_manuscript_proof.yml"
      - "docs/HUMAN_MACHINE_PROGRESS_STANDARD.md"
      - "schemas/human_machine_progress.schema.json"
  pull_request:
    paths:
      - "formalization/QIKVRT_Formalization_v2.0/**"
      - "tools/qikvrt_canonical_temporal_memory_kernel_evidence.py"
      - "tools/qikvrt_survival_connectability_kernel_evidence.py"
      - "tests/test_survival_connectability_kernel_evidence_tool.py"
      - "tests/test_survival_connectability_publication.py"
      - "docs/publications/2026-07-30-canonical-temporal-memory-effect-ack/CLAIM_MATRIX.json"
      - "docs/publications/2026-07-30-canonical-temporal-memory-effect-ack/KERNEL_PROOF_PLAN.json"
      - "docs/publications/2026-07-31-survival-anschlussfaehigsten/**"
      - "docs/publications/2026-08-02-causality-is-relation-vrtcore/**"
      - "docs/publications/2026-08-02-vrtcore-smg-h5/**"
      - "docs/publications/2026-08-02-vrtcore-virtual-sphere-h6/**"
      - ".github/workflows/qikvrt_manuscript_proof.yml"
      - "docs/HUMAN_MACHINE_PROGRESS_STANDARD.md"
      - "schemas/human_machine_progress.schema.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-claim-and-kernel-gates:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: formalization/QIKVRT_Formalization_v2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Provision and verify declared Poppler runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v pdfinfo >/dev/null 2>&1 || \
             ! command -v pdftotext >/dev/null 2>&1 || \
             ! command -v pdftoppm >/dev/null 2>&1; then
            sudo apt-get update -o Acquire::Retries=3
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install --yes --no-install-recommends poppler-utils
          fi
          command -v pdfinfo
          command -v pdftotext
          command -v pdftoppm
          pdfinfo -v 2>&1 | sed -n '1p'
          pdftotext -v 2>&1 | sed -n '1p'
          pdftoppm -v 2>&1 | sed -n '1p'
          if command -v dpkg-query >/dev/null 2>&1; then
            dpkg-query --show --showformat='poppler-utils-package=${Version}\n' \
              poppler-utils
          fi
      - name: Restore cumulative Lean runtime cache
        id: lean_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.elan
            formalization/QIKVRT_Formalization_v2.0/.lake/packages
          key: qikvrt-lean-${{ runner.os }}-${{ hashFiles('formalization/QIKVRT_Formalization_v2.0/lean-toolchain', 'formalization/QIKVRT_Formalization_v2.0/lakefile.toml', 'formalization/QIKVRT_Formalization_v2.0/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            qikvrt-lean-${{ runner.os }}-${{ hashFiles('formalization/QIKVRT_Formalization_v2.0/lean-toolchain', 'formalization/QIKVRT_Formalization_v2.0/lakefile.toml', 'formalization/QIKVRT_Formalization_v2.0/lake-manifest.json') }}-
            qikvrt-lean-${{ runner.os }}-
      - name: Initial Lean build
        id: initial_lean_build
        continue-on-error: true
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: formalization/QIKVRT_Formalization_v2.0
          test: false
      - name: Capture compact Lean compiler diagnostics
        if: steps.initial_lean_build.outcome == 'failure'
        shell: bash
        run: |
          set +e
          mkdir -p .lake/build
          lake build > .lake/build/lean-build-diagnostics.log 2>&1
          status=$?
          {
            printf 'LEAN_BUILD_EXIT=%s\n' "$status"
            printf '%s\n' '--- LAST 400 LINES ---'
            tail -n 400 .lake/build/lean-build-diagnostics.log
          } > .lake/build/lean-build-diagnostics-tail.log
          exit 0
      - name: Upload Lean compiler diagnostics
        if: steps.initial_lean_build.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-lean-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: >-
            formalization/QIKVRT_Formalization_v2.0/.lake/build/lean-build-diagnostics-tail.log
          if-no-files-found: error
      - name: Enforce initial Lean build
        if: steps.initial_lean_build.outcome == 'failure'
        run: |
          cat .lake/build/lean-build-diagnostics-tail.log
          exit 1
      - name: Verify locked manuscript bytes and page count
        run: python3 scripts/verify_source_lock.py
      - name: Verify completed claim graph materialization
        run: python3 scripts/materialize_completion.py --check
      - name: Verify completed human proof map
        run: python3 scripts/render_completion_proof_map.py --check
      - name: Verify completed verification report
        run: python3 scripts/render_completion_verification_report.py --check
      - name: Validate completed claim graph and epistemic boundaries
        run: python3 scripts/validate_completion_claim_graph.py
      - name: Validate EFFECT_ACK source, structure and proof references
        run: python3 scripts/validate_effect_ack_claims.py
      - name: Run positive and negative provenance tests
        run: python3 -m unittest discover -s tests -v
      - name: Run survival/connectability publication boundary tests
        env:
          PYTHONPATH: ../..
        run: |
          python3 ../../tests/test_survival_connectability_kernel_evidence_tool.py
          python3 ../../tests/test_survival_connectability_publication.py
      - name: Run VRTCore relational-causality publication boundary tests
        env:
          PYTHONPATH: ../..
        run: python3 ../../tests/test_vrtcore_relational_causality_publication.py
      - name: Verify VRTCore SMG H5 package
        shell: bash
        run: |
          set -euo pipefail
          lean_bin="$(lake env which lean)"
          python3 ../../docs/publications/2026-08-02-vrtcore-smg-h5/verify_h5_package.py \
            --lean "$lean_bin"
      - name: Verify VRTCore Virtual Sphere H6 package
        shell: bash
        run: |
          set -euo pipefail
          lean_bin="$(lake env which lean)"
          python3 ../../docs/publications/2026-08-02-vrtcore-virtual-sphere-h6/verify_h6_package.py \
            --lean "$lean_bin"
      - name: Compile exact statement/proof bindings
        run: lake build
      - name: Kernel-check the VRTCore relational-causality candidate
        shell: bash
        run: |
          set -euo pipefail
          publication=../../docs/publications/2026-08-02-causality-is-relation-vrtcore
          module_dir=.lake/build/vrtcore-relational-causality-modules
          mkdir -p "$module_dir"
          LEAN_PATH="$publication" lake env lean \
            -E hasSorry \
            --root="$publication" \
            -o "$module_dir/VRTCore_RelationalCausality_Candidate.olean" \
            "$publication/VRTCore_RelationalCausality_Candidate.lean" \
            2>&1 | tee .lake/build/vrtcore-relational-causality-kernel.log
          LEAN_PATH="$module_dir:$publication" lake env lean \
            -E hasSorry \
            --root="$publication" \
            "$publication/VRTCore_RelationalCausality_AxiomAudit.lean" \
            2>&1 | tee .lake/build/vrtcore-relational-causality-axioms.log
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          from collections import Counter
          from pathlib import Path

          repository_root = Path('../..').resolve()
          publication_dir = repository_root / 'docs/publications/2026-08-02-causality-is-relation-vrtcore'
          plan = json.loads((publication_dir / 'KERNEL_PROOF_PLAN.json').read_text(encoding='utf-8'))
          expected_names = plan['theorems']
          expected_axioms = plan['expected_axioms_by_theorem']
          if list(expected_axioms) != expected_names:
              raise SystemExit('proof-plan theorem and expected-axiom inventories differ')

          text = Path('.lake/build/vrtcore-relational-causality-axioms.log').read_text(encoding='utf-8')
          lines = [line for line in text.splitlines() if line.strip()]
          pattern = re.compile(
              r"'([^']+)' (?:does not depend on any axioms|depends on axioms:\s*\[([^]]*)\])"
          )
          reports = []
          for line in lines:
              match = pattern.fullmatch(line)
              if match is None:
                  raise SystemExit(f'unexpected axiom-audit output line: {line!r}')
              axioms = [item.strip() for item in (match.group(2) or '').split(',') if item.strip()]
              reports.append((match.group(1), axioms))
          names = [name for name, _axioms in reports]
          counts = Counter(names)
          if counts != Counter(expected_names) or any(count != 1 for count in counts.values()):
              raise SystemExit(f'axiom-report inventory differs: observed={dict(counts)}')
          observed_axioms = {name: axioms for name, axioms in reports}
          if observed_axioms != expected_axioms:
              raise SystemExit(f'axiom inventory differs: observed={observed_axioms}')

          def identity(path):
              raw = path.read_bytes()
              return {
                  'path': path.relative_to(repository_root).as_posix(),
                  'bytes': len(raw),
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'git_blob_sha1': hashlib.sha1(
                      f'blob {len(raw)}\0'.encode('ascii') + raw
                  ).hexdigest(),
              }

          source = repository_root / plan['source']['path']
          audit = repository_root / plan['axiom_audit']['path']
          if identity(source) != plan['source']:
              raise SystemExit('candidate identity differs from proof plan')
          if identity(audit) != plan['axiom_audit']:
              raise SystemExit('axiom-audit identity differs from proof plan')

          lean_version = subprocess.check_output(
              ['lake', 'env', 'lean', '--version'], text=True
          ).strip()
          lean_githash = subprocess.check_output(
              ['lake', 'env', 'lean', '--githash'], text=True
          ).strip()
          event_name = os.environ['GITHUB_EVENT_NAME']
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          pull_request_head_sha = (
              event.get('pull_request', {}).get('head', {}).get('sha')
          )
          checkout_mode = (
              'pull_request_merge'
              if event_name == 'pull_request'
              else 'exact_ref_head'
          )
          evidence = {
              'schema': 'qikvrt_vrtcore_ci_kernel_evidence_v1',
              'publication_id': plan['publication_id'],
              'state': 'KERNEL_STEP_VERIFIED',
              'global_pass': 'NOT_CLAIMED',
              'final_pass': 'NOT_CLAIMED',
              'effect_ack_done': 'NOT_CLAIMED',
              'source_bytes_exact': True,
              'exact_head_bound': checkout_mode == 'exact_ref_head',
              'checkout': {
                  'event_name': event_name,
                  'mode': checkout_mode,
                  'tested_commit_sha': os.environ['GITHUB_SHA'],
                  'pull_request_head_sha': pull_request_head_sha,
                  'ref': os.environ['GITHUB_REF'],
              },
              'github_sha': os.environ['GITHUB_SHA'],
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'github_run_url': (
                  f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
                  f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              ),
              'runtime': {
                  'lean_version_output': lean_version,
                  'lean_githash': lean_githash,
                  'toolchain': plan['toolchain'],
                  'imports': plan['imports'],
              },
              'source': identity(source),
              'axiom_audit_source': identity(audit),
              'source_exit_code': 0,
              'axiom_audit_exit_code': 0,
              'theorem_count': len(expected_names),
              'axioms_by_theorem': observed_axioms,
              'project_axioms': [],
              'scope_boundary': plan['nonclaims'],
          }
          Path('.lake/build/vrtcore-relational-causality-evidence.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Upload VRTCore kernel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-vrtcore-relational-causality-kernel-evidence
          retention-days: 30
          path: |
            formalization/QIKVRT_Formalization_v2.0/.lake/build/vrtcore-relational-causality-kernel.log
            formalization/QIKVRT_Formalization_v2.0/.lake/build/vrtcore-relational-causality-axioms.log
            formalization/QIKVRT_Formalization_v2.0/.lake/build/vrtcore-relational-causality-evidence.json
          if-no-files-found: error
      - name: Audit legacy and EFFECT_ACK theorem dependencies
        run: python3 scripts/audit_lean_axioms.py
      - name: Verify canonical temporal-memory publication kernel plan
        run: |
          set -euo pipefail
          python3 ../../tools/qikvrt_canonical_temporal_memory_kernel_evidence.py \
            --plan docs/publications/2026-07-30-canonical-temporal-memory-effect-ack/KERNEL_PROOF_PLAN.json \
            --claims docs/publications/2026-07-30-canonical-temporal-memory-effect-ack/CLAIM_MATRIX.json \
            | tee .lake/build/qikvrt-canonical-temporal-memory-kernel-evidence.json
      - name: Upload canonical temporal-memory kernel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-canonical-temporal-memory-kernel-evidence
          retention-days: 30
          path: >-
            formalization/QIKVRT_Formalization_v2.0/.lake/build/qikvrt-canonical-temporal-memory-kernel-evidence.json
          if-no-files-found: error
      - name: Verify survival/connectability publication kernel plan
        run: |
          set -euo pipefail
          python3 ../../tools/qikvrt_survival_connectability_kernel_evidence.py \
            --plan docs/publications/2026-07-31-survival-anschlussfaehigsten/KERNEL_PROOF_PLAN.json \
            --claims docs/publications/2026-07-31-survival-anschlussfaehigsten/CLAIM_MATRIX.json \
            | tee .lake/build/qikvrt-survival-connectability-kernel-evidence.json
      - name: Upload survival/connectability kernel evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-survival-connectability-kernel-evidence
          retention-days: 30
          path: >-
            formalization/QIKVRT_Formalization_v2.0/.lake/build/qikvrt-survival-connectability-kernel-evidence.json
          if-no-files-found: error
      - name: Audit every completed manuscript proof constant
        run: python3 scripts/audit_completion_axioms.py
      - name: Reject project proof escapes
        run: python3 scripts/audit_proof_escapes.py
      - name: Verify completed proof-object manifest is current
        run: python3 scripts/materialize_completion_proof_manifest.py --check
      - name: Verify persistent proof-object manifest
        id: proof_object_manifest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p .lake/build
          python3 scripts/verify_proof_object_manifest.py \
            > .lake/build/qikvrt-proof-object-verifier.log 2>&1
          status=$?
          cat .lake/build/qikvrt-proof-object-verifier.log
          exit "$status"
      - name: Upload proof-object verifier diagnostics
        if: steps.proof_object_manifest.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-proof-object-verifier-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          path: >-
            formalization/QIKVRT_Formalization_v2.0/.lake/build/qikvrt-proof-object-verifier.log
          if-no-files-found: error
      - name: Enforce persistent proof-object verification
        if: steps.proof_object_manifest.outcome == 'failure'
        run: |
          cat .lake/build/qikvrt-proof-object-verifier.log
          exit 1
      - name: Materialize proof-object runtime evidence
        if: steps.proof_object_manifest.outcome == 'success'
        run: |
          set -euo pipefail
          python3 scripts/verify_proof_object_manifest.py \
            | tee .lake/build/qikvrt-proof-object-runtime-evidence.json
      - name: Upload proof-object runtime evidence
        if: steps.proof_object_manifest.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-proof-object-runtime-evidence
          retention-days: 30
          path: >-
            formalization/QIKVRT_Formalization_v2.0/.lake/build/qikvrt-proof-object-runtime-evidence.json
          if-no-files-found: error
      - name: Emit cumulative runtime metrics
        if: always()
        env:
          CACHE_HIT: ${{ steps.lean_cache.outputs.cache-hit }}
        run: |
          mkdir -p ../../.qikvrt/evidence
          python3 - <<'PY'
          import json, os, time
          from pathlib import Path
          target = Path('../../.qikvrt/evidence/runtime_cache_latest.json')
          target.write_text(json.dumps({
              'schema': 'qikvrt_runtime_cache_evidence_v1',
              'cache_hit': os.environ.get('CACHE_HIT', ''),
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
              'recorded_unix': int(time.time()),
          }, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
