name: QIKVRT construct PR249 candidate from current Mirror main c2a6

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: qikvrt-construct-pr249-current-main-c2a6-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  construct:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'trusted/pr249-mirror-constructor-current-main-c2a6-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify current-main request overlay and historical transaction contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest -v tests.test_construct_history_preserving_mirror_candidate_pr249
          python3 -B -m py_compile \
            tools/qikvrt_construct_history_preserving_mirror_candidate_pr249.py \
            tools/qikvrt_construct_history_preserving_mirror_candidate_pr249_exact_bytes.py \
            tools/qikvrt_construct_history_preserving_mirror_candidate_pr249_current_main.py
          python3 -B -m tools.qikvrt_construct_history_preserving_mirror_candidate_pr249_current_main \
            --check-request --json \
            | tee "$RUNNER_TEMP/qikvrt-pr249-current-main-request.json"
      - name: Construct and attach exact one-parent candidate
        shell: bash
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/qikvrt-pr249-current-main-candidate.json"
          python3 -B -m tools.qikvrt_construct_history_preserving_mirror_candidate_pr249_current_main \
            --json | tee "$result"
          grep -F '"mirror_parent": "c2a6e75eb24721029865a9dd5fd94fa55590a955"' "$result"
          grep -F '"target_branch": "sync/six-corrected-candidates-authority-7d87a600-from-c2a6e75-v1"' "$result"
          grep -F '"sole_parent_verified": true' "$result"
          grep -F '"authority_tree_equality_verified": true' "$result"
          grep -F '"repository_manifest_git_blob_sha1": "bcfa9f5f91bddf17328edbe22afa44b4dc1ebeff"' "$result"
          grep -F '"repository_content_tree_sha256": "1116331256858d9b4206f9e80f6d1db2e6a67c5a8bd86a4bfba53c893655d0c0"' "$result"
          grep -F '"mirror_promoted": false' "$result"
          grep -F '"reciprocal_equality_receipt_materialized": false' "$result"
          grep -F '"zenodo_mutation_authorized": false' "$result"
          grep -F '"proof_corpus_published_on_zenodo": false' "$result"
          grep -F '"pass": false' "$result"
          grep -F '"final_pass": false' "$result"
          grep -F '"effect_ack_done": false' "$result"
      - name: Upload immutable current-main constructor output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-pr249-current-main-c2a6-constructor
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0
          path: |
            ${{ runner.temp }}/qikvrt-pr249-current-main-request.json
            ${{ runner.temp }}/qikvrt-pr249-current-main-candidate.json
