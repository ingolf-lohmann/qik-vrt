name: QIK-VRT materialize node-liveness test Git-maintenance repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/qikvrt_materialize_node_liveness_test_git_maintenance_repair.yml"

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: qikvrt-materialize-node-liveness-test-git-maintenance-repair
  cancel-in-progress: false

jobs:
  materialize-repair:
    if: >-
      github.repository == 'ingolf-lohmann/qik-vrt' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BASE: 0a792620364fe8febe7e6b7caee997af4a8464e8
      TARGET_TREE: 3c8427b3d6b4f73e44273a541aee82597a59e449
      SOURCE_TEST_BLOB: e8078ee8b555765d512482c74f125d19683664a2
      TARGET_BRANCH: repair/node-liveness-test-disable-auto-maintenance-0a792620-v1
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Check out exact current Mirror main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0a792620364fe8febe7e6b7caee997af4a8464e8
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reobserve exact base and materialize bounded repair
        shell: bash
        run: |
          set -euo pipefail

          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main" = "$TARGET_BASE"
          test "${{ github.event.pull_request.base.sha }}" = "$TARGET_BASE"
          test "$(git rev-parse --verify HEAD^{commit})" = "$TARGET_BASE"
          test "$(git rev-parse --verify HEAD^{tree})" = "$TARGET_TREE"
          test "$(git rev-parse --verify HEAD:tests/test_qikvrt_node_liveness.py)" = "$SOURCE_TEST_BLOB"

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "Target repair branch already exists; refusing duplicate writer."
            exit 0
          fi

          python3 -B - <<'PY'
          from pathlib import Path

          path = Path('tests/test_qikvrt_node_liveness.py')
          content = path.read_text(encoding='utf-8')
          old = '''def initialize_git(root: pathlib.Path) -> None:
              git(root, "init", "-q")
              git(root, "config", "user.name", "test")
              git(root, "config", "user.email", "test@example.invalid")
          '''.replace('          ', '')
          new = '''def initialize_git(root: pathlib.Path) -> None:
              git(root, "init", "-q")
              # Git may detach automatic object maintenance after a commit.  These
              # repositories are intentionally tiny and ephemeral, so disable it
              # before the fixture can race TemporaryDirectory cleanup.
              git(root, "config", "maintenance.auto", "false")
              git(root, "config", "gc.auto", "0")
              git(root, "config", "user.name", "test")
              git(root, "config", "user.email", "test@example.invalid")
          '''.replace('          ', '')
          if content.count(old) != 1:
              raise SystemExit('BLOCK: exact initialize_git source signature drifted')
          path.write_text(content.replace(old, new), encoding='utf-8')
          PY

          python3 -B -m py_compile tests/test_qikvrt_node_liveness.py
          for iteration in $(seq 1 50); do
            python3 -B -m unittest \
              tests.test_qikvrt_node_liveness.NodeLivenessTests.test_ack_coverage_requires_refresh_after_liveness_bytes_change \
              >/tmp/qikvrt-node-liveness-focused.log 2>&1 || {
                cat /tmp/qikvrt-node-liveness-focused.log
                echo "Focused repetition failed at iteration ${iteration}" >&2
                exit 1
              }
          done
          python3 -B -m unittest -v tests.test_qikvrt_node_liveness

          python3 -B tools/qikvrt_integrity.py generate
          python3 -B tools/qikvrt_integrity.py verify
          make test
          python3 -B tools/qikvrt_integrity.py verify

          git diff --name-only HEAD -- | sort -u > /tmp/qikvrt-actual-paths.txt
          cat > /tmp/qikvrt-expected-paths.txt <<'EOF'
          REPOSITORY_FILE_MANIFEST.json
          REPOSITORY_FILE_MANIFEST.json.sha256
          SHA256SUMS.txt
          tests/test_qikvrt_node_liveness.py
          EOF
          sed -i 's/^          //' /tmp/qikvrt-expected-paths.txt
          diff -u /tmp/qikvrt-expected-paths.txt /tmp/qikvrt-actual-paths.txt
          test -z "$(git status --porcelain=v1 | grep '^??' || true)"

          live_main_before_push="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$live_main_before_push" = "$TARGET_BASE"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "BLOCK: target repair branch appeared concurrently" >&2
            exit 2
          fi

          git config user.name "qik-vrt-test-fixture-repair"
          git config user.email "qik-vrt-test-fixture-repair@users.noreply.github.com"
          git switch -c "$TARGET_BRANCH"
          git add -- \
            REPOSITORY_FILE_MANIFEST.json \
            REPOSITORY_FILE_MANIFEST.json.sha256 \
            SHA256SUMS.txt \
            tests/test_qikvrt_node_liveness.py
          git commit -m "fix(test): disable detached Git maintenance in liveness fixtures"
          candidate_head="$(git rev-parse --verify HEAD^{commit})"
          candidate_tree="$(git rev-parse --verify HEAD^{tree})"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"

          {
            echo "History-preserving repair branch materialized."
            echo "Base: ${TARGET_BASE}"
            echo "Candidate head: ${candidate_head}"
            echo "Candidate tree: ${candidate_tree}"
            echo "Changed paths: four"
            echo "Focused repetitions: 50"
            echo "External effect: NONE"
          } >> "$GITHUB_STEP_SUMMARY"
