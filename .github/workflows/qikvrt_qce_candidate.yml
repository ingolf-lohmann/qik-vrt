name: QIK-VRT QCE candidate verification

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/**"
      - ".github/workflows/qikvrt_qce_candidate.yml"
  push:
    branches-ignore: [main]
    paths:
      - "docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/**"
      - ".github/workflows/qikvrt_qce_candidate.yml"

permissions:
  contents: read

concurrency:
  group: qikvrt-qce-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qce-formal-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate head and resolve source tree
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git -C ../../.. rev-parse HEAD)"
          test "${actual}" = "${expected}"
          tree="$(git -C ../../.. rev-parse 'HEAD^{tree}')"
          test "${#actual}" -eq 40
          test "${#tree}" -eq 40
          echo "head=${actual}" >> "${GITHUB_OUTPUT}"
          echo "tree=${tree}" >> "${GITHUB_OUTPUT}"

      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence
          test: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install document inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Build QCE Lean library
        run: lake build

      - name: Run fail-closed package verification and axiom audit
        run: |
          set -euo pipefail
          qce_tmpdir="$(mktemp -d)"
          python3 -B verify_qce_package.py \
            --lean "$(command -v lean)" \
            --axiom-output "$qce_tmpdir/qce-axiom-output.txt" \
            > "$qce_tmpdir/qce-verification.json"
          mv "$qce_tmpdir/qce-axiom-output.txt" qce-axiom-output.txt
          mv "$qce_tmpdir/qce-verification.json" qce-verification.json
          rmdir "$qce_tmpdir"

      - name: Create exact-head execution-bound kernel receipt
        run: >-
          python3 -B make_qce_kernel_receipt.py
          --lean "$(command -v lean)"
          --axiom-output qce-axiom-output.txt
          --verification-output qce-verification.json
          --output QCE_KERNEL_RECEIPT.json
          --repository "${GITHUB_REPOSITORY}"
          --commit "${{ steps.binding.outputs.head }}"
          --tree "${{ steps.binding.outputs.tree }}"
          --run-id "${GITHUB_RUN_ID}"
          --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Upload exact QCE formal receipt bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qikvrt-qce-kernel-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/QCE_KERNEL_RECEIPT.json
            docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/qce-axiom-output.txt
            docs/publications/2026-08-05-qik-vrt-quantum-causal-emergence/qce-verification.json
