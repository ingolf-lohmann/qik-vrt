name: QIK-VRT publication router
run-name: Publication ${{ inputs.manifest_sha256 || github.sha }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Existing exact-authorized Zenodo capability
        type: choice
        options: [publish, metadata-edit]
        default: publish
      manifest_path:
        description: Committed Authority-relative v2 publication or metadata-edit manifest
        type: string
        required: true
      manifest_sha256:
        description: Independently verified SHA-256 of the exact manifest bytes
        type: string
        required: true
      expected_main_head:
        description: Independently observed current Authority Main HEAD
        type: string
        required: true
      expected_main_tree:
        description: Independently observed current Authority Main root TREE
        type: string
        required: true
      execute:
        description: Invoke the existing publisher only after its canonical candidate-specific authorization
        type: boolean
        default: false
      editorial_request_path:
        description: Optional reviewed state/publication_requests request; never an authorization substitute
        type: string
        required: false
        default: ''
  push:
    branches: [main, 'integration/**']
    paths:
      - state/publication_requests/**
      - tools/qikvrt_publication_router.py
      - tools/qikvrt_publication_overview.py
      - tools/qikvrt_verify_zenodo_public_manifest.py
      - tests/test_publication_router.py
      - tests/test_qikvrt_publication_overview.py
      - tests/test_self_host.py
      - docs/monitor/self-host.mjs
      - runtime/self-host/PACKAGE.json
      - .github/workflows/qikvrt_publication_router.yml
  workflow_run:
    workflows: [QIKVRT EFFECT_ACK HTTP Firefox terminal]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - docs/publications/**/PUBLICATION_ROUTING.json
      - docs/publications/**/ZENODO_CANDIDATE.json
      - docs/publications/**/IETF_DISPOSITION.json
      - tools/qikvrt_publication_router.py
      - tools/qikvrt_publication_overview.py
      - tools/qikvrt_verify_zenodo_public_manifest.py
      - state/publication_requests/**
      - tests/test_publication_router.py
      - tests/test_qikvrt_publication_overview.py
      - tests/test_self_host.py
      - docs/monitor/self-host.mjs
      - runtime/self-host/PACKAGE.json
      - .github/workflows/qikvrt_publication_router.yml

permissions:
  contents: read

jobs:
  editorial-public-readback:
    if: github.event_name == 'workflow_run' && github.repository == 'ingolf-lohmann/qik-vrt' && github.event.workflow_run.head_repository.full_name == 'ingolf-lohmann/qik-vrt' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Provision the existing hash-locked publication inspection runtime
        run: >-
          python3 -I -m pip --isolated --disable-pip-version-check install --require-hashes --no-deps --only-binary=:all: -r runtime/toolchains/requirements-xml2rfc-3.34.0.txt
      - name: Verify native deployment jobs before anonymous exact publication-asset readback
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B tools/qikvrt_integrity.py verify
          mkdir -p .qikvrt/evidence/publication-request
          python3 -B tools/qikvrt_publication_router.py --json --verify-after-existing-deployment "$DEPLOYMENT_RUN" \
            > .qikvrt/evidence/publication-request/post-deployment.json
      - name: Preserve publication-specific public byte readback
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-editorial-public-readback-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          include-hidden-files: true
          path: .qikvrt/evidence/publication-request

  route:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Provision the existing hash-locked publication inspection runtime
        run: >-
          python3 -I -m pip --isolated --disable-pip-version-check install --require-hashes --no-deps --only-binary=:all: -r runtime/toolchains/requirements-xml2rfc-3.34.0.txt
      - name: Validate publication routing
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B tools/qikvrt_publication_router.py \
            docs/publications/2026-08-04-pre-spacetime-ontology --json
          python3 -B -m unittest -v tests.test_publication_router tests.test_qikvrt_publication_overview \
            tests.test_self_host.StandaloneTests.test_reviewed_publication_assets_survive_sealing_and_actual_http_without_control_exposure

  editorial-queue:
    if: github.event_name == 'push' && github.repository == 'ingolf-lohmann/qik-vrt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: qikvrt-authority-editorial-admission
      cancel-in-progress: false
    permissions:
      contents: write # Create-only dispatch reservation; never update Main.
      actions: write # Dispatch only this existing workflow after author/review/Main gates.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Provision the existing hash-locked publication inspection runtime
        run: >-
          python3 -I -m pip --isolated --disable-pip-version-check install --require-hashes --no-deps --only-binary=:all: -r runtime/toolchains/requirements-xml2rfc-3.34.0.txt
      - name: Admit exact author-authorized requests through the existing dispatch lane
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B tools/qikvrt_integrity.py verify
          mkdir -p .qikvrt/evidence/publication-request
          python3 -B tools/qikvrt_publication_router.py --dispatch-editorial-queue --json \
            > .qikvrt/evidence/publication-request/editorial-dispatch.json
      - name: Preserve dispatch admission separately from publication results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-editorial-admission-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          include-hidden-files: true
          path: .qikvrt/evidence/publication-request

  requested-zenodo:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ingolf-lohmann/qik-vrt' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: zenodo-production
    concurrency:
      group: qikvrt-authority-zenodo-request
      cancel-in-progress: false
    permissions:
      contents: write # Existing publisher's create-only authorization-consumption ref; no Main push.
      pull-requests: write # Create only the bound receipt/docs draft review carrier; no approval or merge.
    env:
      REQUEST_OPERATION: ${{ inputs.operation }}
      REQUEST_MANIFEST: ${{ inputs.manifest_path }}
      REQUEST_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
      REQUEST_EDITORIAL: ${{ inputs.editorial_request_path }}
      EXPECTED_HEAD: ${{ inputs.expected_main_head }}
      EXPECTED_TREE: ${{ inputs.expected_main_tree }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
    steps:
      - name: Check out the exact trusted Main event
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12.13'
      - name: Provision the existing hash-locked publication inspection runtime
        run: >-
          python3 -I -m pip --isolated --disable-pip-version-check install --require-hashes --no-deps --only-binary=:all: -r runtime/toolchains/requirements-xml2rfc-3.34.0.txt
      - name: Verify exact requested manifest before any Zenodo credential delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_tool_cache.py verify
          python3 -B tools/qikvrt_integrity.py verify
          mkdir -p .qikvrt/evidence/publication-request
          editorial=()
          if [ -n "$REQUEST_EDITORIAL" ]; then editorial=(--editorial-binding "$REQUEST_EDITORIAL"); fi
          python3 -B tools/qikvrt_publication_router.py --json \
            --zenodo-operation "$REQUEST_OPERATION" --manifest "$REQUEST_MANIFEST" \
            --manifest-sha256 "$REQUEST_MANIFEST_SHA256" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$EXPECTED_TREE" "${editorial[@]}" \
            > .qikvrt/evidence/publication-request/preflight.json
      - name: Preserve complete ordinary gates before requested effect
        if: inputs.execute
        run: make test
      - name: Reobserve Main and invoke only the existing exact-authorized publisher
        if: inputs.execute
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          ZENODO_API_BASE: https://zenodo.org/api
        run: |
          set -euo pipefail
          umask 077
          editorial=()
          if [ -n "$REQUEST_EDITORIAL" ]; then editorial=(--editorial-binding "$REQUEST_EDITORIAL"); fi
          python3 -B tools/qikvrt_publication_router.py --json --execute \
            --zenodo-operation "$REQUEST_OPERATION" --manifest "$REQUEST_MANIFEST" \
            --manifest-sha256 "$REQUEST_MANIFEST_SHA256" \
            --expected-head "$EXPECTED_HEAD" --expected-tree "$EXPECTED_TREE" "${editorial[@]}" \
            > .qikvrt/evidence/publication-request/execution.json
      - name: Independently verify public Zenodo bytes, capture DOI and stage existing website assets
        if: inputs.execute && inputs.operation == 'publish' && inputs.editorial_request_path != ''
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_publication_router.py --json --complete-editorial "$REQUEST_EDITORIAL" \
            > .qikvrt/evidence/publication-request/editorial-completion.json
      - name: Observe the exact public website once without inferring deployment
        if: inputs.execute && inputs.operation == 'publish' && inputs.editorial_request_path != ''
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_publication_router.py --json \
            --verify-editorial-delivery .qikvrt/evidence/publication-request/completion.json \
            > .qikvrt/evidence/publication-request/public-delivery.json
      - name: Persist publication evidence and docs through the existing protected review process
        if: always() && inputs.execute && inputs.operation == 'publish' && inputs.editorial_request_path != '' && hashFiles('.qikvrt/evidence/publication-request/completion.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B tools/qikvrt_publication_router.py --json \
            --persist-editorial .qikvrt/evidence/publication-request/completion.json \
            > .qikvrt/evidence/publication-request/persistence.json
      - name: Preserve bound evidence for independent readback and Authority persistence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-requested-zenodo-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .qikvrt/evidence/publication-request
            **/zenodo-publication.json
            **/zenodo-metadata-edit.json
