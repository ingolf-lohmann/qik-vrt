name: QIK-VRT exact Authority-tree runtime article sync from Mirror 0698e6

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - .github/workflows/qikvrt_sync_runtime_article_exact_tree_from_0698e_once.yml

permissions:
  contents: write

concurrency:
  group: qikvrt-runtime-article-exact-tree-from-0698e6
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AUTHORITY_REPOSITORY: Goldkelch/qik-vrt
      AUTHORITY_COMMIT: 3a186cb54077e959f9072b78bd24eb85a61b5c3d
      MIRROR_BASE: 0698e6fe8e10c5d81c370dc8d12a45cc3da36565
      TARGET_BRANCH: sync/runtime-article-authority-tree-3a186-from-0698e-v1
      EXECUTION_WORKFLOW: .github/workflows/qikvrt_sync_runtime_article_exact_tree_from_0698e_once.yml
      WRITE_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact execution branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: execution/runtime-article-exact-tree-from-0698e6-v1
          fetch-depth: 0
      - name: Verify materialized execution boundary
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_REPOSITORY" = 'ingolf-lohmann/qik-vrt' ]
          [ "${{ github.event.pull_request.base.sha }}" = "$MIRROR_BASE" ]
          [ "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}' ]
          [ "$(git merge-base HEAD "$MIRROR_BASE")" = "$MIRROR_BASE" ]
          [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MIRROR_BASE" ]
          [ "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$MIRROR_BASE" ]
          [ "$(git ls-remote https://github.com/$AUTHORITY_REPOSITORY.git refs/heads/main | cut -f1)" = "$AUTHORITY_COMMIT" ]
          mapfile -t changed < <(git diff --name-only "$MIRROR_BASE" HEAD -- | LC_ALL=C sort)
          expected=(
            "$EXECUTION_WORKFLOW"
            'REPOSITORY_FILE_MANIFEST.json'
            'REPOSITORY_FILE_MANIFEST.json.sha256'
            'SHA256SUMS.txt'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [ "${#changed[@]}" -eq "${#expected_sorted[@]}" ]
          for i in "${!expected_sorted[@]}"; do [ "${changed[$i]}" = "${expected_sorted[$i]}" ]; done
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/qikvrt_integrity.py verify
      - name: Verify complete Authority content tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/$AUTHORITY_REPOSITORY.git "$AUTHORITY_COMMIT"
          [ "$(git rev-parse FETCH_HEAD)" = "$AUTHORITY_COMMIT" ]
          authority_tree="$(git rev-parse 'FETCH_HEAD^{tree}')"
          test -n "$authority_tree"
          worktree="$RUNNER_TEMP/qikvrt-authority-runtime-article"
          git worktree add --detach "$worktree" "$AUTHORITY_COMMIT"
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$worktree/tools/qikvrt_integrity.py" verify
          python3 -B "$worktree/tests/test_quantum_classical_runtime_article.py"
          python3 -B "$worktree/tools/qikvrt_global_completion.py" check
          make -C "$worktree" test
          PYTHONDONTWRITEBYTECODE=1 python3 -B "$worktree/tools/qikvrt_integrity.py" verify
          echo "AUTHORITY_TREE=$authority_tree" >> "$GITHUB_ENV"
      - name: Construct exact Authority tree as child of current Mirror main
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}' ]
          [ "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$MIRROR_BASE" ]
          message="$(printf '%s\n' \
            'Synchronize machine-traceable quantum-classical runtime article from Authority 3a186' \
            '' \
            "Authority commit: $AUTHORITY_COMMIT" \
            "Authority tree: $AUTHORITY_TREE" \
            "Previous Mirror main: $MIRROR_BASE" \
            'Zenodo DOI: 10.5281/zenodo.21640173' \
            'Concept DOI: 10.5281/zenodo.21640172' \
            'Publication receipt SHA-256: 75e4dca716a41d48b2e8ff35f1b9789d6ae24df58f5f192527349e60fce9a8c7' \
            'QRT-018 real QPU integration remains IMPLEMENTATION_OPEN.' \
            'The complete content tree equals Authority; final pair equality remains separate.')"
          sync_commit="$(printf '%s\n' "$message" | env \
            GIT_AUTHOR_NAME='QIK-VRT Repository Mesh' \
            GIT_AUTHOR_EMAIL='ingolf.lohmann@live.com' \
            GIT_COMMITTER_NAME='QIK-VRT Repository Mesh' \
            GIT_COMMITTER_EMAIL='ingolf.lohmann@live.com' \
            git commit-tree "$AUTHORITY_TREE" -p "$MIRROR_BASE")"
          [ "$(git rev-parse "$sync_commit^{tree}")" = "$AUTHORITY_TREE" ]
          [ "$(git show -s --format=%P "$sync_commit")" = "$MIRROR_BASE" ]
          git diff --exit-code "$AUTHORITY_COMMIT" "$sync_commit" --
          push_url="https://x-access-token:${WRITE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$push_url" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$MIRROR_BASE" \
            "$sync_commit:refs/heads/$TARGET_BRANCH"
          persisted="$(git ls-remote "$push_url" refs/heads/$TARGET_BRANCH | cut -f1)"
          [ "$persisted" = "$sync_commit" ]
