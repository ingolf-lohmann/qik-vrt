name: QIKVRT circular Spark M68000 architecture V2

on:
  pull_request:
    paths:
      - "formalization/QIKVRT_Spark_v2/**"
      - "runtime/m68000/QIKVRT_CIRCULAR_SPARK_ARCHITECTURE_V2.json"
      - "runtime/m68000/QIKVRT_COMPILED_KERNELS_V1.json"
      - "runtime/m68000/QIKVRT_SPARK_ARCHITECTURE_V1.json"
      - "runtime/m68000/QIKVRT_SPARK_BRANCH_PLANS_V1.json"
      - "runtime/m68000/qikvrt_spark_branch_plan_v1.hex"
      - "src/m68000/qikvrt_spark_branch_plan_v1.s"
      - "tools/qikvrt_spark_branch_m68000_compiler.py"
      - "tools/qikvrt_spark_branch_work_unit.py"
      - "tools/qikvrt_circular_spark_v2.py"
      - "tools/qikvrt_virtual_mesh_m68000_acceptance.py"
      - "tests/test_qikvrt_spark_branch.py"
      - "tests/test_qikvrt_spark_branch_m68000.py"
      - "tests/test_qikvrt_spark_branch_work_unit.py"
      - "tests/test_qikvrt_circular_spark_v2.py"
      - "tests/test_qikvrt_virtual_mesh_m68000_acceptance.py"
      - "docs/CIRCULAR_SPARK_ARCHITECTURE_V2.md"
      - ".github/workflows/qikvrt_circular_spark_v2.yml"
  push:
    branches: [main]
    paths:
      - "formalization/QIKVRT_Spark_v2/**"
      - "runtime/m68000/QIKVRT_CIRCULAR_SPARK_ARCHITECTURE_V2.json"
      - "runtime/m68000/QIKVRT_COMPILED_KERNELS_V1.json"
      - "runtime/m68000/QIKVRT_SPARK_ARCHITECTURE_V1.json"
      - "runtime/m68000/QIKVRT_SPARK_BRANCH_PLANS_V1.json"
      - "runtime/m68000/qikvrt_spark_branch_plan_v1.hex"
      - "tools/qikvrt_circular_spark_v2.py"
      - "tools/qikvrt_virtual_mesh_m68000_acceptance.py"
      - ".github/workflows/qikvrt_circular_spark_v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove-compile-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Kernel-check circular Spark arithmetic and plan semantics
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: formalization/QIKVRT_Spark_v2
          test: false

      - name: Compile and exhaustively verify both Spark kernels
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qikvrt-spark-v2"
          python3 tools/qikvrt_spark_branch.py verify --json \
            > "$RUNNER_TEMP/qikvrt-spark-v2/local-pass.json"
          python3 tools/qikvrt_spark_branch_m68000_compiler.py --json \
            > "$RUNNER_TEMP/qikvrt-spark-v2/plan-pass.json"
          python3 -m unittest -v \
            tests.test_qikvrt_spark_branch \
            tests.test_qikvrt_spark_branch_m68000 \
            tests.test_qikvrt_spark_branch_work_unit \
            tests.test_qikvrt_circular_spark_v2 \
            tests.test_qikvrt_virtual_mesh_m68000_acceptance

      - name: Execute circular compiler-interpreter-M68000 reference cycles
        run: |
          set -euo pipefail
          for mode in complete rebase no-authority invalid; do
            python3 tools/qikvrt_circular_spark_v2.py \
              --mode "$mode" --json \
              > "$RUNNER_TEMP/qikvrt-spark-v2/cycle-$mode.json"
          done
          python3 tools/qikvrt_virtual_mesh_m68000_acceptance.py \
            --iterations 3 --json \
            > "$RUNNER_TEMP/qikvrt-spark-v2/virtual-mesh-v3.json"

      - name: Reject proof holes and cardinality materialization
        run: |
          set -euo pipefail
          target=formalization/QIKVRT_Spark_v2/QIKVRTSparkV2.lean
          ! grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' "$target"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("runtime/m68000/QIKVRT_CIRCULAR_SPARK_ARCHITECTURE_V2.json")
          a = json.loads(p.read_text())
          card = a["scale"]["macro_ring_state_cardinality"]
          assert card["expression"] == "2^(256^3)"
          assert card["exponent_bits"] == 256 ** 3
          assert card["materialized_or_enumerated"] is False
          assert a["scale"]["macro_ring_bytes"] == 2 * 1024 * 1024
          PY

      - name: Preserve circular Spark evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qikvrt-circular-spark-v2-${{ github.sha }}
          path: ${{ runner.temp }}/qikvrt-spark-v2/**
          retention-days: 30
          if-no-files-found: error
