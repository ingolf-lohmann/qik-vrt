<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QIKVRT AI Terminal</title><style>body{font:16px system-ui,sans-serif;max-width:620px;margin:24px auto;padding:0 18px;background:#071725;color:#eef3f6}fieldset{border:1px solid #6e8291;border-radius:10px;padding:16px}label{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:12px;margin:12px 0;align-items:center}input,select,button{font:inherit;padding:7px;max-width:100%}button{margin-top:12px}small{color:#b7c2c9}@media(max-width:420px){label{grid-template-columns:1fr}}</style></head>
<body>
  <h1>QIKVRT AI Terminal</h1>
  <p data-i18n="localPreferences"></p>
  <p data-i18n="languageInfo"></p>
  <fieldset>
    <legend data-i18n="appearance"></legend>
    <label><span data-i18n="accent"></span><input id="accent" type="color" value="#d7a64a"></label>
    <label><span data-i18n="fontSize"></span><input id="fontScale" type="range" min="0.8" max="1.4" value="1" step="0.05"></label>
    <label><span data-i18n="density"></span><select id="density"><option value="comfortable" data-i18n="comfortable"></option><option value="compact" data-i18n="compact"></option></select></label>
    <label><span data-i18n="position"></span><select id="position"><option value="right" data-i18n="right"></option><option value="left" data-i18n="left"></option></select></label>
    <button id="save" type="button" data-i18n="save"></button> <span id="status" role="status"></span>
  </fieldset>
  <small data-i18n="devicePermission"></small>
  <script src="options.js"></script>
</body></html>
