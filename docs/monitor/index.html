<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QIK-VRT Live Monitor</title><style>body{font-family:system-ui;background:#111;color:#eee;margin:0}header,main{max-width:1200px;margin:auto;padding:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}.card{background:#1b1b1b;border:1px solid #444;border-radius:10px;padding:1rem}.ok{color:#7ee787}.bad{color:#ff7b72}.run{color:#d2a8ff}.muted{color:#999}a{color:#58a6ff}table{width:100%;border-collapse:collapse}td,th{padding:.35rem;border-bottom:1px solid #333;text-align:left;font-size:.9rem}code{word-break:break-all}input{width:min(36rem,90%)}#log{white-space:pre-wrap;font-family:monospace;font-size:.8rem;max-height:18rem;overflow:auto}</style></head><body><header><h1>QIK-VRT Repository Live Monitor</h1><p>Direkte Beobachtung der Authority- und Mirror-Repositories über die offizielle GitHub-API. Keine Chat-Projektion.</p><p><input id="token" type="password" autocomplete="off" placeholder="Optional: GitHub Fine-grained Token nur für diese Browser-Sitzung"> <button onclick="activate()">Live-Modus aktivieren</button> <button onclick="refreshAll()">Jetzt aktualisieren</button></p><p id="mode" class="muted"></p><p id="clock" class="muted"></p></header><main><div id="repos" class="grid"></div><div class="card"><h2>Ereignisprotokoll</h2><div id="log"></div></div></main><script>const repos=['Goldkelch/qik-vrt','ingolf-lohmann/qik-vrt'],api='https://api.github.com',state={};let timer=null,token=sessionStorage.getItem('qikvrt_monitor_token')||'';document.getElementById('token').value=token;function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function cls(s){return ['success','completed','clean'].includes(s)?'ok':['failure','cancelled','timed_out','action_required'].includes(s)?'bad':'run'}function interval(){return token?10000:240000}function schedule(){clearInterval(timer);timer=setInterval(refreshAll,interval());document.getElementById('mode').textContent=token?'Authentifizierter Live-Modus: 10 Sekunden. Token bleibt ausschließlich im sessionStorage dieses Tabs.':'Öffentlicher Fallback: 4 Minuten wegen GitHub-Rate-Limit. Für 10 Sekunden einen read-only Fine-grained Token eingeben.'}function activate(){token=document.getElementById('token').value.trim();token?sessionStorage.setItem('qikvrt_monitor_token',token):sessionStorage.removeItem('qikvrt_monitor_token');schedule();refreshAll()}async function get(path){const h={Accept:'application/vnd.github+json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(api+path,{headers:h});if(!r.ok)throw new Error(r.status+' '+r.statusText+'; remaining='+r.headers.get('x-ratelimit-remaining'));return r.json()}function event(m){const e=document.getElementById('log');e.textContent=new Date().toISOString()+'  '+m+'\n'+e.textContent.slice(0,12000)}async function load(repo){const [meta,prs,runs,commits]=await Promise.all([get('/repos/'+repo),get('/repos/'+repo+'/pulls?state=open&per_page=20&sort=updated&direction=desc'),get('/repos/'+repo+'/actions/runs?per_page=30'),get('/repos/'+repo+'/commits?per_page=10')]);const sig=JSON.stringify({h:commits[0]?.sha,p:prs.map(x=>[x.number,x.head.sha,x.updated_at,x.draft]),r:runs.workflow_runs.map(x=>[x.id,x.status,x.conclusion,x.head_sha])});if(state[repo]&&state[repo]!==sig)event(repo+': technischer Zustand geändert');state[repo]=sig;return{repo,meta,prs,runs:runs.workflow_runs,commits}}function render(d){const a=d.runs.filter(x=>x.status!=='completed'),f=d.runs.filter(x=>['failure','cancelled','timed_out','action_required'].includes(x.conclusion));return `<section class="card"><h2>${esc(d.repo)}</h2><p>Default: <code>${esc(d.meta.default_branch)}</code><br>Head: <code>${esc(d.commits[0]?.sha)}</code></p><p>Offene PRs: <b>${d.prs.length}</b> · aktive Runs: <b class="${a.length?'run':'ok'}">${a.length}</b> · problematische Runs: <b class="${f.length?'bad':'ok'}">${f.length}</b></p><h3>Pull Requests</h3><table>${d.prs.slice(0,10).map(p=>`<tr><td><a target="_blank" href="${p.html_url}">#${p.number}</a></td><td><code>${p.head.sha.slice(0,10)}</code></td><td>${p.draft?'DRAFT':'READY'}</td></tr>`).join('')}</table><h3>Workflows</h3><table>${d.runs.slice(0,15).map(r=>`<tr><td><a target="_blank" href="${r.html_url}">${esc(r.name)}</a></td><td><code>${(r.head_sha||'').slice(0,10)}</code></td><td class="${cls(r.conclusion||r.status)}">${esc(r.status)} / ${esc(r.conclusion||'—')}</td></tr>`).join('')}</table></section>`}async function refreshAll(){document.getElementById('clock').textContent='Aktualisierung läuft …';try{const d=await Promise.all(repos.map(load));document.getElementById('repos').innerHTML=d.map(render).join('');document.getElementById('clock').textContent='Stand: '+new Date().toLocaleString()}catch(e){event('FEHLER: '+e.message);document.getElementById('clock').textContent=e.message}}schedule();refreshAll();</script></body></html>
