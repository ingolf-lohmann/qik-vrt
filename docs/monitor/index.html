<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QIK-VRT Live Monitor</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#111;color:#eee}header,main{max-width:1200px;margin:auto;padding:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}.card{background:#1b1b1b;border:1px solid #444;border-radius:10px;padding:1rem}.ok{color:#7ee787}.bad{color:#ff7b72}.run{color:#d2a8ff}.muted{color:#999}a{color:#58a6ff}table{width:100%;border-collapse:collapse}td,th{padding:.35rem;border-bottom:1px solid #333;text-align:left;font-size:.9rem}code{word-break:break-all}button{padding:.5rem 1rem}#log{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:.8rem;max-height:20rem;overflow:auto}</style></head><body><header><h1>QIK-VRT Repository Live Monitor</h1><p>Direkte Beobachtung über die offizielle öffentliche GitHub-API. Aktualisierung alle 10 Sekunden. Keine Chat-Projektion.</p><p><button onclick="refreshAll()">Jetzt aktualisieren</button> <span id="clock" class="muted"></span></p></header><main><div id="repos" class="grid"></div><div class="card"><h2>Ereignisprotokoll</h2><div id="log"></div></div></main><script>const repos=['Goldkelch/qik-vrt','ingolf-lohmann/qik-vrt'];const state={};const api='https://api.github.com';function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function statusClass(s){return ['success','completed','clean'].includes(s)?'ok':['failure','cancelled','timed_out','action_required'].includes(s)?'bad':'run'}async function get(path){const r=await fetch(api+path,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(r.status+' '+r.statusText);return r.json()}function event(msg){const el=document.getElementById('log');el.textContent=new Date().toISOString()+'  '+msg+'\n'+el.textContent.slice(0,12000)}async function loadRepo(repo){const [owner,name]=repo.split('/');const [meta,prs,runs,commits]=await Promise.all([get('/repos/'+repo),get('/repos/'+repo+'/pulls?state=open&per_page=20&sort=updated&direction=desc'),get('/repos/'+repo+'/actions/runs?per_page=30'),get('/repos/'+repo+'/commits?per_page=10')]);const sig=JSON.stringify({head:commits[0]?.sha,prs:prs.map(p=>[p.number,p.head.sha,p.updated_at,p.draft]),runs:runs.workflow_runs.map(r=>[r.id,r.status,r.conclusion,r.head_sha])});if(state[repo]&&state[repo]!==sig)event(repo+': technischer Zustand geändert');state[repo]=sig;return {repo,meta,prs,runs:runs.workflow_runs,commits}}function render(d){const active=d.runs.filter(r=>r.status!=='completed');const failed=d.runs.filter(r=>['failure','cancelled','timed_out','action_required'].includes(r.conclusion));return `<section class="card"><h2>${esc(d.repo)}</h2><p>Default: <code>${esc(d.meta.default_branch)}</code><br>Aktueller Commit: <code>${esc(d.commits[0]?.sha)}</code></p><p>Offene PRs: <b>${d.prs.length}</b> · aktive Runs: <b class="${active.length?'run':'ok'}">${active.length}</b> · problematische Runs im Fenster: <b class="${failed.length?'bad':'ok'}">${failed.length}</b></p><h3>Pull Requests</h3><table><tr><th>PR</th><th>Head</th><th>Status</th></tr>${d.prs.slice(0,10).map(p=>`<tr><td><a target="_blank" href="${p.html_url}">#${p.number}</a></td><td><code>${p.head.sha.slice(0,10)}</code></td><td>${p.draft?'DRAFT':'READY'} / ${esc(p.mergeable_state||'unknown')}</td></tr>`).join('')}</table><h3>Workflow-Runs</h3><table><tr><th>Name</th><th>Head</th><th>Status</th></tr>${d.runs.slice(0,15).map(r=>`<tr><td><a target="_blank" href="${r.html_url}">${esc(r.name)}</a></td><td><code>${esc((r.head_sha||'').slice(0,10))}</code></td><td class="${statusClass(r.conclusion||r.status)}">${esc(r.status)} / ${esc(r.conclusion||'—')}</td></tr>`).join('')}</table></section>`}async function refreshAll(){document.getElementById('clock').textContent='Aktualisierung läuft …';try{const data=await Promise.all(repos.map(loadRepo));document.getElementById('repos').innerHTML=data.map(render).join('');document.getElementById('clock').textContent='Stand: '+new Date().toLocaleString()}catch(e){event('FEHLER: '+e.message);document.getElementById('clock').textContent='Fehler: '+e.message}}refreshAll();setInterval(refreshAll,10000);</script></body></html>
