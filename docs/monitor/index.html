<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QIK-VRT Live Monitor</title><style>body{font-family:system-ui;background:#111;color:#eee;margin:0}header,main{max-width:1250px;margin:auto;padding:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}.card{background:#1b1b1b;border:1px solid #444;border-radius:10px;padding:1rem}.ok{color:#7ee787}.bad{color:#ff7b72}.run{color:#d2a8ff}.muted{color:#999}a{color:#58a6ff}table{width:100%;border-collapse:collapse}td,th{padding:.4rem;border-bottom:1px solid #333;text-align:left;font-size:.9rem}code{word-break:break-all}input{width:min(36rem,90%)}progress{width:100%}#log{white-space:pre-wrap;font-family:monospace;font-size:.8rem;max-height:18rem;overflow:auto}</style></head><body><header><h1>QIK-VRT Repository Live Monitor</h1><p>Direkte Beobachtung von Authority, Mirror, Dokumentprogramm, Deliveries, Gates und Effect-Acknowledgements über die offizielle GitHub-API. Keine Chat-Projektion.</p><p><input id="token" type="password" autocomplete="off" placeholder="Optional: read-only Fine-grained GitHub Token nur für diese Sitzung"> <button onclick="activate()">Live-Modus aktivieren</button> <button onclick="refreshAll()">Jetzt aktualisieren</button></p><p id="mode" class="muted"></p><p id="clock" class="muted"></p></header><main><div class="card"><h2>Dokumenten- und Delivery-Programm</h2><div id="deliveries">Lade …</div></div><div id="repos" class="grid"></div><div class="card"><h2>Ereignisprotokoll</h2><div id="log"></div></div></main><script>const repos=['Goldkelch/qik-vrt','ingolf-lohmann/qik-vrt'],api='https://api.github.com',branch='candidate/repository-live-monitor-deliveries-v1',wu='work-units/QIKVRT_DOCUMENT_DELIVERY_AND_LIVE_MONITOR_V1.json',state={};let timer=null,token=sessionStorage.getItem('qikvrt_monitor_token')||'';document.getElementById('token').value=token;function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function cls(s){return ['success','completed','clean','verified'].includes(s)?'ok':['failure','cancelled','timed_out','action_required','blocked'].includes(s)?'bad':'run'}function interval(){return token?10000:240000}function schedule(){clearInterval(timer);timer=setInterval(refreshAll,interval());document.getElementById('mode').textContent=token?'Authentifizierter Live-Modus: 10 Sekunden. Token bleibt nur im sessionStorage dieses Tabs.':'Öffentlicher Fallback: 4 Minuten. Für 10 Sekunden read-only Token eingeben.'}function activate(){token=document.getElementById('token').value.trim();token?sessionStorage.setItem('qikvrt_monitor_token',token):sessionStorage.removeItem('qikvrt_monitor_token');schedule();refreshAll()}async function get(path){const h={Accept:'application/vnd.github+json'};if(token)h.Authorization='Bearer '+token;const r=await fetch(api+path,{headers:h});if(!r.ok)throw new Error(r.status+' '+r.statusText+'; remaining='+r.headers.get('x-ratelimit-remaining'));return r.json()}function event(m){const e=document.getElementById('log');e.textContent=new Date().toISOString()+'  '+m+'\n'+e.textContent.slice(0,16000)}async function loadRepo(repo){const [meta,prs,runs,commits]=await Promise.all([get('/repos/'+repo),get('/repos/'+repo+'/pulls?state=open&per_page=25&sort=updated&direction=desc'),get('/repos/'+repo+'/actions/runs?per_page=40'),get('/repos/'+repo+'/commits?per_page=10')]);const sig=JSON.stringify({h:commits[0]?.sha,p:prs.map(x=>[x.number,x.head.sha,x.updated_at,x.draft]),r:runs.workflow_runs.map(x=>[x.id,x.status,x.conclusion,x.head_sha])});if(state[repo]&&state[repo]!==sig)event(repo+': technischer Zustand geändert');state[repo]=sig;return{repo,meta,prs,runs:runs.workflow_runs,commits}}async function loadDeliveries(){const repo=repos[0],f=await get('/repos/'+repo+'/contents/'+wu+'?ref='+encodeURIComponent(branch));const data=JSON.parse(atob(f.content.replace(/\n/g,'')));const sig=JSON.stringify(data.required_deliveries.map(x=>[x.id,x.status,x.path]));if(state.deliveries&&state.deliveries!==sig)event('NEUE ODER GEÄNDERTE DELIVERY erkannt');state.deliveries=sig;return data}function renderDeliveries(d){const total=d.required_deliveries.length,done=d.required_deliveries.filter(x=>['verified','materialized','complete'].includes(x.status)).length,progress=Math.round(done*100/total);return `<p><b>Work Unit:</b> <code>${esc(d.id)}</code><br><b>Status:</b> ${esc(d.state)}<br><progress max="100" value="${progress}"></progress> ${progress}% verifiziert</p><table><tr><th>Delivery</th><th>Format</th><th>Status</th><th>Bereitstellung</th></tr>${d.required_deliveries.map(x=>{const blob='https://github.com/Goldkelch/qik-vrt/blob/'+branch+'/'+x.path,raw='https://raw.githubusercontent.com/Goldkelch/qik-vrt/'+branch+'/'+x.path;return `<tr><td>${esc(x.id)}</td><td>${esc(x.format)}</td><td class="${cls(x.status)}">${esc(x.status)}</td><td><a target="_blank" href="${blob}">anzeigen</a> · <a target="_blank" href="${raw}">direkt</a><br><code>${esc(x.path)}</code></td></tr>`}).join('')}</table><p class="muted">Eine Delivery gilt erst als verifiziert, wenn Pfad, Commit, Gates und Receipt repository-seitig gebunden sind. Telemetrie allein ist kein Effect Acknowledgement.</p>`}function renderRepo(d){const a=d.runs.filter(x=>x.status!=='completed'),f=d.runs.filter(x=>['failure','cancelled','timed_out','action_required'].includes(x.conclusion));return `<section class="card"><h2>${esc(d.repo)}</h2><p>Default: <code>${esc(d.meta.default_branch)}</code><br>Head: <code>${esc(d.commits[0]?.sha)}</code></p><p>Offene PRs: <b>${d.prs.length}</b> · aktive Runs: <b class="${a.length?'run':'ok'}">${a.length}</b> · problematische Runs: <b class="${f.length?'bad':'ok'}">${f.length}</b></p><h3>Pull Requests</h3><table>${d.prs.slice(0,12).map(p=>`<tr><td><a target="_blank" href="${p.html_url}">#${p.number}</a></td><td><code>${p.head.sha.slice(0,10)}</code></td><td>${p.draft?'DRAFT':'READY'}</td></tr>`).join('')}</table><h3>Workflows</h3><table>${d.runs.slice(0,18).map(r=>`<tr><td><a target="_blank" href="${r.html_url}">${esc(r.name)}</a></td><td><code>${(r.head_sha||'').slice(0,10)}</code></td><td class="${cls(r.conclusion||r.status)}">${esc(r.status)} / ${esc(r.conclusion||'—')}</td></tr>`).join('')}</table></section>`}async function refreshAll(){document.getElementById('clock').textContent='Aktualisierung läuft …';try{const [d,...rr]=await Promise.all([loadDeliveries(),...repos.map(loadRepo)]);document.getElementById('deliveries').innerHTML=renderDeliveries(d);document.getElementById('repos').innerHTML=rr.map(renderRepo).join('');document.getElementById('clock').textContent='Stand: '+new Date().toLocaleString()}catch(e){event('FEHLER: '+e.message);document.getElementById('clock').textContent=e.message}}schedule();refreshAll();</script></body></html>
