<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">QIK-VRT SMG H5 - EBNF-, Semantik- und Evidenzkarte</title>
  <desc id="desc">Kreisförmige Karte der H5-Grammatik. Sie führt vom Header über Planck-Brücke, Wave-Record-Dualität, empirische Anker, Grenzfälle, Kopplung, Konsistenz, Vorhersage, Massive Closure und virtuelle Kosmogenese zur Effektgrenze zurück. Grün kennzeichnet kernel-geprüfte Modellteile, Blau etablierte Evidenz, Orange bedingte Brücken und Rot offene oder gesperrte Wirkung.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fd3ff"/>
    </marker>
    <style>
      .title { font: 700 42px system-ui, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 21px system-ui, sans-serif; fill: #b9d6ef; }
      .boxTitle { font: 700 20px system-ui, sans-serif; fill: #f7fbff; }
      .boxText { font: 400 15px system-ui, sans-serif; fill: #e5f0fa; }
      .tiny { font: 500 13px system-ui, sans-serif; fill: #d9e7f3; }
      .code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #f7fbff; }
      .link { fill: none; stroke: #8fd3ff; stroke-width: 4; marker-end: url(#arrow); opacity: 0.9; }
      .kernel { fill: #123f35; stroke: #47d7ac; stroke-width: 3; }
      .evidence { fill: #12375a; stroke: #57a9ff; stroke-width: 3; }
      .conditional { fill: #4a3517; stroke: #f7b955; stroke-width: 3; }
      .open { fill: #4a2028; stroke: #ff7186; stroke-width: 3; }
      .neutral { fill: #23344c; stroke: #a8c3db; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1600" height="1100" rx="28" fill="url(#bg)"/>
  <text x="800" y="68" text-anchor="middle" class="title">VRTCore SMG H5 - vom Unterschied zurück zur Wirkung</text>
  <text x="800" y="103" text-anchor="middle" class="subtitle">EBNF-Syntax → statische Semantik S01-S20 → Lean-Kernel → Evidenzgrenze → EFFECT_ACK_CONTINUE</text>

  <path class="link" d="M800 235 C1040 175 1265 280 1325 455"/>
  <path class="link" d="M1340 555 C1335 760 1160 900 960 935"/>
  <path class="link" d="M830 948 C575 980 330 865 255 670"/>
  <path class="link" d="M245 555 C240 350 420 205 665 220"/>

  <g filter="url(#shadow)">
    <rect x="610" y="140" width="380" height="120" rx="24" class="neutral"/>
    <text x="800" y="177" text-anchor="middle" class="boxTitle">HEADER / AUTHORITY</text>
    <text x="800" y="207" text-anchor="middle" class="code">vrtcore-smg 5.0 · Ingolf Lohmann</text>
    <text x="800" y="235" text-anchor="middle" class="code">EFFECT_ACK_CONTINUE</text>
  </g>

