    <text x="370" y="233" text-anchor="middle" class="boxTitle">EFFEKTGRENZE / RÜCKKEHR</text>
    <text x="370" y="265" text-anchor="middle" class="code">kernel-accepted ≠ discovery</text>
    <text x="370" y="293" text-anchor="middle" class="code">technical PASS ≠ release</text>
    <text x="370" y="323" text-anchor="middle" class="tiny">Der Kreis schließt am verantworteten Haltpunkt.</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="800" cy="555" r="235" fill="#0a1d31" stroke="#d6e8f6" stroke-width="3"/>
    <circle cx="800" cy="555" r="205" fill="none" stroke="#47d7ac" stroke-width="3" stroke-dasharray="10 12"/>
    <text x="800" y="470" text-anchor="middle" class="boxTitle">DER ROTE FADEN</text>
    <text x="800" y="510" text-anchor="middle" class="boxText">Unterscheidung → Information → Messung</text>
    <text x="800" y="542" text-anchor="middle" class="boxText">→ Wirkung → Relation → Kausalordnung</text>
    <text x="800" y="574" text-anchor="middle" class="boxText">→ rekonstruierte Raumzeit → klassischer Grenzfall</text>
    <text x="800" y="622" text-anchor="middle" class="code">Kausalität ist Relation, nicht Sequenz.</text>
    <text x="800" y="666" text-anchor="middle" class="tiny">Syntax ≠ Semantik ≠ Kernelbeweis ≠ Empirie ≠ Natur ≠ Freigabe</text>
  </g>

  <g transform="translate(360 1035)">
    <rect x="0" y="-18" width="22" height="22" rx="5" class="kernel"/><text x="32" y="0" class="tiny">kernel-geprüftes Modell</text>
    <rect x="250" y="-18" width="22" height="22" rx="5" class="evidence"/><text x="282" y="0" class="tiny">etablierte Evidenz</text>
    <rect x="470" y="-18" width="22" height="22" rx="5" class="conditional"/><text x="502" y="0" class="tiny">bedingt</text>
