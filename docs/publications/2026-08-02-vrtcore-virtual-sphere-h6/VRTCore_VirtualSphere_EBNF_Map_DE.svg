<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="title desc">
  <title id="title">QIK-VRT VRTCore H6 – Beweiskarte der virtuellen Vollkugel</title>
  <desc id="desc">Barrierefreie Vektorkarte der H6-Schichten. Externe Paketbytes und ein Receipt speisen eine menschlich lesbare EBNF-Oberfläche, die für sich kein Kernelbeweis ist, und eine formale Lean-BitstreamGrammar. Der kernelgeprüfte Pfad führt über einen eindeutigen AST und das semantische Modell zu Seed, StepSpec, Erreichbarkeit und lückenlosem Wachstum. Diese Aussagen bilden ein konkretes VirtualClosure-Zertifikat. Eine rote Sperre verhindert die Hochstufung zur offenen PhysicalClosure. Die Wirkungsgrenze bleibt EFFECT_ACK_CONTINUE.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061321"/>
      <stop offset="0.55" stop-color="#0b2238"/>
      <stop offset="1" stop-color="#102d46"/>
    </linearGradient>
    <linearGradient id="sphere" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174f41"/>
      <stop offset="1" stop-color="#0c2f29"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset in="blur" dx="0" dy="7" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.38" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowShape"/>
      <feMerge>
        <feMergeNode in="shadowShape"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#77c8ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#47d7ac"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f7b955"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ff7186"/>
    </marker>
    <style>
      .mainTitle { font: 700 43px system-ui, sans-serif; fill: #f7fbff; }
      .subtitle { font: 400 20px system-ui, sans-serif; fill: #bdd9ee; }
      .sectionLabel { font: 700 15px system-ui, sans-serif; letter-spacing: 1.4px; fill: #8fe9cb; }
      .boxTitle { font: 700 20px system-ui, sans-serif; fill: #f7fbff; }
      .boxText { font: 400 15px system-ui, sans-serif; fill: #e6f1f9; }
      .small { font: 500 13px system-ui, sans-serif; fill: #d6e6f2; }
      .tiny { font: 500 12px system-ui, sans-serif; fill: #c9dce9; }
      .code { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f7fbff; }
      .codeSmall { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #f7fbff; }
      .external { fill: #153652; stroke: #77c8ff; stroke-width: 3; }
      .human { fill: #4a3517; stroke: #f7b955; stroke-width: 3; }
      .kernel { fill: #123f35; stroke: #47d7ac; stroke-width: 3; }
      .certificate { fill: url(#sphere); stroke: #70efc4; stroke-width: 4; }
      .open { fill: #4a2028; stroke: #ff7186; stroke-width: 3; }
      .neutral { fill: #23344c; stroke: #aac7dc; stroke-width: 3; }
      .kernelBoundary { fill: #0b1e2d; fill-opacity: 0.62; stroke: #47d7ac; stroke-width: 2.5; stroke-dasharray: 11 9; }
      .blueLink { fill: none; stroke: #77c8ff; stroke-width: 4; marker-end: url(#arrowBlue); }
      .greenLink { fill: none; stroke: #47d7ac; stroke-width: 4; marker-end: url(#arrowGreen); }
      .orangeLink { fill: none; stroke: #f7b955; stroke-width: 3.5; stroke-dasharray: 9 8; marker-end: url(#arrowOrange); }
      .redLink { fill: none; stroke: #ff7186; stroke-width: 4; marker-end: url(#arrowRed); }
      .redBlocked { fill: none; stroke: #ff7186; stroke-width: 4; stroke-dasharray: 9 8; }
      .innerLink { fill: none; stroke: #91e8ca; stroke-width: 2.5; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1800" height="1250" rx="30" fill="url(#bg)"/>
  <text x="900" y="62" text-anchor="middle" class="mainTitle">VRTCore H6 – die virtuelle Vollkugel ohne Beweisloch</text>
  <text x="900" y="100" text-anchor="middle" class="subtitle">Externe Bytes → formale Sprache → AST → Semantik → konkrete Dynamik → VirtualClosure</text>
  <text x="900" y="128" text-anchor="middle" class="small">Kausalität ist Relation, nicht Sequenz. · Der Beweis bleibt relativ zu Spezifikation, Lean-Kernel und ausgewiesener Trust Base.</text>

  <!-- External, non-kernel inputs -->
  <g filter="url(#shadow)">
    <rect x="55" y="240" width="315" height="220" rx="24" class="external"/>
    <text x="212" y="278" text-anchor="middle" class="boxTitle">EXTERNE BYTEBINDUNG</text>
    <text x="212" y="313" text-anchor="middle" class="code">Paketbytes · MANIFEST</text>
    <text x="212" y="341" text-anchor="middle" class="code">SHA-256 · Root-Digest</text>
    <text x="212" y="374" text-anchor="middle" class="boxText">Kernel- und Axiom-Receipt</text>
    <text x="212" y="400" text-anchor="middle" class="boxText">Exact-Inventory / Toolchain / VM</text>
    <text x="212" y="435" text-anchor="middle" class="tiny">Byteidentität ≠ Semantik</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="165" width="370" height="160" rx="24" class="human"/>
    <text x="630" y="202" text-anchor="middle" class="boxTitle">MENSCHLICHE EBNF-OBERFLÄCHE</text>
    <text x="630" y="235" text-anchor="middle" class="code">.ebnf + .vsphere</text>
    <text x="630" y="264" text-anchor="middle" class="boxText">lesbare Struktur und Referenzabbildung</text>
    <text x="630" y="297" text-anchor="middle" class="small">Parser allein ist NICHT kernelbewiesen</text>
  </g>

  <path class="blueLink" d="M370 300 C405 272 418 253 445 248"/>
  <text x="389" y="240" class="tiny">lesbare Projektion</text>

  <!-- Kernel scope -->
  <rect x="410" y="370" width="1335" height="610" rx="32" class="kernelBoundary"/>
  <text x="440" y="402" class="sectionLabel">LEAN-KERNEL-SCOPE · FORMALE H6-SPRACHE UND KONKRETE MODELLINSTANZ</text>

  <path class="blueLink" d="M370 400 C410 430 420 455 455 480"/>
  <text x="380" y="454" class="tiny">gebundene Eingabebytes</text>

  <g filter="url(#shadow)">
    <rect x="455" y="440" width="300" height="175" rx="24" class="kernel"/>
    <text x="605" y="478" text-anchor="middle" class="boxTitle">LEAN BITSTREAMGRAMMAR</text>
    <text x="605" y="511" text-anchor="middle" class="code">BitstreamGrammar</text>
    <text x="605" y="540" text-anchor="middle" class="boxText">decodeBits / encodeBits</text>
    <text x="605" y="569" text-anchor="middle" class="small">sound · complete · eindeutig</text>
    <text x="605" y="595" text-anchor="middle" class="tiny">kanonischer Roundtrip im Modellscope</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="825" y="440" width="250" height="175" rx="24" class="kernel"/>
    <text x="950" y="478" text-anchor="middle" class="boxTitle">KANONISCHER AST</text>
    <text x="950" y="513" text-anchor="middle" class="code">VirtualSphereAST</text>
    <text x="950" y="544" text-anchor="middle" class="boxText">wohlgeformt · eindeutig</text>
    <text x="950" y="573" text-anchor="middle" class="small">serialize(parse(bytes))</text>
    <text x="950" y="597" text-anchor="middle" class="tiny">= deklarierte Normalform</text>
  </g>

  <path class="greenLink" d="M755 528 L825 528"/>
  <path class="orangeLink" d="M690 325 C735 370 823 389 890 440"/>
  <text x="753" y="375" class="tiny">Orientierung; Kernelpfad bleibt separat</text>

  <g filter="url(#shadow)">
    <rect x="1145" y="440" width="270" height="175" rx="24" class="kernel"/>
    <text x="1280" y="478" text-anchor="middle" class="boxTitle">SEMANTISCHES MODELL</text>
    <text x="1280" y="513" text-anchor="middle" class="code">elaborateH6</text>
    <text x="1280" y="544" text-anchor="middle" class="boxText">AST → konkrete Bedeutung</text>
    <text x="1280" y="573" text-anchor="middle" class="small">total auf WellFormed AST</text>
    <text x="1280" y="597" text-anchor="middle" class="tiny">keine physische Referenzbehauptung</text>
  </g>

  <path class="greenLink" d="M1075 528 L1145 528"/>

  <g filter="url(#shadow)">
    <rect x="1480" y="420" width="235" height="330" rx="24" class="kernel"/>
    <text x="1597" y="458" text-anchor="middle" class="boxTitle">VIRTUELLER KOSMOS</text>

    <rect x="1510" y="484" width="175" height="48" rx="12" class="neutral"/>
    <text x="1597" y="514" text-anchor="middle" class="codeSmall">virtualSeed</text>
    <path class="innerLink" d="M1597 532 L1597 560"/>

    <rect x="1510" y="562" width="175" height="48" rx="12" class="neutral"/>
    <text x="1597" y="592" text-anchor="middle" class="codeSmall">StepSpec / grow</text>
    <path class="innerLink" d="M1597 610 L1597 638"/>

    <rect x="1510" y="640" width="175" height="48" rx="12" class="neutral"/>
    <text x="1597" y="670" text-anchor="middle" class="codeSmall">Reachable / Inv</text>
    <path class="innerLink" d="M1597 688 L1597 710"/>

    <text x="1597" y="727" text-anchor="middle" class="tiny">No-hole · deterministisch</text>
    <text x="1597" y="744" text-anchor="middle" class="tiny">strict growth · unbounded</text>
  </g>

  <path class="greenLink" d="M1415 528 L1480 528"/>

  <!-- Concrete certificate -->
  <g filter="url(#shadow)">
    <rect x="890" y="730" width="535" height="190" rx="50" class="certificate"/>
    <circle cx="945" cy="825" r="56" fill="none" stroke="#70efc4" stroke-width="3"/>
    <circle cx="945" cy="825" r="39" fill="none" stroke="#70efc4" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="945" cy="825" r="8" fill="#70efc4"/>
    <text x="1170" y="770" text-anchor="middle" class="boxTitle">KONKRETES VIRTUALCLOSURE-ZERTIFIKAT</text>
    <text x="1170" y="805" text-anchor="middle" class="codeSmall">VirtualClosure exactPackage exactCosmos</text>
    <text x="1170" y="835" text-anchor="middle" class="codeSmall">h6_virtualSphere_noHole_complete</text>
    <text x="1170" y="866" text-anchor="middle" class="small">keine frei gesetzten Bool-Zeugen</text>
    <text x="1170" y="892" text-anchor="middle" class="tiny">relativer Beweis · axiom-auditiert · bytegebunden</text>
  </g>

  <path class="greenLink" d="M1570 750 C1535 805 1495 824 1425 824"/>
  <path class="blueLink" d="M215 460 C238 800 570 900 890 845"/>
  <text x="380" y="902" class="tiny">Receipt bindet Ausführung und exakte Artefakte – nicht physische Wahrheit</text>

  <!-- Explicit physical block -->
  <g filter="url(#shadow)">
    <rect x="1520" y="790" width="225" height="165" rx="24" class="open"/>
    <text x="1632" y="828" text-anchor="middle" class="boxTitle">PHYSICALCLOSURE</text>
    <text x="1632" y="863" text-anchor="middle" class="code">OPEN</text>
    <text x="1632" y="895" text-anchor="middle" class="small">keine automatische Promotion</text>
    <text x="1632" y="920" text-anchor="middle" class="tiny">kein physischer Urknall</text>
    <text x="1632" y="940" text-anchor="middle" class="tiny">keine QG-Bestätigung</text>
  </g>

  <path class="redBlocked" d="M1425 835 L1482 835"/>
  <line x1="1493" y1="807" x2="1493" y2="863" stroke="#ff7186" stroke-width="8" stroke-linecap="round"/>
  <text x="1457" y="808" text-anchor="middle" class="tiny">BLOCK</text>

  <!-- Effect boundary -->
  <path class="redLink" d="M1158 920 L1158 1020"/>
  <g filter="url(#shadow)">
    <rect x="560" y="1020" width="720" height="135" rx="28" class="open"/>
    <text x="920" y="1058" text-anchor="middle" class="boxTitle">WIRKUNGSGRENZE BLEIBT GESCHLOSSEN</text>
    <text x="920" y="1093" text-anchor="middle" class="code">EFFECT_ACK_CONTINUE</text>
    <text x="920" y="1122" text-anchor="middle" class="boxText">Kernelakzeptanz ≠ externe Freigabe · ordinary release = false · remote mutation = false</text>
    <text x="920" y="1145" text-anchor="middle" class="tiny">EFFECT_ACK_DONE erfordert eine separate, scope- und digestgebundene Autorisierung.</text>
  </g>

  <!-- Legend -->
  <g transform="translate(185 1208)">
    <rect x="0" y="-18" width="22" height="22" rx="5" class="external"/>
    <text x="32" y="0" class="tiny">externe Byte-/Receipt-Evidenz</text>
    <rect x="315" y="-18" width="22" height="22" rx="5" class="human"/>
    <text x="347" y="0" class="tiny">menschliche Oberfläche, nicht allein kernelbewiesen</text>
    <rect x="745" y="-18" width="22" height="22" rx="5" class="kernel"/>
    <text x="777" y="0" class="tiny">kernelgeprüftes virtuelles Modell</text>
    <rect x="1080" y="-18" width="22" height="22" rx="5" class="open"/>
    <text x="1112" y="0" class="tiny">OPEN / Wirkung blockiert</text>
  </g>
</svg>
