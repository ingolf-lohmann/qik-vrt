openapi: 3.0.3
info:
  title: QIKVRT GitHub Dispatch Adapter API
  version: 2.4.0
  description: >
    The local adapter exposes GitHub-shaped dispatch paths but evaluates the
    request synchronously and returns a QIK-VRT EFFECT_ACK body. GitHub's real
    dispatch API remains asynchronous and returns 204, or 200 with run details
    when requested; callers must
    subsequently inspect the workflow run and its qikvrt-api-state artifact.
    Technical dispatch acceptance is never ordinary effect permission.
    The existing fixed Ruleset writer is also reachable through an explicitly
    enabled Owner-bound local REST route. It reuses the original controller,
    protected Authority credential resolver and durable dispatch journal.
    No arbitrary workflow, review, merge or credential forwarding is exposed.
servers:
  - url: http://127.0.0.1:8766
    description: Loopback-only synchronous test/development adapter
  - url: https://api.github.com
    description: GitHub asynchronous REST dispatch API
paths:
  /repos/{owner}/{repo}/qikvrt/publication:
    servers:
      - url: http://127.0.0.1:8766
        description: Original native SSO listener; source availability is not a running admitted endpoint.
    parameters:
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
    description: >
      Opt-in ingress to the existing publication-check/publication-resume launcher.
      Only the server selects the original pinned private request and protected
      credential references. No browser cookies, passwords, token values, paths,
      arbitrary provider URLs or new authorization are accepted from clients.
      The existing v2 publisher, single-use consumption refs and public byte
      readback remain authoritative. Uncertain POST results permit GET only;
      neither a new request_id nor another source pin re-invokes that candidate.
    get:
      operationId: originalPublicationCheck
      security: [{nativeSSOSession: []}]
      summary: Admit original source/references or read the existing invocation state, without credentials or effects.
      parameters:
        - {name: schema, in: query, required: true, schema: {type: string, enum: [qikvrt-publication-rest/v1]}}
        - {name: request_id, in: query, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$'}}
        - {name: expected_main_sha, in: query, schema: {type: string, pattern: '^[a-f0-9]{40}$'}, description: Supply both source and request pins or omit both.}
        - {name: request_sha256, in: query, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200': {description: Source/reference admission or original attempt state; no credential delivery or publication acceptance.}
        '404': {description: Publication REST disabled.}
        '409': {description: Original SSO, pinned private request, source or checker unavailable.}
        '429': {description: Existing local rate limit; no retry.}
    post:
      operationId: originalPublicationResumeOnce
      security: [{nativeSSOSession: []}]
      summary: Invoke the original exact-authorized publisher once under durable native intent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema, request_id, expected_main_sha, request_sha256, effect_accepted]
              properties:
                schema: {type: string, enum: [qikvrt-publication-rest/v1]}
                request_id: {type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$'}
                expected_main_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
                request_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                effect_accepted: {type: boolean, enum: [true]}
      responses:
        '200': {description: Original publisher result or prior-attempt NOOP; independent public readback and durable receipts remain required.}
        '404': {description: Publication REST disabled.}
        '409': {description: Source/request drift, failed admission or uncertain original invocation; use GET only.}
        '429': {description: Existing local rate limit; no retry.}
  /repos/{owner}/{repo}/qikvrt/static-delivery:
    servers:
      - url: http://127.0.0.1:8766
        description: Existing admitted QIK-VRT REST server; source availability is not deployment.
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string, enum: [ingolf-lohmann] } }
      - { name: repo, in: path, required: true, schema: { type: string, enum: [qik-vrt] } }
    get:
      operationId: staticDeliveryReadback
      summary: Read the existing VPS file, reconcile its original upload, or check both exact public HTTPS URLs.
      description: >
        Disabled unless QIKVRT_STATIC_DELIVERY_ENABLED=1. Reuses the existing
        expiring REST credential and bound natural Owner. No upload, retry,
        provider key forwarding, GraphQL call or global EFFECT_ACK_DONE.
        reconcile retains the original request_id and S1 intent. Public checks
        require actual matching page bytes on both exact HTTPS URLs.
      security: [{ bearerToken: [] }]
      parameters:
        - { name: schema, in: query, required: true, schema: { type: string, enum: [qikvrt-static-delivery-rest/v1] } }
        - { name: mode, in: query, required: true, schema: { type: string, enum: [readback, reconcile, public-readback] } }
        - { name: request_id, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' } }
        - { name: expected_implementation_sha256, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: binding_sha256, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: static_file_sha256, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        '200': { description: Bound original-controller readback; scope is file bytes or public HTTPS bytes only. }
        '400': { description: Invalid or duplicate readback parameters. }
        '401': { description: Missing or expired REST credential. }
        '403': { description: Foreign repository or unbound Owner. }
        '404': { description: Static REST disabled. }
        '409': { description: Binding mismatch or unverified public/previous effect. }
        '429': { description: Rate limited; no automatic retry. }
        '503': { description: Protected original binding or current implementation unavailable. }
    post:
      operationId: staticDeliveryUpload
      summary: Invoke one original S1 static upload and separate byte readback.
      description: >
        The existing server-side S1 provider resolves protected binding, source
        file and receipt directory from explicit operator configuration. Clients
        supply only reviewed digests, fresh predecessor hash and stable request
        identity. No client paths, keys, arbitrary payload, shell or provider
        origin are accepted. Original S1 backup/intent fencing prevents replay
        after an uncertain upload; continue with GET reconcile, never POST retry.
        No DNS, hosting-control, certificate, native admission or GitHub lifecycle
        change is performed. GraphQL is untouched and not invoked.
      security: [{ bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema, mode, request_id, expected_implementation_sha256, binding_sha256, static_file_sha256, expected_static_sha256, effect_accepted]
              properties:
                schema: { type: string, enum: [qikvrt-static-delivery-rest/v1] }
                mode: { type: string, enum: [upload] }
                request_id: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' }
                expected_implementation_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                binding_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                static_file_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                expected_static_sha256: { type: string, pattern: '^(ABSENT|[0-9a-f]{64})$' }
                effect_accepted: { type: boolean, enum: [true] }
      responses:
        '200': { description: Independent file-byte readback verified; no public delivery inference. }
        '400': { description: Duplicate security headers. }
        '401': { description: Missing or expired REST credential. }
        '403': { description: Foreign repository or unbound Owner. }
        '404': { description: Static REST disabled. }
        '409': { description: Request, predecessor or immutable intent refused; GET reconcile original request. }
        '429': { description: Rate limited; no automatic retry. }
        '503': { description: Result/binding unavailable; GET readback before another effect. }
  /repos/{owner}/{repo}/qikvrt/production-environment:
    description: >
      Opt-in native Authority route on the existing local adapter only, not an
      endpoint provided by api.github.com or the managed ChatGPT connector.
      Uses the original registered OIDC session and OS Secret Service writer
      lock. Only ingolf-lohmann/qik-vrt and its existing qikvrt-production
      environment are admitted. The caller cannot supply secrets, a provider
      credential, another environment, a URL, a workflow or new permissions.
    parameters:
      - $ref: '#/components/parameters/Owner'
      - $ref: '#/components/parameters/Repo'
    get:
      operationId: productionEnvironmentReadback
      security: [{nativeSSOSession: []}]
      summary: Read GitHub binding metadata independently of local production material
      description: >
        After the existing SSO and GitHub Owner/admin checks, observe current
        Main and all five remote binding metadata records before attempting
        local material validation. Missing or invalid local production values
        permit a read-only response with protected_material_available=false,
        binding_sha256=null and variable value_matches=null. This response
        cannot prepare an upload. The native process may explicitly select
        independently pinned original private files instead of process values;
        the caller cannot supply source paths or source pins. Source provisioning
        and actual job delivery remain separately unverified.
      parameters:
        - {name: schema, in: query, required: true, schema: {type: string, enum: [qikvrt-production-environment-rest/v1]}}
        - {name: request_id, in: query, required: true, schema: {type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$'}}
        - {name: expected_main_sha, in: query, schema: {type: string, pattern: '^[a-f0-9]{40}$'}, description: Supply both source and binding pins or omit both for a read-only preparation.}
        - {name: binding_sha256, in: query, schema: {type: string, pattern: '^[a-f0-9]{64}$'}}
      responses:
        '200':
          description: Non-secret Main HEAD/TREE and binding presence; variable equality is null without verified original material. Secret values, job delivery and host identity remain unverified.
        '404': {description: Opt-in route disabled}
        '409': {description: Existing SSO, source or original provider credential/operation unavailable}
        '429': {description: Local request budget exceeded; no provider retry}
    post:
      operationId: productionEnvironmentRestore
      security: [{nativeSSOSession: []}]
      summary: Restore only the existing five exact bindings with encrypted secret uploads
      description: >
        Requires the exact same-origin Origin header and the existing SSO bearer.
        The adapter independently rechecks actual GitHub Owner/admin identity,
        current Main, the existing environment and unchanged native protections.
        Every write is preceded by protected durable intent. Unknown results
        permit GET-only recovery, never another PUT. HTTP acknowledgement and
        metadata readback do not prove job credential delivery, /v1.45/info
        identity, restart, toggle activation or product delivery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema, request_id, expected_main_sha, binding_sha256, effect_accepted]
              properties:
                schema: {type: string, enum: [qikvrt-production-environment-rest/v1]}
                request_id: {type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$'}
                expected_main_sha: {type: string, pattern: '^[a-f0-9]{40}$'}
                binding_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                effect_accepted: {type: boolean, enum: [true]}
      responses:
        '200': {description: Scoped HTTP acknowledgements and independent metadata readback or journal-preserving NOOP; effect_ack_done remains false}
        '404': {description: Opt-in route disabled}
        '409': {description: HOLD; keep the original protected journal and use GET-only readback}
        '429': {description: Local request budget exceeded; no provider retry}
  /repos/{owner}/{repo}/qikvrt/continuation:
    servers:
      - url: http://127.0.0.1:8766
        description: Existing protected QIK-VRT service; deployment requires separate readback.
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string, enum: [ingolf-lohmann] } }
      - { name: repo, in: path, required: true, schema: { type: string, enum: [qik-vrt] } }
    get:
      operationId: meshContinuationPlanAndReadback
      summary: Read exact PR, review, original CI jobs and adaptive continuation graph.
      description: >
        Requires QIKVRT_CONTINUATION_ENABLED=1, the original expiring caller token,
        Owner binding and separate protected Authority credential. Reads only.
        Original successful CI/CD/CO jobs may rank independent siblings; every
        gate and the GraphQL fallback remain in the graph. Missing, foreign,
        failed or incomplete evidence cannot grant mutation or product acceptance.
      security: [{ bearerToken: [] }]
      parameters:
        - { name: request_id, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' } }
        - { name: pull_request, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: expected_main_sha, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{40}$' } }
        - { name: expected_head, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{40}$' } }
        - { name: expected_tree, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{40}$' } }
        - { name: ci_run_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Fresh plan or narrow readiness readback; no merge or deployment. }
        '409': { description: Source, review or original CI evidence rejected. }
        '503': { description: Protected binding or provider observation unavailable. }
    post:
      operationId: meshContinuationReady
      summary: Execute the fixed admitted GraphQL readiness fallback once.
      description: >
        Uses exactly markPullRequestReadyForReview with variables, the existing
        protected credential resolver and original durable attempt journal.
        Requires current exact source, successful complete CI and actual Owner
        review, then fresh admission under the existing lock. A separate REST
        GET verifies readiness after GraphQL. Unknown effects retain their
        journal and cannot be replayed by a changed request ID or HEAD. The
        GraphQL mutation itself has no atomic expected-head argument; drift
        detected after it keeps acceptance unknown. Merge remains a separate
        expected-head-bound REST operation. No arbitrary query, URL or code is
        accepted. Source presence is not live activation.
      security: [{ bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema, request_id, pull_request, expected_main_sha, expected_head, expected_tree, ci_run_id, effect_accepted]
              properties:
                schema: { type: string, enum: [qikvrt-continuation-rest/v1] }
                request_id: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' }
                pull_request: { type: integer, minimum: 1 }
                expected_main_sha: { type: string, pattern: '^[0-9a-f]{40}$' }
                expected_head: { type: string, pattern: '^[0-9a-f]{40}$' }
                expected_tree: { type: string, pattern: '^[0-9a-f]{40}$' }
                ci_run_id: { type: integer, minimum: 1 }
                effect_accepted: { type: boolean, enum: [true] }
      responses:
        '200': { description: Independent exact readiness readback verified. }
        '202': { description: Unresolved attempt retained; read back without another mutation. }
        '409': { description: Exact admission rejected before a new mutation. }
        '503': { description: Protected binding or original provider unavailable. }
  /repos/{owner}/{repo}/qikvrt/ruleset-authority:
    servers:
      - url: http://127.0.0.1:8766
        description: Existing QIK-VRT REST service; deployment/admission must be independently verified.
    parameters:
      - { name: owner, in: path, required: true, schema: { type: string, enum: [ingolf-lohmann] } }
      - { name: repo, in: path, required: true, schema: { type: string, enum: [qik-vrt] } }
    post:
      operationId: meshRulesetAuthorityDispatch
      summary: Invoke the existing exact-Main Ruleset writer through admitted Mesh REST.
      description: >
        Disabled unless QIKVRT_RULESET_AUTHORITY_ENABLED=1. Requires the existing
        expiring REST bearer, exact Authority repository and configured natural
        Owner login. A separately protected existing Authority credential is
        resolved on the server; the caller token and generic GITHUB_TOKEN are
        never used as provider credentials. The original controller verifies
        immutable Main/writer bytes and the current run inventory, persists
        intent before its single GitHub POST and retains HTTP200 run identity or
        legacy empty HTTP204 acceptance. Pending/ambiguous attempts cannot be
        replayed by changing request ID, Main or writer version. This route
        belongs to QIK-VRT, not api.github.com; deployment is a separate effect.
      security: [{ bearerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schema, request_id, expected_main_sha, writer_version, effect_accepted]
              properties:
                schema: { type: string, enum: [qikvrt-ruleset-authority-rest/v1] }
                request_id: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' }
                expected_main_sha: { type: string, pattern: '^[0-9a-f]{40}$' }
                writer_version: { type: string, enum: [legacy-v1, lifecycle-v2, app-renewal-v3, principal-review-v4] }
                effect_accepted: { type: boolean, enum: [true] }
      responses:
        '202': { description: Original dispatch retained; inspect handler_result. Execution, protection, merge and delivery remain unverified. }
        '400': { description: Invalid exact subject, writer or literal scoped acceptance. }
        '401': { description: Missing or expired REST credential; MCP-read credentials confer no authority. }
        '403': { description: Foreign repository or unbound Owner principal. }
        '404': { description: Server-side Ruleset REST admission disabled. }
        '409': { description: Original controller blocked or unresolved dispatch; use readback, never repeat POST. }
        '429': { description: Existing rate limit; no automatic retry. }
        '503': { description: Protected Authority binding or trusted implementation unavailable. }
    get:
      operationId: meshRulesetAuthorityReadback
      summary: GET-only recovery and independent original Ruleset postcondition readback.
      description: >
        Uses the same authenticated Owner admission. Supply the independently
        identified original run ID, or omit it to recover the saved run ID from
        the exact original request's existing private journal. A request/source
        mismatch fails closed. If the original provider outcome contains no run
        ID, the response retains the original intent and remains unresolved;
        it never dispatches again. Original run/event/ref/head/jobs, canonical
        Ruleset digest and protected Main are independently read before an
        effect is reported. No journal rewrite, native review, merge or global
        EFFECT_ACK_DONE follows from this scoped postcondition.
      security: [{ bearerToken: [] }]
      parameters:
        - { name: request_id, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' } }
        - { name: expected_main_sha, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{40}$' } }
        - { name: writer_version, in: query, required: true, schema: { type: string, enum: [legacy-v1, lifecycle-v2, app-renewal-v3, principal-review-v4] } }
        - { name: run_id, in: query, required: false, schema: { type: string, pattern: '^[1-9][0-9]{0,31}$' } }
      responses:
        '200': { description: Scoped Ruleset postcondition verified; mutation attribution, native review, merge and release remain separate. }
        '202': { description: Readback remains unverified or original run ID unresolved; no POST performed. }
        '400': { description: Duplicate/invalid parameters or original request/source mismatch. }
        '401': { description: Missing or expired REST credential. }
        '403': { description: Foreign repository or principal. }
        '404': { description: Route disabled or exact original attempt unavailable. }
        '409': { description: Original source/run readback rejected. }
        '429': { description: Rate limited. }
        '503': { description: Protected original Authority binding unavailable. }
  /mcp:
    servers:
      - url: http://127.0.0.1:8766
    post:
      operationId: optionalMcpFacade
      summary: Optional authenticated MCP facade over the existing local handler.
      description: >
        Enabled only by QIKVRT_MCP_ENABLED=1. One transport reuses the three
        evidence tools from PR 509 and two data tools from PR 511.
        QIKVRT_MCP_TOKEN is an expiring evidence-read credential, distinct from
        QIKVRT_API_TOKEN and attestation/GitHub keys. Its exact repository and
        QIKVRT_MCP_PRINCIPAL are bound separately from QIKVRT_API_PRINCIPAL.
        QIKVRT_MCP_READ_SCOPES permits repository:read, capability:read,
        effect_ack:read and optionally artifact:read. QIKVRT_MCP_DATA_SCOPES
        permits ingest and readback for the REST credential. Each credential
        sees only its own catalog. Legacy QIKVRT_MCP_SCOPES remains supported
        without transferring permissions between credential domains.
        Supports 2025-11-25 initialize and 2026-07-28 per-request metadata;
        the evidence tools retain 2025-03-26 and 2025-06-18 compatibility.
        Data operations require exact REST 2.3.0 and the independently
        obtained implementation digest. Writes require literal scoped
        acceptance and preserve replay/transaction/responsibility validation.
        Original-byte readback requires its explicit read grant and validates
        the authenticated principal. A nested opaque-storage DONE does not
        establish Claude connection, production delivery or ordinary release.
        No GitHub dispatch, review, merge, Ruleset or release is exposed.
        This path belongs to the local QIK-VRT service, not api.github.com.
      security:
        - mcpReadBearer: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ['2.0'] }
                id: { oneOf: [{ type: integer }, { type: string }] }
                method: { type: string }
                params: { type: object }
      responses:
        '200': { description: JSON-RPC result or error. Inspect isError and the bounded handler result; no global product release. }
        '202': { description: Accepted legacy initialized notification, empty body. }
        '400': { description: Invalid request, version, header, source digest or explicit effect acceptance. }
        '401': { description: Missing, invalid or expired bearer credential. }
        '403': { description: Missing tool permission or rejected Origin/Host. }
        '404': { description: MCP disabled or modern RPC method unavailable. }
        '429': { description: Rate limit exceeded. }
        '503': { description: Invalid service configuration. }
  /repos/{owner}/{repo}/qikvrt/artifacts/{artifact_id}/readback:
    servers:
      - url: http://127.0.0.1:8766
    get:
      operationId: committedArtifactByteReadback
      summary: Independent authenticated original-byte readback without store or audit mutation.
      description: >
        Requires enabled MCP and data readback permission, or an independent
        evidence-read credential with explicit artifact:read permission.
        Validates repository,
        principal, payload, sidecar, provenance, committed transaction,
        receipt and responsibility protocol under the shared writer lock.
        Missing or mismatched proof fails closed.
      security:
        - mcpReadBearer: []
        - bearerToken: []
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: artifact_id, in: path, required: true, schema: { type: string } }
        - { name: request_id, in: query, required: true, schema: { type: string } }
        - { name: expected_sha256, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: api_contract_version, in: query, required: true, schema: { type: string, enum: ['2.3.0'] } }
        - { name: expected_implementation_sha256, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        '200':
          description: Original bytes. Client must independently recompute SHA-256.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Missing, invalid or expired bearer credential. }
        '403': { description: Missing readback permission or rejected Origin/Host. }
        '409': { description: Exact bindings, committed provenance or bytes unavailable. }
        '429': { description: Rate limit exceeded. }
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Adapter process is alive and its security configuration is valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Process responds, but the security configuration is invalid; no request should be dispatched.
  /repos/{owner}/{repo}/actions/workflows/qikvrt_mesh_api.yml/dispatches:
    post:
      operationId: workflowDispatch
      summary: GitHub-shaped workflow_dispatch endpoint.
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ref, inputs]
              properties:
                ref: { type: string, minLength: 1, maxLength: 255 }
                inputs: { $ref: '#/components/schemas/DispatchInputs' }
                return_run_details: { type: boolean, default: false, description: GitHub may return an asynchronous run receipt. The local adapter still returns its synchronous 202 EFFECT_ACK evaluation. }
      responses:
        '200':
          description: GitHub accepted an asynchronous dispatch and returned run details; execution and effect require independent readback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchRunDetails' }
        '202': { description: Local evaluation reached DONE or CONTINUE; inspect effect_state. }
        '204': { description: GitHub accepted the asynchronous dispatch; no effect result is implied. }
        '400': { description: Invalid request shape, value, or adapter configuration. }
        '401': { description: Missing, invalid, or expired bearer credential. }
        '409': { description: Protective EFFECT_ACK_BLOCK. }
        '422': { description: EFFECT_NACK or malformed request. }
        '423': { description: EFFECT_ACK_ISOLATE due to integrity or replay conflict. }
        '429': { description: Rate limit exceeded. }
        '500': { description: Internal adapter failure; no effect permission is implied. }
  /repos/{owner}/{repo}/actions/workflows/qikvrt_goldkelch_ruleset_authority_effect.yml/dispatches:
    servers:
      - url: https://api.github.com
    post:
      operationId: rulesetAuthorityDispatch
      summary: Dispatch only the existing reviewed Ruleset writer on Main.
      description: >
        The client requires explicit effect acceptance, a freshly observed Main
        SHA, an explicitly selected pinned writer version with byte-recomputed
        Git blob identity and a complete bounded run inventory. Omission retains
        the legacy-v1 contract; there is no automatic fallback between versions.
        Version selection is local client metadata, never a workflow input. It
        issues at most one POST and never retries an ambiguous response. The
        request identifier is local correlation metadata, not GitHub idempotency.
        Subsequent GET-only ruleset_authority_readback verifies the run and jobs,
        canonical Ruleset digest and protected Main independently. A verified
        Ruleset postcondition grants neither a native review nor merge or release.
      x-qikvrt-writer-versions:
        default: legacy-v1
        legacy-v1:
          workflow_blob_sha: 1202d24c2f23eb8fa52ab7c562a583e79f9e8444
          ruleset_post_sha256: 45da27f3608b38f04b8252d7fc709a6337bff49d40fa2cf9baa4425dd36ec0dd
        lifecycle-v2:
          workflow_blob_sha: ab47a8ec98c39b39bda420050cb7c970a9da6165
          ruleset_post_sha256: 45da27f3608b38f04b8252d7fc709a6337bff49d40fa2cf9baa4425dd36ec0dd
        app-renewal-v3:
          workflow_blob_sha: 05066f6fb83a7f3ba8799677db35647e06942fd2
          ruleset_post_sha256: 45da27f3608b38f04b8252d7fc709a6337bff49d40fa2cf9baa4425dd36ec0dd
        principal-review-v4:
          workflow_blob_sha: 3b9396f4b6415baff047526bd6ecb193f606863e
          ruleset_post_sha256: 59b80123aee14fd0f82a0af8a7e3265a2a5782f786785cf09be35f251b9c6999
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string, enum: [ingolf-lohmann] }
        - name: repo
          in: path
          required: true
          schema: { type: string, enum: [qik-vrt] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ref]
              properties:
                ref: { type: string, enum: [main] }
            example: { ref: main }
      responses:
        '200': { description: Original workflow_run_id, run_url and html_url; transport acceptance only, independently verify the exact run and Ruleset effect. }
        '204': { description: Legacy empty transport acceptance only; independently read the actual run and Ruleset effect. }
        '401': { description: Authentication denied; no retry or credential echo. }
        '403': { description: Actions-write permission or workflow admission denied; no bypass or automatic retry. }
        '404': { description: Repository or fixed workflow unavailable to the authenticated principal. }
        '422': { description: Dispatch rejected; reobserve the trusted Main writer and authorization. }
        '429': { description: Rate limited; no automatic repeat. }
        '500': { description: Outcome may be ambiguous; authoritative readback required before another dispatch. }
  /repos/{owner}/{repo}/actions/secrets/{secret_name}:
    servers:
      - url: https://api.github.com
    get:
      operationId: firefoxAmoSecretMetadata
      summary: Read only the two existing AMO repository-secret metadata records.
      description: >
        The existing client's firefox_amo_access operation copies only name,
        created_at and updated_at. A denial remains NOT_INSPECTED; metadata
        does not establish secret delivery to a job or AMO authentication.
        No secret value, secret write, environment change or local proxy is exposed.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string, enum: [ingolf-lohmann] } }
        - { name: repo, in: path, required: true, schema: { type: string, enum: [qik-vrt] } }
        - name: secret_name
          in: path
          required: true
          schema: { type: string, enum: [AMO_JWT_ISSUER, AMO_JWT_SECRET] }
      responses:
        '200': { description: Repository-scoped metadata only; no job delivery or authentication proof. }
        '401': { description: Authentication unavailable; configuration remains uninspected. }
        '403': { description: Metadata permission unavailable; no absence inference. }
        '404': { description: Metadata not established by this request; no global secret-absence inference. }
  /repos/{owner}/{repo}/actions/workflows/qikvrt_ci.yml/dispatches:
    servers:
      - url: https://api.github.com
    post:
      operationId: firefoxAmoOwnerDispatch
      summary: Dispatch the existing exact-source PR523 signing consumer through its direct Owner path.
      description: >
        The existing client's firefox_amo_dispatch operation requires explicit
        effect acceptance, independently supplied current HEAD/TREE/workflow-blob
        pins, the existing authorized six-component package digest and fresh PR
        admission under its existing durable journal lock. It never changes
        Main, native reviews, branch protection or Firefox signing policy.
        An unresolved intent cannot be replayed using a changed request ID,
        ref or unrelated source commit. The native consumer separately enforces
        the direct Owner actor, current source and original signing journal.
        This GitHub-only contract does not activate a ChatGPT connector operation
        or establish a delivered credential, admitted native run or signed XPI.
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string, enum: [ingolf-lohmann] } }
        - { name: repo, in: path, required: true, schema: { type: string, enum: [qik-vrt] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ref, return_run_details, inputs]
              properties:
                ref: { type: string, minLength: 1, maxLength: 255 }
                return_run_details: { type: boolean, enum: [true] }
                inputs:
                  type: object
                  additionalProperties: false
                  required: [amo_sign_unlisted, amo_expected_head, amo_expected_tree, amo_previous_run_id, amo_executor_run_id, amo_readback_only]
                  properties:
                    amo_sign_unlisted: { type: boolean, enum: [true] }
                    amo_expected_head: { type: string, pattern: '^[0-9a-f]{40}$' }
                    amo_expected_tree: { type: string, pattern: '^[0-9a-f]{40}$' }
                    amo_previous_run_id: { type: string, pattern: '^(0|[1-9][0-9]{0,19})$' }
                    amo_executor_run_id: { type: string, enum: ['0'] }
                    amo_readback_only: { type: boolean, enum: [false] }
      responses:
        '200': { description: Bound native run ID and URLs; transport acceptance only. }
        '204': { description: Legacy empty transport acceptance; read original native state before continuation. }
        '401': { description: Authentication denied; no credential echo or unchanged retry. }
        '403': { description: Actions-write/admission denied; preserve the original attempt. }
        '422': { description: Invalid source or workflow admission; repair and reobserve. }
        '500': { description: Outcome may be ambiguous; read original native state, never blindly replay. }
  /repos/{owner}/{repo}/dispatches:
    post:
      operationId: repositoryDispatch
      summary: GitHub-shaped repository_dispatch endpoint.
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_type, client_payload]
              properties:
                event_type: { type: string, enum: [qikvrt_mesh_api] }
                client_payload: { $ref: '#/components/schemas/DispatchInputs' }
      responses:
        '202': { description: Local evaluation reached DONE or CONTINUE; inspect effect_state. }
        '204': { description: GitHub accepted the asynchronous dispatch; no effect result is implied. }
        '400': { description: Invalid request shape, value, or adapter configuration. }
        '401': { description: Missing, invalid, or expired bearer credential. }
        '409': { description: Protective EFFECT_ACK_BLOCK. }
        '422': { description: EFFECT_NACK or malformed request. }
        '423': { description: EFFECT_ACK_ISOLATE due to integrity or replay conflict. }
        '429': { description: Rate limit exceeded. }
        '500': { description: Internal adapter failure; no effect permission is implied. }
components:
  parameters:
    Owner:
      name: owner
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$' }
    Repo:
      name: repo
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$' }
  schemas:
    DispatchRunDetails:
      type: object
      required: [workflow_run_id, run_url, html_url]
      properties:
        workflow_run_id: { type: integer, minimum: 1 }
        run_url: { type: string, format: uri }
        html_url: { type: string, format: uri }
    Health:
      type: object
      additionalProperties: false
      required: [status, service, tcpip, github_compatible_dispatch, configuration_valid, authentication_configured, remote_attestation_configured]
      properties:
        status: { type: string, enum: [ALIVE, BLOCK] }
        service: { type: string }
        tcpip: { type: boolean }
        github_compatible_dispatch: { type: boolean }
        configuration_valid: { type: boolean }
        authentication_configured: { type: boolean }
        remote_attestation_configured: { type: boolean }
    DispatchInputs:
      type: object
      additionalProperties: false
      required: [operation, artifact_id, dry_run, request_id, effect_accepted]
      properties:
        operation: { type: string, enum: [ingest, verify, stage, release_status] }
        artifact_id: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' }
        payload_b64: { type: string }
        expected_sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        dry_run: { oneOf: [{ type: boolean }, { type: string, enum: ['true', 'false'] }] }
        request_id: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' }
        effect_accepted: { oneOf: [{ type: boolean }, { type: string, enum: ['true', 'false'] }] }
        responsibility_owner: { type: string, minLength: 1, maxLength: 256 }
        state_run_id: { type: string, pattern: '^[0-9]{1,32}$' }
        remote_evidence_b64: { type: string, description: HMAC-authenticated qikvrt_remote_release_attestation_v1 JSON encoded as base64. }
  securitySchemes:
    nativeSSOSession:
      type: http
      scheme: bearer
      description: >
        Local session bearer issued by the original validated OIDC callback;
        renewed and revoked through the original protected profile. No browser
        session or managed-connector token is imported or forwarded to GitHub.
    mcpReadBearer:
      type: http
      scheme: bearer
      description: Separate expiring QIKVRT_MCP_TOKEN with explicit evidence read scopes and principal; no ingest or REST dispatch authority.
    bearerToken:
      type: http
      scheme: bearer
      description: Explicitly configured scoped credential with server-side expiry; canonical b64url prefix, unpadded payload, and 32--128 decoded bytes are required by the local adapter.
security:
  - bearerToken: []
