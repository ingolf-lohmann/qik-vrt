openapi: 3.0.3
info:
  title: QIKVRT GitHub Dispatch Adapter API
  version: 2.3.0
  description: >
    The local adapter exposes GitHub-shaped dispatch paths but evaluates the
    request synchronously and returns a QIK-VRT EFFECT_ACK body. GitHub's real
    dispatch API remains asynchronous and returns 204, or 200 with run details
    when requested; callers must
    subsequently inspect the workflow run and its qikvrt-api-state artifact.
    Technical dispatch acceptance is never ordinary effect permission.
    The fixed Ruleset-writer dispatch is GitHub-only; the local adapter retains
    its existing Mesh routes and cannot execute repository-administration effects.
servers:
  - url: http://127.0.0.1:8766
    description: Loopback-only synchronous test/development adapter
  - url: https://api.github.com
    description: GitHub asynchronous REST dispatch API
paths:
  /mcp:
    servers:
      - url: http://127.0.0.1:8766
    post:
      operationId: optionalMcpFacade
      summary: Optional authenticated MCP facade over the existing local handler.
      description: >
        Enabled only by QIKVRT_MCP_ENABLED=1. One transport reuses the three
        evidence tools from PR 509 and two data tools from PR 511.
        QIKVRT_MCP_TOKEN is an expiring evidence-read credential, distinct from
        QIKVRT_API_TOKEN and attestation/GitHub keys. Its exact repository and
        QIKVRT_MCP_PRINCIPAL are bound separately from QIKVRT_API_PRINCIPAL.
        QIKVRT_MCP_READ_SCOPES permits repository:read, capability:read,
        effect_ack:read and optionally artifact:read. QIKVRT_MCP_DATA_SCOPES
        permits ingest and readback for the REST credential. Each credential
        sees only its own catalog. Legacy QIKVRT_MCP_SCOPES remains supported
        without transferring permissions between credential domains.
        Supports 2025-11-25 initialize and 2026-07-28 per-request metadata;
        the evidence tools retain 2025-03-26 and 2025-06-18 compatibility.
        Data operations require exact REST 2.3.0 and the independently
        obtained implementation digest. Writes require literal scoped
        acceptance and preserve replay/transaction/responsibility validation.
        Original-byte readback requires its explicit read grant and validates
        the authenticated principal. A nested opaque-storage DONE does not
        establish Claude connection, production delivery or ordinary release.
        No GitHub dispatch, review, merge, Ruleset or release is exposed.
        This path belongs to the local QIK-VRT service, not api.github.com.
      security:
        - mcpReadBearer: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, enum: ['2.0'] }
                id: { oneOf: [{ type: integer }, { type: string }] }
                method: { type: string }
                params: { type: object }
      responses:
        '200': { description: JSON-RPC result or error. Inspect isError and the bounded handler result; no global product release. }
        '202': { description: Accepted legacy initialized notification, empty body. }
        '400': { description: Invalid request, version, header, source digest or explicit effect acceptance. }
        '401': { description: Missing, invalid or expired bearer credential. }
        '403': { description: Missing tool permission or rejected Origin/Host. }
        '404': { description: MCP disabled or modern RPC method unavailable. }
        '429': { description: Rate limit exceeded. }
        '503': { description: Invalid service configuration. }
  /repos/{owner}/{repo}/qikvrt/artifacts/{artifact_id}/readback:
    servers:
      - url: http://127.0.0.1:8766
    get:
      operationId: committedArtifactByteReadback
      summary: Independent authenticated original-byte readback without store or audit mutation.
      description: >
        Requires enabled MCP and data readback permission, or an independent
        evidence-read credential with explicit artifact:read permission.
        Validates repository,
        principal, payload, sidecar, provenance, committed transaction,
        receipt and responsibility protocol under the shared writer lock.
        Missing or mismatched proof fails closed.
      security:
        - mcpReadBearer: []
        - bearerToken: []
      parameters:
        - { name: owner, in: path, required: true, schema: { type: string } }
        - { name: repo, in: path, required: true, schema: { type: string } }
        - { name: artifact_id, in: path, required: true, schema: { type: string } }
        - { name: request_id, in: query, required: true, schema: { type: string } }
        - { name: expected_sha256, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
        - { name: api_contract_version, in: query, required: true, schema: { type: string, enum: ['2.3.0'] } }
        - { name: expected_implementation_sha256, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      responses:
        '200':
          description: Original bytes. Client must independently recompute SHA-256.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Missing, invalid or expired bearer credential. }
        '403': { description: Missing readback permission or rejected Origin/Host. }
        '409': { description: Exact bindings, committed provenance or bytes unavailable. }
        '429': { description: Rate limit exceeded. }
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Adapter process is alive and its security configuration is valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Process responds, but the security configuration is invalid; no request should be dispatched.
  /repos/{owner}/{repo}/actions/workflows/qikvrt_mesh_api.yml/dispatches:
    post:
      operationId: workflowDispatch
      summary: GitHub-shaped workflow_dispatch endpoint.
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ref, inputs]
              properties:
                ref: { type: string, minLength: 1, maxLength: 255 }
                inputs: { $ref: '#/components/schemas/DispatchInputs' }
                return_run_details: { type: boolean, default: false, description: GitHub may return an asynchronous run receipt. The local adapter still returns its synchronous 202 EFFECT_ACK evaluation. }
      responses:
        '200':
          description: GitHub accepted an asynchronous dispatch and returned run details; execution and effect require independent readback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispatchRunDetails' }
        '202': { description: Local evaluation reached DONE or CONTINUE; inspect effect_state. }
        '204': { description: GitHub accepted the asynchronous dispatch; no effect result is implied. }
        '400': { description: Invalid request shape, value, or adapter configuration. }
        '401': { description: Missing, invalid, or expired bearer credential. }
        '409': { description: Protective EFFECT_ACK_BLOCK. }
        '422': { description: EFFECT_NACK or malformed request. }
        '423': { description: EFFECT_ACK_ISOLATE due to integrity or replay conflict. }
        '429': { description: Rate limit exceeded. }
        '500': { description: Internal adapter failure; no effect permission is implied. }
  /repos/{owner}/{repo}/actions/workflows/qikvrt_goldkelch_ruleset_authority_effect.yml/dispatches:
    servers:
      - url: https://api.github.com
    post:
      operationId: rulesetAuthorityDispatch
      summary: Dispatch only the existing reviewed Ruleset writer on Main.
      description: >
        The client requires explicit effect acceptance, a freshly observed Main
        SHA, an explicitly selected pinned writer version with byte-recomputed
        Git blob identity and a complete bounded run inventory. Omission retains
        the legacy-v1 contract; there is no automatic fallback between versions.
        Version selection is local client metadata, never a workflow input. It
        issues at most one POST and never retries an ambiguous response. The
        request identifier is local correlation metadata, not GitHub idempotency.
        Subsequent GET-only ruleset_authority_readback verifies the run and jobs,
        canonical Ruleset digest and protected Main independently. A verified
        Ruleset postcondition grants neither a native review nor merge or release.
      x-qikvrt-writer-versions:
        default: legacy-v1
        legacy-v1:
          workflow_blob_sha: 1202d24c2f23eb8fa52ab7c562a583e79f9e8444
          ruleset_post_sha256: 45da27f3608b38f04b8252d7fc709a6337bff49d40fa2cf9baa4425dd36ec0dd
        lifecycle-v2:
          workflow_blob_sha: ab47a8ec98c39b39bda420050cb7c970a9da6165
          ruleset_post_sha256: 45da27f3608b38f04b8252d7fc709a6337bff49d40fa2cf9baa4425dd36ec0dd
      parameters:
        - name: owner
          in: path
          required: true
          schema: { type: string, enum: [ingolf-lohmann] }
        - name: repo
          in: path
          required: true
          schema: { type: string, enum: [qik-vrt] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ref]
              properties:
                ref: { type: string, enum: [main] }
            example: { ref: main }
      responses:
        '204': { description: Empty transport acceptance only; independently read the actual run and Ruleset effect. }
        '401': { description: Authentication denied; no retry or credential echo. }
        '403': { description: Actions-write permission or workflow admission denied; no bypass or automatic retry. }
        '404': { description: Repository or fixed workflow unavailable to the authenticated principal. }
        '422': { description: Dispatch rejected; reobserve the trusted Main writer and authorization. }
        '429': { description: Rate limited; no automatic repeat. }
        '500': { description: Outcome may be ambiguous; authoritative readback required before another dispatch. }
  /repos/{owner}/{repo}/dispatches:
    post:
      operationId: repositoryDispatch
      summary: GitHub-shaped repository_dispatch endpoint.
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_type, client_payload]
              properties:
                event_type: { type: string, enum: [qikvrt_mesh_api] }
                client_payload: { $ref: '#/components/schemas/DispatchInputs' }
      responses:
        '202': { description: Local evaluation reached DONE or CONTINUE; inspect effect_state. }
        '204': { description: GitHub accepted the asynchronous dispatch; no effect result is implied. }
        '400': { description: Invalid request shape, value, or adapter configuration. }
        '401': { description: Missing, invalid, or expired bearer credential. }
        '409': { description: Protective EFFECT_ACK_BLOCK. }
        '422': { description: EFFECT_NACK or malformed request. }
        '423': { description: EFFECT_ACK_ISOLATE due to integrity or replay conflict. }
        '429': { description: Rate limit exceeded. }
        '500': { description: Internal adapter failure; no effect permission is implied. }
components:
  parameters:
    Owner:
      name: owner
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$' }
    Repo:
      name: repo
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_.-]{1,100}$' }
  schemas:
    DispatchRunDetails:
      type: object
      required: [workflow_run_id, run_url, html_url]
      properties:
        workflow_run_id: { type: integer, minimum: 1 }
        run_url: { type: string, format: uri }
        html_url: { type: string, format: uri }
    Health:
      type: object
      additionalProperties: false
      required: [status, service, tcpip, github_compatible_dispatch, configuration_valid, authentication_configured, remote_attestation_configured]
      properties:
        status: { type: string, enum: [ALIVE, BLOCK] }
        service: { type: string }
        tcpip: { type: boolean }
        github_compatible_dispatch: { type: boolean }
        configuration_valid: { type: boolean }
        authentication_configured: { type: boolean }
        remote_attestation_configured: { type: boolean }
    DispatchInputs:
      type: object
      additionalProperties: false
      required: [operation, artifact_id, dry_run, request_id, effect_accepted]
      properties:
        operation: { type: string, enum: [ingest, verify, stage, release_status] }
        artifact_id: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' }
        payload_b64: { type: string }
        expected_sha256: { type: string, pattern: '^[0-9a-fA-F]{64}$' }
        dry_run: { oneOf: [{ type: boolean }, { type: string, enum: ['true', 'false'] }] }
        request_id: { type: string, pattern: '^[A-Za-z0-9_.=-]{1,128}$' }
        effect_accepted: { oneOf: [{ type: boolean }, { type: string, enum: ['true', 'false'] }] }
        responsibility_owner: { type: string, minLength: 1, maxLength: 256 }
        state_run_id: { type: string, pattern: '^[0-9]{1,32}$' }
        remote_evidence_b64: { type: string, description: HMAC-authenticated qikvrt_remote_release_attestation_v1 JSON encoded as base64. }
  securitySchemes:
    mcpReadBearer:
      type: http
      scheme: bearer
      description: Separate expiring QIKVRT_MCP_TOKEN with explicit evidence read scopes and principal; no ingest or REST dispatch authority.
    bearerToken:
      type: http
      scheme: bearer
      description: Explicitly configured scoped credential with server-side expiry; canonical b64url prefix, unpadded payload, and 32--128 decoded bytes are required by the local adapter.
security:
  - bearerToken: []
